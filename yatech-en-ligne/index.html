/* ==========================================================================
   LE RAPPEL EBP
   Une fiche créée le matin ne doit pas dormir jusqu'au soir. Le compte s'écrit
   dans le titre de l'onglet — visible même quand on est ailleurs — et un rappel
   part au bout du délai réglé.
   ========================================================================== */
let dernierRappelEbp = 0;

/** Depuis quand la plus ancienne fiche attend. */
function attendDepuis() {
  const dates = devisATransferer().map(d => d.cree)
    .concat(clientsATransferer().map(c => c.maj || c.cree || Date.now()));
  return dates.length ? Math.min(...dates) : null;
}

function titreOnglet() {
  const n = devisATransferer().length + clientsATransferer().length;
  const nom = (DB.etat && DB.etat.reglages && DB.etat.reglages.nomOutil) || 'Yatech';
  const voulu = n && S.userId && !enVuePublique() ? `(${n}) ${nom}` : nom;
  if (document.title !== voulu) document.title = voulu;
}

/** L'autorisation du navigateur, sans jamais la demander de nous-mêmes. */
function etatNotifications() {
  if (typeof Notification === 'undefined') return 'indisponible';
  try { return Notification.permission; } catch (e) { return 'indisponible'; }
}

function prevenirEbp(n, minutes) {
  const texte = `${n} fiche${n > 1 ? 's' : ''} attend${n > 1 ? 'ent' : ''} depuis plus de `
    + (minutes >= 60 ? Math.round(minutes / 60) + ' h' : minutes + ' min') + '.';
  if (etatNotifications() === 'granted') {
    try {
      new Notification('À passer dans EBP', { body: texte, tag: 'atelier-ebp', renotify: false });
      return;
    } catch (e) { /* le cadre refuse : on retombe sur le message dans la page */ }
  }
  toast('EBP — ' + texte);
}

function verifierRappelEbp() {
  if (!DB.etat || !S.userId || enVuePublique()) return;
  const minutes = Number(DB.etat.reglages.rappelEbp) || 0;
  if (!minutes) return;

  const n = devisATransferer().length + clientsATransferer().length;
  if (!n) { dernierRappelEbp = 0; return; }

  const depuis = attendDepuis();
  if (!depuis || Date.now() - depuis < minutes * 60000) return;
  if (Date.now() - dernierRappelEbp < minutes * 60000) return;   // pas deux fois de suite

  dernierRappelEbp = Date.now();
  prevenirEbp(n, minutes);
}

/* ==========================================================================
   L'ACCÈS
   Un code par personne. Il ne rend pas l'outil inviolable — tout ce qui vit
   dans un navigateur est lisible par qui s'y connaît vraiment — mais il ferme
   la porte à qui tomberait sur l'adresse, et c'est ce qu'on lui demande.
   ========================================================================== */
function ouvrirSession(userId) {
  stock.effacer('atelier.rendu');
  S.userId = userId;
  S.connexionPour = null;
  S.erreurCode = null;
  S.memoDe = null;
  // chacun ouvre sur l'écran par lequel il commence sa journée
  S.vue = monEcranOuverture(userId);
  S.proConnecte = null;                     // et réciproquement
  S.grilleToken = null;
  stock.effacer('atelier.pro');
  stock.ecrire('atelier.qui', userId);
  toucherActivite();

  /* Entré avec le code de première connexion : on ne va pas plus loin sans
     qu'il choisisse le sien. Tant qu'il ne l'a pas fait, tout le garage
     partage le même code. */
  S.modale = (!SANS_CODE && DB.mdpProvisoire(userId)) ? { type: 'code', id: userId, oblige: true } : null;
  rendre();
}

/* Un garage partenaire n'ouvre que sa grille : les mêmes identifiants, mais
   rien de l'atelier. Il n'y a aucun écran de l'outil derrière, pas seulement
   des boutons cachés. */
function ouvrirSessionPro(clientId) {
  const c = DB.client(clientId);
  if (!c) return;
  S.userId = null;
  S.connexionPour = null;
  S.erreurCode = null;
  S.proConnecte = clientId;
  S.grilleToken = DB.jetonClient(c);
  stock.effacer('atelier.qui');            // aucune session d'atelier ne traîne derrière
  stock.ecrire('atelier.pro', clientId);
  toucherActivite();
  S.modale = DB.mdpProvisoireClient(clientId) ? { type: 'code-pro', id: clientId, oblige: true } : null;
  rendre();
}

/* Verrouillage après inactivité : sur le poste de l'atelier, l'écran reste
   ouvert des heures entre deux voitures. */
let derniereActivite = Date.now();
const toucherActivite = () => { derniereActivite = Date.now(); };

function verifierVerrou() {
  if (!DB.etat) return;
  if (SANS_CODE) return;   // porte ouverte : verrouiller ne ferait que gêner
  // l'espace client d'un particulier n'a pas de session : rien à verrouiller
  if (S.clientToken && !S.proConnecte) return;
  if (!S.userId && !S.proConnecte) return;
  if (!DB.protege() && !S.proConnecte) return;

  const minutes = Number(DB.etat.reglages.verrouAuto) || 0;
  if (!minutes) return;
  if (Date.now() - derniereActivite < minutes * 60000) return;

  S.userId = null; S.proConnecte = null; S.grilleToken = null;
  S.connexionPour = null; S.modale = null; S.placeId = null;
  stock.effacer('atelier.qui');
  stock.effacer('atelier.pro');
  rendre();
  toast('Verrouillé après ' + minutes + ' minutes sans activité');
}

['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(ev =>
  document.addEventListener(ev, toucherActivite, { passive: true, capture: true }));

/** De quel appareil parle-t-on ? Utile quand on compare deux écrans. */
function empreinteAppareil() {
  const t = navigator.userAgent || '';
  const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(t);
  const nav = /Edg\//.test(t) ? 'Edge' : /OPR\//.test(t) ? 'Opera'
            : /Firefox\//.test(t) ? 'Firefox'
            : /Chrome\//.test(t) ? 'Chrome' : /Safari\//.test(t) ? 'Safari' : 'Navigateur';
  return (mobile ? 'Téléphone' : 'Ordinateur') + ' · ' + nav;
}

/* La couleur telle qu'elle s'affiche en ce moment, pour que le sélecteur
   s'ouvre sur la bonne teinte plutôt que sur du noir. */
function teinteActuelle(cle) {
  const v = getComputedStyle(document.documentElement).getPropertyValue('--' + cle).trim();
  if (/^#[0-9a-f]{6}$/i.test(v)) return v;
  if (/^#[0-9a-f]{3}$/i.test(v)) return '#' + v.slice(1).split('').map(x => x + x).join('');
  return '#888888';
}

/* Les couleurs de qui regarde l'écran. Un panneau qui s'annonce « vos réglages
   à vous » ne peut pas repeindre l'atelier entier : chacun a les siennes, et
   l'atelier garde les siennes comme point de départ pour les nouveaux. */
function mesCouleurs(userId) {
  const u = DB.etat && DB.utilisateur(userId || S.userId);
  const perso = u && u.prefs && u.prefs.couleurs;
  if (perso) return perso;
  return (DB.etat && DB.etat.reglages && DB.etat.reglages.couleurs) || {};
}

/* Clair, sombre, ou comme l'appareil. Le choix suit la personne d'un poste à
   l'autre ; l'appareil en garde une copie, pour que l'écran de connexion —
   où personne n'est encore identifié — s'ouvre dans la bonne teinte. */
function monTheme(userId) {
  const u = DB.etat && DB.utilisateur(userId || S.userId);
  const perso = u && u.prefs && u.prefs.theme;
  return perso || stock.lire('atelier.theme') || 'auto';
}

function poserTheme(valeur) {
  if (valeur === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', valeur);
}

function appliquerCouleurs() {
  const c = mesCouleurs();
  const style = document.documentElement.style;
  COULEURS_REGLABLES.forEach(({ cle }) => {
    const v = c[cle];
    if (v) {
      style.setProperty('--' + cle, v);
      style.setProperty('--' + cle + '-voile', `color-mix(in srgb, ${v} 16%, transparent)`);
      if (cle === 'accent') {
        style.setProperty('--accent-vif', `color-mix(in srgb, ${v} 82%, #fff)`);
        style.setProperty('--accent-sur', `color-mix(in srgb, ${v} 18%, #000)`);
      }
    } else {
      style.removeProperty('--' + cle);
      style.removeProperty('--' + cle + '-voile');
      if (cle === 'accent') { style.removeProperty('--accent-vif'); style.removeProperty('--accent-sur'); }
    }
  });
}

/* Le témoin d'enregistrement. Posé hors du corps redessiné : il survit à tous
   les redessins et se met à jour seul. On ne devrait jamais avoir à se demander
   si ce qu'on vient de taper est parti. */
function temoinEnregistrement() {
  let t = document.getElementById('temoin-enr');
  if (!t) {
    t = document.createElement('div');
    t.id = 'temoin-enr';
    document.body.appendChild(t);
  }
  if (enVuePublique() || !S.userId) {
    t.hidden = true;
    document.body.classList.remove('avertie');
    return;
  }
  t.hidden = false;

  if (DB.ecritOk) {
    t.className = 'temoin ok';
    t.innerHTML = `${ic('check')} <span>Enregistré${DB.dernierEcrit ? ' à ' + heure(DB.dernierEcrit) : ''}</span>`;
    document.body.classList.remove('avertie');
    return;
  }
  t.className = 'temoin alerte';
  t.innerHTML = `${ic('alerte')}
    <span><b>Ce navigateur refuse d'enregistrer.</b> Votre travail tient jusqu'à la
    fermeture de l'onglet — pas au-delà.</span>
    <button class="btn plein" data-act="exporter">${ic('devis')} Sauvegarder le fichier</button>`;
  /* La page descend exactement de la hauteur du bandeau. La mesure est prise
     tout de suite — repoussée d'une image, elle laisserait la barre du haut
     passer sous le bandeau le temps d'un battement. */
  document.body.classList.add('avertie');
  const h = t.getBoundingClientRect().height;
  if (h) document.body.style.setProperty('--haut-avert', Math.round(h + 20) + 'px');
}

/* ==========================================================================
   Ranger ses compteurs au doigt
   --------------------------------------------------------------------------
   Cocher ses compteurs dans les paramètres, c'est un moment ; les mettre dans
   le bon ordre, c'en est un autre — et il se fait devant eux, pas dans une
   liste. On garde le doigt sur une case, elle se décolle, on la pose ailleurs.

   Deux gestes cohabitent sur la même case : le clic qui emmène à l'écran
   correspondant, et l'appui long qui la décolle. C'est le temps et le
   mouvement qui tranchent — à la souris, un déplacement franc suffit ; au
   doigt, il faut rester posé, sinon on ne pourrait plus faire défiler la page
   en partant d'un compteur.
   ========================================================================== */
const RANGEMENT = { tuile: null, fantome: null, zone: null, x0: 0, y0: 0,
                    minuterie: null, actif: false, styleAvant: '', vientDeRanger: false };

/* Ranger une liste au doigt. Trois listes s'en servent : les compteurs et les
   raccourcis sur l'accueil, les blocs dans les paramètres — toutes trois avec
   le même geste, parce qu'un outil qui se range de trois façons ne se range
   pas.

   `opts` dit ce qui change d'une liste à l'autre : ce qu'on attrape, où l'on
   lit sa clé, comment on trouve la place d'accueil, et quoi enregistrer. */
function rendreRangeable(zone, opts) {
  if (!zone) return;
  const R = RANGEMENT;

  const arreterMinuterie = () => { if (R.minuterie) { clearTimeout(R.minuterie); R.minuterie = null; } };

  const decoller = (t) => {
    const r = t.getBoundingClientRect();
    R.actif = true;
    R.tuile = t;
    R.opts = opts;
    R.zone = zone;
    R.styleAvant = t.getAttribute('style') || '';
    R.fantome = document.createElement('div');
    R.fantome.className = 'trou-rangement ' + (opts.trou || '');
    R.fantome.style.width = r.width + 'px';
    R.fantome.style.height = r.height + 'px';
    t.parentNode.insertBefore(R.fantome, t);
    t.classList.add('en-main');
    t.style.width = r.width + 'px';
    t.style.height = r.height + 'px';
    t.style.left = r.left + 'px';
    t.style.top = r.top + 'px';
    zone.classList.add('range');
    // une pichenette pour dire que c'est décollé, quand l'appareil sait la faire
    try { if (navigator.vibrate) navigator.vibrate(12); } catch (e) { /* tant pis */ }
  };

  const suivre = (x, y) => {
    if (!R.actif) return;
    R.tuile.style.transform = `translate(${x - R.x0}px, ${y - R.y0}px)`;
    /* Près du bord, la page suit. Une liste plus haute que l'écran ne se range
       pas autrement : on ne peut pas poser sur une ligne qu'on ne voit pas. */
    const marge = 70;
    if (y < marge) window.scrollBy(0, -Math.ceil((marge - y) / 4));
    else if (y > window.innerHeight - marge) window.scrollBy(0, Math.ceil((y - (window.innerHeight - marge)) / 4));
    const sous = document.elementFromPoint(x, y);
    const cible = sous && sous.closest ? sous.closest(opts.item) : null;
    if (!cible || cible === R.tuile || !zone.contains(cible)) return;
    /* Avant ou après l'élément survolé, selon le côté par lequel on arrive.
       Une rangée qui s'enroule se juge en largeur, une liste en hauteur : sinon
       tout sautille dès qu'on traverse une ligne. */
    const r = cible.getBoundingClientRect();
    const apres = opts.axe === 'y' ? (y - r.top) > r.height / 2 : (x - r.left) > r.width / 2;
    cible.parentNode.insertBefore(R.fantome, apres ? cible.nextSibling : cible);
  };

  const poser = () => {
    arreterMinuterie();
    if (!R.actif) { R.tuile = null; return; }
    const t = R.tuile, o = R.opts || opts, z = R.zone || zone;
    R.fantome.parentNode.insertBefore(t, R.fantome);
    R.fantome.remove();
    t.classList.remove('en-main');
    if (R.styleAvant) t.setAttribute('style', R.styleAvant); else t.removeAttribute('style');
    z.classList.remove('range');
    R.actif = false; R.tuile = null; R.fantome = null; R.opts = null;
    /* Le clic de fin de geste ne doit pas déclencher ce que fait un vrai clic
       sur cet élément : on l'avale une fois. */
    R.vientDeRanger = true;
    setTimeout(() => { R.vientDeRanger = false; }, 400);

    const ordre = [...z.querySelectorAll(o.item)].map(b => b.dataset[o.cle]).filter(Boolean);
    o.enregistrer(ordre);
    DB.sauver();
    rendre();
    if (o.dit) toast(o.dit);
  };

  zone.addEventListener('pointerdown', (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    const t = e.target.closest(opts.item);
    if (!t || !zone.contains(t)) return;
    /* Une poignée dit exactement où attraper : c'est ce qu'il faut quand la
       ligne est pleine de boutons. Sans poignée, on attrape n'importe où —
       mais alors on ne part pas d'un bouton qui a déjà son propre rôle. */
    if (opts.poignee) {
      if (!e.target.closest(opts.poignee)) return;
    } else {
      const inter = e.target.closest('button, a, input, select, textarea, label');
      if (inter && inter !== t && t.contains(inter)) return;
    }
    R.x0 = e.clientX; R.y0 = e.clientY; R.tuile = t; R.actif = false; R.opts = opts; R.zone = zone;
    arreterMinuterie();
    /* Une poignée n'attend pas : elle ne sert qu'à ça. Ailleurs il faut rester
       posé au doigt, sinon on ne pourrait plus faire défiler la page. */
    if (opts.poignee) { decoller(t); return; }
    R.minuterie = setTimeout(() => { R.minuterie = null; if (R.tuile === t) decoller(t); }, 340);
    try { t.setPointerCapture(e.pointerId); } catch (err) { /* sans capture, ça marche aussi */ }
  });

  zone.addEventListener('pointermove', (e) => {
    if (!R.tuile || R.zone !== zone) return;
    const dx = Math.abs(e.clientX - R.x0), dy = Math.abs(e.clientY - R.y0);
    if (!R.actif) {
      /* À la souris, un déplacement franc décolle tout de suite. Au doigt, le
         même déplacement veut dire « je fais défiler » : on abandonne. */
      if (dx < 7 && dy < 7) return;
      if (e.pointerType === 'mouse') { arreterMinuterie(); decoller(R.tuile); }
      else { arreterMinuterie(); R.tuile = null; return; }
    }
    suivre(e.clientX, e.clientY);
  });

  ['pointerup', 'pointercancel'].forEach(ev => zone.addEventListener(ev, poser));
  /* Le doigt peut se relever ailleurs — hors de la zone, ou pendant que le
     navigateur reprend la main. Sans ce filet, l'élément resterait collé au
     curseur pour toujours. */
  R.relacher = poser;

  /* Une fois décollé, l'élément suit le doigt et la page ne bouge plus. Il faut
     le dire ici : `touch-action` posé après le début du geste arrive trop tard
     pour le navigateur. */
  zone.addEventListener('touchmove', (e) => {
    if (RANGEMENT.actif) e.preventDefault();
  }, { passive: false });
}

/* Tout ce qui se range dans l'outil, branché après chaque affichage. */
function brancherRangements() {
  const p = () => prefsDe();

  rendreRangeable(document.querySelector('.brief'), {
    item: '.brief-item', cle: 'cpt', trou: 'brief-trou', axe: 'x',
    dit: 'Compteurs rangés',
    enregistrer: (ordre) => { const q = p(); if (q) q.compteurs = ordre; }
  });

  rendreRangeable(document.querySelector('.barre-actions'), {
    item: '.raccourci', cle: 'racc', trou: 'racc-trou', axe: 'x',
    dit: 'Raccourcis rangés',
    enregistrer: (ordre) => { const q = p(); if (q) q.raccourcis = ordre; }
  });

  rendreRangeable(document.querySelector('.liste-blocs'), {
    item: '.bloc-accueil', cle: 'bloc', trou: 'bloc-trou', axe: 'y',
    poignee: '.poignee', dit: 'Accueil rangé',
    enregistrer: (ordre) => { const q = p(); if (q) q.ordreAccueil = ordre; }
  });
}

/* Le clic qui termine un rangement n'est pas un clic : il ne doit pas changer
   d'écran. On l'attrape avant tout le monde. */
document.addEventListener('click', (e) => {
  if (!RANGEMENT.vientDeRanger) return;
  if (!e.target.closest || !e.target.closest('.brief-item, .raccourci, .bloc-accueil')) return;
  e.stopPropagation(); e.preventDefault();
  RANGEMENT.vientDeRanger = false;
}, true);

['pointerup', 'pointercancel', 'blur'].forEach(ev =>
  window.addEventListener(ev, () => { if (RANGEMENT.relacher) RANGEMENT.relacher(); }));
document.addEventListener('visibilitychange', () => {
  if (document.hidden && RANGEMENT.relacher) RANGEMENT.relacher();
});

function apresRendu() {
  poserTheme(monTheme());
  poserDensite(maDensite());
  appliquerCouleurs();
  brancherRangements();
  temoinEnregistrement();
  titreOnglet();

  /* Une seule fenêtre à l'écran, toujours. On efface l'ancienne avant de poser
     la nouvelle : sans ça elles s'empilent à chaque redessin, et chaque copie
     ajoute son propre écouteur — un clic finissait par compter double. */
  $$('.voile').forEach(v => v.remove());
  if (S.modale) {
    const h = S.modale.type === 'appel' ? modaleAppel()
            : S.modale.type === 'catalogue' ? modaleCatalogue(S.modale.id)
            : S.modale.type === 'lien' ? modaleLien(S.modale.id)
            : S.modale.type === 'plus' ? modalePlus()
            : S.modale.type === 'planif' ? modalePlanif(S.modale)
            : S.modale.type === 'tour' ? modaleTour()
            : S.modale.type === 'prevenir' ? modalePrevenir(S.modale)
            : S.modale.type === 'alertes' ? modaleAlertes()
            : S.modale.type === 'voix' ? modaleVoix()
            : S.modale.type === 'code' ? modaleCode(S.modale.id)
            : S.modale.type === 'code-pro' ? modaleCodePro(S.modale.id)
            : S.modale.type === 'nouveau-pro' ? modaleNouveauPro()
            : S.modale.type === 'intervention' ? modaleIntervention()
            : S.modale.type === 'pret' ? modalePret()
            : S.modale.type === 'rdv-confirme' ? modaleRdvConfirme()
            : S.modale.type === 'rdv-client' ? modaleRdvClient()
            : S.modale.type === 'appel-entrant' ? modaleAppelEntrant()
            : S.modale.type === 'envoi-pdf' ? modaleEnvoiPdf()
            : S.modale.type === 'confirmer' ? modaleConfirmer() : '';
    const d = document.createElement('div');
    d.innerHTML = h;
    /* Un type de fenêtre inconnu — ou une fenêtre qui pointe vers une fiche
       effacée entre-temps — ne doit pas faire tomber tout l'affichage. Et
       comme rien ne s'affiche, on oublie la fenêtre : sinon l'application se
       croit encore ouverte sur une fenêtre invisible. La palette de recherche
       fait exception : c'est la v2 qui la pose, juste après ce passage. */
    if (d.firstElementChild) document.body.appendChild(d.firstElementChild);
    else if (S.modale.type !== 'recherche') S.modale = null;
  }

  /* Une ligne qu'on vient d'ajouter : le curseur s'y place, il n'y a plus qu'à
     taper la prestation. */
  if (S.focusPresta) {
    const champ = $(`[data-champ-presta="libelle"][data-id="${S.focusPresta}"]`);
    S.focusPresta = null;
    if (champ) { champ.focus(); champ.scrollIntoView({ block: 'center' }); }
  }

  // recherche : garder le curseur
  const r = $('#rech');
  if (r && S.focusRech) { r.focus(); r.setSelectionRange(r.value.length, r.value.length); }
  const rt = $('#rech-tarif');
  if (rt && S.focusRechTarif) { rt.focus(); rt.setSelectionRange(rt.value.length, rt.value.length); }
  const rr = $('#rech-reglage');
  if (rr && S.focusRechReglage) { rr.focus(); rr.setSelectionRange(rr.value.length, rr.value.length); }

  /* Réglage du parc en cours de saisie : le champ garde la main.
     setSelectionRange n'existe que sur les champs texte — l'appeler sur un
     champ nombre lève une erreur qui interromprait tout le reste. */
  if (S.champParcActif) {
    /* Les horaires d'un jour portent leur propre attribut : « jour:5:debut »
       désigne l'heure d'ouverture du samedi. */
    const c = String(S.champParcActif).startsWith('jour:')
      ? $(`[data-champ-jour="${S.champParcActif.slice(5)}"]`)
      : $(`[data-champ-parc="${S.champParcActif}"]`);
    S.champParcActif = null;
    if (c) {
      c.focus();
      if (c.tagName === 'INPUT' && ['text', 'tel', 'search', 'url', 'password'].includes(c.type)) {
        c.setSelectionRange(c.value.length, c.value.length);
      }
    }
  }

  /* La connexion : un e-mail, un mot de passe, et c'est le compte trouvé qui
     décide de ce qui s'ouvre — l'atelier entier ou la seule grille du pro. */
  const fco = $('#form-connexion');
  if (fco) fco.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(fco).entries());
    const email = String(f.email || '').trim();
    const mdp = String(f.mdp || '');
    S.emailSaisi = email;

    if (!email || !mdp) { S.erreurCode = 'Il faut l\'e-mail et le mot de passe.'; rendre(); return; }
    const compte = DB.compteParEmail(email);
    // même message dans les deux cas : on ne dit pas à un inconnu quels e-mails existent
    const refus = () => { S.erreurCode = 'E-mail ou mot de passe incorrect.'; rendre(); };
    if (!compte) return refus();

    if (compte.type === 'salarie') {
      if (!DB.verifierMdp(compte.id, mdp)) return refus();
      S.emailSaisi = ''; ouvrirSession(compte.id);
      return;
    }
    if (!DB.verifierMdpClient(compte.id, mdp)) return refus();
    S.emailSaisi = ''; ouvrirSessionPro(compte.id);
  });

  // le code d'accès
  const fcode = $('#form-code');
  if (fcode) fcode.addEventListener('submit', (e) => {
    e.preventDefault();
    const mdp = (new FormData(fcode).get('mdp') || '').toString();
    if (!mdp) { S.erreurCode = 'Tapez votre code.'; rendre(); return; }
    if (!DB.verifierMdp(fcode.dataset.id, mdp)) {
      S.erreurCode = 'Ce code ne correspond pas.';
      rendre();
      return;
    }
    ouvrirSession(fcode.dataset.id);
  });

  // ouvrir l'accès d'un garage confrère
  const fnp = $('#form-nouveau-pro');
  if (fnp) fnp.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(fnp).entries());
    const nom = String(f.nom || '').trim();
    const email = String(f.email || '').trim();
    if (!nom || !email) { S.erreurCode = 'La raison sociale et l\'e-mail sont indispensables.'; rendre(); return; }
    if (DB.compteParEmail(email)) {
      S.erreurCode = 'Cette adresse sert déjà à un autre compte.'; rendre(); return;
    }

    const c = {
      id: DB.nouvelId('c'), type: 'pro', tarif: 'pro',
      nom, prenom: '', contact: String(f.contact || '').trim(),
      tel: String(f.tel || '').trim(), email,
      adresse: '', cp: '', ville: String(f.ville || '').trim(),
      siret: String(f.siret || '').trim(), tvaIntra: '',
      note: String(f.note || '').trim(), cree: Date.now()
    };
    DB.etat.clients.push(c);
    const code = codeTemporaire();
    DB.definirMdpClient(c.id, code, true, code);

    const envoyer = !!(e.submitter && e.submitter.dataset.envoyer);
    S.erreurCode = null; S.modale = null; S.vue = 'clients'; S.accesPro = true;
    enregistrer(`Accès professionnel ouvert pour ${nom}`);

    rendre();
    if (envoyer) {
      const texte = messageGrille(c);
      const mail = (c.email || '').trim();
      c.lienEnvoye = Date.now();
      DB.sauver();
      ouvrirLien(`mailto:${mail}?subject=${encodeURIComponent('Votre accès — ' + DB.etat.reglages.nom)}`
        + `&body=${encodeURIComponent(texte)}`, texte);
      rendre();
    }
    toast(`${nom} — mot de passe temporaire ${code}`);
  });

  // le garage partenaire choisit son mot de passe
  const fcp = $('#form-code-pro');
  if (fcp) fcp.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(fcp).entries());
    /* On enlève les espaces de bord à l'enregistrement comme à la vérification :
       sinon un mot de passe posé au téléphone avec une espace finale invisible
       ne se retape jamais à l'identique. */
    const mdp = String(f.mdp || '').trim(), mdp2 = String(f.mdp2 || '').trim();
    if (mdp.length < 6) { S.erreurCode = 'Six caractères au minimum.'; rendre(); return; }
    if (mdp !== mdp2) { S.erreurCode = 'Les deux mots de passe ne sont pas identiques.'; rendre(); return; }
    if (mdp === DB.codeTempPro(fcp.dataset.id)) {
      S.erreurCode = 'Choisissez autre chose que le mot de passe temporaire.'; rendre(); return;
    }
    DB.definirMdpClient(fcp.dataset.id, mdp);
    S.erreurCode = null; S.modale = null;
    DB.sauver(); rendre();
    toast('Mot de passe enregistré');
  });

  /* Enregistrer une intervention déjà faite : elle devient un dossier terminé,
     daté du jour du travail et non du jour de la saisie. */
  const fi = $('#form-intervention');
  if (fi) fi.addEventListener('submit', (e) => {
    e.preventDefault();
    lireChampsIntervention();
    const m = S.modale;
    const c = DB.client(fi.dataset.id);
    if (!c) return;
    const lignes = (m.lignes || []).filter(l => String(l.libelle || '').trim());
    if (!lignes.length) {
      S.erreurCode = 'Ajoutez au moins une prestation réalisée.'; rendre(); return;
    }
    const quand = m.jour || Date.now();
    const d = {
      id: DB.nouvelId('d'), numero: DB.nouveauNumero(), clientId: c.id,
      vehiculeId: m.vehiculeId || null, statut: 'termine', creePar: S.userId,
      cree: quand, maj: Date.now(), reponse: quand,
      panne: String(m.panne || '').trim() || 'Intervention',
      lignes: lignes.map(l => ({
        id: DB.nouvelId('l'), type: l.type || 'mo', libelle: String(l.libelle).trim(),
        code: l.code || '', ref: l.ref || '',
        qte: Number(l.qte) || 1, prixHT: Number(l.prixHT) || 0, remise: 0
      })),
      remise: 0, note: '', regle: m.regle ? quand : null,
      notee: Date.now(),               // saisie après coup, pas passée par un devis
      token: Math.random().toString(36).slice(2, 8)
    };
    DB.etat.devis.unshift(d);
    S.modale = null; S.erreurCode = null;
    enregistrer(`Intervention notée pour ${c.type === 'pro' ? c.nom : (c.prenom + ' ' + c.nom).trim()}`);
    toast(`${d.numero} ajouté à l'historique — ${eur(totaux(d).ttc)} TTC${m.regle ? ', réglé' : ' à encaisser'}`);
  });

  // poser un nouveau code
  const fnc = $('#form-nouveau-code');
  if (fnc) fnc.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(fnc).entries());
    const mdp = String(f.mdp || '').trim(), mdp2 = String(f.mdp2 || '').trim();
    if (mdp.length < 4) { S.erreurCode = 'Quatre caractères au minimum.'; rendre(); return; }
    if (mdp !== mdp2) { S.erreurCode = 'Les deux codes ne sont pas identiques.'; rendre(); return; }
    if (mdp === MDP_PROVISOIRE) {
      S.erreurCode = 'Choisissez autre chose que le code de première connexion.';
      rendre(); return;
    }
    const u = DB.utilisateur(fnc.dataset.id);
    DB.definirMdp(fnc.dataset.id, mdp);
    S.erreurCode = null; S.modale = null;
    enregistrer(`Code d'accès posé pour ${u ? u.nom : ''}`);
    toast('Code enregistré — notez-le, il n\'est pas relisible');
  });

  // formulaire « appel entrant »
  const fa = $('#form-appel');
  if (fa) {
    /* Le client parle : chaque chiffre tapé relance la reconnaissance, et on
       ne remplace que le bandeau — le curseur reste où il est. */
    fa.addEventListener('input', (e) => {
      if (['tel', 'immat'].includes(e.target.name)) rafraichirReco(fa);
    });
    rafraichirReco(fa);
  }
  if (fa) fa.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(fa).entries());
    const vide = !['nom', 'prenom', 'tel', 'email', 'immat', 'panne'].some(k => (f[k] || '').trim());
    if (vide) { toast('Notez au moins un nom, un numéro ou la panne.'); return; }

    // le bouton utilisé décide de la suite : enregistrer, ou enchaîner sur l'envoi
    const envoyer = !!(e.submitter && e.submitter.dataset.envoyer);
    creerDepuisAppel({
      nom: f.nom || '', prenom: f.prenom || '', tel: f.tel || '', email: f.email || '',
      immat: f.immat || '', marque: f.marque || '', modele: f.modele || '', panne: f.panne || ''
    }, envoyer);
  });

  /* La prestation choisie décide de ce qu'on demande en plus : sur une
     reprogrammation, c'est la référence du calculateur qui manque toujours, et
     c'est elle qui permet d'annoncer un prix sans ouvrir le véhicule. Le champ
     n'apparaît que là — ailleurs il n'aurait aucun sens — et reste facultatif :
     tous les confrères ne l'ont pas sous la main. */
  const presta = $('#presta-pro');
  if (presta) {
    const note = $('#note-pro'), aide = $('#aide-note-pro'), bloc = $('#bloc-calculo');
    const ajuster = () => {
      const v = sansAccent(presta.value || '').toLowerCase();
      const prog = /programme|reprogramm|calculateur|fap|egr|duo|cartographie|injecteur/.test(v);
      if (bloc) bloc.hidden = !prog;
      if (!note) return;
      note.placeholder = prog
        ? 'Ex. : moteur 1.6 HDi 92 ch, défaut connu, véhicule déposé la veille…'
        : 'Véhicule déposé la veille, pièce déjà commandée…';
      if (aide) aide.innerHTML = prog
        ? 'Ajoutez la motorisation si vous la connaissez : elle change parfois le fichier.'
        : '';
    };
    presta.addEventListener('change', ajuster);
    ajuster();
  }

  /* Glisser d'une semaine à l'autre. Le geste est franc et surtout horizontal :
     sur téléphone, le planning se lit en défilant vers le bas, et il ne doit pas
     changer de semaine pendant qu'on descend.

     Mais la semaine elle-même défile maintenant du pouce, jour après jour. Le
     même geste veut donc dire deux choses, et c'est la place dans la semaine qui
     tranche : tant qu'il reste des jours à découvrir, on les découvre ; une fois
     collé au samedi, pousser encore fait passer à la semaine suivante. Il faut
     avoir été au bord avant ET après le geste — sinon le glissement qui vient
     tout juste d'atteindre le samedi changerait de semaine dans la foulée. */
  const pl = $('#planning-glisse');
  const cadre = pl ? pl.closest('.planning-cadre') : null;

  /* Où en est le défilement : au début, à la fin, ou entre les deux. Sans
     débordement — sur grand écran — les deux bords sont vrais à la fois, et le
     geste retrouve son sens d'avant. */
  const bordsScroll = () => {
    if (!cadre) return { debut: true, fin: true };
    const reste = cadre.scrollWidth - cadre.clientWidth;
    return { debut: cadre.scrollLeft <= 2, fin: cadre.scrollLeft >= reste - 2 };
  };

  if (cadre) {
    /* On retient la position pendant qu'on défile : le prochain affichage la
       repose telle quelle. */
    cadre.addEventListener('scroll', () => { S.planningScroll = cadre.scrollLeft; }, { passive: true });
    cadre.scrollLeft = S.planningScroll === 'fin'
      ? Math.max(0, cadre.scrollWidth - cadre.clientWidth)
      : (Number(S.planningScroll) || 0);
  }

  if (pl) {
    let x0 = null, y0 = null, bord0 = null;
    pl.addEventListener('touchstart', (e) => {
      if (e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
      bord0 = bordsScroll();
    }, { passive: true });
    pl.addEventListener('touchend', (e) => {
      if (x0 === null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - x0, dy = t.clientY - y0;
      x0 = null;
      if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
      const sens = dx < 0 ? +1 : -1;
      const bord = bordsScroll();
      // au milieu de la semaine, le doigt fait défiler : il ne fait que ça
      if (sens > 0 && !(bord0.fin && bord.fin)) return;
      if (sens < 0 && !(bord0.debut && bord.debut)) return;
      glisserSemaine(sens, true);
    }, { passive: true });
  }

  /* Sur une programmation, tout ne vient pas forcément avec la voiture : le
     confrère peut déposer le seul calculateur. Ça ne change pas le travail,
     mais ça change tout pour nous — pas de place à réserver sur le parc, pas
     de véhicule immobilisé. */
  const segApport = $('#bloc-calculo .segments');
  if (segApport) {
    segApport.addEventListener('click', (e) => {
      const b = e.target.closest('[data-apport]');
      if (!b) return;
      e.preventDefault();
      segApport.querySelectorAll('[data-apport]').forEach(x => x.classList.toggle('on', x === b));
      const champ = $('#apport-pro'), aide = $('#aide-apport');
      if (champ) champ.value = b.dataset.apport;
      if (aide) aide.textContent = b.dataset.apport === 'calculateur'
        ? 'Vous déposez le boîtier, le véhicule reste chez vous — nous ne bloquons pas de place.'
        : 'Le véhicule reste chez nous le temps de l\'opération.';
    });
  }

  // demande de créneau posée par un garage professionnel
  const fr = $('#form-reserver');
  if (fr) fr.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(fr).entries());
    const c = DB.client(fr.dataset.client);
    if (!c || !f.jour) return;

    const immat = String(f.immat || '').trim().toUpperCase();
    const km = Number(f.km) || 0;
    const modele = String(f.modele || '').trim();
    // la plaque suffit : elle identifie le véhicule, le reste se complète après
    if (!immat) return;

    /* La fiche véhicule se remplit toute seule à partir de ce qu'il déclare :
       s'il revient avec la même plaque, on ne crée pas de doublon, on met le
       kilométrage à jour. */
    let v = DB.etat.vehicules.find(x => (x.immat || '').toUpperCase() === immat);
    const mots = modele.split(/\s+/);
    if (!v) {
      v = {
        id: DB.nouvelId('v'), clientId: c.id, immat,
        marque: mots[0] || '', modele: mots.slice(1).join(' ') || '',
        km, cree: Date.now()
      };
      DB.etat.vehicules.push(v);
    } else {
      if (km) v.km = km;
      if (!v.marque && mots[0]) v.marque = mots[0];
      if (!v.modele && mots.length > 1) v.modele = mots.slice(1).join(' ');
      if (!v.clientId) v.clientId = c.id;
    }

    /* Le calculateur, s'il l'a donné : on le range sur le véhicule — il ne
       changera plus — et on le répète dans le dossier, sous les yeux de celui
       qui préparera le fichier. */
    const calculo = [String(f.calculoMarque || '').trim(), String(f.calculoRef || '').trim()]
      .filter(Boolean).join(' · ');
    if (calculo) v.calculo = calculo;

    /* Boîtier seul : le véhicule ne vient pas. On le dit clairement partout,
       c'est ce qui décide si on garde une place sur le parc. */
    const prog = /programme|reprogramm|calculateur|fap|egr|duo|cartographie|injecteur/
      .test(sansAccent(String(f.prestation || '')).toLowerCase());
    const boitierSeul = prog && String(f.apport || '') === 'calculateur';

    /* La prestation demandée entre aussitôt dans ses interventions, en attente :
       elle n'est ni faite ni due, mais elle est écrite — c'est tout l'intérêt,
       plus rien ne se perd entre la demande et la facture. */
    const presta = DB.etat.catalogue.find(p => p.libelle === String(f.prestation || '').trim());
    const dossier = {
      id: DB.nouvelId('d'), numero: DB.nouveauNumero(), clientId: c.id, vehiculeId: v.id,
      statut: 'accepte', creePar: null, cree: Date.now(), maj: Date.now(),
      panne: String(f.prestation || '').trim()
           + (boitierSeul ? ' — calculateur déposé seul, sans le véhicule' : '')
           + (calculo ? ' — calculateur ' + calculo : '')
           + (String(f.note || '').trim() ? ' — ' + f.note.trim() : ''),
      lignes: presta ? [{
        id: DB.nouvelId('l'), type: presta.type || 'mo', libelle: presta.libelle,
        code: presta.code || '', ref: presta.ref || '',
        qte: 1, prixHT: DB.prixPour(presta, c), remise: 0
      }] : [],
      remise: 0, note: String(f.note || '').trim(), regle: null,
      demandePro: Date.now(),                   // vient de son espace, pas de chez nous
      token: Math.random().toString(36).slice(2, 8)
    };
    DB.etat.devis.push(dossier);

    const idRdv = DB.nouvelId('r');
    DB.etat.planning.push({
      id: idRdv,
      userId: DB.etat.utilisateurs[0].id,      // à répartir à la confirmation
      jour: Number(f.jour),
      heure: HEURES[0],                        // l'heure sera fixée par l'atelier
      duree: Number(DB.etat.reglages.dureeDefaut) || 1,
      emplacement: 'sol',
      devisId: dossier.id,
      client: c.nom,
      prestation: (f.prestation || '').trim(),
      note: (f.note || '').trim(),
      immat,
      km,
      calculo,                                  // vide s'il ne le savait pas
      boitierSeul,                              // le véhicule ne vient pas
      demandeur: c.id,                          // c'est un pro qui l'a posée
      aValider: true,
      fait: false,
      pose: Date.now()
    });

    /* Une seule alerte par demande : la clé est la même que celle de la veille,
       qui ne reposera donc rien par-dessus. */
    alerterTousExterne('rdv',
      `${c.nom} demande un créneau le ${dateCourte(Number(f.jour))}`
      + ((f.prestation || '').trim() ? ' — ' + f.prestation.trim() : '')
      + (boitierSeul ? ' (calculateur seul)' : ''),
      { vue: 'planning', ref: idRdv, pro: true, cle: 'demande-pro:' + idRdv });
    DB.sauver();
    rendre();
    toast('Demande envoyée — nous vous confirmons le créneau');
  });

  // garer une voiture depuis une place libre
  const fg = $('#form-garer');
  if (fg) {
    fg.addEventListener('submit', (e) => {
      e.preventDefault();
      const f = Object.fromEntries(new FormData(fg).entries());
      garerDepuisPlaque(fg.dataset.place, f);
    });
    const champ = $('#immat-placement');
    if (champ && S.focusImmat) {
      champ.focus();
      champ.setSelectionRange(champ.value.length, champ.value.length);
    }
  }

  /* Changer le jour change les créneaux : le samedi matin n'a pas les heures
     du mardi. On refait la liste sur place — un redessin complet viderait tout
     ce que la fenêtre a déjà de saisi. */
  const fpJour = $('#form-planif [name=jourDate]');
  if (fpJour) fpJour.addEventListener('change', () => {
    const ts = depuisInputDate(fpJour.value);
    if (!ts) return;
    const sel = $('#form-planif [name=heure]');
    if (sel) {
      const avant = sel.value;
      const dispo = heuresDuJour(DB.etat.reglages, ts);
      const liste = dispo.length ? dispo : HEURES;
      const garde = liste.includes(avant) ? avant : liste[0];
      sel.innerHTML = liste.map(h => `<option value="${h}" ${h === garde ? 'selected' : ''}>${h}</option>`).join('');
      sel.value = garde;
    }
    const avis = $('#planif-ferme');
    if (avis) {
      const ferm = fermetureDu(ts);
      const clos = horairesDuJour(DB.etat.reglages, rangJour(ts)).ferme;
      avis.innerHTML = (ferm || clos)
        ? `<div class="encart alerte"><b>L'atelier est fermé ce jour-là${
            ferm && ferm.motif ? ' — ' + esc(ferm.motif) : ''}.</b>
            Le créneau se pose quand même si vous ouvrez exprès, mais il ne comptera
            dans aucune charge de journée.</div>`
        : '';
    }
  });

  /* Une fermeture s'ajoute : congés, pont, journée exceptionnelle. Une seule
     date suffit — le champ « au » vide veut dire « ce jour-là seulement ». */
  const ff = $('#form-fermeture');
  if (ff) ff.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!exigeAdmin('Modifier les fermetures')) return;
    const f = Object.fromEntries(new FormData(ff).entries());
    const debut = depuisInputDate(f.debut);
    if (!debut) { toast('Choisissez au moins une date de début'); return; }
    const fin = depuisInputDate(f.fin) || debut;
    if (fin < debut) { toast('La fin est avant le début : reprenez les dates'); return; }
    const r = DB.etat.reglages;
    r.fermetures = r.fermetures || [];
    r.fermetures.push({
      id: DB.nouvelId('fe'), debut: isoLocal(debut), fin: isoLocal(fin),
      motif: String(f.motif || '').trim()
    });
    DB.sauver();
    const jours = Math.round((fin - debut) / JOUR) + 1;
    const pris = DB.etat.planning.filter(x => !x.annule
      && minuit(x.jour) >= debut && minuit(x.jour) <= fin && !x.annule).length;
    enregistrer(`Fermeture posée du ${dateCourte(debut)} au ${dateCourte(fin)}`
      + (f.motif ? ' : ' + String(f.motif).trim() : ''));
    toast(jours > 1 ? `${jours} jours fermés` : 'Journée fermée');
    if (pris) toast(`${pris} rendez-vous ${pris > 1 ? 'sont' : 'est'} déjà posé${
      pris > 1 ? 's' : ''} sur ces dates — pensez à prévenir`);
    rendre();
  });

  /* L'enseigne : elle est rangée avec les données, sur cet appareil. Une image
     lourde ferait grossir la sauvegarde d'autant — on la refuse plutôt que de
     laisser l'enregistrement échouer plus tard, sans prévenir. */
  const lg = $('#champ-logo');
  if (lg) lg.addEventListener('change', () => {
    const f = lg.files && lg.files[0];
    if (!f) return;
    if (!/^image\//.test(f.type)) { toast('Choisissez une image'); lg.value = ''; return; }
    if (f.size > 200 * 1024) {
      toast('Image trop lourde : ' + Math.round(f.size / 1024) + ' Ko pour 200 Ko au plus');
      lg.value = ''; return;
    }
    const lecteur = new FileReader();
    lecteur.onload = () => {
      DB.etat.reglages.logo = String(lecteur.result || '');
      if (!DB.sauver()) {
        DB.etat.reglages.logo = '';
        toast('Pas assez de place pour garder cette image');
      } else {
        enregistrer('Enseigne changée');
        toast('Enseigne enregistrée');
      }
      rendre();
    };
    lecteur.onerror = () => toast('Cette image n\'a pas pu être lue');
    lecteur.readAsDataURL(f);
  });

  // pose ou modification d'un créneau
  const fp = $('#form-planif');
  if (fp) fp.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(fp).entries());
    const existant = fp.dataset.id ? DB.rdv(fp.dataset.id) : null;

    /* L'attribut `min` du calendrier n'arrête qu'un clic : une date tapée à la
       main passe au travers. On refuse ici pour de bon — sauf le jour que le
       rendez-vous avait déjà, qu'on doit pouvoir corriger. */
    const vise = minuit(depuisInputDate(f.jourDate));
    if (vise < minuit(Date.now()) && !(existant && vise === minuit(existant.jour))) {
      toast('Ce jour est déjà passé — choisissez aujourd\'hui ou plus tard');
      return;
    }

    const donnees = {
      userId: f.userId,
      jour: depuisInputDate(f.jourDate),
      heure: f.heure,
      duree: Math.max(0.5, Number(f.duree) || 1),
      emplacement: f.emplacement,
      devisId: f.devisId || null,
      client: String(f.client || '').trim(),
      prestation: String(f.prestation || '').trim(),
      marque: String(f.marque || '').trim(),
      immat: String(f.immat || '').trim().toUpperCase(),
      tel: String(f.tel || '').trim()
    };
    if (existant) Object.assign(existant, donnees);
    else DB.etat.planning.push(Object.assign({ id: DB.nouvelId('r'), fait: false }, donnees));

    const u = DB.utilisateur(donnees.userId);
    const pose = existant || DB.etat.planning[DB.etat.planning.length - 1];
    S.modale = null;
    enregistrer(`Planning : ${libelleRdv(donnees)} — ${u ? u.nom : ''} ${dateCourte(donnees.jour)} ${donnees.heure}`);
    toast(existant ? 'Créneau modifié' : 'Créneau posé');

    /* Le créneau est posé, le portable est là : le SMS s'écrit tout seul et
       n'attend qu'un envoi. Prévenir plus tard, c'est ne pas prévenir. */
    if (telRdv(pose)) {
      S.texteP = null;
      S.modale = { type: 'rdv-client', id: pose.id };
      rendre();
    }
  });

  // ajout d'un pense-bête
  const fm = $('#form-memo');
  if (fm) fm.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(fm).entries());
    if (!f.texte.trim()) return;
    const pour = S.memoDe || S.userId;
    const m = {
      id: DB.nouvelId('m'),
      userId: pour,
      type: f.type || 'note',
      texte: f.texte.trim(),
      quand: depuisInputDate(f.quand),
      fait: false,
      cree: Date.now()
    };
    DB.etat.memos.unshift(m);
    const moi = DB.utilisateur(S.userId);
    alerter(pour, 'memo',
      `${moi ? moi.nom : 'Quelqu\'un'} vous a laissé un pense-bête : ${m.texte}`,
      { vue: 'memos', ref: m.id });
    DB.sauver();

    if (pour === S.userId) {
      notifierNavigateur('Nouvelle tâche', m.texte);
      rendre();
    } else {
      // tâche créée pour un collègue : on propose tout de suite de le prévenir
      S.modale = { type: 'prevenir', id: m.id };
      rendre();
    }
  });

  // formulaire coordonnées côté client
  const fc = $('#form-client');
  if (fc) fc.addEventListener('submit', (e) => {
    e.preventDefault();
    const d = DB.devisParToken(S.clientToken);
    const c = DB.client(d.clientId);
    const v = DB.vehicule(d.vehiculeId);
    const f = Object.fromEntries(new FormData(fc).entries());

    /* Le client ne touche qu'à sa fiche et à son véhicule — jamais au chiffrage.
       Et il ne peut qu'ajouter ou corriger : un champ qu'il laisse vide ne
       efface pas ce que l'atelier avait déjà noté. Sans cette précaution, une
       adresse saisie ici disparaissait au premier formulaire renvoyé à moitié. */
    ['prenom', 'nom', 'tel', 'email', 'adresse', 'cp', 'ville'].forEach(k => {
      const val = String(f[k] || '').trim();
      if (val) c[k] = val;
    });
    c.maj = Date.now();                       // la fiche repart vers EBP
    if (v) {
      if (f.v_immat)  v.immat  = f.v_immat.toUpperCase().trim();
      if (f.v_marque) v.marque = f.v_marque.trim();
      if (f.v_modele) v.modele = f.v_modele.trim();
      if (f.v_km)     v.km     = Math.max(0, Number(f.v_km) || 0);
      v.maj = Date.now();
    }

    if (d.statut === 'attente' || d.statut === 'appel') { d.statut = 'brouillon'; d.maj = Date.now(); }
    DB.noter(d.creePar, `${c.prenom} ${c.nom} a rempli sa fiche (${d.numero})`);
    DB.etat.memos.unshift({
      id: DB.nouvelId('m'), userId: d.creePar, type: 'devis',
      texte: `Chiffrer le devis ${d.numero} — ${(c.prenom + ' ' + c.nom).trim()}, fiche remplie`,
      quand: Date.now(), fait: false, cree: Date.now()
    });
    DB.sauver();
    toast('Merci, vos informations sont enregistrées.');
    rendre();
  });

  // filtre du catalogue : on garde le curseur dedans entre deux redessins
  const rp = $('#rech-presta');
  if (rp) {
    rp.addEventListener('input', () => { S.filtrePresta = rp.value; rendre(); });
    rp.focus();
    rp.setSelectionRange(rp.value.length, rp.value.length);
  }

  // signature
  const cv = $('#signature');
  if (cv) brancherSignature(cv);

  plierReglages();

  /* Le bandeau du micro vit à côté de l'écran, pas dedans : il doit rester
     visible quel que soit ce qu'on regarde, et survivre à chaque redessin. */
  const ancien = document.getElementById('voix-barre');
  if (ancien) ancien.remove();
  const h = (S.userId && !enVuePublique()) ? barreVocale() : '';
  if (h) {
    const d = document.createElement('div');
    d.id = 'voix-barre';
    d.innerHTML = h;
    document.body.appendChild(d);
  }
}

let signatureVide = true;
function brancherSignature(cv) {
  const ctx = cv.getContext('2d');
  const style = getComputedStyle(document.documentElement);
  ctx.strokeStyle = style.getPropertyValue('--encre').trim() || '#111';
  ctx.lineWidth = 3.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  signatureVide = true;

  let trace = false;
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * (cv.width / r.width), y: (e.clientY - r.top) * (cv.height / r.height) };
  };
  cv.addEventListener('pointerdown', (e) => {
    trace = true; cv.setPointerCapture(e.pointerId);
    const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y);
    signatureVide = false;
    const inv = $('#signature-invite'); if (inv) inv.style.display = 'none';
  });
  cv.addEventListener('pointermove', (e) => {
    if (!trace) return;
    const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke();
  });
  const fin = () => { trace = false; };
  cv.addEventListener('pointerup', fin);
  cv.addEventListener('pointercancel', fin);
}

/* Le navigateur vise mal à travers une transformation 3D : un clic sur une
   place du plan atterrit sur le conteneur au lieu de la place. On retrouve
   donc la place nous-mêmes, à partir de son rectangle projeté à l'écran —
   exact ici, puisque le plan n'est basculé que sur un axe. */
function placeSousLePoint(x, y) {
  const cadre = document.querySelector('.parc-cadre');
  if (!cadre) return null;
  const bc = cadre.getBoundingClientRect();
  if (x < bc.left || x > bc.right || y < bc.top || y > bc.bottom) return null;

  let trouvee = null;
  cadre.querySelectorAll('.place').forEach(p => {
    const b = p.getBoundingClientRect();
    if (x >= b.left && x <= b.right && y >= b.top && y <= b.bottom) trouvee = p;
  });
  return trouvee;   // la dernière : celle du rang le plus proche
}

/* Le sommaire des tarifs. Selon la page, ce n'est pas la fenêtre qui défile
   mais un bloc intérieur : une ancre ne suffit pas, on va chercher la section
   nous-mêmes. */
document.addEventListener('click', (e) => {
  const puce = e.target.closest('.sommaire .puce');
  if (!puce) return;
  const section = document.getElementById(puce.getAttribute('href').slice(1));
  if (!section) return;
  e.preventDefault();
  const doux = !matchMedia('(prefers-reduced-motion: reduce)').matches;
  section.scrollIntoView({ block: 'start', behavior: doux ? 'smooth' : 'auto' });
});

/* ==========================================================================
   LA COMMANDE VOCALE
   --------------------------------------------------------------------------
   Un mécanicien a les mains dans le moteur : demander « ouvre le planning »
   vaut mieux que d'essuyer ses doigts pour toucher l'écran. Tout ce qui se
   fait au doigt se dit aussi.

   Le principe : une table de commandes, chacune avec ses tournures, son
   exemple et ce qu'elle fait. La liste d'aide se construit à partir de cette
   même table — elle ne peut donc pas mentir sur ce que l'outil comprend.
   ========================================================================== */

/* Ce qui sort d'une reconnaissance vocale n'est jamais propre : majuscules,
   accents, ponctuation, « s'il te plaît » collé au bout. On ramène tout à une
   forme plate avant de comparer. */
function normaliserVoix(t) {
  return String(t || '')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .toLowerCase()
    .replace(/[.,;!?]/g, ' ')
    .replace(/\b(s'il te plait|s'il vous plait|steuplait|merci)\b/g, ' ')
    .replace(/[\u2019\u02bc\u00b4`]/g, "'")
    .replace(/\s+/g, ' ')
    .trim();
}

/** Retrouver quelqu'un de l'équipe par son prénom, tel qu'il a été entendu. */
function quiVoix(mot) {
  const m = normaliserVoix(mot);
  if (!m) return null;
  return DB.etat.utilisateurs.find(u => normaliserVoix(u.nom) === m)
      || DB.etat.utilisateurs.find(u => normaliserVoix(u.nom).startsWith(m))
      || null;
}

/* ==========================================================================
   Comprendre une date, une heure, une durée dites à voix haute
   --------------------------------------------------------------------------
   Chaque fonction cherche son morceau n'importe où dans la phrase, le retire,
   et rend le reste : « rendez-vous demain 14 h pendant 2 heures » se démonte
   ainsi sans imposer d'ordre à celui qui parle.
   ========================================================================== */
const JOURS_DITS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const MOIS_DITS = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin',
                   'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];

/** Le jour dit, ramené à minuit. Rend { ts, reste } ou null. */
function dateVocale(t) {
  const jour = minuit(Date.now());
  const pris = (ts, m) => ({ ts, reste: t.replace(m, ' ').replace(/\s+/g, ' ').trim() });
  const decale = (n) => { const d = new Date(jour); d.setDate(d.getDate() + n); return d.getTime(); };
  let m;

  if ((m = /\b(aujourd'hui|ce matin|cet apres-midi|ce soir|dans la journee)\b/.exec(t))) return pris(jour, m[0]);
  if ((m = /\bapres-demain\b/.exec(t))) return pris(decale(2), m[0]);
  if ((m = /\bdemain\b/.exec(t))) return pris(decale(1), m[0]);

  // « mardi », « mardi prochain » : la prochaine fois qu'on y sera
  if ((m = /\b(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(\s+prochain)?\b/.exec(t))) {
    const vise = JOURS_DITS.indexOf(m[1]);
    const d = new Date(jour);
    let ecart = (vise - d.getDay() + 7) % 7;
    if (ecart === 0 && m[2]) ecart = 7;      // « mardi prochain », dit un mardi
    return pris(decale(ecart), m[0]);
  }

  // « le 25 », « le 25 septembre », « 25 septembre »
  if ((m = new RegExp('\\b(?:le\\s+)?(\\d{1,2})(?:er)?\\s+(' + MOIS_DITS.join('|') + ')\\b').exec(t))) {
    const d = new Date(jour);
    d.setMonth(MOIS_DITS.indexOf(m[2]), +m[1]);
    if (d.getTime() < jour) d.setFullYear(d.getFullYear() + 1);
    return pris(minuit(d.getTime()), m[0]);
  }
  if ((m = /\ble\s+(\d{1,2})(?:er)?\b/.exec(t))) {
    const d = new Date(jour);
    d.setDate(+m[1]);
    if (d.getTime() < jour) d.setMonth(d.getMonth() + 1);
    return pris(minuit(d.getTime()), m[0]);
  }
  // « 25/09 », « 25 09 2026 »
  if ((m = /\b(\d{1,2})[/](\d{1,2})(?:[/](\d{2,4}))?\b/.exec(t))) {
    const an = m[3] ? (m[3].length === 2 ? 2000 + (+m[3]) : +m[3]) : new Date(jour).getFullYear();
    const d = new Date(an, (+m[2]) - 1, +m[1]);
    if (!m[3] && d.getTime() < jour) d.setFullYear(an + 1);
    return pris(minuit(d.getTime()), m[0]);
  }
  return null;
}

/** L'heure dite, en « 14:30 ». Rend { heure, reste } ou null. */
function heureVocale(t) {
  const pose = (h, min, m) => {
    const hh = Math.min(23, Math.max(0, h));
    const mm = Math.min(59, Math.max(0, min));
    return { heure: String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0'),
             reste: t.replace(m, ' ').replace(/\s+/g, ' ').trim() };
  };
  let m;
  if ((m = /\b(?:a\s+)?midi\b/.exec(t))) return pose(12, 0, m[0]);
  /* « 14 h », « 14h30 », « 14 heures et demie », « 9 h moins le quart ». Le
     « à » est facultatif : personne ne le dit toujours. */
  // « heures » avant « h » : sinon l'expression s'arrête au h et laisse « eures »
  /* Les minutes s'écrivent sur deux chiffres : sans ça « 14 h 2 heures » se
     lisait 14 h 02, et la durée disparaissait dans l'heure. */
  const re = /\b(?:a\s+|vers\s+)?(\d{1,2})\s*(?:heures?|h|:)\s*(\d{2})?\s*(et demie|et quart|moins le quart)?/;
  if ((m = re.exec(t))) {
    let h = +m[1], min = m[2] ? +m[2] : 0;
    if (m[3] === 'et demie') min = 30;
    else if (m[3] === 'et quart') min = 15;
    else if (m[3] === 'moins le quart') { h -= 1; min = 45; }
    return pose(h, min, m[0]);
  }
  return null;
}

/** La durée dite, en heures décimales. Toujours annoncée — « pendant deux
 *  heures », « durée 30 minutes » — sinon on la confondrait avec l'heure. */
function dureeVocale(t) {
  const pris = (h, m) => ({ duree: Math.max(0.5, Math.round(h * 2) / 2),
                            reste: t.replace(m, ' ').replace(/\s+/g, ' ').trim() });
  let m;
  if ((m = /\b(?:pendant|duree|dure|en|sur)\s+(?:une\s+)?demi[- ]heure\b/.exec(t))) return pris(0.5, m[0]);
  if ((m = /\b(?:pendant|duree|dure|en|sur)\s+(\d{1,2})\s*h\s*(\d{2})\b/.exec(t))) return pris(+m[1] + (+m[2]) / 60, m[0]);
  if ((m = /\b(?:pendant|duree|dure|en|sur)\s+(\d{1,3})\s*(?:min|minutes?)\b/.exec(t))) return pris((+m[1]) / 60, m[0]);
  if ((m = /\b(?:pendant|duree|dure|en|sur)\s+(\d{1,2})(?:[.,](\d))?\s*(?:h|heures?)?\s*(et demie)?\b/.exec(t))) {
    let h = +m[1] + (m[2] ? +('0.' + m[2]) : 0);
    if (m[3]) h += 0.5;
    return pris(h, m[0]);
  }
  return null;
}

/* ==========================================================================
   Remplir le formulaire ouvert
   --------------------------------------------------------------------------
   On écrit dans le champ, on prévient la page, et surtout on ne redessine pas :
   un redessin reconstruit la fenêtre depuis zéro et effacerait tout ce qui
   vient d'être dicté.
   ========================================================================== */
function poserChamp(nom, valeur) {
  const zone = document.querySelector('.voile') || document;
  const el = zone.querySelector('[name="' + nom + '"]');
  if (!el) return null;
  if (el.tagName === 'SELECT') {
    const v = String(valeur);
    const opt = [...el.options].find(o => o.value === v)
             || [...el.options].find(o => normaliserVoix(o.textContent) === normaliserVoix(v))
             || [...el.options].find(o => normaliserVoix(o.textContent).startsWith(normaliserVoix(v)));
    if (!opt) return null;
    el.value = opt.value;
  } else {
    el.value = valeur;
  }
  el.dispatchEvent(new Event('input', { bubbles: true }));
  el.dispatchEvent(new Event('change', { bubbles: true }));
  return el;
}

/** Y a-t-il un formulaire sous la main — une fenêtre ouverte, ou celui des mémos ? */
function formulaireOuvert() {
  return document.querySelector('.voile form') || document.getElementById('form-memo');
}

/** Le champ « jour » du formulaire ouvert : il ne porte pas le même nom partout. */
function champJour() {
  const f = formulaireOuvert();
  if (!f) return null;
  return f.querySelector('[name=jourDate]') ? 'jourDate'
       : f.querySelector('[name=quand]') ? 'quand' : null;
}

/* ==========================================================================
   Lire un rendez-vous dicté d'une traite
   --------------------------------------------------------------------------
   « rendez-vous demain 14 h pendant 2 heures pour Yoann au pont client Dupont
   distribution » : on retire un à un les morceaux qu'on sait reconnaître, et
   ce qui reste est du texte libre. La durée s'annonce (« pendant »), sans quoi
   on la confondrait avec l'heure.
   ========================================================================== */
function lireRdv(dit, brut) {
  const lu = { jour: minuit(Date.now()), heure: '', duree: 0, userId: '',
               emplacement: '', client: '', prestation: '', jourDit: false };
  let t = dit;

  const d = dureeVocale(t); if (d) { lu.duree = d.duree; t = d.reste; }
  const j = dateVocale(t);  if (j) { lu.jour = j.ts; lu.jourDit = true; t = j.reste; }
  const h = heureVocale(t); if (h) { lu.heure = h.heure; t = h.reste; }

  /* « demain 14 h 2 heures » : l'heure est prise, une seconde durée n'a plus
     besoin d'être annoncée — il ne reste rien d'autre qu'elle puisse être. */
  if (lu.heure && !lu.duree) {
    const d2 = dureeVocale('pendant ' + t);
    if (d2) { lu.duree = d2.duree; t = d2.reste.replace(/^pendant\s*/, ''); }
  }

  let m;
  if ((m = /\b(?:au|sur le|sur la)\s+(pont|elevateur|sol)\b/.exec(t))) {
    lu.emplacement = m[1] === 'sol' ? 'sol' : 'pont';
    t = t.replace(m[0], ' ');
  }
  /* « pour Yoann » nomme un mécanicien ; « pour Dupont » nomme le client. On
     tranche sur l'équipe, la seule liste dont on soit sûr. */
  if ((m = /\b(?:pour|avec)\s+([a-z-]+)\b/.exec(t))) {
    const u = quiVoix(m[1]);
    if (u) { lu.userId = u.id; t = t.replace(m[0], ' '); }
  }
  if ((m = /\b(?:client|chez|pour le client)\s+(.+?)(?=\s+(?:prestation|travaux|pour|au pont|au sol)\b|$)/.exec(t))) {
    lu.client = m[1].trim(); t = t.replace(m[0], ' ');
  }
  if ((m = /\b(?:prestation|travaux|pour la|il faut)\s+(.+)$/.exec(t))) {
    lu.prestation = m[1].trim(); t = t.replace(m[0], ' ');
  }

  /* Ce qui reste sans étiquette est un nom de client : c'est ce qu'on dit en
     premier au téléphone, et le champ le plus souvent rempli. */
  const reste = t.replace(/\s+/g, ' ').trim();
  if (reste && !lu.client) lu.client = reste;
  else if (reste && !lu.prestation) lu.prestation = reste;

  // le nom et la prestation dits d'affilée : le catalogue tranche
  if (lu.client && !lu.prestation) {
    const coupe = couperPrestation(lu.client);
    lu.client = coupe.client; lu.prestation = coupe.prestation;
  }

  /* Les majuscules du nom se reprennent sur la phrase d'origine. */
  if (brut) {
    [['client', lu.client], ['prestation', lu.prestation]].forEach(([cle, val]) => {
      if (!val) return;
      const trouve = motifAccents(val).exec(brut);
      if (trouve) lu[cle] = trouve[0];
    });
  }
  return lu;
}

/* « client Dupont distribution » : rien ne dit où s'arrête le nom. Mais le
   catalogue de l'atelier, lui, sait ce qu'est une distribution. On coupe au
   premier mot que le catalogue reconnaît — le reste devant est le client. */
function couperPrestation(texte) {
  const mots = String(texte || '').trim().split(/\s+/).filter(Boolean);
  if (mots.length < 2) return { client: texte, prestation: '' };

  const libelles = DB.etat.catalogue.map(p => normaliserVoix(p.libelle))
    .concat(DB.etat.planning.map(p => normaliserVoix(p.prestation || '')));
  const connu = (mot) => mot.length >= 4 && libelles.some(l => l.includes(mot));

  const i = mots.findIndex(m => connu(normaliserVoix(m)));
  if (i <= 0) return { client: texte, prestation: '' };   // rien de connu, ou dès le premier mot
  return { client: mots.slice(0, i).join(' '), prestation: mots.slice(i).join(' ') };
}

/** De quoi confirmer à voix haute ce qu'on a compris. */
function resumeRdv(lu) {
  const bouts = [];
  bouts.push(lu.jourDit ? dateCourte(lu.jour) : "aujourd'hui");
  if (lu.heure) bouts.push(lu.heure);
  if (lu.duree) bouts.push(heuresFr(lu.duree));
  if (lu.client) bouts.push(lu.client);
  const u = lu.userId ? DB.utilisateur(lu.userId) : null;
  if (u) bouts.push('pour ' + u.nom);
  return bouts.join(' · ');
}

/** Une expression qui retrouve un fragment dans le texte d'origine, accents et
    majuscules compris : « revision » y retrouve « Révision ». */
function motifAccents(fragment) {
  const equiv = { a: '[aàâä]', e: '[eéèêë]', i: '[iîï]', o: '[oôö]', u: '[uùûü]', c: '[cç]' };
  return new RegExp(String(fragment).split('')
    .map(ch => equiv[ch] || ch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join(''), 'i');
}

/* Les écrans, avec les mots par lesquels on les appelle vraiment. Le premier
   de chaque liste sert d'exemple dans l'aide. */
const ECRANS_VOIX = [
  { vue: 'atelier',   nom: "L'atelier",     mots: ["l'atelier", 'atelier', "aujourd'hui", 'le tableau', 'tableau', 'accueil'] },
  { vue: 'planning',  nom: 'Le planning',   mots: ['le planning', 'planning', 'agenda', 'les rendez-vous', 'rendez-vous'] },
  { vue: 'parking',   nom: 'Le parc',       mots: ['le parc', 'parc', 'parking', 'les voitures'] },
  { vue: 'memos',     nom: 'Le pense-bête', mots: ['les memos', 'memos', 'le pense-bete', 'pense-bete', 'les rappels'] },
  { vue: 'clients',   nom: 'Les clients',   mots: ['les clients', 'clients', 'la clientele'] },
  { vue: 'catalogue', nom: 'Les tarifs',    mots: ['les tarifs', 'tarifs', 'le catalogue', 'catalogue', 'les prix'] },
  { vue: 'reglages',  nom: 'Les paramètres',mots: ['les parametres', 'parametres', 'les reglages', 'reglages'] }
];

/* Les verbes qui ouvrent quelque chose. Optionnels : dire « planning » suffit. */
const OUVRIR = '(?:ouvre|ouvrir|va|vas|aller|va a|va au|va aux|affiche|montre|montrer|donne|passe a|passe au)?'
  + '(?:[-\\s]moi)?\\s*';


/* ==========================================================================
   Le dialogue : quand il manque quelque chose, l'outil demande
   --------------------------------------------------------------------------
   Dicter un rendez-vous complet d'une traite, personne ne le fait. On pose
   donc la question qui manque — « Pour quel client ? » — et la phrase
   suivante vaut réponse. Une fois tout rempli, l'outil relit ce qu'il a
   compris et attend un « oui » : rien ne part sans qu'on l'ait entendu.
   ========================================================================== */
const DIALOGUES = {
  planif: {
    nom: 'le rendez-vous',
    poser: 'Je pose le rendez-vous ?',
    champs: [
      { champ: 'client',     dit: 'le client',     question: 'Pour quel client ?' },
      { champ: 'prestation', dit: 'la prestation',  question: "Qu'est-ce qu'il y a à faire ?" },
      /* L'heure a toujours une valeur dans la liste : ce n'est pas parce que
         le champ n'est pas vide qu'elle a été dite. */
      { champ: 'heure',      dit: "l'heure",       question: 'À quelle heure ?', jamaisVide: true, lire: heureVocale }
    ]
  },
  appel: {
    nom: 'la fiche',
    poser: 'J\'enregistre la demande ?',
    champs: [
      { champ: 'nom',    dit: 'le nom',              question: 'Le nom du client ?' },
      { champ: 'tel',    dit: 'le numéro',           question: 'Son numéro de téléphone ?' },
      { champ: 'immat',  dit: "l'immatriculation",   question: "L'immatriculation du véhicule ?" },
      { champ: 'panne',  dit: 'la panne',            question: "Qu'est-ce qui ne va pas ?" }
    ]
  },
  memo: {
    nom: 'le pense-bête',
    poser: 'J’ajoute ce rappel ?',
    champs: [
      { champ: 'texte', dit: 'le texte', question: 'Que faut-il noter ?' },
      { champ: 'quand', dit: 'la date',   question: 'Pour quand ?', jamaisVide: true, lire: dateVocale }
    ]
  }
};

/** Ce qui n'est pas encore renseigné, dans l'ordre où on le demanderait. */
function champsManquants(type, dits, passes) {
  const f = formulaireOuvert();
  return DIALOGUES[type].champs.filter(c => {
    if (dits.has(c.champ) || (passes && passes.has(c.champ))) return false;
    if (c.jamaisVide) return true;      // l'heure a toujours une valeur : ce n'est pas une réponse
    const el = f && f.querySelector('[name="' + c.champ + '"]');
    return el ? !String(el.value || '').trim() : false;
  });
}

/** Ouvrir un dialogue sur le formulaire qui vient de s'ouvrir.
 *  Questions coupées dans les réglages : on dit ce qui manque, une fois, et on
 *  laisse la main — celui qui préfère taper n'est pas interrogé. */
function ouvrirDialogue(type, dits) {
  const vus = new Set(dits || []);
  if (!DB.etat.reglages.voixDemande) {
    finirDialogue();
    const reste = champsManquants(type, vus, null);
    if (!reste.length) return 'dites « valide » pour enregistrer';
    return 'il manque ' + reste.map(c => c.dit || c.champ).join(' et ');
  }
  VOIX.dialogue = { type, dits: vus, passes: new Set() };
  return demanderSuite();
}

function finirDialogue() { VOIX.dialogue = null; VOIX.attente = null; }

/** Ce qu'il reste à demander, dans l'ordre. */
function manqueDialogue() {
  const d = VOIX.dialogue;
  if (!d) return [];
  const f = formulaireOuvert();
  if (!f && d.type !== 'memo') { finirDialogue(); return []; }
  return champsManquants(d.type, d.dits, d.passes);
}

/** Poser la question suivante, ou demander confirmation. Rend la phrase à dire. */
function demanderSuite() {
  const d = VOIX.dialogue;
  if (!d) return '';
  VOIX.questionPosee = true;      // pour ne pas la reposer deux fois dans la même phrase
  const reste = manqueDialogue();
  if (reste.length) {
    VOIX.attente = { champ: reste[0].champ, question: reste[0].question, lire: reste[0].lire || null };
    return reste[0].question;
  }
  const modele = DIALOGUES[d.type];
  if (!modele.poser) { finirDialogue(); return ''; }

  /* Relecture coupée dans les réglages : tout est rempli, on enregistre. Sans
     redessiner — la fenêtre serait détruite avant que le formulaire ne parte. */
  if (!DB.etat.reglages.voixConfirme) {
    const f = formulaireOuvert();
    finirDialogue();
    if (!f) return '';
    VOIX.garderEcran = true;
    setTimeout(() => f.requestSubmit(), 0);
    return 'c’est enregistré';
  }

  VOIX.attente = { champ: null, question: modele.poser };
  return relireDialogue() + ' ' + modele.poser;
}

/** Relire ce qui est dans le formulaire, pour que l'accord se donne en connaissance. */
function relireDialogue() {
  const f = formulaireOuvert();
  if (!f || !VOIX.dialogue) return '';
  const v = (n) => { const el = f.querySelector('[name="' + n + '"]'); return el ? String(el.value || '').trim() : ''; };
  if (VOIX.dialogue.type === 'appel') {
    return [v('nom'), v('immat'), v('panne')].filter(Boolean).join(', ') + '.';
  }
  if (VOIX.dialogue.type === 'memo') {
    return v('texte') + (v('quand') ? ', pour le ' + dateCourte(depuisInputDate(v('quand'))) : '') + '.';
  }
  const sel = f.querySelector('[name=userId]');
  const qui = sel ? sel.options[sel.selectedIndex].text : '';
  const jour = v('jourDate') ? dateCourte(depuisInputDate(v('jourDate'))) : '';
  return [jour, v('heure'), v('client'), v('prestation'), qui ? 'pour ' + qui : '']
    .filter(Boolean).join(', ') + '.';
}

/* Les mots qui pilotent le dialogue lui-même, et rien d'autre. */
const MOTS_OUI = /^(?:oui|ouais|c'est bon|d'accord|ok|vas-y|valide|valider|enregistre|enregistrer|confirme|confirmer|pose-le|c'est ca)$/;
const MOTS_NON = /^(?:non|pas encore|attends|attend|laisse|annule|annuler|laisse tomber|arrete)$/;
const MOTS_PASSE = /^(?:passe|passer|sans|je ne sais pas|aucun|aucune|rien|plus tard|on verra)$/;

/** La phrase répond-elle à la question posée ? Rend la confirmation, ou null. */
function repondreAttente(dit, brut) {
  const a = VOIX.attente;
  if (!a) return null;

  if (MOTS_NON.test(dit)) {
    const surConfirmation = !a.champ;
    finirDialogue();
    if (surConfirmation) return 'Très bien, rien n’est posé — dites « valide » quand vous voulez';
    S.modale = null;
    VOIX.garderEcran = false;
    return 'Abandonné';
  }

  if (!a.champ) {                       // on attendait un accord
    if (!MOTS_OUI.test(dit)) return null;
    const f = formulaireOuvert();
    finirDialogue();
    if (!f) return null;
    /* Surtout ne pas redessiner : la fenêtre serait reconstruite et le
       formulaire détaché avant même de s'enregistrer. */
    VOIX.garderEcran = true;
    setTimeout(() => f.requestSubmit(), 0);
    return 'C’est posé';
  }

  /* « c'est bon », « valide » posés sur une question : on garde ce que le
     champ contient déjà et on passe à la suite. Sur un champ vide, on le
     redemande plutôt que d'enregistrer un rendez-vous sans client. */
  if (MOTS_OUI.test(dit)) {
    const f = formulaireOuvert();
    const el = f && f.querySelector('[name="' + a.champ + '"]');
    if (!el || !String(el.value || '').trim()) { VOIX.garderEcran = true; return 'Il me faut encore ça. ' + a.question; }
    VOIX.dialogue.dits.add(a.champ);
    VOIX.garderEcran = true;
    return demanderSuite() || '';
  }

  if (MOTS_PASSE.test(dit)) {
    VOIX.dialogue.passes.add(a.champ);
    const suite = demanderSuite();
    VOIX.garderEcran = true;
    return 'Sans, alors. ' + suite;
  }

  /* Tout le reste est la réponse. Un champ qui se lit — l'heure, une date —
     passe par son lecteur ; les autres prennent la phrase telle qu'elle est. */
  let valeur = (brut || dit).trim(), echo = valeur;
  if (a.lire) {
    const lu = a.lire(dit);
    if (!lu) { VOIX.garderEcran = true; return 'Je n’ai pas saisi. ' + a.question; }
    if (lu.heure) { valeur = echo = lu.heure; }
    else { valeur = isoLocal(lu.ts); echo = dateCourte(lu.ts); }   // une date se relit en clair
  }
  if (!poserChamp(a.champ, valeur)) return null;
  VOIX.dialogue.dits.add(a.champ);

  const suite = demanderSuite();
  VOIX.garderEcran = true;
  return echo + (suite ? ' — ' + suite : '');
}
