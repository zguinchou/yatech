function vueClients() {
  const q = S.recherche.trim().toLowerCase();
  const liste = DB.etat.clients.filter(c => {
    if (!q) return true;
    const veh = DB.etat.vehicules.filter(v => v.clientId === c.id).map(v => v.immat + ' ' + v.marque + ' ' + v.modele).join(' ');
    return (c.nom + ' ' + c.prenom + ' ' + c.tel + ' ' + c.email + ' ' + c.ville + ' ' + veh).toLowerCase().includes(q);
  });

  return entete('Clients', `${liste.length} fiche${liste.length > 1 ? 's' : ''}`,
    `<button class="btn plein" data-act="appel">${ic('plus')} Nouveau client</button>`

        const vs = DB.etat.vehicules.filter(v => v.clientId === c.id);

        const fait = ds.filter(d => ['termine', 'facture'].includes(d.statut)).reduce((s, d) => s + totaux(d).ht, 0);

        <div class="carte-corps pile">

            <div class="champ">
              <label>Type</label>
              <select class="saisie" data-champ-client="type" data-id="${c.id}">

          <div class="champ-duo">${ch('Téléphone', 'tel', 'tel')}${ch('E-mail', 'email', 'email')}</div>
          ${ch('Adresse', 'adresse')}
          <div class="champ-duo">${ch('Code postal', 'cp')}${ch('Ville', 'ville')}</div>

            <label>Code client EBP</label>

          <div class="copiable">
            <input class="saisie" readonly value="${esc(lienGrille(c))}">

            ${c.tel ? `<a class="btn" href="sms:${esc(c.tel.replace(/\s/g, ''))}?&body=${encodeURIComponent(messageGrille(c))}">${ic('tel')} Par SMS</a>` : ''}

/* ==========================================================================
   ÉCRAN — catalogue de tarifs
   ========================================================================== */
function vueCatalogue() {
  const r = DB.etat.reglages;
  // sa propre recherche, qui ne cherche que dans les tarifs
  const q = (S.rechTarif || '').trim().toLowerCase();
  const filtre = q
    ? DB.etat.catalogue.filter(p => (p.libelle + ' ' + p.code + ' ' + p.famille).toLowerCase().includes(q))
    : DB.etat.catalogue;
  const familles = [...new Set(filtre.map(p => p.famille))];
  const toutes = [...new Set(DB.etat.catalogue.map(p => p.famille))];

  return entete('Tarifs', `${DB.etat.catalogue.length} lignes · ${r.tauxHoraire} €/h particulier · ${r.tauxHorairePro} €/h professionnel`,
    `<button class="btn" data-act="nouvelle-famille">${ic('plus')} Section</button>
     <button class="btn plein" data-act="nouvelle-presta">${ic('plus')} Ligne</button>`
  ) + `<div class="corps large pile">

    <div class="chercher">
      ${ic('loupe')}
      <input class="saisie" id="rech-tarif" value="${esc(S.rechTarif || '')}"
             placeholder="Chercher une prestation : « FAP », « alternateur », « EGR »…">
      ${q ? `<button class="btn nu" data-act="vider-rech-tarif" title="Effacer">${ic('croix')}</button>` : ''}
    </div>

    ${(() => {
      /* Tous les confrères n'ont pas le même tarif : celui qui amène dix
         voitures par mois n'a pas à payer le prix de celui qui en amène une.
         On ouvre sa grille d'ici, sans repasser par sa fiche. */
      const pros = DB.etat.clients.filter(c => DB.estPro(c));
      if (q || !pros.length) return '';
      return `<div class="rangee" style="gap:8px">
        <span class="etiq">Grille d'un confrère</span>
        <select class="saisie" style="max-width:280px" data-aller-grille>
          <option value="">— choisir un garage —</option>
          ${pros.map(c => `<option value="${c.id}">${esc(c.nom)}${
            c.remisePro ? ' · −' + c.remisePro + ' %' : ''}${
            c.tarifs && Object.keys(c.tarifs).length
              ? ' · ' + Object.keys(c.tarifs).length + ' prix convenu' + (Object.keys(c.tarifs).length > 1 ? 's' : '')
              : ''}</option>`).join('')}
        </select>
        <span class="aide">Pour ajuster ses prix à lui, ou relever une intervention.</span>
      </div>`;
    })()}

    ${q ? `<p class="mini">${filtre.length} prestation${filtre.length > 1 ? 's' : ''} trouvée${filtre.length > 1 ? 's' : ''}.</p>`
        : `<div class="encart" style="max-width:70ch">
      <b>Deux grilles.</b> Chaque ligne a un prix <b>particulier</b> et un prix <b>professionnel</b>.
      Quand vous montez un devis, l'outil applique automatiquement celle qui correspond au client.
      Vos clients pros peuvent aussi <b>consulter leur grille eux-mêmes</b> : le lien se trouve sur leur fiche.
      <br><br>
      <b>Les sections, c'est juste le rangement.</b> Chaque bloc ci-dessous en est une : Diagnostic,
      Électricité… Une ligne appartient à une seule section, et vous la déplacez avec le menu
      <b>Section</b> de sa ligne. Ça ne change ni les prix ni les devis — seulement l'ordre dans
      lequel vous et vos pros lisez la grille.
    </div>`}

    ${DB.etat.catalogue.length ? '' : `<div class="carte"><div class="vide" style="padding:34px 20px">
      <h3>Votre catalogue est vide</h3>
      <p class="mini">Reprenez la base livrée avec l'outil — une vingtaine de prestations
      d'électro-mécanique, à corriger à vos prix — ou importez vos articles depuis EBP.</p>
      <div class="rangee" style="justify-content:center;margin-top:14px">
        <button class="btn plein" data-act="remettre-catalogue">${ic('catalogue')} Remettre la base de prestations</button>
        <button class="btn" data-act="import-ebp" data-id="articles">${ic('devis')} Importer d'EBP</button>
      </div>
    </div></div>`}
    ${filtre.length || !DB.etat.catalogue.length ? '' : '<div class="carte"><div class="vide"><h3>Aucune prestation trouvée</h3></div></div>'}
    ${q ? '' : sommaireFamilles(familles, 't')}
    ${familles.map((f, iFam) => `
      <section class="carte" id="${cleFamille('t', iFam)}">
        <div class="carte-tete">
          <input class="saisie titre-famille" data-champ-famille="${esc(f)}" value="${esc(f)}"
                 title="Renommer cette section" aria-label="Nom de la section">
          <span class="etiq">${filtre.filter(p => p.famille === f).length} ligne${filtre.filter(p => p.famille === f).length > 1 ? 's' : ''}</span>
          <div class="rangee outils-section" style="margin-left:auto;gap:2px;flex-wrap:nowrap">
            <button class="btn nu" title="Monter cette section" data-act="monter-famille" data-id="${esc(f)}"
                    ${iFam === 0 ? 'disabled' : ''}>${ic('retour')}</button>
            <button class="btn nu" title="Descendre cette section" data-act="descendre-famille" data-id="${esc(f)}"
                    ${iFam === familles.length - 1 ? 'disabled' : ''}>${ic('fleche')}</button>
            <button class="btn nu danger" title="Supprimer cette section" data-act="suppr-famille" data-id="${esc(f)}"
                    ${toutes.length < 2 ? 'disabled' : ''}>${ic('poubelle')}</button>
          </div>
        </div>
        <div class="deroule"><table class="tarifs" style="min-width:480px">
          <thead><tr>
            <th>Prestation</th>
            <th class="droite" style="width:1%">Particulier</th>
            <th class="droite" style="width:1%">Professionnel</th>
            <th style="width:1%"></th>
          </tr></thead>
          <tbody>${filtre.filter(p => p.famille === f).map((p, iL, mesLignes) => {
            const ecart = p.prixHT > 0 && p.prixPro != null ? Math.round((1 - p.prixPro / p.prixHT) * 100) : 0;
            const premiere = iL === 0, derniere = iL === mesLignes.length - 1;
            return `<tr class="${S.prestaBougee === p.id ? 'vient-de-bouger' : ''}">
              <td class="td-lib"><input class="saisie" data-champ-presta="libelle" data-id="${p.id}"
                    value="${esc(p.libelle)}" placeholder="Ce que vous faites"></td>
              <td class="droite td-part" data-l="Particulier"><input class="saisie num" style="width:96px;text-align:right" type="number" step="0.01" data-champ-presta="prixHT" data-id="${p.id}" value="${p.prixHT}"></td>
              <td class="droite td-pro" data-l="Professionnel">
                <input class="saisie num" style="width:96px;text-align:right" type="number" step="0.01" data-champ-presta="prixPro" data-id="${p.id}" value="${p.prixPro != null ? p.prixPro : p.prixHT}">
                ${ecart > 0 ? `<div class="mini num" style="margin-top:3px">−${ecart} %</div>` : ''}
              </td>
              <td class="td-sup">
                <div class="rangee" style="gap:2px;flex-wrap:nowrap;justify-content:flex-end">
                  ${q ? '' : `<button class="btn nu range-l" data-act="monter-presta" data-id="${p.id}"
                          title="Monter cette ligne" ${premiere ? 'disabled' : ''}>${ic('haut')}</button>
                  <button class="btn nu range-l" data-act="descendre-presta" data-id="${p.id}"
                          title="Descendre cette ligne" ${derniere ? 'disabled' : ''}>${ic('bas')}</button>`}
                  <button class="btn nu" data-act="suppr-presta" data-id="${p.id}" title="Supprimer cette ligne">${ic('poubelle')}</button>
                </div>
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table></div>
        <div class="carte-pied">
          <button class="btn" data-act="nouvelle-presta" data-id="${esc(f)}">${ic('plus')} Ajouter une ligne ici</button>
        </div>
      </section>`).join('')}
  </div>`;
}

const TEINTES = [38, 195, 320, 145, 265, 15, 90, 220];

/* La gestion des comptes des garages confrères : qui peut entrer, avec quelle
   adresse, et comment refermer la porte sans effacer l'historique du client. */
function blocReglagesPro() {
  const pros = DB.etat.clients.filter(c => DB.estPro(c));
  const ouverts = pros.filter(c => c.mdp && c.mdp.emp);
  const attente = ouverts.filter(c => DB.mdpProvisoireClient(c.id));

  return `<section class="carte" style="grid-column:1/-1">
    <div class="carte-tete">
      <h2>Accès professionnels</h2>
      <span class="badge t-${attente.length ? 'attente' : ouverts.length ? 'ok' : 'neutre'}">
        ${ouverts.length} accès ouvert${ouverts.length > 1 ? 's' : ''}${attente.length ? ` · ${attente.length} en attente` : ''}</span>
      <button class="btn plein pousse" style="margin-left:auto" data-act="nouveau-pro">
        ${ic('plus')} Ajouter un garage
      </button>
    </div>
    <div class="carte-corps pile">
      ${!pros.length ? `<p class="aide" style="margin:0">Aucun garage confrère pour l'instant.
        Ajoutez-en un : il consultera ses tarifs et réservera ses créneaux sans vous appeler.</p>` : `

      <p class="aide" style="margin:0">Chaque garage entre avec <b>son e-mail</b> et son mot de passe.
      Vous pouvez lui en redonner un temporaire, changer son adresse, ou <b>refermer son accès</b>
      sans rien perdre de son historique.</p>

      <div class="pile" style="gap:12px">
        ${pros.map(c => {
          const ouvert = !!(c.mdp && c.mdp.emp);
          const temp = DB.codeTempPro(c.id);
          return `<div class="acces-ligne">
            <div class="acces-tete">
              <b>${esc(c.nom)}</b>
              ${!(c.email || '').trim() ? '<span class="badge t-urgent">Sans e-mail</span>'
                : !ouvert ? '<span class="badge t-mort">Accès fermé</span>'
                : temp ? `<span class="badge t-attente">Mot de passe temporaire <b class="num">${esc(temp)}</b></span>`
                : '<span class="badge t-ok">A choisi son mot de passe</span>'}
              ${c.lienEnvoye ? `<span class="mini">lien envoyé le ${dateCourte(c.lienEnvoye)}</span>` : ''}
            </div>
            <div class="champ">
              <label>E-mail de connexion</label>
              <input class="saisie" type="email" data-champ-client="email" data-id="${c.id}"
                     value="${esc(c.email || '')}" placeholder="contact@garage.fr">
            </div>
            <div class="rangee" style="gap:6px">
              <button class="btn" data-act="voir-grille" data-id="${c.id}">${ic('loupe')} Sa grille</button>
              <button class="btn" data-act="envoyer-grille" data-id="${c.id}">${ic('envoi')} Envoyer son accès</button>
              ${ouvert
                ? `<button class="btn" data-act="reinit-pro" data-id="${c.id}">${ic('retour')} Nouveau mot de passe</button>
                   <button class="btn nu danger pousse" style="margin-left:auto"
                           data-act="fermer-acces-pro" data-id="${c.id}">Fermer l'accès</button>`
                : `<button class="btn plein pousse" style="margin-left:auto"
                           data-act="reinit-pro" data-id="${c.id}">${ic('cadenas')} Rouvrir l'accès</button>`}
            </div>
          </div>`;
        }).join('')}
      </div>`}
    </div>
  </section>`;
}

/* L'equipe, les acces confreres et EBP ouvrent les parametres : c'est ce
   qu'on vient regler le plus souvent. Le reste suit. */
function blocReglagesEquipe(r) {
  return `
    <section class="carte" style="grid-column:1/-1">
      <div class="carte-tete">
        <h2>L'équipe</h2>
        <span class="compte-equipe">${DB.etat.utilisateurs.length}</span>
        <button class="pousse btn plein" style="margin-left:auto" data-act="ajouter-personne">${ic('plus')} Ajouter quelqu'un</button>
      </div>
      <div class="carte-corps pile" style="gap:14px">
        ${DB.etat.utilisateurs.map(u => `
          <div class="fiche-personne">
            <div class="teintes">
              ${TEINTES.map(t => `<button class="teinte ${u.teinte === t ? 'on' : ''}" style="--teinte:${t}"
                 data-act="teinte-personne" data-id="${u.id}" data-teinte="${t}" title="Couleur"></button>`).join('')}
            </div>
            <div class="champ-personne">
              <div class="champ"><label>Prénom</label>
                <input class="saisie" data-champ-user="nom" data-id="${u.id}" value="${esc(u.nom)}"></div>
              <div class="champ"><label>Fonction</label>
                <input class="saisie" data-champ-user="fonction" data-id="${u.id}" value="${esc(u.fonction)}"></div>
              <div class="champ"><label>Portable</label>
                <input class="saisie num" type="tel" data-champ-user="tel" data-id="${u.id}"
                       value="${esc(u.tel || '')}" placeholder="06 12 34 56 78"></div>
            </div>
            <div class="champ" style="grid-column:1/-1">
              <label>Ce qu'il ou elle peut régler</label>
              <div class="segments" style="max-width:360px">
                ${Object.keys(ROLES_ACCES).map(k => `<button data-act="role-acces" data-id="${u.id}"
                    data-role="${k}" class="${(k === 'admin') === estAdmin(u) ? 'on' : ''}"
                    ${(k === 'salarie' && estAdmin(u) && nbAdmins() < 2) ? 'disabled' : ''}>
                  ${esc(ROLES_ACCES[k].nom)}</button>`).join('')}
              </div>
              <span class="aide">${esc(ROLES_ACCES[estAdmin(u) ? 'admin' : 'salarie'].aide)}${
                estAdmin(u) && nbAdmins() < 2
                  ? ' <b>Seul administrateur de l\'atelier</b> — il en faut au moins un.' : ''}</span>
            </div>

            <div class="champ" style="grid-column:1/-1">
              <label>E-mail de connexion</label>
              <input class="saisie" type="email" data-champ-user="email" data-id="${u.id}"
                     value="${esc(u.email || '')}" placeholder="prenom@garage.fr" autocomplete="off">
              ${(() => {
                const m = DB.normEmail(u.email);
                if (!m) return '<span class="aide" style="color:var(--occupe)">Sans e-mail, cette personne ne peut pas se connecter.</span>';
                const double = DB.etat.utilisateurs.some(x => x.id !== u.id && DB.normEmail(x.email) === m)
                  || DB.etat.clients.some(x => DB.estPro(x) && DB.normEmail(x.email) === m);
                return double
                  ? '<span class="aide" style="color:var(--occupe)">Cette adresse sert déjà à un autre compte — la connexion serait ambiguë.</span>'
                  : '<span class="aide">C\'est ce qu\'il ou elle tape sur l\'écran de connexion.</span>';
              })()}
            </div>
            <div class="champ" style="grid-column:1/-1">
              <label>Comment le ou la prévenir</label>
              <div class="rangee">
                <select class="saisie" style="max-width:220px" data-canal-user data-id="${u.id}">
                  ${Object.keys(CANAUX).map(c => `<option value="${c}" ${canalDe(u) === c ? 'selected' : ''}>${
                    esc(CANAUX[c].nom)}</option>`).join('')}
                </select>
                ${joignable(u)
                  ? `<a class="btn" href="${esc(lienNotif(u, '[' + (DB.etat.reglages.nomOutil || 'Yatech')
                        + '] Essai — si vous lisez ceci, les avertissements arrivent bien.'))}"
                        target="_blank" rel="noopener">${ic('envoi')} Envoyer un essai</a>`
                  : `<span class="badge t-attente">${canalDe(u) === 'aucun' ? 'Ne sera pas prévenu'
                      : CANAUX[canalDe(u)].besoin === 'tel' ? 'Il manque son portable' : 'Il manque son e-mail'}</span>`}
              </div>
            </div>
            <button class="btn nu danger" data-act="suppr-personne" data-id="${u.id}"
                    title="Retirer ${esc(u.nom)} de l'équipe" ${DB.etat.utilisateurs.length < 2 ? 'disabled' : ''}>
              ${ic('poubelle')}
            </button>
            <div class="acces-personne">
              ${SANS_CODE
                ? `<span class="badge t-info">Entrée directe</span>
                   <span class="mini">aucun code n'est demandé tant que la porte est ouverte</span>`
                : DB.mdpProvisoire(u.id)
                ? `<span class="badge t-attente">Code de 1<sup>re</sup> connexion</span>
                   <span class="mini">entre avec <b class="num">${esc(MDP_PROVISOIRE)}</b>, choisira le sien en entrant</span>`
                : DB.aUnMdp(u.id)
                ? `<span class="badge t-ok">${ic('cadenas')} Code personnel</span>
                   <button class="btn" data-act="changer-code" data-id="${u.id}">Changer</button>
                   <button class="btn" data-act="reinit-code" data-id="${u.id}"
                           title="Si ${esc(u.nom)} a oublié son code">Réinitialiser à ${esc(MDP_PROVISOIRE)}</button>`
                : `<span class="badge t-urgent">Sans code — accès libre</span>
                   <button class="btn plein" data-act="changer-code" data-id="${u.id}">Donner un code</button>`}
            </div>
          </div>`).join('')}

        ${(() => {

/* ==========================================================================
   Les paramètres, en volets
   --------------------------------------------------------------------------
   Onze cartes dépliées d'un coup, c'est un mur : on cherche « l'équipe » en
   faisant défiler. On ne montre donc que le nom de chaque réglage, et on ouvre
   celui qu'on veut. Un seul à la fois — la liste reste sous les yeux, et on
   passe de l'un à l'autre sans jamais remonter.

   Le pliage se pose sur le rendu plutôt que dans chaque carte : les réglages
   s'écrivent comme avant, et une carte ajoutée demain sera pliée sans qu'on y
   pense. */
function nomVolet(section) {
  const h = section.querySelector('.carte-tete h2');
  if (!h) return '';
  return sansAccent(h.textContent).toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

function plierReglages() {
  if (S.vue !== 'reglages') return;
  const zone = document.querySelector('.corps.grille');
  if (!zone) return;

  /* Chercher un réglage : on lit le contenu de chaque volet, accents et
     ponctuation mis de côté, et on n'affiche que ceux qui en parlent — ouverts,
     puisqu'on sait déjà ce qu'on veut y faire. */
  const q = sansAccent(String(S.rechReglage || '').trim()).toLowerCase();
  const mots = q ? q.split(/\s+/).filter(Boolean) : [];
  let trouves = 0;

  zone.classList.add('volets');
  zone.classList.toggle('en-recherche', !!mots.length);
  zone.querySelectorAll(':scope > .carte').forEach(section => {
    const id = nomVolet(section);
    const tete = section.querySelector('.carte-tete');
    if (!id || !tete) return;             // une carte sans titre reste ouverte

    let colle = true;
    if (mots.length) {
      const texte = sansAccent(section.textContent || '').toLowerCase();
      colle = mots.every(m => texte.includes(m));
      section.hidden = !colle;
      if (colle) trouves++;
    } else {
      section.hidden = false;
    }

    const ouvert = mots.length ? colle : S.volet === id;
    section.dataset.volet = id;
    section.classList.toggle('ouvert', ouvert);

    tete.dataset.act = 'volet';
    tete.dataset.id = id;
    tete.setAttribute('role', 'button');
    tete.setAttribute('tabindex', '0');
    tete.setAttribute('aria-expanded', String(ouvert));

    if (!tete.querySelector('.volet-fleche')) {
      const f = document.createElement('span');
      f.className = 'volet-fleche';
      f.innerHTML = ic('fleche');
      tete.insertBefore(f, tete.firstChild);
    }
  });

  /* Rien trouvé : le dire, plutôt que de laisser un écran vide qui ressemble à
     une panne. */
  let vide = zone.querySelector('.rech-rien');
  if (mots.length && !trouves) {
    if (!vide) {
      vide = document.createElement('div');
      vide.className = 'carte rech-rien';
      vide.style.gridColumn = '1/-1';
      zone.appendChild(vide);
    }
    vide.innerHTML = `<div class="vide"><h3>Aucun réglage pour « ${esc(S.rechReglage)} »</h3>
      <p class="mini">Essayez un mot plus court : « tva », « heure », « parc », « voix », « couleur ».</p></div>`;
    vide.hidden = false;
  } else if (vide) {
    vide.hidden = true;
  }
}

/* Au clavier, un titre de volet s'ouvre comme le bouton qu'il est devenu. */
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const tete = e.target.closest && e.target.closest('[data-act="volet"]');
  if (!tete) return;
  e.preventDefault();
  tete.click();
});

/** Le texte tel qu'il partira, l'exemple en place. */
function apercuTexte(cle, mode) {
  const r = DB.etat.reglages;

  const valeurs = Object.assign({}, ex.valeurs, {
    garage: r.nom || 'Votre garage',

       qui parle d'annuler ferait croire à un lien qui n'existe pas. */
    lien: (location.origin || 'https://votre-garage.fr') + '/#'

/* ==========================================================================
   GRILLE TARIFAIRE PROFESSIONNELLE
   Un lien par client pro, envoyé une fois. Il consulte ses prix lui-même,
   toujours à jour — au lieu d'appeler et de mobiliser quelqu'un.
   ========================================================================== */
function lienGrille(c) {
  return location.href.split('#')[0] + '#tarifs=' + DB.jetonClient(c);
}

function messageGrille(c) {
  const r = DB.etat.reglages;
  const nom = c.type === 'pro' ? c.nom : (c.prenom + ' ' + c.nom).trim();
  const base = remplirModele(r.messageGrille, {
    prenom: c.prenom || c.nom || '', client: nom, lien: lienGrille(c), garage: r.nom
  });

  /* On joint les identifiants tant qu'il n'a pas choisi son mot de passe :
     sans ça, le lien arrive sans le moyen d'entrer. */
  const code = DB.codeTempPro(c.id);
  const acces = code && (c.email || '').trim()
    ? `\n\nPour vous connecter :\nAdresse : ${base.includes(lienGrille(c)) ? lienGrille(c).split('#')[0] : lienGrille(c)}`
      + `\nE-mail : ${c.email}\nMot de passe temporaire : ${code}`
      + `\n(il vous sera demandé d'en choisir un à vous dès la première connexion)`
    : '';

  return base + acces + `\n\n${r.nom}${r.tel ? '\n' + r.tel : ''}`;
}

/* ==========================================================================
   CE QU'UN CLIENT DOIT
   Une prestation réalisée n'est pas une prestation payée. On garde les deux
   séparées : l'atelier suit ce qu'il a fait, et ce qu'il attend encore.
   ========================================================================== */
const TRAVAIL_FAIT = ['termine', 'facture'];

/* Une intervention passe par trois états, et un seul les résume tous :
   en attente (demandée, pas encore faite) · à régler (faite, pas encaissée) ·
   réglée. On les déduit du dossier plutôt que d'ajouter un champ de plus qui
   pourrait le contredire. */
const ETATS_INTERV = {
  attente: { nom: 'En attente', court: 'Attente', ton: 'attente' },
  aregler: { nom: 'À régler',   court: 'À régler', ton: 'urgent'  },
  regle:   { nom: 'Réglé',      court: 'Réglé',    ton: 'ok'      }
};

function etatIntervention(d) {
  if (d.regle) return 'regle';
  return TRAVAIL_FAIT.includes(d.statut) ? 'aregler' : 'attente';
}

/* Poser un état à la main : c'est l'atelier qui décide, l'outil suit et met le
   dossier en accord — sinon l'historique dirait une chose et le devis une autre. */
function poserEtatIntervention(devisId, etat) {
  const d = DB.devis(devisId);
  if (!d || !ETATS_INTERV[etat]) return;
  if (etat === 'attente') {
    d.regle = null;
    if (TRAVAIL_FAIT.includes(d.statut)) d.statut = 'accepte';
  } else {
    if (!TRAVAIL_FAIT.includes(d.statut)) { d.statut = 'termine'; d.reponse = d.reponse || Date.now(); }
    d.regle = etat === 'regle' ? (d.regle || Date.now()) : null;
  }
  d.maj = Date.now();
  DB.sauver();
}

/** Les interventions d'un client : celles qui sont faites, et celles qui attendent. */
function interventionsDe(clientId) {
  return DB.etat.devis
    .filter(d => d.clientId === clientId && d.lignes.length
              && (TRAVAIL_FAIT.includes(d.statut) || d.demandePro))
    .sort((a, b) => (b.reponse || b.maj) - (a.reponse || a.maj));
}

/* Ce qui est réellement dû : le travail fait et non encaissé. Une demande en
   attente n'est pas une dette — elle n'a pas encore été réalisée. */
function resteADevoir(clientId) {
  return interventionsDe(clientId).filter(d => etatIntervention(d) === 'aregler')
    .reduce((s, d) => s + totaux(d).ttc, 0);
}

/** Le tableau des interventions d'un pro — le même des deux côtés du décor. */
function listeInterventions(c, pourLePro) {
  const liste = interventionsDe(c.id);
  const du = resteADevoir(c.id);
  if (!liste.length) {
    return `<div class="vide" style="padding:26px 16px">
      <p class="mini">${pourLePro ? 'Aucune intervention terminée pour l\'instant.'
        : 'Aucune intervention terminée pour ce client.'}</p></div>`;
  }

  return `<div class="deroule"><table class="travaux" style="min-width:520px">
      <thead><tr>
        <th>Intervention</th><th>Véhicule</th>
        <th class="droite" style="width:1%">Montant TTC</th>
        <th style="width:1%">Règlement</th>
      </tr></thead>
      <tbody>${liste.map(d => {
        const v = DB.vehicule(d.vehiculeId);
        const t = totaux(d);
        const quand = d.facture ? d.facture.date : (d.reponse || d.maj);
        return `<tr>
          <td class="td-lib">
            <div class="ligne-titre">${esc(d.panne || d.lignes.map(l => l.libelle).filter(Boolean)[0] || d.numero)}</div>
            <div class="ligne-sous">${esc(d.numero)} · ${dateCourte(quand)}${
              d.notee ? ' · notée après coup' : ''}</div>
            <ul class="prestations-faites">${d.lignes.map(l => `<li>
              <span>${esc(l.libelle)}${Number(l.qte) !== 1 ? ` <i>× ${l.qte}</i>` : ''}</span>
              <b class="num">${eur((Number(l.qte) || 0) * (Number(l.prixHT) || 0))}</b>
            </li>`).join('')}</ul>
          </td>
          <td class="td-veh">${v ? `<span class="plaque">${esc(v.immat)}</span>
            <div class="ligne-sous">${esc((v.marque + ' ' + v.modele).trim())}</div>` : '—'}</td>
          <td class="droite td-montant num" data-l="Montant TTC">${eur(t.ttc)}</td>
          <td class="td-regle" data-l="État">${(() => {
            const etat = etatIntervention(d);
            if (pourLePro) {
              return `<span class="badge t-${ETATS_INTERV[etat].ton}">${esc(ETATS_INTERV[etat].nom)}</span>`
                   + (etat === 'regle' ? `<div class="mini">${dateCourte(d.regle)}</div>` : '');
            }
            /* Trois boutons plutôt qu'une bascule : l'atelier dit où en est
               chaque ligne, sans passer par un menu ni deviner le sens du clic. */
            return `<div class="rangee gestes-interv">
              <div class="segments etat-interv">
                ${Object.keys(ETATS_INTERV).map(k => `<button class="${etat === k ? 'on' : ''}"
                  data-act="etat-interv" data-id="${d.id}" data-etat="${k}"
                  title="${esc(ETATS_INTERV[k].nom)}">${esc(ETATS_INTERV[k].court)}</button>`).join('')}
              </div>
              <button class="btn nu danger" data-act="suppr-intervention" data-id="${d.id}"
                      title="Supprimer cette intervention">${ic('poubelle')}</button>
            </div>${etat === 'regle' ? `<div class="mini">${dateCourte(d.regle)}</div>` : ''}`;
          })()}
          </td>
        </tr>`;
      }).join('')}</tbody>
    </table></div>
    <div class="rangee bilan-du">
      <span class="etiq">${liste.length} intervention${liste.length > 1 ? 's' : ''}</span>
      <span class="pousse" style="margin-left:auto">
        ${du > 0
          ? `<b class="num" style="color:var(--occupe);font-size:17px">${eur(du)}</b>
             <span class="mini"> ${pourLePro ? 'restant à régler' : 'à encaisser'}</span>`
          : `<b style="color:var(--libre)">Tout est réglé</b>`}
      </span>
    </div>`;
}

/* ==========================================================================
   RÉSERVATION PAR UN GARAGE PROFESSIONNEL
   Il voit les créneaux qui restent, il pose sa demande. Rien n'entre au
   planning sans qu'on l'ait acceptée : c'est une demande, pas un rendez-vous.
   ========================================================================== */

/** Ce qu'il reste comme place un jour donné, tous mécaniciens confondus. */
function chargeDuJour(jour) {
  const j = minuit(jour);
  const rdv = rdvActifs(j);
  const heuresOuvrees = heuresOuvertes(DB.etat.reglages);
  /* Ceux qui réparent. Dans un garage d'une personne qui s'est déclarée à
     l'accueil, il n'y en a aucun : la capacité tomberait à zéro et plus
     personne ne pourrait réserver. On retombe alors sur toute l'équipe. */
  const repare = DB.etat.utilisateurs.filter(u => u.role !== 'secretariat');
  const capacite = heuresOuvrees * (repare.length || DB.etat.utilisateurs.length);
  const pris = rdv.reduce((s, p) => s + (Number(p.duree) || 1), 0);
  return { pris, capacite, libre: Math.max(0, capacite - pris) };
}

function joursReservables(nb) {
  const jours = [];
  let n = 1;
  /* On ne propose jamais un jour où l'atelier n'ouvre pas : ni le dimanche, ni
     un jour de fermeture hebdomadaire, ni pendant les congés. Le garde-fou à
     400 évite une boucle sans fin si tout est fermé. */
  while (jours.length < nb && n <= 400) {
    const j = jourPlus(Date.now(), n++);
    if (jourOuvre(j)) jours.push(j);
  }
  return jours;
}

function blocReservationPro(c) {
  const demandes = DB.etat.planning.filter(p => p.demandeur === c.id);
  const enAttente = demandes.filter(p => p.aValider);

        <b>${enAttente.length} demande${enAttente.length > 1 ? 's' : ''} en attente de notre confirmation.</b>

      ${demandes.filter(p => !p.aValider).length ? `<div class="encart">
        <b>Confirmé :</b>
        ${demandes.filter(p => !p.aValider).map(p => `<div class="mini">${dateLongue(p.jour)} à ${esc(p.heure)}

  return `<div class="voile" data-voile><div class="modale" style="width:min(560px,100%)">
    <div class="modale-tete">
      <div><h2 style="font-size:18px">Prévenir ${esc(ct.nom)}</h2>
        <div class="mini">${v ? esc((v.marque + ' ' + v.modele).trim()) + ' · ' + esc(v.immat) : ''}
        — sans passer un appel</div></div>
      <button class="btn nu" style="margin-left:auto" data-act="fermer-modale">${ic('croix')}</button>
    </div>
    <div class="modale-corps pile">
      <div class="champ">
        <label>Le message</label>
        <textarea class="saisie" id="texte-pret" rows="8">${esc(texte)}</textarea>

      </div>
      ${!ct.tel ? '<div class="encart">Pas de portable dans sa fiche : seul l\'e-mail est possible.</div>' : ''}

    </div>
    <div class="modale-pied">
      <button class="btn nu pousse" style="margin-right:auto" data-act="copier-pret">${ic('copie')} Copier</button>
      ${ct.tel ? `<a class="btn" data-act="pret-envoye" data-id="${o.placeId}" data-canal="sms"
         href="sms:${esc(tel)}?body=${encodeURIComponent(texte)}">${ic('tel')} SMS</a>` : ''}
      ${ct.tel ? `<a class="btn plein" data-act="pret-envoye" data-id="${o.placeId}" data-canal="whatsapp"

    </div>
  </div></div>`;
}

      </div>
      <div class="encart">
        <b>Le lien d'annulation est dedans.</b> S'il clique dessus, le créneau se libère

      ${tel ? `<a class="btn plein" data-act="rdv-envoye" data-id="${p.id}" data-canal="sms"
         href="sms:${esc(tel)}?body=${encodeURIComponent(texte)}">${ic('tel')} SMS</a>` : ''}
      ${tel ? `<a class="btn" data-act="rdv-envoye" data-id="${p.id}" data-canal="whatsapp"
         target="_blank" rel="noopener"

      ${email ? `<a class="btn ${tel ? '' : 'plein'}" data-act="rdv-envoye" data-id="${p.id}" data-canal="email"

/* Le relevé en cours, posé au bas de la grille. Il ne quitte pas l'écran tant
   qu'il reste quelque chose dedans : c'est le rappel qu'une prestation attend
   d'être notée. */
function barrePanier(c) {
  if (!S.userId || !S.panier || S.panier.clientId !== c.id || !S.panier.lignes.length) return '';
  const sien = DB.catalogueDe(c);
  const lignes = S.panier.lignes.map(id => sien.find(x => x.id === id) || DB.presta(id)).filter(Boolean);
  const ht = lignes.reduce((s, p) => s + DB.prixPour(p, c), 0);
  const ttc = ht * (1 + DB.etat.reglages.tauxTva / 100);
  return `<div class="panier-barre sans-impression">
    <div class="panier-dedans">
      <div class="panier-txt">
        <b>${lignes.length} prestation${lignes.length > 1 ? 's' : ''} relevée${lignes.length > 1 ? 's' : ''}</b>
        <small>${esc(lignes.map(p => p.libelle).join(' · '))}</small>
      </div>
      <span class="num panier-total">${eur(ttc)} <i>TTC</i></span>
      <button class="btn nu panier-vider" data-act="panier-vider" title="Vider le relevé">
        ${ic('croix')}<span>Vider</span></button>
      <button class="btn plein" data-act="panier-noter" data-id="${c.id}">${ic('check')} Noter l'intervention</button>
    </div>
  </div>`;
}

/* --- la coiffe commune des pages publiques --------------------------------
   Le bandeau d'encre, la feuille, le pied. Les trois pages qu'un client ou un
   confrère peut ouvrir la partagent : c'est ce qui en fait des documents du
   même garage, et non trois écrans qui se ressemblent vaguement. */
function docPage(dedans, opts) {
  const r = DB.etat.reglages;
  const o = opts || {};
  const coord = [adresseGarage(r), r.tel].filter(Boolean).join(' · ');
  return `<div class="client-page${o.classe ? ' ' + o.classe : ''}">
    ${o.atelier || ''}
    <header class="doc-tete">
      <div class="doc-tete-dedans">
        ${marque()}
        <div class="doc-ident">
          <b>${esc(r.nom || 'Votre garage')}</b>
          <span>${esc(coord || 'Votre garage')}</span>
        </div>
        ${o.mention ? `<div class="doc-tete-droite">${esc(o.mention)}</div>` : ''}
      </div>
    </header>
    <div class="doc-feuille">
      ${dedans}
      <div class="doc-pied">
        ${esc(r.nom || '')}${r.formeJuridique ? ' ' + esc(r.formeJuridique) : ''}${
          coord ? '<br>' + esc(coord) : ''}${
          r.siret ? '<br>SIRET ' + esc(r.siret) : ''}${
          r.email ? ' · ' + esc(r.email) : ''}
      </div>
    </div>
    ${o.pied || ''}
  </div>`;
}

/** La barre de l'atelier : elle vit au-dessus du document, jamais dedans. */
function docBarreAtelier(dedans) {
  if (!S.userId) return '';
  return `<div class="doc-atelier sans-impression"><div class="doc-atelier-dedans">${dedans}</div></div>`;
}

function vueGrilleTarifs() {
  const c = DB.clientParToken(S.grilleToken);
  const r = DB.etat.reglages;

  if (!c) {
    return docPage(`<div class="doc-vide">
      <div class="doc-eyebrow">Lien</div>
      <h1>Ce lien ne mène à aucune grille</h1>
      <p class="doc-note">Il a peut-être été renouvelé depuis. Demandez-nous le lien à jour.</p>
    </div>`, { mention: 'Grille tarifaire' });
  }

  const pro = DB.estPro(c);
  const nom = c.type === 'pro' ? c.nom : (c.prenom + ' ' + c.nom).trim();
  /* Sa grille à lui : sans ce qu'on lui masque, avec ce qu'on ne fait que pour
     lui. Le catalogue commun ne bouge pas, les autres confrères non plus. */
  const sien = DB.catalogueDe(c);
  const familles = [...new Set(sien.map(p => p.famille))];
  const prix = (p) => DB.prixPour(p, c);
  const negocies = pro && DB.etat.catalogue.some(p => DB.prixNegocie(p, c));

  const barre = docBarreAtelier(`
    <b>Aperçu</b>
    <span class="mini">ce que voit ${esc(nom)} en ouvrant son lien</span>
    <button class="btn" style="margin-left:auto" data-act="copier" data-texte="${esc(lienGrille(c))}"
            data-quoi="Lien de ${esc(nom)}">${ic('copie')} Copier le lien</button>
    <button class="btn plein" data-act="envoyer-grille" data-id="${c.id}">${ic('envoi')} Le lui envoyer</button>
    <button class="btn nu" data-act="quitter-grille">${ic('croix')} Quitter</button>`);

  const dedans = `
    ${S.proConnecte === c.id ? `<div class="doc-actions sans-impression" style="justify-content:flex-end">
      <span class="doc-eyebrow" style="color:var(--doc-gris)">Connecté · ${esc(nom)}</span>
      <button class="btn nu" data-act="quitter-pro">Se déconnecter</button>
    </div>` : ''}

    <div class="doc-titre">
      <div class="doc-eyebrow">${pro ? 'Tarifs professionnels' : 'Tarifs'}</div>
      <h1>Grille tarifaire</h1>
      <div class="doc-ref">
        <span>Établie pour <b>${esc(nom)}</b></span>
        <span>En vigueur au <b>${esc(dateCourte(Date.now()))} ${new Date().getFullYear()}</b></span>
        <span><b>${sien.length}</b> prestations</span>
      </div>
    </div>

    ${pro ? `<p class="doc-prose">Deux colonnes : à gauche <b>votre prix</b>, à droite le tarif
      particulier — celui que paierait votre client final. De quoi établir votre propre facturation
      sans nous appeler.${negocies ? ' Les lignes marquées <b>convenu</b> sont les prix arrêtés ensemble : ils priment sur la remise.' : ''}</p>`
    : `<p class="doc-prose">Nos tarifs de main d'œuvre et de forfaits, tels qu'ils s'appliquent
      aujourd'hui. Les pièces s'ajoutent au devis, au tarif du jour de notre fournisseur.</p>`}

    ${S.userId ? `<div class="doc-encart sans-impression">
      <b>Vous relevez ce qui a été fait.</b> Touchez le <b>+</b> devant chaque prestation réalisée
      pour ${esc(nom)} : elles s'ajoutent en bas, et vous notez l'intervention d'un coup, aux prix
      de sa grille. Rien ne s'écrit tant que vous n'avez pas enregistré.
    </div>` : ''}

    ${familles.length > 1 ? `<nav class="doc-sommaire">
      ${familles.map((f, i) => `<a href="#${cleFamille('g', i)}">${esc(f)}</a>`).join('')}
    </nav>` : ''}

    ${familles.map((f, iFam) => `
      <section class="doc-section" id="${cleFamille('g', iFam)}">
        <div class="doc-section-tete">
          <h2>${esc(f)}</h2>
          ${pro ? `<span class="doc-colonnes"><span>Votre prix</span><span>Particulier</span></span>` : ''}
        </div>
        ${sien.filter(p => p.famille === f).map(p => {
          const ecart = pro && !p.perso && p.prixHT > 0 ? Math.round((1 - prix(p) / p.prixHT) * 100) : 0;
          const convenu = pro && (p.perso || DB.prixNegocie(p, c));
          /* Dans l'aperçu, l'atelier coche au fil de la grille ce qu'il a
             réellement fait : c'est là qu'on a la liste sous les yeux, et
             c'est là qu'une prestation s'oublie le moins. */
          const pris = S.panier && S.panier.clientId === c.id && S.panier.lignes.includes(p.id);
          return `<div class="doc-l ${pris ? 'prise' : ''}">
            ${S.userId ? `<button class="btn nu coche-presta sans-impression"
                data-act="panier-presta" data-id="${p.id}" data-client="${c.id}"
                title="${pris ? 'Retirer de l\'intervention' : 'Ajouter à une intervention'}">
              ${ic(pris ? 'check' : 'plus')}</button>` : ''}
            <span class="doc-lib">${esc(p.perso ? p.libelle : libelleDansSection(p))}</span>
            ${pro ? `<span class="doc-prix">
              <b>${eur(prix(p))}${convenu ? '<i class="doc-gain convenu">convenu</i>'
                                : ecart > 0 ? `<i class="doc-gain">−${ecart} %</i>` : ''}</b>
              ${/* une ligne faite pour lui seul n'a pas de tarif particulier
                    à mettre en regard : on n'invente pas une colonne */ ''}
              <span class="public">${p.perso ? '—' : eur(p.prixHT)}</span>
            </span>`
            : `<span class="doc-prix"><b class="seul">${eur(prix(p))}</b></span>`}
          </div>`;
        }).join('')}
      </section>`).join('')}

    <p class="doc-note"><b>Prix hors taxes, main d'œuvre et forfaits.</b> Les pièces sont facturées
    en sus, au tarif du jour de notre fournisseur, et figurent au devis avant toute intervention.
    Tarifs susceptibles d'évoluer — cette page affiche toujours la version en vigueur.</p>

    ${pro ? `<section class="doc-bloc">
      <div class="doc-bloc-tete">
        <h2>Vos interventions</h2>
        ${resteADevoir(c.id) > 0
          ? `<span class="doc-etat attente">${eur(resteADevoir(c.id))} à régler</span>`
          : `<span class="doc-etat ok">Compte à jour</span>`}
      </div>
      ${listeInterventions(c, true)}
    </section>` : ''}

    ${pro ? blocReservationPro(c) : ''}

    <div class="doc-actions sans-impression">
      ${r.tel ? `<a class="btn plein" href="tel:${esc(r.tel.replace(/\s/g, ''))}">${ic('tel')} Nous appeler</a>` : ''}
      ${r.email ? `<a class="btn" href="mailto:${esc(r.email)}?subject=${encodeURIComponent('Demande de devis — ' + nom)}">${ic('envoi')} Demander un devis</a>` : ''}
      <button class="btn nu" onclick="window.print()">${ic('imprim')} Imprimer</button>
    </div>`;

  return docPage(dedans, {
    atelier: barre,
    pied: barrePanier(c),
    mention: pro ? 'Grille professionnelle' : 'Grille tarifaire',
    classe: 'grille-page' + (S.userId && S.panier && S.panier.clientId === c.id
      && S.panier.lignes.length ? ' avec-panier' : '')
  });
}

/* ==========================================================================
   ANNULER SON RENDEZ-VOUS (ce que le client voit au bout du lien du SMS)

   Une page, une phrase, un bouton. Le client est peut-être au volant, peut-être
   pressé : il doit voir de quel rendez-vous on parle et pouvoir le rendre en un
   geste. Rien d'autre n'est cliquable — ni l'atelier, ni les autres dossiers.

  const p = DB.rdvParToken(S.annulToken);
  const r = DB.etat.reglages;

  const barre = docBarreAtelier(`
    <b>Aperçu</b>

    <button class="btn nu" style="margin-left:auto" data-act="quitter-annul">${ic('croix')} Quitter</button>`);
  const page = (dedans) => docPage(dedans, { atelier: barre, mention: 'Rendez-vous' });

  if (!p) {
    return page(`<div class="doc-vide">
      <div class="doc-eyebrow">Rendez-vous</div>
      <h1>Ce lien ne mène à aucun rendez-vous</h1>
      <p class="doc-note">Il a peut-être déjà servi, ou le créneau a été déplacé.
      ${r.tel ? 'Appelez le garage au <b>' + esc(r.tel) + '</b>.' : 'Appelez le garage.'}</p>
    </div>`);
  }

  const veh = [marqueRdv(p), immatRdv(p)].filter(x => x && x !== '—').join(' · ');
  const recap = `<div class="doc-ref" style="border-top-width:2px;gap:10px 26px">
    <span>Le <b>${esc(dateLongue(p.jour))}</b></span>
    <span>à <b>${esc(p.heure || '')}</b></span>

  /* Déjà annulé : le client revient sur son lien, ou il a cliqué deux fois. On
     ne lui redemande rien — on lui redit ce qu'il a fait. */
  if (p.annule) {
    return page(`<div class="doc-titre">
        <div class="doc-eyebrow">Annulé</div>

        ${recap}

  /* Un rendez-vous passé ne s'annule plus : il a eu lieu, ou il a été manqué.

  if (minuit(p.jour) < minuit(Date.now())) {
    return page(`<div class="doc-titre">

        <h1>Il n'y a plus rien à annuler</h1>

      ${r.tel ? 'appelez-nous au <b>' + esc(r.tel) + '</b>.' : 'appelez le garage.'}</p>
      ${r.tel ? `<div class="doc-actions"><a class="btn plein" href="tel:${esc(String(r.tel).replace(/\s/g, ''))}">
        ${ic('tel')} Appeler le garage</a></div>` : ''}`);
  }

  return page(`<div class="doc-titre">
      <div class="doc-eyebrow">Annulation</div>
      <h1>Annuler votre rendez-vous</h1>
      ${recap}
    </div>
    <p class="doc-prose">Vérifiez qu'il s'agit bien de ce rendez-vous, puis confirmez. Le créneau
    se libère aussitôt et le garage est prévenu — vous n'avez rien d'autre à faire.

}

/* ==========================================================================
   L'appel entrant
   --------------------------------------------------------------------------
   Le téléphone sonne. Avant de décrocher, on veut savoir qui c'est — et
   surtout pourquoi il appelle : son devis attend une réponse depuis trois
   jours, sa voiture est prête depuis mardi, il a rendez-vous dans une heure.
   Trois secondes de lecture changent complètement la conversation.

   Le standard n'a qu'une chose à faire : ouvrir une adresse en y mettant le
   numéro. Presque tous savent le faire, et ça ne demande aucun serveur.
   ========================================================================== */

/* Le journal des appels. Un garagiste est sous une voiture quand ça sonne :
   la fenêtre passe et personne ne l'a vue. Sans trace, l'appel est perdu — on
   ne sait même pas qu'il a eu lieu. Trois lignes de journal valent mieux qu'un
   rappel qu'on ne fera jamais. */
function noterAppelJournal(num) {
  const r = DB.etat.reglages;
  if (r.appelJournal === false) return null;
  if (!Array.isArray(DB.etat.appels)) DB.etat.appels = [];
  const maintenant = Date.now();

  /* Beaucoup de standards ouvrent l'adresse plusieurs fois pour une seule
     sonnerie. Le même numéro à quelques secondes d'intervalle, c'est le même
     appel : on ne le compte pas deux fois. */
  const fenetre = Math.max(0, Number(r.appelDouble) || 0) * 1000;
  const recent = DB.etat.appels.find(a => memeNumero(a.num, num) && maintenant - a.quand < fenetre);
  if (recent) return recent;

  const info = reconnaitreNumero(num);
  const c = info && info.client;
  const appel = {
    id: DB.nouvelId('ap'), num: String(num).trim(), quand: maintenant,
    clientId: c ? c.id : null,
    nom: c ? (DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim())
           : (info && info.rdvSeul ? info.rdvSeul.client : ''),
    pris: false        // a-t-on fait quelque chose de cet appel ?
  };
  DB.etat.appels.unshift(appel);
  menageAppels();
  DB.sauver();
  return appel;
}

/** Le journal ne grossit pas indéfiniment : il oublie ce qui est vieux. */
function menageAppels() {
  if (!Array.isArray(DB.etat.appels)) { DB.etat.appels = []; return; }
  const jours = Math.max(1, Number(DB.etat.reglages.appelJours) || 14);
  const limite = Date.now() - jours * JOUR;
  DB.etat.appels = DB.etat.appels.filter(a => a.quand >= limite).slice(0, 300);
}

/** Les appels dont personne n'a rien fait. */
function appelsEnAttente() {
  return (DB.etat.appels || []).filter(a => !a.pris);
}

/* Qui a appelé, et qu'en a-t-on fait. Le seul écran où l'on voit ce qu'on a
   raté pendant qu'on était sous une voiture. */
function blocJournalAppels() {
  const liste = (DB.etat.appels || []).slice(0, 8);
  const attente = appelsEnAttente().length;

  const quandDit = (ts) => {
    const j = minuit(ts), aujourd = minuit(Date.now());
    const h = new Date(ts).toTimeString().slice(0, 5);
    return j === aujourd ? h : j === jourPlus(Date.now(), -1) ? 'hier ' + h : dateCourte(ts) + ' ' + h;
  };

  return `<section class="carte">
    <div class="carte-tete">
      <h2>Le téléphone</h2>
      ${attente ? `<span class="pousse etiq" style="margin-left:auto;color:var(--occupe)">
        ${attente} à rappeler</span>` : '<span class="pousse etiq" style="margin-left:auto">à jour</span>'}
    </div>
    ${liste.length ? `<div class="liste">
      ${liste.map(a => {
        const c = a.clientId ? DB.client(a.clientId) : null;
        const nom = a.nom || (c ? (DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim()) : '');
        return `<div class="item journal-appel ${a.pris ? 'fait' : ''}">
          <div style="flex:1;min-width:0">
            <b>${esc(nom || 'Numéro inconnu')}</b>
            <div class="mini num">${esc(telLisible(a.num))} · ${esc(quandDit(a.quand))}</div>
          </div>
          <a class="btn nu" href="tel:${esc(String(a.num).replace(/\s/g, ''))}" title="Rappeler">${ic('tel')}</a>
          ${c ? `<button class="btn nu" data-act="ouvrir-client" data-id="${c.id}"
                  title="Ouvrir sa fiche">${ic('clients')}</button>` : ''}
          <button class="btn nu" data-act="appel-revoir" data-id="${a.id}"
                  title="Revoir ce qui s'affichait">${ic('loupe')}</button>
          <button class="btn nu" data-act="appel-pris" data-id="${a.id}"
                  title="${a.pris ? 'Remettre à rappeler' : 'Marquer traité'}">${ic('check')}</button>
        </div>`;
      }).join('')}
    </div>` : `<div class="vide">
      <h3>Aucun appel</h3>
      <p class="mini">Les appels reçus s'inscriront ici — même ceux que vous n'avez pas pu prendre.
      Le branchement se règle dans <b>Paramètres → Le téléphone de l'atelier</b>.</p>
    </div>`}
  </section>`;
}

/** Ce qu'on a de mieux à dire sur un appel : qui, et pourquoi. */
function reconnaitreNumero(num) {
  /* Un standard annonce un numéro entier : on le compare entier. La
     reconnaissance de l'écran « noter un appel », elle, cherche aussi les
     numéros en cours de frappe — et « 4408 » y désigne légitimement le
     06 21 44 08 17. Appliquée à un appel, cette souplesse ferait afficher la
     fiche d'un habitué au hasard dès qu'une ligne interne appelle. */
  const client = DB.etat.clients.find(c => memeNumero(c.tel, num));
  const info = client ? reconnaitreAppel(client.tel, '') : null;
  if (info) return info;
  /* Pas de fiche client : un rendez-vous posé à la main porte peut-être ce
     numéro-là. On n'a pas de dossier, mais on a un nom et une heure. */
  const rdv = DB.etat.planning.filter(p => memeNumero(p.tel, num))
    .sort((a, b) => a.jour - b.jour)[0];
  return rdv ? { client: null, rdvSeul: rdv } : null;
}

/* Pourquoi il appelle, probablement. Rangé du plus urgent au moins pressant :
   ce qui a une heure passe devant ce qui attend depuis des jours. */
function raisonsAppel(info) {
  if (!info || !info.client) return [];
  const c = info.client;
  const out = [];
  const jour = minuit(Date.now());

  DB.etat.planning
    .filter(p => !p.annule && minuit(p.jour) >= jour && minuit(p.jour) <= jourPlus(jour, 2))
    .filter(p => memeNumero(p.tel, c.tel)
              || (p.devisId && (DB.devis(p.devisId) || {}).clientId === c.id))
    .sort((a, b) => a.jour - b.jour)
    .slice(0, 2)
    .forEach(p => out.push({ ton: 'actif', quoi: 'Rendez-vous',
      texte: (minuit(p.jour) === jour ? "aujourd'hui" : dateCourte(p.jour)) + ' à ' + (p.heure || '')
           + (p.prestation ? ' — ' + p.prestation : '') }));

  (info.surLeParc || []).forEach(o => {
    const v = DB.vehicule(o.vehiculeId);
    const e = ETATS[o.etat];
    out.push({ ton: o.etat === 'pret' ? 'ok' : 'neutre',
      quoi: o.etat === 'pret' ? 'Sa voiture est prête' : 'Sa voiture est chez nous',
      texte: (v ? v.marque + ' ' + v.modele + ' · ' + v.immat : '')
           + (e ? ' · ' + e.nom : '') + ' · depuis ' + joursDepuis(o.depuis) + ' j' });
  });

  (info.enCours || []).filter(d => d.statut === 'envoye').slice(0, 2).forEach(d => {
    out.push({ ton: 'attente', quoi: 'Devis envoyé, sans réponse',
      texte: d.numero + ' · ' + eur(totaux(d).ttc) + ' · il y a ' + joursDepuis(d.maj) + ' j' });
  });

  const du = resteADevoir(c.id);
  if (du > 0) out.push({ ton: 'urgent', quoi: 'Reste à encaisser', texte: eur(du) });

  return out;
}

/* La fenêtre qui s'ouvre quand ça sonne. Elle se lit d'un coup d'œil et de
   loin : le nom en gros, la raison probable juste dessous. */
function modaleAppelEntrant() {
  const num = (S.modale && S.modale.num) || '';

  const c = info && info.client;
  const pro = c && DB.estPro(c);
  const nom = c ? (pro ? c.nom : (c.prenom + ' ' + c.nom).trim()) : '';
  const raisons = raisonsAppel(info);
  const compose = String(num).replace(/\s/g, '');

  return `<div class="voile" data-voile><div class="modale appel-entrant" style="width:min(560px,100%)">
    <div class="modale-tete">
      <div>
        <div class="appel-sonne">${ic('tel')} Appel entrant</div>
        <h2 style="font-size:22px;margin:0">${c ? esc(nom) : 'Numéro inconnu'}</h2>
        <div class="mini num">${esc(telLisible(num))}${
          c && pro ? ' · <b>garage professionnel</b>' : ''}${
          c && c.ville ? ' · ' + esc(c.ville) : ''}</div>
      </div>
      <button class="btn nu" style="margin-left:auto" data-act="fermer-modale" title="Fermer">${ic('croix')}</button>
    </div>
    <div class="modale-corps pile">

      ${c && c.note ? `<div class="encart">${ic('epingle')} ${esc(c.note)}</div>` : ''}

      ${(() => {
        /* Le troisième appel en une heure ne se traite pas comme le premier :
           quelqu'un attend une réponse qu'il n'a pas eue. */
        const avant = (DB.etat.appels || []).filter(a =>
          memeNumero(a.num, num) && Date.now() - a.quand < 12 * 3600 * 1000);
        if (avant.length < 2) return '';
        return `<div class="encart alerte"><b>${avant.length}e appel de ce numéro</b> dans la journée —
          le premier à ${esc(new Date(avant[avant.length - 1].quand).toTimeString().slice(0, 5))}.</div>`;
      })()}

      ${raisons.length ? `<div>

          ${raisons.map(r => `<div class="appel-raison t-${r.ton}">
            <b>${esc(r.quoi)}</b><span>${esc(r.texte)}</span>
          </div>`).join('')}
        </div>
      </div>` : ''}

      ${c ? `<div>
        <div class="etiq">Ses véhicules</div>
        <div class="rangee" style="flex-wrap:wrap;gap:6px;margin-top:6px">
          ${(info.vehicules || []).map(v => `<span class="btn" style="pointer-events:none">

          </span>`).join('') || '<span class="mini">Aucun véhicule enregistré.</span>'}
        </div>
        <div class="mini" style="margin-top:7px">Client depuis ${esc(dateCourte(c.cree))} ·
          ${info.devis.length} demande${info.devis.length > 1 ? 's' : ''}${
          info.dernier ? ' · dernier passage facturé le ' + esc(dateCourte(info.dernier.maj)) : ''}.</div>
      </div>`
      : info && info.rdvSeul ? `<div class="encart">
        <b>${esc(info.rdvSeul.client || 'Rendez-vous à ce numéro')}</b> — ${esc(dateCourte(info.rdvSeul.jour))}
        à ${esc(info.rdvSeul.heure || '')}${info.rdvSeul.prestation ? ' · ' + esc(info.rdvSeul.prestation) : ''}.
        <br>Aucune fiche client à ce numéro pour l'instant.
      </div>`
      : `<div class="encart">Ce numéro n'est dans aucune fiche. C'est peut-être un nouveau client —
        notez sa demande, la fiche se créera avec.</div>`}
    </div>
    <div class="modale-pied">
      ${compose ? `<a class="btn nu pousse" style="margin-right:auto"
         href="tel:${esc(compose)}" title="Rappeler ce numéro">${ic('tel')} Rappeler</a>` : ''}
      <button class="btn" data-act="fermer-modale">Plus tard</button>
      ${c ? `<button class="btn" data-act="appel-noter" data-num="${esc(num)}">${ic('devis')} Noter la demande</button>
             <button class="btn plein" data-act="appel-fiche" data-id="${c.id}">${ic('clients')} Ouvrir sa fiche</button>`
          : `<button class="btn plein" data-act="appel-noter" data-num="${esc(num)}">${ic('devis')} Noter l'appel</button>`}
    </div>
  </div></div>`;

  const q = (S.filtrePresta || '').trim().toLowerCase();
  const catalogue = q
    ? DB.etat.catalogue.filter(p => (p.libelle + ' ' + p.code + ' ' + (p.ref || '')).toLowerCase().includes(q))

  const familles = [...new Set(catalogue.map(p => p.famille))];
  return `<div class="voile" data-voile><div class="modale xl">

  { cle: 'libre',   nom: 'Place libre',        aide: 'vert du plan' },

];

/* Deux cloches, deux contenus bien séparés :
   — l'atelier : les appels reçus, les pense-bêtes, les fiches clients ;
   — les pros : les demandes de rendez-vous des garages confrères.
   Rien d'autre ne vient encombrer l'une ou l'autre. */
/* Une annulation est de type « rdv » sans être une demande de confrère : elle
   n'a rien à faire dans la cloche des pros, qui ne sert qu'à ce qu'ils
   attendent de nous. Le drapeau `pro` les sépare. */
/* « devis » et « parc » manquaient à la cloche de l'atelier : les rappels
   d'impayés étaient posés et n'apparaissaient nulle part. Le drapeau `pro`
   suffit à garder hors d'ici ce qui ne regarde qu'un confrère. */
const TYPES_CLOCHE = { atelier: ['demande', 'memo', 'client', 'rdv', 'devis', 'parc'],
                       pro: ['rdv', 'devis'] };

const estCloche = (a, quoi) => quoi === 'pro'
  ? !!a.pro
  : !a.pro && TYPES_CLOCHE.atelier.includes(a.type);

const alertesAtelier = () => DB.alertesDe(S.userId).filter(a => estCloche(a, 'atelier'));
const alertesPro     = () => DB.alertesDe(S.userId).filter(a => estCloche(a, 'pro'));

/* Ajouter ou retirer une ligne redessine la fenêtre : on relit d'abord ce qui
   est déjà tapé, sinon la date, l'objet et les prix ajustés à la main
   disparaîtraient à chaque manipulation. */
function lireChampsIntervention() {
  const m = S.modale;
  const f = $('#form-intervention');
  if (!m || !f) return;
  const val = (n) => { const e = f.querySelector(`[name="${n}"]`); return e ? e.value : ''; };
  m.jour = depuisInputDate(val('jour')) || m.jour || Date.now();
  m.vehiculeId = val('vehiculeId');
  m.panne = val('panne');
  const coche = f.querySelector('[name="regle"]');
  m.regle = !!(coche && coche.checked);
  m.lignes = (m.lignes || []).map((l, i) => {
    const lib = f.querySelector(`[data-ligne-lib="${i}"]`);
    const qte = f.querySelector(`[data-ligne-qte="${i}"]`);
    const prix = f.querySelector(`[data-ligne-prix="${i}"]`);
    return Object.assign({}, l, {
      libelle: lib ? lib.value : l.libelle,
      qte: qte && qte.value !== '' ? Number(qte.value) : l.qte,
      prixHT: prix && prix.value !== '' ? Number(prix.value) : l.prixHT
    });
  });
}

/* Noter une intervention déjà faite. Le devis reste la seule façon de décrire
   un travail dans l'outil — on n'invente pas un deuxième objet qui dirait la
   même chose. Ce formulaire crée donc un dossier déjà terminé, avec ses
   prestations et le prix du client, et il rejoint l'historique et le suivi des
   règlements comme n'importe quel autre. */
function modaleIntervention() {
  const m = S.modale;
  const c = DB.client(m.id);
  if (!c) return '';
  const nom = c.type === 'pro' ? c.nom : (c.prenom + ' ' + c.nom).trim();
  const vs = DB.etat.vehicules.filter(v => v.clientId === c.id);
  const lignes = m.lignes || [];
  // sa grille à lui : masquées en moins, lignes propres en plus
  const sections = [...new Set(DB.catalogueDe(c).map(p => p.famille))];

  const total = lignes.reduce((s, l) => s + (Number(l.qte) || 0) * (Number(l.prixHT) || 0), 0);
  const ttc = total * (1 + DB.etat.reglages.tauxTva / 100);

  return `<div class="voile" data-voile><div class="modale" style="width:min(620px,100%)">
    <div class="modale-tete">
      <div><h2 style="font-size:18px">Noter une intervention</h2>
        <div class="mini">Un travail déjà réalisé pour ${esc(nom)} — il entre directement dans son historique.</div></div>
      <button class="btn nu" style="margin-left:auto" data-act="fermer-modale">${ic('croix')}</button>
    </div>
    <form id="form-intervention" data-id="${c.id}">
      <div class="modale-corps pile">
        <div class="champ-duo">
          <div class="champ"><label>Date de l'intervention</label>
            <input class="saisie" type="date" name="jour" value="${isoLocal(m.jour || Date.now())}"></div>
          <div class="champ"><label>Véhicule</label>
            <select class="saisie" name="vehiculeId">
              <option value="">Sans véhicule précis</option>
              ${vs.map(v => `<option value="${v.id}" ${m.vehiculeId === v.id ? 'selected' : ''}>${
                esc(v.immat)} — ${esc((v.marque + ' ' + v.modele).trim())}</option>`).join('')}
            </select></div>
        </div>
        <div class="champ">
          <label>Objet</label>
          <input class="saisie" name="panne" value="${esc(m.panne || '')}"
                 placeholder="Recherche de panne démarrage, remplacement calculateur…">
        </div>

        <div class="champ">
          <label>Prestations réalisées</label>
          <select class="saisie" data-ajout-presta>
            <option value="">Ajouter une prestation du catalogue…</option>
            ${sections.map(f => `<optgroup label="${esc(f)}">
              ${DB.catalogueDe(c).filter(p => p.famille === f).map(p =>
                `<option value="${p.id}">${esc(p.perso ? p.libelle : libelleDansSection(p))} — ${eur(DB.prixPour(p, c))}</option>`).join('')}
            </optgroup>`).join('')}
            <option value="libre">＋ Ligne libre (à décrire moi-même)</option>
          </select>
          <span class="aide">Le prix proposé est celui de ${esc(nom)} — sa grille, ses prix négociés.
          Il reste modifiable ligne par ligne.</span>
        </div>

        ${lignes.length ? `<div class="deroule"><table class="travaux lignes-interv" style="min-width:440px">
          <thead><tr><th>Prestation</th><th style="width:1%">Qté</th>
            <th class="droite" style="width:1%">Prix HT</th><th style="width:1%"></th></tr></thead>
          <tbody>${lignes.map((l, i) => `<tr>
            <td class="td-lib">${l.prestaId
              ? `<div class="ligne-titre">${esc(l.libelle)}</div>
                 <div class="ligne-sous">${esc(l.famille || '')}</div>`
              : `<input class="saisie" data-ligne-lib="${i}" value="${esc(l.libelle)}"
                        placeholder="Décrivez la prestation">`}</td>
            <td data-l="Qté"><input class="saisie num" type="number" step="0.5" min="0"
                   style="width:70px;text-align:right" data-ligne-qte="${i}" value="${l.qte}"></td>
            <td class="droite" data-l="Prix HT"><input class="saisie num" type="number" step="0.01" min="0"
                   style="width:92px;text-align:right" data-ligne-prix="${i}" value="${l.prixHT}"></td>
            <td><button type="button" class="btn nu" data-act="oter-ligne-interv" data-i="${i}"
                        title="Retirer">${ic('croix')}</button></td>
          </tr>`).join('')}</tbody>
        </table></div>
        <div class="rangee bilan-du">
          <span class="etiq">${lignes.length} ligne${lignes.length > 1 ? 's' : ''}</span>
          <span class="pousse" style="margin-left:auto">
            <b class="num" id="total-interv" style="font-size:17px">${eur(ttc)}</b>
            <span class="mini"> TTC</span>
          </span>
        </div>` : `<div class="vide" style="padding:20px 16px">
          <p class="mini">Aucune prestation pour l'instant — choisissez-en une ci-dessus.</p></div>`}

        <label class="bascule">
          <input type="checkbox" name="regle" ${m.regle ? 'checked' : ''}>
          <span>Déjà réglé</span>
        </label>
        ${S.erreurCode ? `<div class="encart alerte">${esc(S.erreurCode)}</div>` : ''}
      </div>
      <div class="modale-pied">
        <button type="button" class="btn nu pousse" style="margin-right:auto" data-act="fermer-modale">Annuler</button>
        <button type="submit" class="btn plein">${ic('check')} Enregistrer l'intervention</button>
      </div>
    </form>
  </div></div>`;
}
