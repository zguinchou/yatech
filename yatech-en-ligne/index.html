    'export-ebp'() {
      const jour = isoLocal(Date.now());
      if (id === 'clients') {
        telechargerFichier('ebp-clients-' + jour + '.csv', csvClients());
        return;
      }
      if (id === 'articles') {
        telechargerFichier('ebp-tarifs-' + jour + '.csv', csvArticles());
        return;
      }
      const liste = id === 'devis'
        ? DB.etat.devis.filter(d => ['accepte', 'commande', 'encours', 'termine', 'facture'].includes(d.statut))
        : DB.etat.devis;
      if (!liste.length) { toast('Aucun devis à exporter'); return; }
      telechargerFichier('ebp-devis-' + jour + '.csv', lignesDevisCsv(liste));
    },

    /* Le geste de tous les jours : ce qui n'est pas encore passé s'en va d'un
       coup — les clients neufs d'abord, les devis ensuite. Rien n'est marqué
       tant que les fichiers ne sont pas réellement partis. */
    /* La facturation d'un coup : tout ce qui est fait et non encaissé part dans
       un fichier, clients d'abord si certains manquent à EBP. Rien n'est marqué
       tant que le fichier n'est pas réellement enregistré. */
    'export-facturation'() {
      // réalisé et pas encore passé : réglé ou non, la facture reste à faire
      const devis = DB.etat.devis.filter(d =>
        d.lignes.length && !d.ebp && etatIntervention(d) !== 'attente');
      if (!devis.length) { toast('Rien à facturer pour l\'instant'); return; }
      const clients = clientsATransferer(devis);
      const jour = isoLocal(Date.now());

      const etape = clients.length
        ? telechargerFichier('ebp-clients-' + jour + '.csv', csvClients(clients))
        : Promise.resolve(true);

      Promise.resolve(etape)
        .then(ok => !ok ? false
          : telechargerFichier('ebp-a-facturer-' + jour + '.csv', lignesDevisCsv(devis)))
        .then(ok => {
          if (!ok) { toast('Rien n\'a été marqué : le fichier n\'est pas parti'); return; }
          const quand = Date.now();
          devis.forEach(d => { d.ebp = quand; });
          clients.forEach(c => { c.ebp = quand; });
          const somme = devis.reduce((s, d) => s + totaux(d).ttc, 0);
          enregistrer(`${devis.length} intervention${devis.length > 1 ? 's' : ''} passée${devis.length > 1 ? 's' : ''} à la facturation`);
          toast(`${devis.length} à facturer · ${eur(somme)} — importez le fichier dans EBP`);
        });
    },

    'export-ebp-attente'() {
      const devis = devisATransferer();
      const clients = clientsATransferer(devis);
      if (!devis.length && !clients.length) { toast('Tout est déjà passé dans EBP'); return; }
      const jour = isoLocal(Date.now());

      const etape = clients.length
        ? telechargerFichier('ebp-clients-nouveaux-' + jour + '.csv', csvClients(clients))
        : Promise.resolve(true);

      etape
        .then(ok => !ok ? false
          : devis.length
            ? telechargerFichier('ebp-devis-nouveaux-' + jour + '.csv', lignesDevisCsv(devis))
            : true)
        .then(ok => {
          if (!ok) { toast('Rien n\'a été marqué : les fichiers ne sont pas partis'); return; }
          const quand = Date.now();
          devis.forEach(d => { d.ebp = quand; });
          clients.forEach(c => { c.ebp = quand; });
          enregistrer(`${devis.length} demande${devis.length > 1 ? 's' : ''} passée${devis.length > 1 ? 's' : ''} dans EBP`);
          toast(`${devis.length} demande${devis.length > 1 ? 's' : ''} marquée${devis.length > 1 ? 's' : ''} comme passée${devis.length > 1 ? 's' : ''}`);
        });
    },

    /* L'autorisation ne se demande que sur un geste de l'utilisateur : les
       navigateurs refusent en bloc toute demande spontanée. */
    alertes() {
      S.filtreAlerte = id === 'pro' ? 'pro' : 'atelier';
      S.modale = { type: 'alertes' }; rendre();
    },
    'filtre-alerte'() { S.filtreAlerte = id; rendre(); },
    'tout-lu'() {
      const quoi = id === 'pro' ? 'pro' : 'atelier';
      DB.alertesDe(S.userId, true).forEach(a => { if (estCloche(a, quoi)) a.lu = true; });
      DB.sauver(); rendre();
    },
    'ouvrir-alerte'() {
      const a = (DB.etat.alertes || []).find(x => x.id === id);
      if (!a) return;
      a.lu = true;
      S.modale = null;
      if (a.vue === 'devis-fiche' && DB.devis(a.ref)) { S.vue = 'devis-fiche'; S.devisId = a.ref; }
      else if (a.vue === 'client-fiche' && DB.client(a.ref)) { S.vue = 'client-fiche'; S.clientId = a.ref; }
      else if (a.vue) S.vue = a.vue;
      DB.sauver(); rendre();
    },

    'autoriser-notifs'() {
      if (typeof Notification === 'undefined') { toast('Ce navigateur ne propose pas de notifications'); return; }
      try {
        Notification.requestPermission().then(() => {
          rendre();
          const e = etatNotifications();
          toast(e === 'granted' ? 'Notifications autorisées'
              : e === 'denied' ? 'Refusées — le rappel s\'affichera dans la page'
              : 'Demande sans réponse');
        });
      } catch (e) { toast('Notifications indisponibles dans ce cadre'); }
    },

    /* Une fiche client toute seule, quand on ne veut pas attendre le lot. */
    'passer-client-ebp'() {
      const c = DB.client(id);
      if (!c) return;
      telechargerFichier('ebp-client-' + codeEbp(c) + '.csv', csvClients([c])).then(ok => {
        if (!ok) return;
        c.ebp = Date.now();
        c.maj = null;
        enregistrer(`${c.nom} passé dans EBP`);
        toast('Fiche prête pour EBP — reprenez-la dans Imports paramétrables');
      });
    },

    'export-devis-ebp'() {
      const d = DB.devis(id);
      if (!d) return;
      const c = DB.client(d.clientId);
      const etape = c && !c.ebp
        ? telechargerFichier('ebp-client-' + codeEbp(c) + '.csv', csvClients([c]))
        : Promise.resolve(true);
      etape
        .then(ok => ok ? telechargerFichier('ebp-' + d.numero + '.csv', lignesDevisCsv([d])) : false)
        .then(ok => {
          if (!ok) return;
          const quand = Date.now();
          d.ebp = quand;
          if (c) c.ebp = quand;
          enregistrer(`${d.numero} passé dans EBP`);
        });
    },

    /* Il a fait l'import à la main, ou il veut le refaire : le repère se pose
       et se retire d'un clic. */
    /* Le règlement se coche à la main : c'est vous qui savez quand l'argent
       est rentré, pas l'outil. */
    /* Noter après coup un travail déjà fait : la fenêtre garde ses lignes dans
       S.modale le temps de la saisie, rien n'est écrit avant l'enregistrement. */
    'noter-intervention'() {
      S.erreurCode = null;
      S.modale = { type: 'intervention', id, jour: Date.now(), lignes: [], regle: false };
      rendre();
    },

    'oter-ligne-interv'() {
      if (!S.modale || S.modale.type !== 'intervention') return;
      lireChampsIntervention();
      S.modale.lignes.splice(Number(cible.dataset.i), 1);
      rendre();
    },

    /* Le message est parti dans WhatsApp ou les SMS : on ne le repropose plus.
       Le lien s'ouvre tout seul (c'est un <a>), on ne fait que noter. */
    'prevenir-fait'() {
      const ids = String(id || '').split(',');
      DB.etat.alertes.forEach(a => { if (ids.includes(a.id)) a.prevenu = Date.now(); });
      DB.sauver();
      setTimeout(rendre, 60);
      toast('Message préparé — envoyez-le depuis l\'application');
    },

    'prevenir-passer'() {
      const ids = String(id || '').split(',');
      DB.etat.alertes.forEach(a => { if (ids.includes(a.id)) a.prevenu = Date.now(); });
      DB.sauver(); rendre();
    },

    'prevenir-quand-meme'() {
      S.silenceLeve = true; rendre();
    },

    'alerte-ecarter'() {
      const a = DB.ecarter(id);
      rendre();
      if (a) toast('Écartée — elle reste chez les autres');
    },

    /* Le travail est fait : l'alerte tombe pour toute l'équipe. La veille ne la
       reposera pas, puisqu'elle ne relève que ce qui reste à faire. */
    'alerte-traitee'() {
      const a = (DB.etat.alertes || []).find(x => x.id === id);
      if (!a) return;
      if (!a.cle) { DB.ecarter(id); rendre(); return; }
      const n = DB.resoudre(a.cle);
      rendre();
      toast(n > 1 ? 'Traité — retirée pour toute l\'équipe' : 'Traité');
    },

    /* Cocher une prestation dans la grille d'un confrère. On ne redessine que
       la ligne et la barre du bas : la page est longue, elle ne doit pas
       remonter en haut à chaque coche. */
    'panier-presta'() {
      const clientId = cible.dataset.client;
      if (!S.panier || S.panier.clientId !== clientId) S.panier = { clientId, lignes: [] };
      const i = S.panier.lignes.indexOf(id);
      if (i >= 0) S.panier.lignes.splice(i, 1);
      else S.panier.lignes.push(id);
      const ligne = cible.closest('.recap-l');
      const dedans = S.panier.lignes.includes(id);
      if (ligne) {
        ligne.classList.toggle('prise', dedans);
        cible.innerHTML = ic(dedans ? 'check' : 'plus');
        cible.title = dedans ? 'Retirer de l\'intervention' : 'Ajouter à une intervention';
      }
      /* La barre vit dans l'écran, jamais sur le <body> : sinon elle survivrait
         au redessin et suivrait l'utilisateur d'un client à l'autre, jusque
         dans l'espace du confrère. */
      const app = document.getElementById('app');
      const ancienne = app.querySelector('.panier-barre');
      if (ancienne) ancienne.remove();
      const html = barrePanier(DB.client(clientId));
      if (html) {
        const d = document.createElement('div');
        d.innerHTML = html;
        if (d.firstElementChild) app.appendChild(d.firstElementChild);
      }
      // la page se réserve la hauteur de la barre, sinon celle-ci masque la fin
      const page = app.querySelector('.grille-page');
      if (page) page.classList.toggle('avec-panier', !!html);
    },

    'panier-vider'() { S.panier = null; rendre(); },

    /* On passe le relevé à la fenêtre d'intervention : elle sait déjà appliquer
       la grille du client et enregistrer le dossier. */
    'panier-noter'() {
      const c = DB.client(id);
      if (!c || !S.panier || !S.panier.lignes.length) return;
      const sien = DB.catalogueDe(c);
      const lignes = S.panier.lignes.map(pid => sien.find(x => x.id === pid) || DB.presta(pid))
        .filter(Boolean).map(p => ({
        prestaId: p.id, libelle: p.libelle, famille: p.famille,
        code: p.code || '', ref: p.ref || '', type: p.type,
        qte: 1, prixHT: DB.prixPour(p, c)
      }));
      S.retourGrille = S.grilleToken;      // pour revenir à la grille en fermant
      S.grilleToken = null;
      S.vue = 'client-fiche'; S.clientId = c.id;
      S.modale = { type: 'intervention', id: c.id, jour: Date.now(), lignes, regle: false };
      S.panier = null;
      rendre();
    },

    /* Prévenir que la voiture est prête. Même principe que pour l'équipe :
       l'outil écrit le message, le client le reçoit par SMS, WhatsApp ou
       e-mail selon ce qu'on a de lui. */
    /* Le lien part tout seul (c'est un <a>) : on note seulement que le client
       a été prévenu, pour que ça reste écrit dans le dossier. */
    'pret-envoye'() {
      const o = DB.occupation(id);
      if (!o) return;
      o.prevenuLe = Date.now();
      o.prevenuPar = S.userId;
      const ct = contactDe(o);
      DB.noter(S.userId, `${ct ? ct.nom : 'Client'} prévenu — véhicule prêt`);
      DB.sauver();
      S.modale = null; S.texteP = null;
      setTimeout(rendre, 60);
      toast('Message préparé — envoyez-le depuis l\'application');
    },

    /* Le SMS de confirmation, repris depuis un créneau déjà posé. */
    'rdv-prevenir'() {
      const p = DB.rdv(id);
      if (!p) return;
      S.texteP = null;
      S.modale = { type: 'rdv-client', id: p.id };
      rendre();
    },

    'copier-adresse-appel'() {
      const champ = document.querySelector('#adresse-appel');
      if (champ) copier(champ.value, 'Adresse');
    },

    'copier-pret'() {
      const champ = $('#texte-pret');
      if (champ) copier(champ.value, 'Message');
    },

    'rdv-envoye'() {
      const p = DB.rdv(id);
      if (p) { p.prevenuLe = Date.now(); DB.sauver(); }
      const c = p && p.demandeur ? DB.client(p.demandeur) : null;
      DB.noter(S.userId, `${c ? c.nom : 'Garage'} prévenu — créneau du ${p ? dateCourte(p.jour) : ''}`);
      S.modale = null; S.texteP = null;
      setTimeout(rendre, 60);
      toast('Message préparé — envoyez-le depuis l\'application');
    },

    'prevenir-pret'() {
      const o = DB.occupation(id);
      if (!o) return;
      const ct = contactDe(o);
      if (!ct) { toast('Ce véhicule n\'est rattaché à aucun client'); return; }
      if (!ct.tel && !ct.email) {
        confirmer({
          titre: 'Aucun moyen de le joindre',
          texte: `<b>${esc(ct.nom)}</b> n'a ni téléphone ni e-mail dans sa fiche.`
               + ' Complétez-la, et le message partira d\'un bouton.',
          bouton: 'Ouvrir sa fiche',
          alors() { S.vue = 'client-fiche'; S.clientId = ct.client.id; S.placeId = null; rendre(); }
        });
        return;
      }
      S.texteP = null;                 // on repart du modèle à chaque ouverture
      S.modale = { type: 'pret', id: o.placeId };
      rendre();
    },

    'demander-notifs'() {
      if (typeof Notification === 'undefined') { toast('Ce navigateur ne sait pas afficher d\'avertissement'); return; }
      Notification.requestPermission().then((p) => {
        rendre();
        toast(p === 'granted' ? 'Avertissements autorisés'
            : p === 'denied' ? 'Refusé — à rouvrir dans les réglages du navigateur'
            : 'Rien de changé');
      });
    },

    'essai-notif'() {
      const n = DB.etat.reglages.notifs;
      const nom = DB.etat.reglages.nomOutil || 'Yatech';
      if (n.navigateur) notifierNavigateur(nom, 'Essai — c\'est exactement ce que vous verrez.');
      if (n.sonner) sonner();
      toast(n.navigateur || n.sonner ? 'Essai envoyé' : 'Aucun avertissement n\'est activé ici');
    },

    'bascule-ebp'() {
      const d = DB.devis(id);
      if (!d) return;
      d.ebp = d.ebp ? null : Date.now();
      DB.sauver(); rendre();
      toast(d.ebp ? 'Marqué comme passé dans EBP' : 'Remis en attente de transfert');
    },

    /* Un seul bouton pour les trois fichiers : clients, tarifs, factures.
       Le type se lit dans les colonnes, l'utilisateur n'a rien à choisir. */
    'import-ebp'() {
      lireFichier('.csv,text/csv,text/plain', (texte) => {
        const lignes = depuisCsv(texte);
        if (lignes.length < 2) {
          confirmer({ titre: 'Import impossible', bouton: 'J\'ai compris',
            texte: 'Ce fichier ne contient aucune ligne exploitable.' });
          return;
        }
        const type = id && id !== 'auto' ? id : typeFichierEbp(lignes[0]);
        if (!type) {
          confirmer({ titre: 'Fichier non reconnu', bouton: 'J\'ai compris',
            texte: 'Impossible de dire s\'il s\'agit de clients, de tarifs ou de factures.<br><br>'
                 + 'La <b>première ligne</b> du fichier doit porter les intitulés des colonnes '
                 + '(Nom, Téléphone… / Code article, Prix de vente HT… / Numéro, Total TTC…).' });
          return;
        }

        /* Les tarifs, c'est le seul import qui peut défaire votre rangement :
           on demande avant, pas après. */
        if (type === 'articles') { demanderModeTarifs(texte); return; }

        const r = type === 'factures' ? importerFacturesEbp(texte) : importerClientsEbp(texte);
        if (r.erreur) {
          confirmer({ titre: 'Import impossible', texte: esc(r.erreur), bouton: 'J\'ai compris' });
          return;
        }
        rendre();

        const pl = (n, mot, terminaison) => `<b>${n}</b> ${mot}${n > 1 ? (terminaison || 's') : ''}`;

        /* Reprendre son fichier EBP puis tout perdre en fermant l'onglet serait
           le pire des scénarios : quand le navigateur refuse d'enregistrer, on
           ne propose plus qu'une chose à la fin de l'import — la sauvegarde. */
        const fragile = !DB.ecritOk;
        const avertir = fragile
          ? '<br><br><b style="color:var(--occupe)">Ce navigateur n\'enregistre rien.</b> '
            + 'Ce que vous venez d\'importer disparaîtra en fermant l\'onglet : '
            + 'sauvegardez le fichier maintenant.'
          : '';
        const suite = fragile
          ? { bouton: 'Sauvegarder le fichier', alors() { sauvegarderFichier(); } }
          : null;

        if (type === 'articles') {
          confirmer(Object.assign({
            titre: 'Tarifs repris depuis EBP',
            texte: `${pl(r.majs, 'prix mis à jour', '')}.<br>${pl(r.ajoutes, 'article ajouté', 's')} au catalogue.<br>`
                 + (r.ignores ? `${pl(r.ignores, 'ligne sans prix ignorée', 's')}.<br>` : '')
                 + `<br>Vos prix particuliers et professionnels viennent maintenant d'EBP.` + avertir,
            bouton: 'Voir mes tarifs',
            alors() { S.vue = 'catalogue'; S.rechTarif = ''; rendre(); }
          }, suite));
        } else if (type === 'factures') {
          confirmer(Object.assign({
            titre: 'Factures rapprochées',
            texte: `${pl(r.rapproches, 'dossier passé en « facturé »', 's')}.<br>`
                 + (r.orphelines ? `${pl(r.orphelines, 'facture sans dossier ici', 's')} — normal pour ce qui a été fait avant.<br>` : '')
                 + `<br>Le rapprochement se fait sur <b>notre numéro de devis</b>, repris dans la référence du document EBP.` + avertir,
            bouton: 'Voir les devis',
            alors() { S.vue = 'devis'; S.filtreDevis = 'tous'; rendre(); }
          }, suite));
        } else {
          confirmer(Object.assign({
            titre: 'Clients repris depuis EBP',
            texte: `${pl(r.ajoutes, 'client ajouté', 's')}`
                 + (r.pros ? `, dont <b>${r.pros}</b> en <b>professionnel</b> (raison sociale ou SIRET)` : '')
                 + `.<br>${pl(r.reconnus, 'déjà connu', 's')} ici — complété, jamais dupliqué.<br>`
                 + (r.ignores ? `${pl(r.ignores, 'ligne sans nom ignorée', 's')}.<br>` : '')
                 + `<br>Sur ${r.total} ligne${r.total > 1 ? 's' : ''} lue${r.total > 1 ? 's' : ''}.` + avertir,
            bouton: 'Voir mes clients',
            alors() { S.vue = 'clients'; rendre(); }
          }, suite));
        }
      });
    },

    restaurer() {
      lireFichier(null, (contenu) => {
        let donnees;
        try { donnees = JSON.parse(contenu); }
        catch (e) {
          confirmer({ titre: 'Ce fichier n\'est pas une sauvegarde', bouton: 'J\'ai compris',
            texte: `Choisissez le fichier <b>${esc(nomFichierOutil())}-….json</b> produit par « Sauvegarder mes données ».<br><br>`
                 + 'Un CSV EBP se charge, lui, depuis le bloc EBP juste au-dessus.' });
          return;
        }
        if (!DB.estUneSauvegarde(donnees)) {
          confirmer({ titre: 'Ce fichier n\'est pas une sauvegarde', bouton: 'J\'ai compris',
            texte: 'Le fichier est lisible mais ne contient pas les données de l\'outil.' });
          return;
        }

        const equipe = Array.isArray(donnees.utilisateurs) ? donnees.utilisateurs.map(u => u.nom).join(', ') : '—';
        const quand = donnees.majGlobale;
        confirmer({
          titre: 'Restaurer cette sauvegarde ?',
          texte: `<b>${donnees.clients.length}</b> clients · <b>${donnees.devis.length}</b> devis`
               + (Array.isArray(donnees.planning) ? ` · <b>${donnees.planning.length}</b> rendez-vous` : '')
               + `<br>Équipe : <b>${esc(equipe)}</b>`
               + (quand ? `<br>Modifié le <b>${dateCourte(quand)} à ${heure(quand)}</b>` : '')
               + `<br><br>Cet appareil contient aujourd'hui <b>${DB.etat.clients.length}</b> clients`
               + `, <b>${DB.etat.devis.length}</b> devis`
               + (DB.etat.majGlobale ? `, modifiés le <b>${dateCourte(DB.etat.majGlobale)} à ${heure(DB.etat.majGlobale)}</b>` : '')
               + `.<br><br><b>Tout sera remplacé par le fichier.</b>`,
          bouton: 'Restaurer', danger: true,
          alors() {
            if (DB.restaurer(donnees)) {
              S.placeId = null; S.immatPlacement = ''; S.vue = 'atelier';
              if (!DB.utilisateur(S.userId)) S.userId = DB.etat.utilisateurs[0].id;
              rendre();
              toast('Sauvegarde restaurée sur cet appareil');
            } else {
              toast('Restauration impossible');
            }
          }
        });
      });
    },

    /* Le passage de la démonstration au vrai travail. Deux temps : d'abord la
       sauvegarde — un fichier avant d'effacer, toujours — puis le choix de
       garder ou non le catalogue, parce qu'on peut vouloir repartir des tarifs
       d'exemple pour les corriger plutôt que tout retaper. */
    'vider-donnees'() {
      if (!exigeAdmin('Effacer les données')) return;
      const n = {
        clients: DB.etat.clients.length, vehicules: DB.etat.vehicules.length,
        devis: DB.etat.devis.length, planning: DB.etat.planning.length,
        parc: DB.etat.occupations.length, catalogue: DB.etat.catalogue.length
      };
      confirmer({
        titre: 'Tout vider ?',
        texte: 'Seront effacés de cet appareil : <b>' + n.clients + ' client(s)</b>, '
             + '<b>' + n.vehicules + ' véhicule(s)</b>, <b>' + n.devis + ' dossier(s)</b>, '
             + '<b>' + n.parc + ' voiture(s) sur le parc</b>, <b>' + n.planning + ' rendez-vous</b>, '
             + 'les pense-bêtes, les alertes, et <b>' + n.catalogue + ' prestation(s)</b> du catalogue.'
             + '<br><br><b>Ne bougent pas :</b> votre équipe et ses mots de passe, et tous vos réglages.'
             + '<br><br>Rien de tout cela n\'est récupérable ensuite : enregistrez une sauvegarde avant.',
        bouton: 'Tout vider', danger: true,
        avant: { acte: 'exporter', txt: 'Sauvegarder d\'abord' },
        alors() {
          DB.toutVider();
          S.placeId = null; S.immatPlacement = ''; S.devisId = null; S.clientId = null;
          S.vue = 'atelier';
          rendre();
          toast('Place nette — équipe et réglages gardés');
        }
      });
    },

    /* Vider seulement le travail, en gardant les tarifs déjà saisis. */
    'vider-dossiers'() {
      if (!exigeAdmin('Effacer les dossiers')) return;
      confirmer({
        titre: 'Effacer les dossiers ?',
        texte: 'Clients, véhicules, dossiers, planning, parc et pense-bêtes seront effacés.'
             + '<br><br><b>Votre catalogue de ' + DB.etat.catalogue.length + ' prestation(s) reste en place</b>, '
             + 'ainsi que l\'équipe et les réglages.',
        bouton: 'Effacer les dossiers', danger: true,
        avant: { acte: 'exporter', txt: 'Sauvegarder d\'abord' },
        alors() {
          const n = DB.viderDonnees({ catalogue: false });
          S.placeId = null; S.immatPlacement = ''; S.devisId = null; S.clientId = null;
          S.vue = 'atelier';
          rendre();
          toast(`${n.clients} client(s) et ${n.devis} dossier(s) effacés — catalogue gardé`);
        }
      });
    },

    reset() {
      confirmer({
        titre: 'Remettre la démonstration ?',
        texte: 'Tout ce que vous avez saisi dans ce navigateur sera effacé et remplacé par '
             + 'le jeu d\'exemple : clients, devis, planning, réglages compris.<br><br>'
             + '<b>Faites une sauvegarde avant si vous voulez garder quelque chose.</b>',
        bouton: 'Tout effacer', danger: true,
        alors() {
          DB.reinitialiser();
          S.placeId = null; S.immatPlacement = ''; S.devisId = null;
          rendre();
          toast('Démonstration réinitialisée');
        }
      });
    }
  };

  if (actions[a]) { e.preventDefault(); actions[a](); }
});

/* --- saisies ---------------------------------------------------------------- */
document.addEventListener('input', (e) => {
  const t = e.target;

  /* Le message « véhicule prêt » se corrige à la main : les trois liens
     d'envoi se refont à mesure, sans redessiner — sinon le curseur sauterait
     au début du texte à chaque lettre. */
  if (t.id === 'texte-pret') {
    S.texteP = t.value;
    const enc = encodeURIComponent(t.value);
    $$('.modale-pied a[data-act="pret-envoye"], .modale-pied a[data-act="rdv-envoye"]').forEach(a => {
      const canal = a.dataset.canal;
      if (canal === 'sms') a.href = a.href.replace(/\?body=.*$/, '?body=' + enc);
      else if (canal === 'whatsapp') a.href = a.href.replace(/\?text=.*$/, '?text=' + enc);
      else a.href = a.href.replace(/&body=.*$/, '&body=' + enc);
    });
    return;
  }

  /* Lignes d'une intervention en cours de saisie : on met à jour le total sans
     redessiner la fenêtre, sinon le curseur sauterait à chaque chiffre. */
  const iLigne = t.dataset.ligneQte || t.dataset.lignePrix || t.dataset.ligneLib;
  if (iLigne !== undefined && S.modale && S.modale.type === 'intervention') {
    const l = S.modale.lignes[Number(iLigne)];
    if (!l) return;
    if (t.dataset.ligneLib !== undefined) l.libelle = t.value;
    if (t.dataset.ligneQte !== undefined) l.qte = t.value === '' ? '' : Number(t.value);
    if (t.dataset.lignePrix !== undefined) l.prixHT = t.value === '' ? '' : Number(t.value);
    const tot = S.modale.lignes.reduce((s, x) => s + (Number(x.qte) || 0) * (Number(x.prixHT) || 0), 0);
    const cell = $('#total-interv');
    if (cell) cell.textContent = eur(tot * (1 + DB.etat.reglages.tauxTva / 100));
    return;
  }

  /* Chaque écran a sa propre recherche : celle des tarifs ne doit pas suivre
     dans les clients, ni l'inverse. On retrouve son écran comme on l'a laissé. */
  if (t.id === 'rech-reglage') { S.rechReglage = t.value; S.focusRechReglage = true; rendre(); return; }
  if (t.id === 'rech-tarif') { S.rechTarif = t.value; S.focusRechTarif = true; rendre(); return; }
  if (t.id === 'rech') { S.recherche = t.value; S.focusRech = true; rendre(); return; }

  // la plaque pilote tout le formulaire : on redessine à chaque frappe
  if (t.id === 'immat-placement') { S.immatPlacement = t.value; S.focusImmat = true; rendre(); return; }

  if (t.dataset.champ) {                       // champ direct d'un devis
    const d = DB.devis(t.dataset.id);
    if (!d) return;
    d[t.dataset.champ] = t.dataset.champ === 'remise'
      ? Math.min(100, Math.max(0, Number(t.value) || 0))       // 0 à 100 %, jamais au-delà
      : t.type === 'number' ? Number(t.value) : t.value;
    d.maj = Date.now(); DB.sauver();
    if (t.dataset.champ === 'remise') rendre();
    return;
  }

  if (t.dataset.champLigne) {                  // ligne de devis
    const d = DB.devis(t.dataset.id);
    const l = d && d.lignes.find(x => x.id === t.dataset.ligne);
    if (!l) return;
    /* Une ligne de devis ne descend pas sous zéro et ne se remise pas à plus
       de cent pour cent : sans ces bornes, un chiffre mal collé donnait un
       total négatif qui partait ensuite dans EBP. */
    const cleL = t.dataset.champLigne;
    l[cleL] = (cleL === 'qte' || cleL === 'prixHT') ? Math.max(0, Number(t.value) || 0)
            : cleL === 'remise' ? Math.min(100, Math.max(0, Number(t.value) || 0))
            : t.value;
    d.maj = Date.now(); DB.sauver();
    if (t.dataset.champLigne !== 'libelle') rendre();
    return;
  }

  /* La case « il le voit » d'une ligne de sa grille. */
  if (t.hasAttribute && t.hasAttribute('data-voit-presta')) {
    const c = DB.client(t.dataset.id);
    if (!c) return;
    c.masquees = c.masquees || {};
    if (t.checked) delete c.masquees[t.dataset.voitPresta];
    else c.masquees[t.dataset.voitPresta] = 1;
    c.maj = Date.now();
    DB.sauver();
    const ligne = t.closest('tr');
    if (ligne) ligne.classList.toggle('masquee', !t.checked);
    return;                      // pas de redessin : on coche souvent à la suite
  }

  if (t.dataset.champVehicule) {
    const v = DB.vehicule(t.dataset.id);
    if (!v) return;
    const cle = t.dataset.champVehicule;
    v[cle] = (cle === 'km' || cle === 'annee') ? Math.max(0, Number(t.value) || 0)
           : cle === 'immat' ? t.value.toUpperCase()
           : t.value;
    v.maj = Date.now();
    DB.sauver();
    return;                       // pas de redessin : le curseur reste dans le champ
  }

  if (t.dataset.champClient) {
    const c = DB.client(t.dataset.id);
    if (c) {
      const cle = t.dataset.champClient;
      // une remise reste entre 0 et 100 % : au-delà, le garage paierait le client
      c[cle] = cle === 'remisePro'
        ? (t.value === '' ? '' : Math.min(100, Math.max(0, Number(t.value) || 0)))
        : t.value;
      // une fiche retouchée ici doit repartir vers EBP : elle se remet dans la file
      if (t.dataset.champClient !== 'codeEbp') c.maj = Date.now();
      DB.sauver();
    }
    return;
  }

  /* Un prix négocié avec un confrère : il ne touche pas au catalogue, seulement
     à sa grille à lui. Vide, on revient à la règle générale. */
  if (t.dataset.champTarif) {
    const c = DB.client(t.dataset.id);
    if (!c) return;
    c.tarifs = c.tarifs || {};
    const v = t.value.trim();
    if (v === '' || isNaN(Number(v))) delete c.tarifs[t.dataset.champTarif];
    else c.tarifs[t.dataset.champTarif] = Math.max(0, Number(v));   // jamais sous zéro
    c.maj = Date.now();
    DB.sauver();
    // on rafraîchit la seule colonne concernée, sans perdre le curseur
    const ligne = t.closest('tr');
    const p = DB.presta(t.dataset.champTarif);
    const cell = ligne && ligne.querySelector('.td-applique');
    if (cell && p) {
      cell.textContent = eur(DB.prixPour(p, c));
      cell.classList.toggle('negocie', DB.prixNegocie(p, c));
    }
    return;
  }

  if (t.dataset.champPresta) {
    const p = DB.presta(t.dataset.id);
    const cle = t.dataset.champPresta;
    if (p) { p[cle] = (cle === 'prixHT' || cle === 'prixPro') ? Number(t.value) : t.value; DB.sauver(); }
    return;
  }

  if (t.dataset.champUser) {
    const u = DB.utilisateur(t.dataset.id);
    if (u) { u[t.dataset.champUser] = t.value; if (t.dataset.champUser === 'nom') u.init = t.value.trim().charAt(0).toUpperCase() || '?'; DB.sauver(); }
    return;
  }

  /* Les réglages d'avertissement. Cocher « heures de silence » fait apparaître
     les deux horaires : ce cas-là redessine, les autres non — sinon le curseur
     sauterait à chaque lettre du modèle de message. */
  if (t.dataset.champNotif) {
    const cle = t.dataset.champNotif;
    const valeur = t.type === 'checkbox' ? t.checked
                 : (cle === 'relancerApres') ? Number(t.value) : t.value;
    /* Deux réglages seulement appartiennent à l'atelier : le texte du message,
       qui parle au nom du garage, et le délai de relance, qui rythme la file
       commune. Tout le reste est propre à la personne connectée. */
    if (cle === 'modele' || cle === 'relancerApres') DB.etat.reglages.notifs[cle] = valeur;
    else poserPrefNotif(cle, valeur);
    DB.sauver();
    if (cle === 'silenceActif' || cle === 'actif' || cle === 'canal') rendre();
    return;
  }

  if (t.dataset.champNotifQuoi) {
    poserPrefNotifQuoi(t.dataset.champNotifQuoi, t.checked);
    return;
  }

  if (t.hasAttribute && t.hasAttribute('data-canal-user')) {
    const u = DB.utilisateur(t.dataset.id);
    if (u) { poserPrefNotif('canal', t.value, u.id); rendre(); }
    return;
  }

  if (t.dataset.champReglage) {
    const cle = t.dataset.champReglage;
    if (cle === '__compteur') {
      // le prochain numéro : on stocke le précédent
      DB.etat.compteur = Math.max(0, (Number(t.value) || 1) - 1);
    } else {
      DB.etat.reglages[cle] = t.type === 'number' ? Number(t.value) : t.value;
    }
    DB.sauver();
    return;
  }

  /* Renommer une famille renomme toutes ses lignes d'un coup. L'attribut suit
     la valeur tapée, sinon la frappe suivante ne retrouverait plus ses lignes. */
  if (t.dataset.champFamille !== undefined) {
    const avant = t.dataset.champFamille;
    const apres = t.value.trim() || avant;
    if (apres !== avant) {
      DB.etat.catalogue.forEach(p => { if (p.famille === avant) p.famille = apres; });
      t.dataset.champFamille = apres;
      DB.sauver();
    }
    return;
  }

  /* Une couleur se pose sur la personne, pas sur l'atelier : c'est son écran
     qu'elle repeint, pas celui de ses collègues. */
  if (t.dataset.champCouleur) {
    const p = prefsDe();
    if (!p) return;
    p.couleurs = Object.assign({}, mesCouleurs(), p.couleurs || {});
    p.couleurs[t.dataset.champCouleur] = t.value;
    DB.sauver(); appliquerCouleurs();
    const bouton = document.querySelector(`[data-act="couleur-defaut"][data-id="${t.dataset.champCouleur}"]`);
    if (bouton) bouton.disabled = false;
    return;                       // pas de redessin : la couleur suit toute seule
  }

  /* Les compteurs appartiennent à celui qui les regarde, comme le reste de
     son accueil. On garde l'ordre du catalogue : la liste stockée n'est qu'un
     ensemble, pas un rangement. */
  if (t.dataset.champCompteur) {
    const p = prefsDe();
    if (p) {
      const cle = t.dataset.champCompteur;
      const actuels = Array.isArray(p.compteurs) ? p.compteurs.slice() : COMPTEURS_DEFAUT.slice();
      const i = actuels.indexOf(cle);
      if (t.checked && i < 0) actuels.push(cle);
      if (!t.checked && i >= 0) actuels.splice(i, 1);
      p.compteurs = actuels;
      DB.sauver();
    }
    rendre();
    return;
  }

  if (t.dataset.champAccueil) {
    // l'accueil appartient à celui qui le regarde
    const p = prefsDe();
    if (p) {
      p.accueil = p.accueil || {};
      p.accueil[t.dataset.champAccueil] = t.checked;
      DB.sauver();
    }
    return;
  }

  if (t.dataset.champLibelle !== undefined) {
    const r = DB.etat.reglages;
    r.libelles = r.libelles || {};
    r.libelles[t.dataset.champLibelle] = t.value;
    DB.sauver(); appliquerLibelles(r);
    return;                       // pas de redessin : le nouveau mot suit au prochain passage
  }

  if (t.dataset.champRangee) {
    const r = DB.etat.reglages;
    r.nomsRangees = r.nomsRangees || {};
    r.nomsRangees[t.dataset.champRangee] = t.value;
    DB.sauver(); DB.appliquerReglages();
    return;                       // pas de redessin : le nom apparaît sur le plan au prochain passage
  }

  if (t.dataset.champPlace) {
    const r = DB.etat.reglages;
    r.typesPlaces = r.typesPlaces || {};
    r.typesPlaces[t.dataset.champPlace] = t.value;
    DB.sauver(); DB.appliquerReglages();
    S.parcZoom = null;
    rendre();
    return;
  }

  /* Ces réglages redessinent le parc ou le planning : on applique et on
     redessine, en gardant le curseur dans le champ en cours de saisie. */
  /* Un interrupteur de réglage, quel que soit le panneau : `champ-voix` est
     le nom d'origine, `champ-oui` celui qu'on donne aux nouveaux. */
  if (t.dataset.champVoix || t.dataset.champOui) {
    DB.etat.reglages[t.dataset.champVoix || t.dataset.champOui] = t.checked;
    DB.sauver(); rendre();
    return;
  }
  /* Les horaires d'un jour : « 5:debut », « 2:pauseFin ». Vide = ce jour suit
     l'horaire général, ce qui permet de revenir en arrière sans tout retaper. */
  /* Un réglage qui n'appartient qu'à la personne connectée. */
  if (t.dataset.champPerso) {
    poserMaPref(t.dataset.champPerso, t.type === 'checkbox' ? t.checked : t.value);
    rendre();
    return;
  }
  if (t.dataset.champJour) {
    const [n, quoi] = t.dataset.champJour.split(':');
    const r = DB.etat.reglages;
    r.horairesJour = r.horairesJour || {};
    const j = r.horairesJour[n] = r.horairesJour[n] || {};
    if (t.value) j[quoi] = t.value; else delete j[quoi];
    DB.sauver(); DB.appliquerReglages();
    S.champParcActif = 'jour:' + t.dataset.champJour;
    rendre();
    return;
  }
  if (t.dataset.champJourFerme) {
    const n = t.dataset.champJourFerme;
    const r = DB.etat.reglages;
    r.horairesJour = r.horairesJour || {};
    r.horairesJour[n] = r.horairesJour[n] || {};
    r.horairesJour[n].ferme = t.checked;
    DB.sauver(); DB.appliquerReglages();
    rendre();
    return;
  }
  /* Un interrupteur qui refait les créneaux : il faut réappliquer, pas
     seulement enregistrer. */
  if (t.dataset.champParcOui) {
    DB.etat.reglages[t.dataset.champParcOui] = t.checked;
    DB.sauver(); DB.appliquerReglages(); rendre();
    return;
  }
  if (t.dataset.champParc) {
    const cle = t.dataset.champParc;
    DB.etat.reglages[cle] = t.type === 'number' ? Number(t.value) : t.value;
    if (cle === 'parcColonnes') {
      DB.etat.reglages.parcMeca = Math.min(DB.etat.reglages.parcMeca, DB.etat.reglages.parcColonnes);
    }
    DB.sauver();
    const deplacees = DB.appliquerReglages();
    S.parcZoom = null;
    S.champParcActif = cle;
    rendre();
    if (deplacees) toast(`${deplacees} voiture${deplacees > 1 ? 's' : ''} déplacée${deplacees > 1 ? 's' : ''} dans la rue`);
    return;
  }
});

document.addEventListener('change', (e) => {
  const t = e.target;

  /* Ouvrir la grille d'un confrère depuis l'écran des tarifs : on atterrit
     directement sur son tableau de prix, ouvert et à l'écran. */
  if (t.hasAttribute && t.hasAttribute('data-aller-grille')) {
    const c = DB.client(t.value);
    t.value = '';
    if (!c) return;
    S.clientId = c.id; S.vue = 'client-fiche'; S.grillePerso = c.id;   // c'est un id, pas un oui/non
    rendre();
    const bloc = $('.grille-perso');
    if (bloc) bloc.scrollIntoView({ block: 'center' });
    return;
  }

  /* La liste des prestations à ajouter revient toujours à sa première ligne :
     elle sert à choisir, pas à afficher un état. */
  if (t.hasAttribute && t.hasAttribute('data-ajout-presta')) {
    if (!S.modale || S.modale.type !== 'intervention') return;
    const choix = t.value;
    t.value = '';
    if (!choix) return;
    lireChampsIntervention();
    const c = DB.client(S.modale.id);
    if (choix === 'libre') {
      S.modale.lignes.push({ prestaId: null, libelle: '', famille: '', qte: 1, prixHT: 0 });
    } else {
      // on cherche aussi dans ses lignes à lui, pas seulement au catalogue
      const p = DB.catalogueDe(c).find(x => x.id === choix) || DB.presta(choix);
      if (!p) return;
      S.modale.lignes.push({
        prestaId: p.id, libelle: p.libelle, famille: p.famille,
        code: p.code || '', ref: p.ref || '', type: p.type,
        qte: 1, prixHT: DB.prixPour(p, c)
      });
    }
    rendre();
    return;
  }

  if (t.dataset.champOcc) {
    const o = DB.occupation(t.dataset.place);
    if (!o) return;
    const cle = t.dataset.champOcc;
    o[cle] = cle === 'sortiePrevue' ? depuisInputDate(t.value)
           : cle === 'assigneA' ? (t.value || null) : t.value;
    if (cle === 'pont') o.pont = t.checked;
    if (cle === 'etat') suivreEtatDevis(o);
    DB.sauver(); rendre();
    return;
  }

  // les <select> : traités ici pour redessiner l'écran après le choix
  if (t.dataset.champLigne === 'type') {
    const d = DB.devis(t.dataset.id);
    const l = d && d.lignes.find(x => x.id === t.dataset.ligne);
    if (l) { l.type = t.value; d.maj = Date.now(); DB.sauver(); rendre(); }
    return;
  }

  if (t.dataset.champClient === 'type' || t.dataset.champClient === 'tarif') {
    const c = DB.client(t.dataset.id);
    if (!c) return;
    if (t.dataset.champClient === 'type') {
      c.type = t.value;
      c.tarif = t.value === 'pro' ? 'pro' : 'part';   // la grille suit le type par défaut
    } else {
      c.tarif = t.value;
    }
    DB.sauver(); rendre();
    toast(DB.estPro(c) ? 'Grille professionnel appliquée à ce client' : 'Grille particulier appliquée à ce client');
  }
});

/* Deux onglets ouverts sur le même outil — ou les deux versions côte à côte —
   écrivaient au même endroit : le dernier à enregistrer effaçait le travail de
   l'autre. On reprend maintenant ce que l'autre onglet vient d'écrire, sauf si
   on est en train de saisir quelque chose. */
window.addEventListener('storage', (e) => {
  if (e.key !== CLE || !e.newValue) return;
  const saisieEnCours = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if (saisieEnCours || S.modale) return;
  if (!DB.relire()) return;

  /* Un partenaire connecté reste un partenaire : le rafraîchissement d'un
     autre onglet ne doit jamais le faire basculer dans l'atelier. */
  if (S.proConnecte) {
    const c = DB.client(S.proConnecte);
    // accès fermé depuis un autre poste : la session tombe aussitôt
    if (!c || !DB.estPro(c) || !(c.mdp && c.mdp.emp)) {
      S.proConnecte = null; S.grilleToken = null; stock.effacer('atelier.pro');
    } else {
      S.grilleToken = DB.jetonClient(c);
    }
    rendre();
    return;
  }
  if (!S.userId) { rendre(); return; }         // écran de connexion : on ne connecte personne
  if (!DB.utilisateur(S.userId)) S.userId = DB.etat.utilisateurs[0].id;
  if (S.placeId && !PLACES.some(p => p.id === S.placeId) && !estDansLaRue(S.placeId)) S.placeId = null;
  rendre();
  toast('Mis à jour depuis un autre onglet');
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (S.modale) { S.modale = null; rendre(); }
    else if (S.placeId) { S.placeId = null; rendre(); }
  }
  // raccourci : N = nouvel appel
  if (e.key.toLowerCase() === 'n' && !e.ctrlKey && !e.metaKey && !S.modale
      && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) {
    S.modale = { type: 'appel' }; rendre();
  }
});

let minuteurTaille;
window.addEventListener('resize', () => {
  clearTimeout(minuteurTaille);
  minuteurTaille = setTimeout(() => {
    if (S.vue === 'parking' && !S.zoomManuel) { S.parcZoom = null; rendre(); }
  }, 180);
});

/** Les deux liens publics vivent dans l'adresse : espace client et grille. */
/* Ouvrir la messagerie ou le téléphone du poste. Si le cadre l'interdit, on ne
   laisse pas l'utilisateur devant un bouton mort : le message s'affiche, prêt
   à être copié. */
function ouvrirLien(adresse, secours) {
  let parti = false;
  try {
    const a = document.createElement('a');
    a.href = adresse;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    parti = true;
  } catch (e) { parti = false; }

  if (!parti && secours) {
    S.messageSecours = secours;
    confirmer({
      titre: 'Messagerie indisponible ici',
      texte: 'Ce cadre empêche d\'ouvrir votre messagerie. Voici le message, à copier :'
           + `<br><br><textarea class="saisie" rows="7" readonly>${esc(secours)}</textarea>`,
      bouton: 'Copier le message',
      alors() { copier(secours, 'Message'); }
    });
  }
}

/* Certains cadres refusent qu'on touche à l'adresse. L'écran doit changer quand
   même : l'affichage suit l'état, l'adresse n'est qu'un confort de partage. */
function poserAdresse(valeur) {
  try { location.hash = valeur; } catch (e) { /* le cadre l'interdit : sans conséquence */ }
}

function lireAdresse() {
  let hash = '';
  try { hash = location.hash || ''; } catch (e) { hash = ''; }
  const client = hash.match(/client=([a-z0-9]+)/i);
  const grille = hash.match(/tarifs=([a-z0-9]+)/i);
  const annul = hash.match(/annul=([a-z0-9]+)/i);
  /* Le standard ouvre « …#appel=0612345678 ». On prend le numéro, on ouvre la
     fenêtre, et on efface aussitôt l'adresse : sans ça, un rafraîchissement
     ferait sonner un appel qui date d'une heure. */
  const appel = hash.match(/appel=([^&]+)/i);
  if (appel) {
    let num = appel[1];
    try { num = decodeURIComponent(num); } catch (e) { /* le brut fera l'affaire */ }
    poserAdresse('');
    if (chiffresSeuls(num).length >= 4) sonnerAppel(num);
    /* Le journal se vide de ce qui est trop vieux au premier appel du jour :
       inutile d'y penser ailleurs. */
    try { menageAppels(); } catch (e) { /* jamais bloquant */ }
  }
  S.clientToken = client ? client[1] : null;
  S.grilleToken = grille ? grille[1] : null;
  S.annulToken = annul ? annul[1] : null;
}

/* Trois liens publics mènent ici sans compte : l'espace client, la grille
   tarifaire, l'annulation d'un rendez-vous. Derrière l'un d'eux, l'outil n'est
   plus l'atelier — ni cloches, ni micro, ni ouverture de session. */
/* Faire sonner un appel à l'écran : la fenêtre passe devant tout le reste, et
   un son plus une notification vont chercher celui qui regarde ailleurs. */
function sonnerAppel(num, essai) {
  const r = DB.etat.reglages;
  let appel = null;
  try { appel = noterAppelJournal(num); } catch (e) { /* le journal n'est pas vital */ }

  /* Un même appel annoncé deux fois par le standard ne refait pas sonner tout
     l'atelier. Un essai depuis les réglages, lui, doit toujours montrer. */
  if (!essai && appel && appel.vu) return;
  if (appel) { appel.vu = true; }

  if (essai || r.appelFiche !== false) S.modale = { type: 'appel-entrant', num: String(num).trim() };
  if (r.appelSon !== false) { try { bip('appel', true); } catch (e) { /* un outil muet n'est pas cassé */ } }
  if (r.appelNotif !== false) {
    try {
      const info = reconnaitreNumero(num);
      const c = info && info.client;
      const nom = c ? (DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim()) : 'Numéro inconnu';
      notifierNavigateur('Appel entrant — ' + nom, telLisible(num));
    } catch (e) { /* pas de notification : la fenêtre suffit */ }
  }
}

function enVuePublique() {
  return !!(S.clientToken || S.grilleToken || S.annulToken);
}

window.addEventListener('hashchange', () => { lireAdresse(); rendre(); });

/* Le rappel EBP tourne tant que l'outil est ouvert : toutes les cinq minutes,
   il regarde si quelque chose dort dans la file. */
setInterval(() => {
  try { veilleAlertes(); verifierRappelEbp(); titreOnglet(); } catch (e) { /* jamais bloquant */ }
}, 300000);

/* Un outil qu'on laisse ouvert du lundi au samedi doit suivre le calendrier
   tout seul : au changement de jour, le planning fait son ménage, se replace
   sur la semaine en cours et se redessine. Sans ça, l'écran du vendredi soir
   affiche encore « aujourd'hui » le lundi matin. */
let jourAffiche = minuit(Date.now());
setInterval(() => {
  const jour = minuit(Date.now());
  if (jour === jourAffiche) return;
  jourAffiche = jour;
  try {
    if (!S.userId || enVuePublique()) return;
    menagePlanning();
    S.semaineDuMois = null;        // on retombe sur la semaine du jour
    if (S.vue === 'planning') S.moisPlanning = 0;
    rendre();
  } catch (e) { /* jamais bloquant */ }
}, 60000);

// le verrou se contrôle plus souvent que le reste
setInterval(() => { try { verifierVerrou(); } catch (e) { /* jamais bloquant */ } }, 30000);

/* ==========================================================================
   DÉMARRAGE
   ========================================================================== */
(function demarrer() {
  // La version 2 se greffe par-dessus ce fichier et prend la main sur
  // l'affichage : on la laisse démarrer elle-même.
  if (window.ATELIER_V2) return;
  try {
    const theme = stock.lire('atelier.theme');
    if (theme) document.documentElement.setAttribute('data-theme', theme);

    DB.charger();

    lireAdresse();

    const qui = stock.lire('atelier.qui');
    if (qui && DB.utilisateur(qui)) S.userId = qui;

    // porte ouverte : on n'attend personne devant l'écran de connexion
    /* Porte ouverte : on n'attend personne devant l'écran de connexion — sauf
       si quelqu'un vient justement de rendre la main. */
    if (SANS_CODE && !S.userId && !enVuePublique() && stock.lire('atelier.rendu') !== '1') {
      S.userId = compteParDefaut();
    }

    rendre();
  } catch (e) {
    // plutôt qu'une page blanche : dire ce qui ne va pas
    console.error(e);
    document.getElementById('app').innerHTML =
      '<div class="accueil"><div class="accueil-boite"><div class="carte"><div class="carte-corps pile">'
      + '<h2 style="font-size:18px">L\'outil n\'a pas pu démarrer</h2>'
      + '<p class="mini">' + esc(e.message) + '</p>'
      + '<button class="btn plein" onclick="location.reload()">Réessayer</button>'
      + '</div></div></div></div>';
  }
})();

</script>
<script>
/* ==========================================================================
   ATELIER — version 2
   --------------------------------------------------------------------------
   Se greffe sur le moteur de la version 1 : mêmes données, mêmes calculs,
   mêmes corrections. Ce fichier ne refait que ce qui décide de la qualité
   d'usage — l'organisation de l'écran.

   L'accueil montre ce qui réclame une décision aujourd'hui : les appels reçus,
   les rappels, la journée et le lendemain. Le suivi des devis vit dans son
   propre écran.
   ========================================================================== */

/* --- la fiche d'une demande ------------------------------------------------ */

/** Ce qu'un dossier a d'urgent, en un coup d'œil. */
function urgenceDossier(d) {
  const occ = DB.etat.occupations.find(o => o.devisId === d.id);
  const jours = occ ? joursDepuis(occ.depuis) : joursDepuis(d.cree);
  const seuil = DB.etat.reglages.immobilisationAlerte;
  return {
    occ,
    jours,
    vieux: !!occ && jours >= seuil,
    dort: d.statut === 'envoye' && joursDepuis(d.envoye || d.cree) >= DB.etat.reglages.relanceApres,
    piecesDues: occ ? piecesEnRetard(occ) : 0,
    // accepté ou commandé : dans les deux cas, il manque un créneau
    sansCreneau: ['accepte', 'commande'].includes(d.statut) && !DB.etat.planning.some(p => p.devisId === d.id)
  };
}

function ficheDossier(d, ton) {
  const i = infosDevis(d);
  const u = urgenceDossier(d);
  const t = totaux(d);
  const qui = u.occ && u.occ.assigneA ? DB.utilisateur(u.occ.assigneA) : null;
  const tel = i.client && i.client.tel ? i.client.tel.replace(/\s/g, '') : '';

  return `<div class="fiche" style="--ton:${ton}">
    <button class="fiche-corps" data-act="ouvrir-devis" data-id="${d.id}">
      <div class="fiche-haut">
        <span class="fiche-client">${esc(i.nomClient)}</span>
        <span class="fiche-jours ${u.vieux || u.dort ? 'vieux' : ''}">${
          u.dort ? joursDepuis(d.envoye) + ' j' : (u.jours === 0 ? "auj." : u.jours + ' j')}</span>
      </div>
      <div class="fiche-auto">${esc(i.vehiculeTexte)}</div>
      ${d.panne ? `<div class="fiche-panne">${esc(d.panne)}</div>` : ''}
      <div class="fiche-bas">
        <span class="plaque">${esc(i.immat)}</span>
        ${u.occ ? `<span class="marque-place">${estDansLaRue(u.occ.placeId) ? 'Rue' : esc(u.occ.placeId)}</span>` : ''}
        ${u.piecesDues ? `<span class="alerte-piece">${ic('alerte')} ${u.piecesDues} pièce${u.piecesDues > 1 ? 's' : ''}</span>` : ''}
        ${u.sansCreneau ? `<span class="alerte-piece" style="color:var(--gros)">${ic('agenda')} sans créneau</span>` : ''}
        ${qui ? `<span class="jeton-mini" style="--teinte:${qui.teinte}" title="${esc(qui.nom)}">${esc(qui.init)}</span>` : ''}
        <span class="fiche-montant">${d.lignes.length ? eur(t.ttc) : '—'}</span>
      </div>
    </button>
    <div class="fiche-actions">
      ${tel ? `<a class="btn nu num-appel" href="tel:${esc(tel)}" title="Appeler ${esc(i.nomClient)}">
                 ${ic('tel')}<span>${esc(i.client.tel)}</span></a>`
            : '<span class="mini" style="margin-right:auto">Sans téléphone</span>'}
      <button class="btn nu" data-act="envoyer-lien" data-id="${d.id}" title="Envoyer le lien au client">${ic('lien')}</button>
      <button class="btn nu" data-act="statut" data-id="${d.id}" data-statut="brouillon" title="Je complète moi-même">${ic('crayon')}</button>
      <button class="btn nu danger" data-act="suppr-devis" data-id="${d.id}" title="Supprimer la demande">${ic('poubelle')}</button>
    </div>
  </div>`;
}

/* Ce qui attend d'être facturé. C'est le point où l'outil rejoint EBP : tout
   travail terminé et non encaissé doit devenir une facture, et rien ne doit se
   perdre en route. Le bouton sort le fichier et marque les dossiers comme
   passés — la même liste ne repart jamais deux fois. */
function blocFacturer() {
  /* Facturer et encaisser sont deux choses : un confrère qui paie comptant doit
     quand même recevoir sa facture. On prend donc tout travail réalisé — à
     régler ou déjà réglé — qui n'est pas encore passé dans EBP. */
  const aFacturer = DB.etat.devis.filter(d =>
    d.lignes.length && !d.ebp && etatIntervention(d) !== 'attente');
  const total = aFacturer.reduce((s, d) => s + totaux(d).ttc, 0);

  if (!aFacturer.length) {
    const attente = DB.etat.devis.filter(d => d.lignes.length && etatIntervention(d) === 'attente').length;
    return `<section class="carte">
      <div class="carte-tete"><h2>À facturer dans EBP</h2>
        <span class="badge t-ok">${ic('check')} rien en attente</span>
      </div>
      <div class="carte-corps" style="padding-top:0">
        <p class="aide" style="margin:0">Tout ce qui est terminé est passé dans EBP.
        ${attente ? `${attente} intervention${attente > 1 ? 's sont' : ' est'} encore en attente de réalisation.` : ''}</p>
      </div>
    </section>`;
  }

  return `<section class="carte">
    <div class="carte-tete">
      <h2>À facturer dans EBP</h2>
      <span class="etiq">${aFacturer.length}</span>
      <span class="badge t-urgent">${eur(total)} TTC</span>
      <button class="pousse btn plein" style="margin-left:auto" data-act="export-facturation">
        ${ic('envoi')} Sortir le fichier
      </button>
    </div>
    <div class="liste">
      ${aFacturer.slice(0, 6).map(d => {
        const i = infosDevis(d);
        return `<button class="item" data-act="ouvrir-devis" data-id="${d.id}">
          <span class="badge t-urgent">${esc(d.numero)}</span>
          <span class="item-txt">
            <b>${esc(i.nomClient)}</b>
            <small>${esc(d.panne || i.vehiculeTexte)}${i.immat && i.immat !== '—' ? ' · ' + esc(i.immat) : ''}</small>
          </span>
          <span class="item-meta"><span class="num">${eur(totaux(d).ttc)}</span></span>
        </button>`;
      }).join('')}
    </div>
    ${aFacturer.length > 6 ? `<div class="carte-corps" style="padding-top:0">
      <p class="mini">…et ${aFacturer.length - 6} autre${aFacturer.length - 6 > 1 ? 's' : ''}.</p></div>` : ''}
    <div class="carte-corps" style="padding-top:0">
      <p class="aide" style="margin:0">Le fichier reprend les lignes, les quantités et les prix appliqués
      — grille du client comprise. Une fois sorti, ces dossiers ne repartiront plus :
      ils sont marqués comme passés dans EBP.</p>
    </div>
  </section>`;
}

/* Les garages partenaires, à portée de main depuis l'accueil : leur grille
   s'ouvre d'un geste — c'est là qu'on ajuste leurs prix et qu'on relève ce
   qu'on vient de leur faire. Ce qu'ils doivent est écrit à côté. */
function blocProsAccueil() {
  const pros = DB.etat.clients.filter(c => DB.estPro(c));
  if (!pros.length) {
    return `<section class="carte">
      <div class="carte-tete"><h2>Garages partenaires</h2>
        <button class="pousse btn" style="margin-left:auto" data-act="nouveau-pro">${ic('plus')} En ajouter un</button>
      </div>
      <div class="vide" style="padding:22px 16px">
        <p class="mini">Aucun confrère pour l'instant. Ouvrez-leur un accès :
        ils consultent leurs tarifs et demandent leurs créneaux eux-mêmes.</p>
      </div>
    </section>`;
  }

  const du = pros.reduce((s, c) => s + resteADevoir(c.id), 0);
  const demandes = demandesPro();
  return `<section class="carte">
    <div class="carte-tete">
      <h2>Garages partenaires</h2>
      <span class="etiq">${pros.length}</span>
      ${du > 0 ? `<span class="badge t-urgent">${eur(du)} à encaisser</span>` : ''}
      <button class="pousse btn nu" style="margin-left:auto" data-act="nouveau-pro">${ic('plus')} Ajouter</button>
    </div>

    ${/* Les créneaux qu'ils attendent, traitables d'ici : on confirme et le
         message de confirmation s'ouvre dans la foulée. */ ''}
    ${demandes.length ? `<div class="demandes-pro">
      ${demandes.map(p => `<div class="demande-l">
        <span class="item-txt">
          <b>${esc(p.client || 'Un garage')} — ${dateCourte(p.jour)}</b>
          <small>${esc(p.prestation || 'créneau demandé')}${p.immat ? ' · ' + esc(p.immat) : ''}${
            p.boitierSeul ? ' · calculateur seul' : ''}</small>
        </span>
        <button class="btn plein" data-act="planif-ouvrir" data-id="${p.id}">
          ${ic('agenda')}<span class="sur-grand">Donner l'heure</span></button>
      </div>`).join('')}
    </div>` : ''}

    <div class="liste">
      ${pros.map(c => {
        const doit = resteADevoir(c.id);
        const attente = interventionsDe(c.id).filter(d => etatIntervention(d) === 'attente').length;
        const negociees = DB.etat.catalogue.filter(p => DB.prixNegocie(p, c)).length;
        return `<div class="item pro-l">
          <button class="alerte-corps" data-act="ouvrir-client" data-id="${c.id}">
            <span class="jeton-mini" style="--teinte:190">${esc((c.nom || '?').charAt(0).toUpperCase())}</span>
            <span class="item-txt">
              <b>${esc(c.nom)}</b>
              <small>${Number(c.remisePro) ? '−' + c.remisePro + ' % sur sa grille'
                     : negociees ? negociees + ' prix convenu' + (negociees > 1 ? 's' : '')
                     : 'grille professionnelle'}${
                attente ? ' · ' + attente + ' en attente' : ''}</small>
            </span>
            ${doit > 0 ? `<span class="badge t-urgent">${eur(doit)}</span>` : ''}
          </button>
          <button class="btn nu" data-act="voir-grille" data-id="${c.id}"
                  title="Ouvrir sa grille tarifaire">${ic('catalogue')}<span class="sur-grand">Sa grille</span></button>
        </div>`;
      }).join('')}
    </div>
  </section>`;
}

/* --- recherche unique : un client au téléphone, quel que soit son motif ---- */
function resultatsAccueil(q) {
  const brut = q.toLowerCase();
  const nu = brut.replace(/[-\s.]/g, '');
  const dansTexte = (s) => String(s).toLowerCase().replace(/[-\s.]/g, '').includes(nu);

  return {
    tarifs: DB.etat.catalogue.filter(p => (p.libelle + ' ' + p.code + ' ' + p.famille).toLowerCase().includes(brut)),
    dossiers: DB.etat.devis.filter(d => {
      const i = infosDevis(d);
      const c = i.client || {};
      return dansTexte(i.nomClient + i.vehiculeTexte + i.immat + d.numero + (d.panne || '') + (c.tel || '') + (c.ville || ''));
    }).sort((a, b) => b.maj - a.maj).slice(0, 10),
    clients: DB.etat.clients.filter(c =>
      dansTexte((c.nom || '') + (c.prenom || '') + (c.tel || '') + (c.ville || ''))).slice(0, 8)
  };
}

function panneauRecherche(q) {
  const res = resultatsAccueil(q);
  const rien = !res.tarifs.length && !res.dossiers.length && !res.clients.length;

  return `<div class="pile" style="gap:14px">
    ${res.tarifs.length ? `<section class="carte">
      <div class="carte-tete"><h2>Tarifs</h2><span class="pousse etiq" style="margin-left:auto">${res.tarifs.length}</span></div>
      <div class="liste">
        ${res.tarifs.map(p => `<div class="item" style="grid-template-columns:minmax(0,1fr) auto">
          <span class="item-txt"><b style="font-weight:500">${esc(p.libelle)}</b><small>${esc(p.famille)}</small></span>
          <span class="duo-prix">
            <span><i>Particulier</i><b class="num">${eur(p.prixHT)}</b></span>
            <span class="pro"><i>Pro</i><b class="num">${eur(p.prixPro != null ? p.prixPro : p.prixHT)}</b></span>
          </span>
        </div>`).join('')}
      </div>
    </section>` : ''}

    ${res.dossiers.length ? `<section class="carte">
      <div class="carte-tete"><h2>Dossiers</h2><span class="pousse etiq" style="margin-left:auto">${res.dossiers.length}</span></div>
      <div class="liste">
        ${res.dossiers.map(d => {
          const i = infosDevis(d);
          return `<button class="item" data-act="ouvrir-devis" data-id="${d.id}">
            <span class="badge t-${STATUTS[d.statut].ton}">${esc(STATUTS[d.statut].court)}</span>
            <span class="item-txt"><b>${esc(i.nomClient)}</b><small>${esc(i.vehiculeTexte)} · ${esc(d.panne || '—')}</small></span>
            <span class="item-meta"><span class="plaque">${esc(i.immat)}</span>
              <span class="mini num">${d.lignes.length ? eur(totaux(d).ttc) : '—'}</span></span>
          </button>`;
        }).join('')}
      </div>
    </section>` : ''}

    ${res.clients.length ? `<section class="carte">
      <div class="carte-tete"><h2>Clients</h2><span class="pousse etiq" style="margin-left:auto">${res.clients.length}</span></div>
      <div class="liste">
        ${res.clients.map(c => `<button class="item" data-act="ouvrir-client" data-id="${c.id}">
          <span class="jeton-mini" style="--teinte:${DB.estPro(c) ? 190 : 220}">${esc((c.nom || '?').charAt(0).toUpperCase())}</span>
          <span class="item-txt"><b>${esc(c.type === 'pro' ? c.nom : (c.prenom + ' ' + c.nom).trim())}${DB.estPro(c) ? ' <span class="type-pin" data-t="pro">PRO</span>' : ''}</b>
            <small>${esc(c.tel || 'sans téléphone')}${c.ville ? ' · ' + esc(c.ville) : ''}</small></span>
          <span class="item-meta"><span class="fleche">${ic('fleche')}</span></span>
        </button>`).join('')}
      </div>
    </section>` : ''}

    ${rien ? `<div class="carte"><div class="vide">
      <h3>Rien trouvé pour « ${esc(q)} »</h3>
      <p class="mini">Essayez un nom, une immatriculation, un numéro de téléphone, ou une prestation.</p>
    </div></div>` : ''}
  </div>`;
}

/* La même recherche, mais accessible de n'importe quel écran par le bouton
   en haut à droite : un client au téléphone n'attend pas qu'on revienne à
   l'accueil. */
function modaleRecherche() {
  const q = (S.rechAccueil || '').trim();
  return `<div class="voile haut" data-voile><div class="modale xl palette">
    <div class="palette-champ">
      ${ic('loupe')}
      <input class="saisie" id="rech-modale" value="${esc(S.rechAccueil || '')}"
             placeholder="Un tarif, un client, une immatriculation, un numéro…">
      <button class="btn nu" data-act="fermer-modale" title="Fermer">${ic('croix')}</button>
    </div>
    <div class="palette-corps">
      ${q ? panneauRecherche(q) : `<div class="vide">
        <p class="mini">Cherchez dans vos tarifs, vos clients et vos dossiers.<br>
        Les tirets et les espaces sont ignorés.</p>
      </div>`}
    </div>
  </div></div>`;
}

/* --- la journée et le lendemain ------------------------------------------- */
function colonneJour(titre, jour) {
  const liste = rdvActifs(jour);
  const charge = liste.reduce((s, p) => s + p.duree, 0);

  return `<section class="carte">
    <div class="carte-tete">
      <h2>${esc(titre)}</h2>
      <span class="pousse mini num" style="margin-left:auto">${liste.length ? heuresFr(charge) : ''}</span>
    </div>
    ${liste.length ? `<div class="liste">
      ${liste.map(p => {
        const u = DB.utilisateur(p.userId);
        const e = EMPLACEMENTS[p.emplacement] || EMPLACEMENTS.sol;
        return `<button class="item ${p.aValider ? 'a-valider' : ''}" data-act="planif-ouvrir" data-id="${p.id}">
          <span class="heure-rdv num">${p.aValider ? '?' : esc(p.heure)}</span>
          <span class="item-txt">
            <b style="${p.fait ? 'text-decoration:line-through;color:var(--encre-3)' : ''}">${esc(p.client || libelleRdv(p))}</b>
            <small>${p.aValider ? 'Demande d\'un pro — à confirmer' : esc(p.prestation)}</small>
          </span>
          <span class="item-meta">
            <span class="rangee" style="gap:5px">
              <span class="emplacement ${p.emplacement === 'pont' ? 'pont' : ''}">${esc(e.court)}</span>
              ${u ? `<span class="jeton-mini" style="--teinte:${u.teinte}" title="${esc(u.nom)}">${esc(u.init)}</span>` : ''}
            </span>
            <span class="mini">${heuresFr(p.duree)}</span>
          </span>
        </button>`;
      }).join('')}
    </div>` : '<div class="vide" style="padding:26px 16px"><p class="mini">Rien de prévu.</p></div>'}
  </section>`;
}

function colonneMemos() {
  const liste = DB.etat.memos.filter(m => m.userId === S.userId && !m.fait)
    .sort((a, b) => (a.quand || 8e15) - (b.quand || 8e15));

  return `<section class="carte avant" style="--ton:var(--accent)">
    <div class="carte-tete">
      <h2>Mon pense-bête</h2>
      <span class="compte">${liste.length}</span>
      <button class="pousse btn nu" style="margin-left:auto" data-act="aller" data-vue="memos">Tout voir ${ic('fleche')}</button>
    </div>

    <form id="form-memo-rapide" class="ajout-rapide">
      <input class="saisie" id="memo-rapide" name="texte" autocomplete="off"
             placeholder="Ajouter un rappel…" value="${esc(S.brouillonMemo || '')}">
      <div class="ancre-menu">
        <button class="btn plein ajout-btn" type="submit" title="Choisir le type">${ic('plus')}</button>
        ${S.menuTypeMemo ? `<div class="menu-type">
          <div class="menu-type-tete">Quel type de rappel ?</div>
          ${Object.keys(TYPES_MEMO).map(k => `<button type="button" data-act="memo-ajouter" data-type="${k}">
            <i class="pastille-ton" style="background:var(--${TYPES_MEMO[k].ton === 'urgent' ? 'occupe'

              : TYPES_MEMO[k].ton === 'info' ? 'actif'

          </button>`).join('')}
        </div>` : ''}
      </div>
    </form>

    ${montre.length ? `<div class="liste">
      ${montre.map(m => {
        const t = TYPES_MEMO[m.type] || TYPES_MEMO.note;
        const e = echeanceTexte(m);
        return `<div class="item" style="align-items:flex-start">

                  style="color:var(--encre-3);padding:2px">${ic('carre')}</button>
          <span class="item-txt">

/* Les appels reçus : ce qui arrive de l'extérieur et n'attend que nous. */
function blocAppels() {
  const liste = DB.etat.devis
    .filter(d => d.statut === 'appel' || d.statut === 'attente')
    .sort((a, b) => a.maj - b.maj);

  return `<section class="carte avant" style="--ton:var(--occupe)">
    <div class="carte-tete">
      <h2>Appels reçus</h2>
      <span class="compte">${liste.length}</span>
      <button class="pousse btn plein" style="margin-left:auto" data-act="appel">${ic('tel')} Noter un appel</button>
    </div>

      <p class="mini">Aucun appel en attente. Tout ce qui est arrivé a été traité.</p>
    </div>`}

}

function vueTableauAtelier() {
  const ceJour = minuit(Date.now());
  // chacun compose son accueil : ce que Yoann cache reste chez Laura
  const montre = (cle) => prefAccueil(cle);

  /* Chaque bloc de l'accueil se rend séparément : c'est ce qui permet à chacun
     de les ranger dans l'ordre qui lui va — le pense-bête avant les appels,
     ou l'inverse. L'ordre et les cases cochées appartiennent à la personne. */
  const blocs = {
    raccourcis: () => `<div class="barre-actions">
      ${/* Les raccourcis d'abord — c'est ce qu'on vient chercher —, la date
            ensuite : elle se lit, elle ne se clique pas. */ ''}
      ${(raccourcisChoisis()).map(k => RACCOURCIS[k] ? `<button class="raccourci" data-racc="${k}"
          data-act="${RACCOURCIS[k].act}" ${RACCOURCIS[k].vue ? `data-vue="${RACCOURCIS[k].vue}"` : ''}>
          ${ic(RACCOURCIS[k].ico)} ${esc(RACCOURCIS[k].nom)}</button>` : '').join('')}
      <span class="jour-dit">${dateLongue(Date.now())}</span>
      <button class="btn plein sur-grand" data-act="appel">${ic('tel')} Nouvelle demande</button>
    </div>`,

    compteurs: () => {
      const choisis = compteursChoisis();
      if (!choisis.length) return `<div class="brief-vide">
        Aucun compteur affiché — choisissez les vôtres dans
        <b>Paramètres → L'écran d'accueil</b>.</div>`;
      // un compteur qui tombe en panne est sauté : il n'emporte pas l'accueil
      return `<div class="brief">${choisis.map(tuileCompteur).join('')}</div>`;
    },

    facturer: () => blocFacturer(),
    pros:     () => blocProsAccueil(),
    appels:   () => blocAppels(),
    journal:  () => blocJournalAppels(),
    memos:    () => colonneMemos(),
    planning: () => `<div class="bande-jour">
      ${colonneJour("Aujourd'hui", ceJour)}
      ${colonneJour('Demain', jourPlus(ceJour, 1))}
    </div>`
  };

  const ordre = ordreAccueil().filter(k => blocs[k] && montre(k));

  /* Les appels et les pense-bêtes se mettent côte à côte quand ils se suivent :
     deux colonnes valent mieux que deux bandeaux l'un sous l'autre. */
  /* Deux blocs courts qui se suivent se mettent côte à côte : une liste de
     trois lignes étalée sur toute la largeur d'un écran d'atelier laisse un
     grand vide à droite, et l'œil perd le fil entre le nom et le montant. */
  const APPARIABLES = ['appels', 'memos', 'journal', 'facturer', 'pros'];
  const morceaux = [];
  for (let i = 0; i < ordre.length; i++) {
    const k = ordre[i], suivant = ordre[i + 1];
    if (APPARIABLES.includes(k) && APPARIABLES.includes(suivant)) {
      morceaux.push(`<div class="duo-avant">${blocs[k]()}${blocs[suivant]()}</div>`);
      i++;
    } else if (APPARIABLES.includes(k)) {
      morceaux.push(`<div class="duo-avant seul">${blocs[k]()}</div>`);
    } else {
      morceaux.push(blocs[k]());
    }
  }

  return `
    ${morceaux.join('\n')}

    ${!ordre.length
      ? `<div class="carte"><div class="vide"><h3>Écran d'accueil vidé</h3>
         <p class="mini">Tout est décoché dans Paramètres → L'écran d'accueil.</p>
         <button class="btn" style="margin-top:12px" data-act="aller" data-vue="reglages">Y retourner</button></div></div>` : ''}

    ${S.placeId ? tiroirPlace(S.placeId) : ''}`;
}

/* ==========================================================================
   L'ENVELOPPE
   ========================================================================== */
const MENU2 = [
  { id: 'atelier',   nom: 'Atelier',   ico: 'jauge' },
  { id: 'planning',  nom: 'Planning',  ico: 'agenda' },
  { id: 'parking',   nom: 'Parc',      ico: 'parking' },
  { id: 'memos',     nom: 'Mémos',     ico: 'epingle' },
  { id: 'clients',   nom: 'Clients',   ico: 'clients' },
  { id: 'catalogue', nom: 'Tarifs',    ico: 'catalogue' },
  { id: 'reglages',  nom: 'Paramètres', ico: 'reglages' }
];

/** Les vues de la v1 rendent leur propre en-tête ; ici la barre est unique,
 *  donc on neutralise cet en-tête et on garde uniquement le contenu. */
function sansEntete(html) {
  return html.replace(/<header class="barre">[\s\S]*?<\/header>/, '');
}

const VUES2 = {
  atelier:        () => vueTableauAtelier(),
  planning:       () => sansEntete(vuePlanning()),
  parking:        () => sansEntete(vueParking()),
  memos:          () => sansEntete(vueMemos()),
  clients:        () => sansEntete(vueClients()),
  'client-fiche': () => sansEntete(vueFicheClient()),
  catalogue:      () => sansEntete(vueCatalogue()),
  reglages:       () => sansEntete(vueReglages()),
  devis:          () => sansEntete(vueListeDevis()),
  'devis-fiche':  () => sansEntete(vueFicheDevis())
};

/** L'en-tête de la v1 est retiré : on reconstruit ici un titre cohérent,
 *  y compris pour les fiches, dont le titre dépend du dossier ouvert. */
const TITRES2 = {
  planning:  null,          // son titre dit le mois et la semaine ouverte
  parking:   ['Parc véhicules', null],
  memos:     ['Mon pense-bête', null],
  clients:   ['Clients', null],
  catalogue: ['Tarifs', 'Grilles particulier et professionnel'],
  reglages:  null,          // son sous-titre dépend de ce qu'on a le droit de régler
  devis:     ['Tous les devis', null]
};

function titreEcran(vue) {
  if (vue === 'devis-fiche') {
    const d = DB.devis(S.devisId);
    if (!d) return null;
    const i = infosDevis(d);
    return [d.numero, i.nomClient + ' · ' + i.vehiculeTexte + ' · ' + i.immat];
  }
  if (vue === 'client-fiche') {
    const c = DB.client(S.clientId);
    if (!c) return null;
    const vs = DB.etat.vehicules.filter(v => v.clientId === c.id).length;
    return [c.type === 'pro' ? c.nom : (c.prenom + ' ' + c.nom).trim(),
            (DB.estPro(c) ? 'Tarif professionnel' : 'Tarif particulier') + ` · ${vs} véhicule${vs > 1 ? 's' : ''}`];
  }
  if (vue === 'parking') {
    const libres = placesLibres().length;
    return ['Parc véhicules', `${PLACES.length - libres} occupées · ${libres} libres sur ${PLACES.length} places`];
  }
  if (vue === 'planning') {
    const m = semainesDuMois(S.moisPlanning || 0);
    const s = m.semaines[semaineAffichee(m)] || m.semaines[0];
    const ouvres = (DB.etat.reglages.joursOuvres || 6) - 1;
    const qui = S.planningQui ? DB.utilisateur(S.planningQui) : null;
    return ['Planning', libelleSemaine(s.lundi, jourPlus(s.lundi, ouvres))
            + (qui ? ` · ${qui.nom} seulement` : '')];
  }
  if (vue === 'reglages') {
    return ['Paramètres', jeSuisAdmin()
      ? 'Tout ce que vous pouvez régler vous-même'
      : 'Votre écran, vos avertissements, votre voix'];
  }
  return TITRES2[vue] || null;
}

rendre = function rendreV2() {
  const app = document.getElementById('app');

  sessionValide();   // jamais afficher le nom de quelqu'un d'autre
  if (S.grilleToken) { app.innerHTML = vueGrilleTarifs(); apresRendu(); return; }
  if (S.clientToken) { app.innerHTML = vueClient(); apresRendu(); return; }
  if (S.annulToken) { app.innerHTML = vueAnnulation(); apresRendu(); return; }
  if (!S.userId) { app.innerHTML = SANS_CODE ? vueConnexionProfils() : vueConnexion(); apresRendu(); return; }

  // la veille tourne avant l'affichage : la cloche est juste dès l'ouverture
  if (S.userId && !enVuePublique()) {
    try { menagePlanning(); veilleAlertes(); } catch (e) { /* rien */ }
  }

  const vue = VUES2[S.vue] ? S.vue : 'atelier';
  const badges = {
    atelier: appelsATraiter().length + aRelancer().length,
    parking: pretsARendre().length,
    memos: mesMemos(false).length,
    // demandes des garages pro à confirmer, et créneaux rendus par des clients
    planning: demandesPro().length + annulationsClient().length
  };

  // les fiches gardent le titre que la v1 leur donne : on le laisse tomber et
  // on affiche un fil de retour, plus lisible qu'un bouton perdu dans la page
  const retour = vue === 'devis-fiche' ? { vers: 'atelier', txt: 'Le tableau' }
               : vue === 'client-fiche' ? { vers: 'clients', txt: 'Clients' } : null;

  const titre = titreEcran(vue);

  app.innerHTML = `
    <div class="coque2">
      ${/* Une seule porte vers tous les écrans : la barre du haut ne sert plus
            qu'à ce qui doit rester sous la main — chercher, parler, être averti. */ ''}
      <header class="commande">
        ${/* Partout ailleurs qu'à l'atelier, une porte de retour d'un seul
              clic. Sur l'atelier elle n'aurait rien à faire : on y est déjà,
              et elle prendrait la place de ce qui sert. */ ''}
        ${vue === 'atelier' ? '' : `<button class="btn nu retour-accueil" data-act="aller" data-vue="atelier"
          title="Revenir à l'atelier" aria-label="Revenir à l'atelier">${ic('maison', 1.9)}</button>`}
        <button class="btn tout" data-act="menu-plus" title="Tous les écrans">
          ${ic('plus-menu', 2)}<span>${esc(nomEcran(vue))}</span>
          ${(() => {
            const n = Object.values(badges).reduce((s, x) => s + (x || 0), 0);
            return n ? `<span class="pastille">${n}</span>` : '';
          })()}
        </button>
        ${/* Chercher se fait aussi souvent que changer d'écran : les deux
              gestes tiennent côte à côte, à gauche. */ ''}
        <button class="btn cherche-vite" data-act="recherche" title="Rechercher">
          ${ic('loupe')}<span>Rechercher</span>
        </button>
        <div class="fin">
          <button class="btn nu micro ${VOIX.voulu ? 'ecoute' : ''}" data-act="voix"
                  title="${VOIX.voulu ? 'Couper le micro' : 'Commander à la voix'}"
                  aria-pressed="${VOIX.voulu ? 'true' : 'false'}">${ic('micro', 1.9)}</button>
          ${(() => {
            // dès qu'il y a quelque chose à voir, la cloche bat en rouge
            const n = alertesAtelier().length;
            return `<button class="btn nu cloche ${n ? 'clignote' : ''}" data-act="alertes" data-id="atelier"
                      title="${n ? n + ' alerte' + (n > 1 ? 's' : '') : 'Aucune alerte'}">
              ${ic('alerte', 1.9)}${n ? `<span class="pastille">${n}</span>` : ''}
            </button>`;
          })()}
          ${(() => {
            /* La cloche des confrères reste à sa place même quand elle est
               calme : une cloche qui disparaît, on ne sait plus si elle
               n'a rien à dire ou si elle n'existe pas. */
            const n = alertesPro().length;
            return `<button class="btn nu cloche pro ${n ? 'clignote' : ''}" data-act="alertes" data-id="pro"
                      title="${n ? n + ' demande' + (n > 1 ? 's' : '') + ' d\'un garage professionnel'
                                 : 'Aucune demande des garages partenaires'}">
              ${ic('agenda', 1.9)}${n ? `<span class="pastille">${n}</span>` : ''}
            </button>`;
          })()}
        </div>
      </header>

      <main class="plateau ${vue === 'atelier' ? '' : 'centre'}">
        ${retour ? `<button class="btn nu" style="margin-bottom:12px" data-act="aller" data-vue="${retour.vers}">
          ${ic('retour')} ${esc(retour.txt)}</button>` : ''}
        ${titre ? `<div class="titre-page">
            <div><h1>${esc(titre[0])}</h1>${titre[1] ? `<div class="sous">${esc(titre[1])}</div>` : ''}</div>
            <div class="fin">${actionsEcran(vue)}</div>
          </div>` : ''}
        ${VUES2[vue]()}
      </main>
    </div>
    ${/* Le bouton flottant vivait dans la barre du bas : elle est partie, lui
          reste — sur téléphone, « Nouvelle demande » n'a pas d'autre porte. */ ''}
    <button class="fab" data-act="appel">${ic('tel')} Nouvelle demande</button>
    ${S.vue === 'devis-fiche' && DB.devis(S.devisId) ? blocImpression(DB.devis(S.devisId)) : ''}
  `;
  apresRendu();
  sonnerSiNouveau();

  /* La palette est propre à la v2 : on la pose nous-mêmes, et on la REFAIT à
     chaque frappe. Sans ça l'ancienne resterait en place et les résultats ne
     bougeraient jamais — le curseur est replacé juste après. */
  if (S.modale && S.modale.type === 'recherche') {
    document.querySelectorAll('.voile').forEach(v => v.remove());
    const boite = document.createElement('div');
    boite.innerHTML = modaleRecherche();
    if (boite.firstElementChild) document.body.appendChild(boite.firstElementChild);
  }

  // garder le curseur dans la recherche pendant la frappe
  const champ = document.getElementById('rech-modale');
  if (champ) { champ.focus(); champ.setSelectionRange(champ.value.length, champ.value.length); }
  // enchaîner les rappels sans reprendre la souris
  if (S.focusMemoRapide) {
    S.focusMemoRapide = false;
    const rapide = document.getElementById('memo-rapide');
    if (rapide) { rapide.focus(); rapide.setSelectionRange(rapide.value.length, rapide.value.length); }
  }
};

/** Le nom de l'écran où l'on est. Les fiches n'ont pas d'entrée au menu :
 *  elles portent le nom de l'écran dont elles viennent. */
function nomEcran(vue) {
  const m = MENU2.find(x => x.id === vue);
  if (m) return m.nom;
  return { devis: 'Tous les devis', 'devis-fiche': 'Devis', 'client-fiche': 'Clients' }[vue] || 'Menu';
}

/** Les boutons propres à chaque écran, remontés dans le titre. */

  if (vue === 'reglages') {

  if (vue === 'clients' || vue === 'devis') {
    return `<button class="btn plein" data-act="appel">${ic('plus')} Nouvelle demande</button>`;
  }
  if (vue === 'catalogue') {
    return `<button class="btn" data-act="nouvelle-famille">${ic('plus')} Section</button>
            <button class="btn plein" data-act="nouvelle-presta">${ic('plus')} Ligne</button>`;

  if (vue === 'devis-fiche') {
    return `<button class="btn" data-act="export-devis-ebp" data-id="${S.devisId}" title="CSV à reprendre dans EBP">${ic('devis')} EBP</button>

                 title="Supprimer ce client et tout ce qui s'y rattache">${ic('poubelle')}</button>`;

  return '';
}

document.addEventListener('input', (e) => {
  if (e.target.id !== 'rech-modale') return;
  S.rechAccueil = e.target.value;
  rendre();
});

/* Ajout d'un rappel depuis l'accueil.
   Le texte se garde dans l'état pendant la frappe : sans ça, ouvrir le menu
   des types redessinerait le champ et effacerait ce qui vient d'être tapé. */
document.addEventListener('input', (e) => {
  if (e.target.id === 'memo-rapide') S.brouillonMemo = e.target.value;
});

document.addEventListener('submit', (e) => {
  if (e.target.id !== 'form-memo-rapide') return;
  e.preventDefault();
  if (!(S.brouillonMemo || '').trim()) { toast('Écrivez d\'abord le rappel.'); return; }
  S.menuTypeMemo = true;
  rendre();
});

document.addEventListener('click', (e) => {
  const choix = e.target.closest('[data-act="memo-ajouter"]');
  if (choix) {
    const texte = (S.brouillonMemo || '').trim();
    if (texte) {
      DB.etat.memos.unshift({
        id: DB.nouvelId('m'), userId: S.userId, type: choix.dataset.type,
        texte, quand: minuit(Date.now()), fait: false, cree: Date.now()
      });
      DB.sauver();
    }
    S.brouillonMemo = ''; S.menuTypeMemo = false; S.focusMemoRapide = true;
    rendre();
    return;
  }
  // un clic ailleurs referme le menu
  if (S.menuTypeMemo && !e.target.closest('.ancre-menu')) { S.menuTypeMemo = false; rendre(); }
});

(function demarrerV2() {
  try {
    const theme = stock.lire('atelier.theme');
    if (theme) document.documentElement.setAttribute('data-theme', theme);

    DB.charger();

    lireAdresse();

    const qui = stock.lire('atelier.qui');
    if (qui && DB.utilisateur(qui)) S.userId = qui;

    /* Un garage partenaire retrouve sa grille — à condition que son accès soit
       toujours ouvert. Fermé entre-temps, la session ne se rétablit pas. */
    const pro = stock.lire('atelier.pro');
    const cPro = pro ? DB.client(pro) : null;
    if (!S.userId && cPro && DB.estPro(cPro) && cPro.mdp && cPro.mdp.emp) {
      S.proConnecte = pro;
      S.grilleToken = DB.jetonClient(cPro);
    } else if (pro) {
      stock.effacer('atelier.pro');
    }

    /* Porte ouverte : on n'attend personne devant l'écran de connexion — sauf
       si quelqu'un vient justement de rendre la main en verrouillant. */
    if (SANS_CODE && !S.userId && !S.proConnecte && !S.clientToken && !S.grilleToken
        && stock.lire('atelier.rendu') !== '1') {
      S.userId = compteParDefaut();
    }

    S.vue = 'atelier';
    rendre();

    /* Le micro ne s'ouvre de lui-même que si on l'a demandé : un navigateur
       qui réclame l'autorisation dès l'ouverture, sans qu'on ait rien fait,
       est une mauvaise surprise. */
    if (S.userId && DB.etat.reglages.voixAuto && VOIX.dispo()) VOIX.demarrer();
  } catch (e) {
    console.error(e);
    document.getElementById('app').innerHTML =
      '<div class="accueil"><div class="accueil-boite"><div class="carte"><div class="carte-corps pile">'
      + '<h2 style="font-size:18px">L\'outil n\'a pas pu démarrer</h2>'
      + '<p class="mini">' + esc(e.message) + '</p>'
      + '<button class="btn plein" onclick="location.reload()">Réessayer</button>'
      + '</div></div></div></div>';
  }
})();

</script>
</body>
</html>
