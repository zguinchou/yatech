/* ==========================================================================
   ATELIER — feuille de style
   Direction : instrumentation d'atelier. Typo condensée type DIN (celle des
   plaques machine et des panneaux), fond acier, jaune sécurité en accent
   unique. Le vert et le rouge sont RÉSERVÉS à l'état des places de parking
   pour rester lisibles en une seconde depuis l'autre bout de l'atelier.
   ========================================================================== */

/* --- jetons : thème clair (défaut) --------------------------------------- */
:root {
  --fond:        #e9ecef;
  --plan:        #ffffff;
  --plan-2:      #f2f4f6;
  --relief:      #e4e8ec;
  --trait:       #d2d8de;
  --trait-fin:   #e2e7eb;
  --encre:       #10161c;
  --encre-2:     #55646f;
  --encre-3:     #8593a0;

  --accent:      #a35c00;
  --accent-vif:  #d97a06;
  --accent-sur:  #ffffff;
  --accent-voile:#fbf0dd;

  --libre:       #1f8a52;
  --libre-voile: #e2f4ea;
  --occupe:      #c0392f;
  --occupe-voile:#fbe8e6;
  --attente:     #b06d00;
  --attente-voile:#fbf0da;
  --actif:       #1a6fa8;
  --actif-voile: #e3eff8;
  --pret:        #0f7c8a;
  --gros:        #7040c0;   /* gros travaux : immobilisation longue */
  --gros-voile:  #efe8fb;
  --perso:       #55707f;   /* véhicule du personnel : ne rapporte rien, ne presse pas */
  --perso-voile: #e6edf1;
  --mort:        #7b8791;

  --bitume:      #cfd5da;
  --bitume-2:    #c4cbd1;
  --marquage:    #ffffff;   /* la peinture au sol */
  --marquage-txt:#5f6a75;   /* le texte posé dessus, qui doit rester lisible */

  --ombre:       0 1px 2px rgba(16,22,28,.06), 0 8px 24px -12px rgba(16,22,28,.22);
  --ombre-fort:  0 24px 60px -20px rgba(16,22,28,.4);
  --luisant:     rgba(255,255,255,.7);   /* arête haute d'un panneau */

  --din: Bahnschrift, "DIN Alternate", "DIN Condensed", "Roboto Condensed",
         "Segoe UI Semibold", "Helvetica Neue", system-ui, sans-serif;
  --texte: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --chiffre: "Cascadia Mono", "SF Mono", ui-monospace, Consolas, "Roboto Mono", monospace;

  --r: 4px;
  --r-l: 8px;
  --rail: 232px;
}

/* --- jetons : thème sombre ----------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root {
    /* Un noir pur écrase tout : les cartes ne se détachent plus, les bords
       disparaissent. On remonte le fond d'un cran et on éclaircit le plan
       d'autant — chaque carte redevient un objet posé sur un établi. */
    --fond:        #10151a;
    --plan:        #1a2027;
    --plan-2:      #20272e;
    --relief:      #283038;
    --trait:       #313a43;
    --trait-fin:   #262e36;
    --encre:       #e7edf2;
    --encre-2:     #97a4b0;
    --encre-3:     #667381;

    --accent:      #ffb020;
    --accent-vif:  #ffc44d;
    --accent-sur:  #1a1204;
    --accent-voile:#2c2413;

    --libre:       #3fc07e;
    --libre-voile: #14301f;
    --occupe:      #ef5f52;
    --occupe-voile:#331715;
    --attente:     #f2a63a;
    --attente-voile:#312211;
    --actif:       #4fa3e0;
    --actif-voile: #12242f;
    --pret:        #2fbccb;
    --gros:        #b07cf5;
    --gros-voile:  #251a3a;
    --perso:       #8fa3b8;
    --perso-voile: #1c262e;
    --mort:        #64717d;

    --bitume:      #262d33;
    --bitume-2:    #1f262b;
    --marquage:    #7d8b96;
    --marquage-txt:#a9b6c1;

    --ombre:       0 1px 0 rgba(255,255,255,.03), 0 10px 30px -14px rgba(0,0,0,.8);
    --ombre-fort:  0 30px 70px -20px rgba(0,0,0,.85);
    --luisant:     rgba(255,255,255,.055);
  }
}

/* le sélecteur du visualiseur doit gagner dans les deux sens */
:root[data-theme="dark"] {
  --fond:#10151a; --plan:#1a2027; --plan-2:#20272e; --relief:#283038;
  --trait:#313a43; --trait-fin:#262e36;
  --encre:#e7edf2; --encre-2:#97a4b0; --encre-3:#667381;
  --accent:#ffb020; --accent-vif:#ffc44d; --accent-sur:#1a1204; --accent-voile:#2c2413;
  --libre:#3fc07e; --libre-voile:#14301f; --occupe:#ef5f52; --occupe-voile:#331715;
  --attente:#f2a63a; --attente-voile:#312211; --actif:#4fa3e0; --actif-voile:#12242f;
  --pret:#2fbccb; --mort:#64717d;
  --gros:#b07cf5; --gros-voile:#251a3a; --perso:#8fa3b8; --perso-voile:#1c262e;
  --bitume:#262d33; --bitume-2:#1f262b; --marquage:#7d8b96; --marquage-txt:#a9b6c1;
  --ombre:0 1px 0 rgba(255,255,255,.03), 0 10px 30px -14px rgba(0,0,0,.8);
  --ombre-fort:0 30px 70px -20px rgba(0,0,0,.85);
  --luisant:rgba(255,255,255,.055);
}
:root[data-theme="light"] {
  --fond:#e9ecef; --plan:#ffffff; --plan-2:#f2f4f6; --relief:#e4e8ec;
  --trait:#d2d8de; --trait-fin:#e2e7eb;
  --encre:#10161c; --encre-2:#55646f; --encre-3:#8593a0;
  --accent:#a35c00; --accent-vif:#d97a06; --accent-sur:#ffffff; --accent-voile:#fbf0dd;
  --libre:#1f8a52; --libre-voile:#e2f4ea; --occupe:#c0392f; --occupe-voile:#fbe8e6;
  --attente:#b06d00; --attente-voile:#fbf0da; --actif:#1a6fa8; --actif-voile:#e3eff8;
  --pret:#0f7c8a; --mort:#7b8791;
  --gros:#7040c0; --gros-voile:#efe8fb; --perso:#55707f; --perso-voile:#e6edf1;
  --bitume:#cfd5da; --bitume-2:#c4cbd1; --marquage:#ffffff; --marquage-txt:#5f6a75;
  --ombre:0 1px 2px rgba(16,22,28,.06), 0 8px 24px -12px rgba(16,22,28,.22);
  --ombre-fort:0 24px 60px -20px rgba(16,22,28,.4);
  --luisant:rgba(255,255,255,.7);
}

/* --- les bords de l'écran d'un téléphone ---------------------------------
   Ajouté à l'écran d'accueil, l'outil occupe tout l'écran de l'iPhone, barre
   d'état comprise : sans ces marges, le nom de l'atelier s'écrit par-dessus
   l'heure et la barre du bas passe sous le trait tactile. On range les quatre
   retraits dans des variables : le reste de la feuille s'en sert sans jamais
   réécrire env(), et on peut les simuler pour vérifier la mise en page. */
:root {
  --sur-haut:   env(safe-area-inset-top, 0px);
  --sur-bas:    env(safe-area-inset-bottom, 0px);
  --sur-gauche: env(safe-area-inset-left, 0px);
  --sur-droite: env(safe-area-inset-right, 0px);
}

/* --- base ---------------------------------------------------------------- */
* { box-sizing: border-box; }
html, body { height: 100%; }
html {
  /* Safari grossit tout seul le texte au passage en paysage : on le lui interdit,
     sinon les tableaux du parc débordent d'un coup. */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
body {
  margin: 0;
  /* une lueur chaude tombant du haut, comme une baladeuse au-dessus du plan */
  background-color: var(--fond);
  background-image: radial-gradient(120% 70% at 50% -8%,
    color-mix(in srgb, var(--accent) 6%, transparent), transparent 62%);
  background-attachment: fixed;
  color: var(--encre);
  font-family: var(--texte);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: none; padding: 0; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--trait); border-radius: 6px; border: 3px solid var(--fond); }
::-webkit-scrollbar-track { background: transparent; }

h1, h2, h3, h4 { font-family: var(--din); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: .01em; }
.num { font-family: var(--chiffre); font-variant-numeric: tabular-nums; }

.etiq {
  font-family: var(--din);
  font-size: 11px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--encre-3);
}

/* --- structure ----------------------------------------------------------- */
#app { min-height: 100%; }
.coque { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }

/* --- rail de navigation --------------------------------------------------- */
.rail {
  background: var(--plan);
  border-right: 1px solid var(--trait);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.rail-marque {
  padding: 18px 18px 16px;
  border-bottom: 1px solid var(--trait-fin);
  display: flex; align-items: center; gap: 11px;
}
.logo {
  width: 36px; height: 36px; flex: none; border-radius: 9px;
  background: var(--accent); color: var(--accent-sur);
  display: grid; place-items: center; padding: 4px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.2);
}
.logo svg { width: 100%; height: 100%; }
.rail-marque b { font-family: var(--din); font-size: 16px; font-weight: 600; display: block; line-height: 1.15; }
.rail-marque span { font-size: 11px; color: var(--encre-3); }

.rail nav { padding: 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; overflow-y: auto; }
.rail nav .etiq { padding: 14px 10px 6px; }
.lien {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r);
  color: var(--encre-2); font-size: 13.5px; text-align: left; width: 100%;
  transition: background .12s, color .12s;
  position: relative;
}
/* le repère d'un tableau de bord : une barre à gauche de la ligne active */
.lien.on::before {
  content: ""; position: absolute; left: -10px; top: 5px; bottom: 5px; width: 3px;
  background: var(--accent); border-radius: 0 2px 2px 0;
}
.lien svg { flex: none; width: 17px; height: 17px; opacity: .8; }
.lien:hover { background: var(--plan-2); color: var(--encre); }
.lien.on { background: var(--accent-voile); color: var(--accent); font-weight: 600; }
.lien.on svg { opacity: 1; }
.lien .pastille {
  margin-left: auto; min-width: 19px; height: 19px; padding: 0 5px;
  border-radius: 10px; background: var(--occupe); color: #fff;
  font-family: var(--chiffre); font-size: 11px; font-weight: 700;
  display: grid; place-items: center;
}
.lien.on .pastille { background: var(--accent); color: var(--accent-sur); }

.rail-pied { border-top: 1px solid var(--trait-fin); padding: 10px; }
.moi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: var(--r); }
.moi:hover { background: var(--plan-2); }
.jeton {
  width: 28px; height: 28px; flex: none; border-radius: 50%;
  display: grid; place-items: center;
  font-family: var(--din); font-size: 13px; font-weight: 700; color: #fff;
  background: hsl(var(--teinte, 38) 55% 42%);
}
.moi div { text-align: left; line-height: 1.2; overflow: hidden; }
.moi b { font-size: 13px; font-weight: 600; }
.moi small { display: block; font-size: 10.5px; color: var(--encre-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* --- zone principale ------------------------------------------------------ */
.vue { min-width: 0; display: flex; flex-direction: column; }
.barre {
  position: sticky; top: 0; z-index: 30;
  background: color-mix(in srgb, var(--fond) 88%, transparent);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--trait);
  padding: 14px 26px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.barre h1 { font-size: 24px; letter-spacing: -.004em; line-height: 1.1; }
.barre .sous { font-size: 12.5px; color: var(--encre-3); margin-top: 2px; }
.barre .pousse { margin-left: auto; }
.corps { padding: 22px 26px 60px; flex: 1; }
.large { max-width: 1180px; }

/* --- boutons -------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 13px; border-radius: var(--r);
  border: 1px solid var(--trait); background: var(--plan);
  font-size: 13px; font-weight: 500; color: var(--encre);
  transition: background .12s, border-color .12s, transform .06s;
  white-space: nowrap;
}
.btn:hover { background: var(--plan-2); border-color: var(--encre-3); }
.btn:active { transform: translateY(1px); }
.btn svg { width: 15px; height: 15px; }
.btn.plein {
  background: var(--accent); border-color: var(--accent); color: var(--accent-sur); font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.22), inset 0 -1px 0 rgba(0,0,0,.14);
}
.btn.plein:hover { background: var(--accent-vif); border-color: var(--accent-vif); }
.btn.nu { border-color: transparent; background: none; color: var(--encre-2); }
.btn.nu:hover { background: var(--plan-2); color: var(--encre); }
.btn.danger { color: var(--occupe); border-color: color-mix(in srgb, var(--occupe) 35%, transparent); }
.btn.danger:hover { background: var(--occupe-voile); }
/* Le geste qu'on ne fait qu'une fois et qui compte — annuler son rendez-vous —
   se voit de loin : il est seul sur sa page. */
.btn.danger.plein {
  background: var(--occupe); border-color: var(--occupe); color: #fff;
}
.btn.danger.plein:hover { background: color-mix(in srgb, var(--occupe) 85%, #000); }
.btn.grand { padding: 11px 18px; font-size: 14.5px; }
.btn[disabled] { opacity: .45; pointer-events: none; }

/* --- cartes --------------------------------------------------------------- */
.carte {
  background: var(--plan); border: 1px solid var(--trait);
  border-radius: var(--r-l); box-shadow: var(--ombre);
  position: relative;
}
/* l'arête haute qui donne son épaisseur à un panneau */
.carte::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; box-shadow: inset 0 1px 0 var(--luisant);
}
.carte-tete {
  padding: 12px 16px; border-bottom: 1px solid var(--trait-fin);
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  min-height: 46px;
}
/* Le titre d'une carte est une étiquette, pas un titre de chapitre : petite
   capitale espacée, comme sur un panneau de machine. Toutes les cartes le
   portent pareil — l'œil apprend une fois où regarder. */
.carte-tete h2 {
  white-space: nowrap;
  font-size: 11.5px; font-weight: 700; letter-spacing: .11em;
  text-transform: uppercase; color: var(--encre-2);
}
.carte-tete .pousse { margin-left: auto; }
.carte-corps { padding: 16px; }

.grille { display: grid; gap: 16px; }
.grille > * { min-width: 0; }
.g-stats { grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); }
.g-2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.g-3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }

/* --- tuiles chiffres ------------------------------------------------------ */
.tuile {
  background: var(--plan); border: 1px solid var(--trait);
  border-radius: var(--r-l); padding: 14px 15px;
  display: flex; flex-direction: column; gap: 3px;
  position: relative; overflow: hidden; text-align: left;
  box-shadow: var(--ombre);
}
.tuile::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: var(--ton, var(--trait));
}
.tuile::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit;
  pointer-events: none; box-shadow: inset 0 1px 0 var(--luisant);
}
.tuile::before { transition: width .14s; }
.tuile .val { font-family: var(--din); font-size: 32px; font-weight: 700; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.tuile .val small { font-size: 15px; font-weight: 600; color: var(--encre-3); letter-spacing: 0; }
.tuile .leg { font-size: 12px; color: var(--encre-2); }
button.tuile { cursor: pointer; transition: border-color .12s, transform .08s; }
button.tuile:hover { border-color: color-mix(in srgb, var(--ton, var(--encre-3)) 55%, transparent); transform: translateY(-1px); }
button.tuile:hover::before { width: 5px; }
button.tuile:active { transform: translateY(0); }

/* --- badges d'état -------------------------------------------------------- */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 3px;
  font-family: var(--din); font-size: 11.5px; font-weight: 600;
  letter-spacing: .045em; text-transform: uppercase; white-space: nowrap;
  border: 1px solid transparent;
}
.badge::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
.t-ok      { color: var(--libre);   background: var(--libre-voile);   border-color: color-mix(in srgb, var(--libre) 25%, transparent); }
.t-urgent  { color: var(--occupe);  background: var(--occupe-voile);  border-color: color-mix(in srgb, var(--occupe) 25%, transparent); }
.t-attente { color: var(--attente); background: var(--attente-voile); border-color: color-mix(in srgb, var(--attente) 25%, transparent); }
.t-info,
.t-actif   { color: var(--actif);   background: var(--actif-voile);   border-color: color-mix(in srgb, var(--actif) 25%, transparent); }
.t-gros    { color: var(--gros);    background: var(--gros-voile);    border-color: color-mix(in srgb, var(--gros) 30%, transparent); }
.t-perso   { color: var(--perso);   background: var(--perso-voile);   border-color: color-mix(in srgb, var(--perso) 30%, transparent); }
.t-neutre  { color: var(--encre-2); background: var(--plan-2);        border-color: var(--trait); }
.t-mort,
.t-fini    { color: var(--mort);    background: var(--plan-2);        border-color: var(--trait); }

/* --- listes / tableaux ---------------------------------------------------- */
.deroule { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
thead th {
  text-align: left; padding: 9px 14px;
  font-family: var(--din); font-size: 11px; letter-spacing: .09em; text-transform: uppercase;
  color: var(--encre-3); font-weight: 600;
  border-bottom: 1px solid var(--trait); white-space: nowrap;
}
tbody td { padding: 11px 14px; border-bottom: 1px solid var(--trait-fin); vertical-align: middle; }
tbody tr:last-child td { border-bottom: none; }
tbody tr.cliquable { cursor: pointer; }
tbody tr.cliquable:hover td { background: var(--plan-2); }
td.droite, th.droite { text-align: right; }
.plaque {
  font-family: var(--chiffre); font-size: 12px; font-weight: 600; letter-spacing: .02em;
  padding: 2px 6px; border: 1px solid var(--trait); border-radius: 3px;
  background: var(--plan-2); white-space: nowrap;
}
/* En grand, l'immatriculation est dessinée comme la plaque elle-même. */
.plaque.grande {
  font-size: 15px; letter-spacing: .06em; font-weight: 700;
  padding: 5px 11px 5px 20px; border-radius: 4px;
  background: #f4f4f1; color: #12161a; border-color: #98a1a9;
  position: relative; box-shadow: 0 1px 2px rgba(0,0,0,.25);
}
.plaque.grande::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 13px;
  background: #0b3ea8; border-radius: 3px 0 0 3px;
}
.plaque.grande::after {
  content: "F"; position: absolute; left: 2.5px; bottom: 2px;
  font-family: var(--din); font-size: 8px; font-weight: 700; color: #fff;
}
.ligne-titre { font-weight: 600; }
.ligne-sous { font-size: 12px; color: var(--encre-3); }

/* liste compacte — préférée au tableau dans les colonnes étroites */
.liste { display: flex; flex-direction: column; }
.item {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 11px; width: 100%; text-align: left;
  padding: 11px 16px; border-bottom: 1px solid var(--trait-fin);
  transition: background .12s;
}
.item:last-child { border-bottom: none; }
.item:hover { background: var(--plan-2); }
.item-txt { min-width: 0; }
.item-txt b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-txt small { display: block; font-size: 12px; color: var(--encre-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; white-space: nowrap; }

/* --- formulaires ---------------------------------------------------------- */
.champ { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.champ > label { font-family: var(--din); font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--encre-3); }
.saisie {
  width: 100%; padding: 9px 11px; border-radius: var(--r);
  border: 1px solid var(--trait); background: var(--plan-2); color: var(--encre);
  transition: border-color .12s, background .12s;
}
.saisie:focus { outline: none; border-color: var(--accent); background: var(--plan); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.saisie::placeholder { color: var(--encre-3); }
textarea.saisie { resize: vertical; min-height: 76px; line-height: 1.5; }
select.saisie { appearance: none; background-image: none; padding-right: 30px; cursor: pointer; }
.champ-duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.aide { font-size: 12px; color: var(--encre-3); }

.segments { display: inline-flex; background: var(--plan-2); border: 1px solid var(--trait); border-radius: var(--r); padding: 2px; gap: 2px; }
.segments button {
  padding: 5px 11px; border-radius: 3px; font-size: 12.5px; color: var(--encre-2);
  font-family: var(--din); letter-spacing: .03em;
}
.segments button.on { background: var(--plan); color: var(--encre); font-weight: 600; box-shadow: var(--ombre); }

/* --- barre de recherche ---------------------------------------------------- */
.chercher {
  display: flex; align-items: center; gap: 8px;
  background: var(--plan); border: 1px solid var(--trait); border-radius: var(--r-l);
  padding: 4px 12px; box-shadow: var(--ombre); max-width: 620px;
}
.chercher:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.chercher svg { width: 17px; height: 17px; flex: none; color: var(--encre-3); }
.chercher .saisie {
  border: none; background: none; padding: 9px 0; font-size: 15px;
}
.chercher .saisie:focus { outline: none; box-shadow: none; background: none; }

.type-pin[data-t="pro"] { color: var(--pret); border-color: color-mix(in srgb, var(--pret) 45%, transparent); font-size: 9px; margin-left: 6px; }

/* --- filtres -------------------------------------------------------------- */
.filtres { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.puce {
  padding: 5px 11px; border-radius: 20px; border: 1px solid var(--trait);
  background: var(--plan); font-size: 12.5px; color: var(--encre-2);
  display: inline-flex; align-items: center; gap: 6px;
}
.puce:hover { border-color: var(--encre-3); color: var(--encre); }
.puce.on { background: var(--encre); color: var(--fond); border-color: var(--encre); font-weight: 600; }
.puce .n { font-family: var(--chiffre); font-size: 11px; opacity: .65; }

/* ==========================================================================
   PLANNING
   Une grille : une colonne par personne, une bande par jour.
   ========================================================================== */
/* Un agenda de semaine : les jours en colonnes sur une seule ligne, le temps
   qui descend. Le cadre glisse latéralement quand l'écran est trop étroit —
   c'est lui qui défile, jamais la page. */
.planning-cadre {
  overflow-x: auto; overflow-y: hidden;
  border-radius: var(--r-l); box-shadow: var(--ombre);
  -webkit-overflow-scrolling: touch;
}
.planning {
  display: grid; align-content: start;
  grid-template-columns: 62px repeat(var(--jours, 6), minmax(112px, 1fr));
  gap: 1px;
  background: var(--trait);
  border: 1px solid var(--trait);
  border-radius: var(--r-l);
  overflow: hidden;
  min-width: max-content;
}
.pl-jour {
  background: var(--plan-2); padding: 8px 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  text-align: center;
}
.pl-jour b { font-family: var(--din); font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.pl-jour span { font-size: 11px; color: var(--encre-3); line-height: 1.2; }
.pl-jour.jour-j { background: var(--accent-voile); }
.pl-jour.jour-j b { color: var(--accent); }

/* --- l'échelle des heures, à gauche ----------------------------------------
   L'ouverture en haut, la fermeture en bas. Une boîte prend sa vraie hauteur
   dans sa demi-journée : voir les trous devient immédiat. */
.pl-coin { background: var(--plan-2); }
/* La colonne des heures ne part pas quand on fait glisser la semaine : sans
   elle, on ne saurait plus à quelle heure on regarde. */
.pl-coin, .pl-rail { position: sticky; left: 0; z-index: 6; }
.pl-rail {
  background: var(--plan-2);
  height: calc(var(--heures) * var(--pas-h));
}
/* Le nom de la demi-journée se lit debout, dans la marge : il tient en 18 px
   là où « S1 » couché mangerait la moitié de l'échelle. */
.pl-demi {
  position: absolute; left: 0; top: 0; bottom: 0; width: 18px;
  display: flex; align-items: center; justify-content: center;
  writing-mode: vertical-rl; transform: rotate(180deg);
  background: color-mix(in srgb, var(--accent) 8%, var(--plan-2));
  border-right: 1px solid var(--trait);
  font-family: var(--din); font-size: 11px; font-weight: 700;
  letter-spacing: .12em; color: var(--accent);
}
.pl-h {
  position: absolute; right: 8px; top: var(--y); transform: translateY(-50%);
  font-family: var(--chiffre); font-size: 11px; color: var(--encre-3);
  white-space: nowrap; font-variant-numeric: tabular-nums;
}
/* Aux deux bouts, l'heure se range à l'intérieur : à cheval sur le bord, elle
   serait coupée en deux. */
.pl-h.haut { transform: none; margin-top: 3px; }
.pl-h.bas { transform: translateY(-100%); margin-top: -3px; }
.pl-h.haut, .pl-h.bas { color: var(--encre-2); font-weight: 700; }

/* Une heure vaut la même hauteur partout : c'est ce qui rend les trous
   comparables d'un jour à l'autre. */
/* Repli si rien n'est posé à la volée : une heure vaut 62 px. */
.planning { --pas-h: 62px; }
.pl-piste {
  position: relative; background: var(--plan);
  height: calc(var(--heures) * var(--pas-h));
  overflow: hidden;
}
.pl-piste.jour-j { background: color-mix(in srgb, var(--accent) 4%, var(--plan)); }
/* La coupure du midi n'est plus un trait dans la frise : c'est le bord entre
   les deux moitiés de la journée. Il se voit. */
.pl-piste.coupe, .pl-rail.coupe { border-top: 2px solid var(--trait); }
/* Ce qui est derrière nous se relit, mais ne se planifie plus. */
.pl-jour.passe, .pl-piste.passe { opacity: .62; }

/* --- les heures où l'atelier n'ouvre pas ----------------------------------
   Hachurées, jamais effacées : un trou sans explication ressemble à un créneau
   libre, et c'est comme ça qu'on promet une heure qu'on ne tiendra pas. */
.pl-ferme {
  position: absolute; left: 0; right: 0; top: var(--y); height: var(--h);
  background: repeating-linear-gradient(135deg,
    var(--trait-fin) 0 6px, transparent 6px 12px);
  opacity: .85; pointer-events: none; z-index: 1;
  display: flex; align-items: center; justify-content: center;
}
.pl-ferme i {
  font-style: normal; font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase;
  color: var(--encre-3); background: var(--plan); border: 1px solid var(--trait);
  border-radius: 999px; padding: 2px 8px; max-width: 92%; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.pl-piste.ferme { background: var(--fond); }
.pl-jour.clos b, .pl-jour.clos span { color: var(--encre-3); }
.pl-charge.clos { background: var(--relief); color: var(--encre-3); }

/* les heures pleines, en fond : des repères, pas un quadrillage */
.pl-trait {
  position: absolute; top: var(--y); left: 0; right: 0; height: 1px;
  background: var(--trait-fin);
}
/* l'instant présent */
.pl-maintenant {
  position: absolute; top: var(--y); left: 0; right: 0; height: 2px;
  background: var(--occupe); z-index: 3;
}
.pl-maintenant::before {
  content: ''; position: absolute; top: 50%; left: 0; transform: translate(-2px, -50%);
  width: 7px; height: 7px; border-radius: 50%; background: var(--occupe);
}

/* Deux rendez-vous qui se chevauchent se partagent la largeur du jour : aucun
   ne disparaît sous l'autre. */
.pl-bloc {
  position: absolute; top: var(--y); height: var(--h); min-height: 26px;
  left: calc(var(--c) * (100% / var(--n))); width: calc(100% / var(--n));
  display: flex; flex-direction: column; justify-content: flex-start; gap: 1px;
  padding: 4px 7px; text-align: left; overflow: hidden;
  border-radius: var(--r); border: 1px solid transparent;
  border-left: 3px solid hsl(var(--teinte, 220) 55% 45%);
  background: color-mix(in srgb, hsl(var(--teinte, 220) 55% 45%) 13%, var(--plan));
  cursor: pointer; transition: transform .06s, box-shadow .12s;
  z-index: 2;
}
.pl-bloc:hover { box-shadow: var(--ombre); z-index: 4; }
.pl-bloc:active { transform: translateY(1px); }
.pl-bloc.pont { box-shadow: inset 0 0 0 1px hsl(var(--teinte, 220) 55% 45% / .45); }
.pl-bloc.fini { opacity: .5; }
/* Rendu par le client : la place est libre, mais le trou garde son explication.
   Barré et hachuré, il ne se confond ni avec un créneau tenu ni avec du vide. */
.pl-bloc.annule {
  opacity: .55;
  border-style: dashed;
  background: repeating-linear-gradient(135deg,
    color-mix(in srgb, var(--occupe) 9%, var(--plan)) 0 5px, var(--plan) 5px 10px);
}
.pl-bloc.annule .pl-bloc-t, .pl-bloc.annule .pl-bloc-h { text-decoration: line-through; }
/* Posé hors des heures ouvertes : la boîte n'a pas de place sur la frise, on
   la borde en pointillé pour que l'anomalie se voie. */
.pl-bloc.hors { border: 1px dashed var(--occupe); border-left-width: 3px; }
.pl-bloc.fini .pl-bloc-t { text-decoration: line-through; }
/* Commencé ici, fini après : le bas s'ouvre plutôt que de faire croire que
   l'intervention s'arrête à midi. */
.pl-bloc.deborde {
  border-bottom: 2px dashed hsl(var(--teinte, 220) 55% 45%);
  border-bottom-left-radius: 0; border-bottom-right-radius: 0;
}
.pl-bloc-tete { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.pl-bloc-h {
  font-family: var(--chiffre); font-size: 10.5px; font-weight: 700; flex: none;
  color: hsl(var(--teinte, 220) 55% 38%); line-height: 1.2;
}
.pl-bloc-t {
  font-size: 12px; font-weight: 600; color: var(--encre); line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.pl-bloc-s {
  font-size: 10.5px; color: var(--encre-2); line-height: 1.2;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
/* Étroite, une boîte laisse tomber ce qui ne tient pas : d'abord la
   prestation, puis le nom. L'heure reste toujours. */
/* Deux rendez-vous en même temps se partagent la colonne : chaque boîte est
   alors deux fois plus étroite. Les seuils se mesurent donc sur la boîte
   elle-même, jamais sur la journée. */
.pl-bloc { container-type: size; }
@container (max-width: 66px) { .pl-bloc-s { display: none; } }
@container (max-height: 34px) { .pl-bloc-s { display: none; } }
@container (max-width: 44px) { .pl-bloc-t { display: none; } }

.pl-libre {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--din); font-size: 10.5px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--libre); pointer-events: none;
}
.pl-charge {
  margin-top: 2px; font-family: var(--chiffre); font-size: 10.5px;
  color: var(--encre-3); font-variant-numeric: tabular-nums;
}
.pl-charge.plein { color: var(--occupe); font-weight: 700; }
.pl-charge.libre { color: var(--libre); font-family: var(--din); font-size: 10.5px;
  letter-spacing: .08em; text-transform: uppercase; }
.pl-plus {
  position: absolute; right: 6px; top: 6px; z-index: 5;
  width: 26px; height: 26px; border-radius: 50%;
  border: 1px dashed var(--trait); color: var(--encre-3);
  display: grid; place-items: center;
  opacity: 0; transition: opacity .12s, border-color .12s, color .12s;
}
.pl-plus svg { width: 14px; height: 14px; }
.pl-piste:hover .pl-plus, .pl-plus:focus-visible { opacity: 1; }
/* Un écran tactile ne survole rien, et des mains sales ne visent pas un cercle
   de 26 px : la demi-journée entière devient le bouton, le « + » se contentant
   d'en marquer le coin. Les rendez-vous posés passent au-dessus — on peut
   toujours en ouvrir un. */
@media (hover: none) {
  .pl-plus {
    opacity: 1; z-index: 1; inset: 0; width: auto; height: auto;
    border: 0; border-radius: 0; padding: 5px;
    place-items: start end; color: var(--encre-3);
  }
  .pl-plus:hover { border: 0; }
}
.pl-plus:hover { border-color: var(--accent); color: var(--accent); border-style: solid; }

/* Une ligne d'appel : le nom, puis les gestes, tous sur la même ligne. Les
   icônes ne se replient pas — quatre boutons empilés à droite d'un nom, on ne
   sait plus lequel va avec quoi. */
.journal-appel { display: flex; align-items: center; gap: 2px; flex-wrap: nowrap; }
.journal-appel > a, .journal-appel > button {
  flex: none; width: 34px; height: 34px; padding: 0;
  display: inline-flex; align-items: center; justify-content: center;
}
.journal-appel svg { width: 17px; height: 17px; }
.journal-appel.fait { opacity: .5; }
.journal-appel.fait b { text-decoration: line-through; }
@media (max-width: 720px) {
  .journal-appel > a, .journal-appel > button { width: 40px; height: 40px; }
}

/* --- l'appel entrant -------------------------------------------------------
   Ça sonne, et il faut lire de loin : le nom en gros, la raison probable
   juste dessous, en couleur selon l'urgence. */
.appel-sonne {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--din); font-size: 11px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase; color: var(--accent);
  margin-bottom: 3px;
}
.appel-sonne svg { width: 15px; height: 15px; animation: sonne 1.4s ease-in-out infinite; }
@keyframes sonne {
  0%, 100% { transform: rotate(0); }
  10%, 30% { transform: rotate(-12deg); }
  20%, 40% { transform: rotate(12deg); }
  50% { transform: rotate(0); }
}
@media (prefers-reduced-motion: reduce) { .appel-sonne svg { animation: none; } }
.modale.appel-entrant { border-top: 3px solid var(--accent); }
.appel-raison {
  display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
  padding: 8px 11px; border-radius: var(--r);
  border: 1px solid var(--trait); background: var(--plan-2);
  border-left: 3px solid var(--encre-3);
}
.appel-raison b { font-size: 13px; }
.appel-raison span { font-size: 12.5px; color: var(--encre-2); }
.appel-raison.t-actif   { border-left-color: var(--accent); }
.appel-raison.t-ok      { border-left-color: var(--libre); }
.appel-raison.t-attente { border-left-color: var(--attente); }
.appel-raison.t-urgent  { border-left-color: var(--occupe); }
.appel-raison.t-urgent b { color: var(--occupe); }

/* Un créneau rendu par un client. Il se lit en haut du planning, bordé de la
   couleur des choses qui demandent un regard — pas une alarme, une nouvelle. */
.carte.annulations { border-color: color-mix(in srgb, var(--occupe) 40%, var(--trait)); }
.carte.annulations .carte-tete h2 { color: var(--occupe); }
.annul-ligne {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: var(--r);
  border: 1px solid var(--trait); background: var(--plan-2);
}
.annul-ligne > div:first-child { flex: 1; min-width: 0; }
@media (max-width: 720px) {
  .annul-ligne { flex-wrap: wrap; }
  .annul-ligne > div:first-child { flex-basis: 100%; }
}

/* Qui porte quelle couleur. Le nom reste écrit : deux teintes voisines, un
   écran d'atelier mal réglé, un daltonien — la couleur seule ne dit rien. */
.pl-legende { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
.pl-leg {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 5px 11px 5px 6px; border-radius: 999px;
  border: 1px solid var(--trait); background: var(--plan);
  font-size: 12.5px; color: var(--encre-2);
}
.pl-leg:first-child { padding-left: 11px; }
.pl-leg:hover { border-color: var(--encre-3); color: var(--encre); }
.pl-leg.on { border-color: var(--accent); color: var(--encre); box-shadow: var(--ombre); }
.emplacement {
  font-family: var(--din); font-size: 9px; letter-spacing: .1em;
  padding: 1px 5px; border-radius: 2px;
  border: 1px solid var(--trait); color: var(--encre-3);
}
.emplacement.pont { color: var(--actif); border-color: color-mix(in srgb, var(--actif) 45%, transparent); }

.a-poser {
  border: 1px solid var(--trait); border-left: 3px solid var(--libre);
  border-radius: 0 var(--r) var(--r) 0; background: var(--plan-2);
  padding: 8px 12px; text-align: left; max-width: 280px;
  transition: border-color .12s, transform .06s;
}
.a-poser:hover { border-color: var(--accent); }
.a-poser:active { transform: translateY(1px); }
.a-poser b { display: block; font-size: 13px; font-weight: 600; }
.a-poser span { display: block; font-size: 11.5px; color: var(--encre-3); margin-top: 2px; }

/* ==========================================================================
   PARKING
   ========================================================================== */
/* Bande du haut : côté du parc à gauche, réglages de vue à droite. */
.parc-controles { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
.parc-controles .segments {
  flex: none;
  background: color-mix(in srgb, var(--plan) 90%, transparent);
  box-shadow: var(--ombre);
}

/* Bande du bas : les couleurs, alignées à gauche, sur une ligne qui défile. */
.parc-filtres {
  display: flex; gap: 6px; align-items: center;
  overflow-x: auto; scrollbar-width: none; padding-bottom: 2px;
}
.parc-filtres::-webkit-scrollbar { display: none; }
.parc-filtres .puce {
  flex: none; white-space: nowrap;
  background: color-mix(in srgb, var(--plan) 90%, transparent);
  box-shadow: var(--ombre);
}
.pastille-ton {
  width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none;
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--encre) 18%, transparent);
}
.segments button .pastille-ton { margin-right: 5px; vertical-align: -1px; }

.parc-outils { display: flex; gap: 10px 16px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.legende { display: flex; gap: 6px 16px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--encre-2); min-width: 0; }
.legende b { font-family: var(--din); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--encre-3); font-weight: 600; }
.legende i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 5px; vertical-align: -1px; }
.legende .sep-v { width: 1px; height: 14px; background: var(--trait); }

/* Le bloc du parc : trois bandes empilées, aucune superposition.
   Les réglages ne sont plus posés PAR-DESSUS la zone qui défile — sans quoi
   des places passaient dessous et devenaient impossibles à cliquer. */
.parc-bloc {
  background:
    radial-gradient(120% 90% at 50% 0%, color-mix(in srgb, var(--plan) 55%, transparent), transparent 72%),
    var(--bitume-2);
  border: 1px solid var(--trait); border-radius: var(--r-l);
  box-shadow: var(--ombre);
  padding: 12px;
  display: flex; flex-direction: column; gap: 10px;
}
.parc-cadre {
  background: none; border: none; box-shadow: none; padding: 0;
  overflow: auto; position: relative;
}
/* Projection axonométrique (sans point de fuite) : toutes les places gardent
   la même taille, ce qui compte plus ici que l'effet de profondeur. */
/* « safe center » : centré tant que ça rentre, calé à gauche dès que ça
   déborde — sinon le bord gauche devient inatteignable au défilement. */
.scene { display: grid; place-items: safe center; }
/* La boîte du plan une fois incliné : évite que les coins débordent du cadre. */
.cadre3d { position: relative; transform-style: preserve-3d; }

/* L'inclinaison est portée par deux variables : tout ce qui doit rester face
   caméra (étiquettes, pastilles) applique simplement la rotation inverse. */
.sol {
  position: absolute; left: 50%; top: 50%;
  transform-style: preserve-3d;
  transition: transform .45s cubic-bezier(.22,.75,.25,1);
  border-radius: 3px;
  background:
    repeating-linear-gradient(94deg, transparent 0 22px, color-mix(in srgb, #000 6%, transparent) 22px 23px),
    var(--bitume);
  box-shadow: 0 0 0 1px color-mix(in srgb, var(--marquage) 16%, transparent) inset;
  --rx: 0deg; --rz: 0deg;
}
.sol.iso  { --rx: 52deg; --rz: 0deg; transform: translate(-50%, -50%) scale(var(--z, 1)) rotateX(var(--rx)) rotateZ(var(--rz)); }
.sol.plan { transform: translate(-50%, -50%) scale(var(--z, 1)); }
.face-cam { transform: rotateZ(calc(-1 * var(--rz))) rotateX(calc(-1 * var(--rx))) scale(calc(1 / var(--z, 1))); }

/* — la place : de la peinture au sol — */
.place {
  position: absolute;
  transform-style: preserve-3d;
  border: 2px solid color-mix(in srgb, var(--marquage) 50%, transparent);
  border-top-width: 0;
  cursor: pointer;
  transition: background .18s, border-color .18s;
}
.place[data-etat="libre"]  { background: color-mix(in srgb, var(--libre) 26%, transparent);  border-color: color-mix(in srgb, var(--libre) 75%, transparent); }
.place[data-etat="occupe"] { background: color-mix(in srgb, var(--occupe) 30%, transparent); border-color: color-mix(in srgb, var(--occupe) 70%, transparent); }
.place:hover { background: color-mix(in srgb, var(--accent) 40%, transparent); border-color: var(--accent); }
.place.choisie { background: color-mix(in srgb, var(--accent) 52%, transparent); border-color: var(--accent); }
.place.cible { animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 65%, transparent); } 50% { box-shadow: 0 0 0 8px transparent; } }

.place-num {
  position: absolute; left: 5px; bottom: 4px;
  font-family: var(--chiffre); font-size: 10px; font-weight: 700;
  color: var(--marquage-txt);
  pointer-events: none;
}
.place-type {
  position: absolute; right: 5px; bottom: 4px;
  font-family: var(--din); font-size: 8px; letter-spacing: .1em;
  color: color-mix(in srgb, var(--marquage-txt) 72%, transparent);
  pointer-events: none;
}

/* — la voiture : une caisse et une cabine, chacune en volume — */
.auto { position: absolute; inset: 7px 6px; transform-style: preserve-3d; pointer-events: none; --hb: 13px; --hc: 10px; }
.bloc { position: absolute; transform-style: preserve-3d; }
.bloc > i { position: absolute; display: block; background: var(--c); }
.bloc > i.t { inset: 0; transform: translateZ(var(--bh)); }
.bloc > i.n { left: 0; right: 0; top: 0;    height: var(--bh); transform-origin: top;    transform: rotateX(-90deg); }
.bloc > i.s { left: 0; right: 0; bottom: 0; height: var(--bh); transform-origin: bottom; transform: rotateX(90deg); }
.bloc > i.o { top: 0; bottom: 0; left: 0;   width:  var(--bh); transform-origin: left;   transform: rotateY(90deg); }
.bloc > i.e { top: 0; bottom: 0; right: 0;  width:  var(--bh); transform-origin: right;  transform: rotateY(-90deg); }

.caisse { inset: 0; --bh: var(--hb); border-radius: 3px; }
.caisse > i    { --c: color-mix(in srgb, var(--peau) 88%, #000); }
.caisse > i.t  { --c: var(--peau); border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.caisse > i.n  { --c: color-mix(in srgb, var(--peau) 72%, #000); }
.caisse > i.s  { --c: color-mix(in srgb, var(--peau) 62%, #000); }

.cabine { left: 13%; right: 13%; top: 24%; bottom: 26%; --bh: var(--hc); transform: translateZ(var(--hb)); }
.cabine > i    { --c: color-mix(in srgb, #0d1418 68%, var(--peau)); }
.cabine > i.t  { --c: color-mix(in srgb, var(--peau) 82%, #000); border-radius: 2px; }

/* — la pastille au-dessus de la voiture — */
.marqueur {
  position: absolute; left: 50%; top: 50%;
  /* la contre-échelle garde l'étiquette à la même taille quel que soit le
     zoom : lisible de près comme de loin, et elles cessent de se toucher */
  transform: translate(-50%, -50%) translateZ(var(--lev, 40px))
             rotateZ(calc(-1 * var(--rz))) rotateX(calc(-1 * var(--rx)))
             scale(calc(1 / var(--z, 1)));
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  pointer-events: none; white-space: nowrap;
}
/* une hampe relie la pastille à la voiture, comme une étiquette plantée */
.marqueur::after {
  content: ""; position: absolute; top: 100%; left: 50%; width: 1px;
  height: calc(var(--lev, 40px) * .62);
  background: linear-gradient(color-mix(in srgb, var(--ton) 70%, transparent), transparent);
}
.sol.plan .marqueur::after { display: none; }
.marqueur .pin {
  font-family: var(--chiffre); font-size: 10px; font-weight: 700;
  padding: 2px 6px; border-radius: 3px; color: #fff;
  background: var(--ton); box-shadow: 0 4px 10px rgba(0,0,0,.55);
  border: 1px solid rgba(255,255,255,.3);
}
/* Trop serré pour une étiquette : une simple pastille de couleur, qui dit
   l'état sans masquer le plan. La plaque reste dans la liste et sur la fiche. */
.marqueur.point .pin {
  width: 11px; height: 11px; padding: 0; border-radius: 50%;
  box-shadow: 0 2px 5px rgba(0,0,0,.5);
}
.marqueur .jours {
  font-family: var(--din); font-size: 9.5px; font-weight: 700; letter-spacing: .05em;
  padding: 1px 5px; border-radius: 2px;
  background: rgba(10,14,18,.86); color: #fff;
}

/* — nom de zone, debout dans l'allée — */
.zone-titre {
  position: absolute; transform-style: preserve-3d; transform-origin: left bottom;
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px;
  white-space: nowrap; pointer-events: none;
}
.zone-titre b {
  font-family: var(--din); font-size: 19px; font-weight: 700; line-height: 1;
  color: var(--marquage-txt);
}
.zone-titre span {
  font-family: var(--din); font-size: 10.5px; letter-spacing: .15em; text-transform: uppercase;
  color: color-mix(in srgb, var(--marquage-txt) 78%, transparent);
}

/* — panneau latéral de la place — */
.tiroir {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(430px, 100%);
  background: var(--plan); border-left: 1px solid var(--trait);
  box-shadow: var(--ombre-fort); z-index: 60;
  display: flex; flex-direction: column;
  animation: glisse .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes glisse { from { transform: translateX(24px); opacity: 0; } }
.tiroir-tete { padding: 16px 18px; border-bottom: 1px solid var(--trait); display: flex; align-items: flex-start; gap: 12px; }
.tiroir-corps { padding: 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 15px; }
/* la plaque est le seul champ vraiment nécessaire : on lui donne du poids */
.saisie-immat {
  font-size: 19px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; text-align: center; padding: 12px;
}
.liste-travaux { margin: 0; padding-left: 18px; font-size: 13.5px; line-height: 1.5; }
.liste-travaux li { margin-bottom: 2px; }
.liste-travaux li::marker { color: var(--accent); }
.tiroir-pied { padding: 14px 18px; border-top: 1px solid var(--trait); display: flex; gap: 8px; flex-wrap: wrap; }

/* suivi des pièces dans la fiche de travaux */
.piece-l {
  border: 1px solid var(--trait); border-radius: var(--r);
  padding: 9px 11px; background: var(--plan-2);
}
.piece-l b { font-size: 13px; font-weight: 600; }
.piece-l .segments { width: 100%; }
.piece-l .segments button { flex: 1; font-size: 11.5px; padding: 5px 4px; }

/* tour du parc */
.tour-l { padding: 11px 16px; border-bottom: 1px solid var(--trait-fin); }
.tour-l:last-child { border-bottom: none; }
.tour-tete { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 11px; }
.tour-etats { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 9px; }
.tour-etats .puce { padding: 6px 12px; font-size: 12.5px; }

.paire { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px solid var(--trait-fin); font-size: 13px; }
.paire:last-child { border-bottom: none; }
.paire dt { color: var(--encre-3); }
.paire dd { margin: 0; text-align: right; font-weight: 500; }

/* ==========================================================================
   DEVIS
   ========================================================================== */
/* minmax(0,…) : sans ça, un tableau large repousse la colonne de droite
   hors de l'écran au lieu de défiler dans son propre cadre. */
.devis-grille { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 18px; align-items: start; }
.devis-grille > * { min-width: 0; }
.lignes-devis { min-width: 560px; }
.lignes-devis td { padding: 8px 10px; }
.lignes-devis input.saisie { padding: 6px 8px; font-size: 13px; }
.choix-nature { padding: 4px 6px; font-size: 11px; }

/* réglage fin du parc, dans les paramètres */
.grille-rangees { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }

/* --- les horaires jour par jour -------------------------------------------
   Une ligne par jour travaillé, lisible d'un coup : c'est là qu'on voit que le
   samedi s'arrête à midi sans avoir à ouvrir six panneaux. */
.horaires-jours { display: grid; gap: 8px; }
.hj {
  display: grid; gap: 7px; padding: 9px 11px;
  border: 1px solid var(--trait); border-radius: var(--r-s); background: var(--plan-2);
}
.hj.clos { opacity: .72; }
.hj-nom { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.hj-nom b { font-size: 13px; min-width: 74px; }
.hj-nom .bascule { margin-left: auto; font-size: 12px; }
.hj-heures { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); }
.hj-heures label {
  display: grid; gap: 3px; font-size: 10.5px; letter-spacing: .05em;
  text-transform: uppercase; color: var(--encre-3);
}
.hj-heures .saisie { padding: 6px 8px; font-size: 12.5px; }
@media (max-width: 560px) {
  .hj-heures { grid-template-columns: 1fr 1fr; }
}

/* --- congés et fermetures ------------------------------------------------- */
/* --- la densité -----------------------------------------------------------
   Le même outil, plus serré ou plus gros. On agrandit l'ensemble plutôt que le
   seul texte : sur un poste d'atelier, ce sont aussi les boutons qu'on vise de
   loin avec des mains sales. */
body { zoom: var(--echelle, 1); }
@media print { body { zoom: 1; } }

/* --- chercher un réglage --------------------------------------------------
   Une vingtaine de volets, c'est déjà trop pour retrouver un réglage à l'œil. */
.rech-reglages {
  display: flex; align-items: center; gap: 9px; padding: 5px 13px;
  border: 1px solid var(--trait); border-radius: 999px; background: var(--plan);
  box-shadow: var(--ombre);
}
.rech-reglages svg { color: var(--encre-3); flex: none; }
.rech-reglages .saisie {
  flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; font-size: 14px;
}
.rech-reglages .saisie:focus { outline: none; box-shadow: none; }
.volets.en-recherche > .carte.ouvert { box-shadow: 0 0 0 1.5px var(--accent-voile), var(--ombre); }
.apercu-logo {
  max-height: 46px; max-width: 150px; border: 1px solid var(--trait);
  border-radius: var(--r-s); padding: 5px 8px; background: #fff;
}
.ferm-l {
  display: flex; align-items: center; gap: 10px; padding: 8px 11px;
  border: 1px solid var(--trait); border-radius: var(--r-s); background: var(--plan-2);
}
.ferm-l.passee { opacity: .55; }
.ferm-txt { display: grid; gap: 1px; min-width: 0; flex: 1; }
.ferm-txt b { font-size: 13px; }
.ferm-form {
  display: grid; gap: 9px; align-items: end;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  padding: 11px; border: 1px dashed var(--trait); border-radius: var(--r-s);
}
.ferm-form .btn { height: 36px; }
.grille-places { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.place-reglage { display: flex; align-items: center; gap: 8px; }
.place-reglage .num {
  flex: none; min-width: 30px; text-align: center;
  font-size: 11.5px; font-weight: 700; padding: 4px 5px; border-radius: 3px;
  background: var(--plan-2); border: 1px solid var(--trait); color: var(--encre-2);
}
.place-reglage .saisie { padding: 6px 8px; font-size: 12.5px; }

/* --- reconnaissance pendant l'appel ---------------------------------------
   Le bandeau qui remonte la fiche du client pendant qu'on l'a au téléphone. */
.reco { border-radius: var(--r); font-size: 13px; }
.reco.muette {
  display: flex; align-items: center; gap: 9px; padding: 11px 13px;
  border: 1px dashed var(--trait); color: var(--encre-3); background: var(--plan-2);
}
.reco.muette svg { flex: none; }
.reco.trouve {
  border: 1px solid color-mix(in srgb, var(--libre) 45%, transparent);
  background: var(--libre-voile); padding: 12px 13px;
  display: flex; flex-direction: column; gap: 11px;
}
.reco-tete { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.reco-tete > svg { color: var(--libre); flex: none; }
.reco-tete b { font-family: var(--din); font-size: 15.5px; }
.reco-tete .badge { margin-left: 7px; vertical-align: 2px; }
.reco-note {
  display: flex; gap: 8px; align-items: flex-start;
  padding: 8px 10px; border-radius: var(--r-s);
  background: var(--attente-voile); color: var(--encre-2);
}
.reco-note svg { flex: none; color: var(--attente); }
.reco-bloc { display: flex; flex-direction: column; gap: 6px; }
.reco-l {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px 9px; border-radius: var(--r-s);
  background: var(--plan); border: 1px solid var(--trait-fin);
}
.reco-l .mini { white-space: nowrap; }
.reco-l.cliquable { cursor: pointer; }
.reco-l.cliquable:hover { border-color: var(--accent); }

/* --- témoin d'enregistrement ----------------------------------------------
   Discret quand tout va bien, impossible à manquer quand rien n'est conservé. */
.temoin {
  position: fixed; z-index: 60; left: 12px; bottom: 12px;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border-radius: 999px; font-size: 12px;
  border: 1px solid var(--trait); background: var(--plan); color: var(--encre-3);
  box-shadow: var(--ombre); pointer-events: none;
}
/* `display: flex` bat l'attribut hidden : sans cette règle, le témoin
   réapparaît sur les pages client et pro, où il n'a rien à faire. */
.temoin[hidden] { display: none !important; }
.temoin.ok svg { color: var(--libre); }
.temoin.ok { opacity: .78; }
.temoin.alerte {
  left: 12px; right: 12px; bottom: auto; top: calc(12px + var(--sur-haut));
  border-radius: var(--r); padding: 10px 13px; font-size: 13px;
  border-color: var(--occupe); background: var(--occupe-voile); color: var(--encre);
  pointer-events: auto; align-items: flex-start; line-height: 1.45;
}
.temoin.alerte svg { color: var(--occupe); flex: none; margin-top: 1px; }
/* le bandeau ne recouvre rien : la page descend d'autant */
body.avertie { padding-top: var(--haut-avert, 62px); }
body.avertie .commande, body.avertie .barre { top: var(--haut-avert, 62px); }
.temoin.alerte .btn { margin-left: auto; flex: none; }
@media (max-width: 900px) {
  .temoin.ok { bottom: calc(16px + var(--sur-bas)); font-size: 11.5px; padding: 5px 9px; }
  .temoin.ok { left: calc(12px + var(--sur-gauche)); }
  .temoin.alerte { flex-wrap: wrap; }
  .temoin.alerte .btn { margin-left: 0; width: 100%; justify-content: center; }
}
@media print { .temoin { display: none !important; } }

/* la recherche générale, posée en haut de l'accueil */
/* La recherche est un geste à part : on ne la colle pas aux raccourcis, sinon
   les deux se lisent comme une seule rangée de boutons. */
.chercher-accueil { max-width: none; margin-bottom: 20px; }
.chercher-accueil .saisie { font-size: 16px; }
@media (max-width: 900px) { .chercher-accueil { margin-bottom: 16px; } }

/* la grille négociée d'un confrère */
.grille-perso .td-applique { font-weight: 700; }
.grille-perso .td-applique.negocie { color: var(--accent); }
.grille-perso .td-part { color: var(--encre-3); }
@media (max-width: 900px) {
  .grille-perso { min-width: 0 !important; }
  .grille-perso thead { display: none; }
  .grille-perso, .grille-perso tbody, .grille-perso tr, .grille-perso td { display: block; }
  .grille-perso tr {
    display: grid; gap: 8px; align-items: end;
    grid-template-columns: 1fr 1fr 1fr;
    grid-template-areas: "lib lib lib" "part applique nego";
    padding: 12px 0; border-bottom: 1px solid var(--trait-fin);
  }
  .grille-perso tr:last-child { border-bottom: none; }
  .grille-perso td { padding: 0; border: none; text-align: left; }
  .grille-perso .td-lib { grid-area: lib; font-weight: 500; }
  .grille-perso .td-part { grid-area: part; }
  .grille-perso .td-applique { grid-area: applique; }
  .grille-perso .td-nego { grid-area: nego; }
  .grille-perso td[data-l]::before {
    content: attr(data-l); display: block; margin-bottom: 3px;
    font-size: 10.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--encre-3);
  }
  .grille-perso .saisie.num { width: 100% !important; }
}

/* interventions et règlements */
.bilan-du {
  padding: 11px 16px; border-top: 1px solid var(--trait-fin);
  display: flex; align-items: center; gap: 10px;
}
.travaux .td-regle { white-space: nowrap; }
.travaux .td-regle .btn { padding: 5px 7px; }

/* le détail de ce qui a été fait, sous chaque intervention : c'est l'historique
   qu'on vient chercher deux ans plus tard, il doit se lire sans rien ouvrir */
.prestations-faites { list-style: none; margin: 6px 0 0; padding: 0 0 0 10px; }
.prestations-faites li {
  display: flex; align-items: baseline; gap: 10px;
  padding: 2px 0; font-size: 12.5px; color: var(--encre-2);
  border-left: 2px solid var(--trait); padding-left: 9px;
}
.prestations-faites li span { flex: 1; }
.prestations-faites li i { font-style: normal; color: var(--encre-3); }
.prestations-faites li b { font-weight: 600; color: var(--encre-3); }

/* les lignes en cours de saisie dans la fenêtre « noter une intervention » */
.lignes-interv .saisie { padding: 7px 9px; }
@media (max-width: 900px) {
  .lignes-interv .saisie { min-height: 44px; }
  .lignes-interv tr {
    grid-template-columns: 1fr auto auto;
    grid-template-areas: "lib lib lib" "qte prix oter";
    align-items: end;
  }
  .lignes-interv .td-lib { grid-area: lib; }
  .lignes-interv td:nth-child(2) { grid-area: qte; }
  .lignes-interv td:nth-child(3) { grid-area: prix; }
  .lignes-interv td:nth-child(4) { grid-area: oter; }
}
@media (max-width: 900px) {
  .travaux { min-width: 0 !important; }
  .travaux thead { display: none; }
  .travaux, .travaux tbody, .travaux tr, .travaux td { display: block; }
  .travaux tr {
    display: grid; gap: 8px; align-items: center;
    grid-template-columns: 1fr auto;
    grid-template-areas: "lib lib" "veh montant" "regle regle";
    padding: 13px 0; border-bottom: 1px solid var(--trait-fin);
  }
  .travaux tr:last-child { border-bottom: none; }
  .travaux td { padding: 0; border: none; text-align: left; }
  .travaux .td-lib { grid-area: lib; } .travaux .td-veh { grid-area: veh; }
  .travaux .td-montant { grid-area: montant; text-align: right; font-size: 16px; font-weight: 700; }
  .travaux .td-regle { grid-area: regle; display: flex; align-items: center; gap: 8px; }
  .travaux td[data-l]::before {
    content: attr(data-l); display: block; margin-bottom: 2px;
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--encre-3);
  }
  .travaux .td-regle[data-l]::before { display: none; }
}

/* les semaines du mois, en onglets — on glisse le planning pour en changer */
/* les trois états d'une intervention, et sa corbeille */
.etat-interv { padding: 2px; gap: 1px; }
.etat-interv button { padding: 5px 8px; font-size: 11.5px; white-space: nowrap; }
.gestes-interv { flex-wrap: nowrap; gap: 4px; }
@media (max-width: 900px) {
  .gestes-interv { width: 100%; }
  .etat-interv { flex: 1; }
  .etat-interv button { flex: 1; min-height: 40px; min-width: 0; }
  .gestes-interv > .btn { min-height: 40px; min-width: 40px; }
}

/* les créneaux que des confrères attendent, en tête de leur section */
.demandes-pro { padding: 0 16px 12px; display: flex; flex-direction: column; gap: 8px; }
.demande-l {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: var(--r);
  border: 1px solid color-mix(in srgb, var(--attente) 40%, var(--trait));
  background: var(--attente-voile);
}
.demande-l .item-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.demande-l .item-txt b { font-size: 13.5px; font-weight: 600; }
.demande-l .item-txt small { font-size: 11.5px; color: var(--encre-2);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.demande-l .btn { flex: none; gap: 7px; }
@media (max-width: 900px) { .demande-l .btn { min-height: 42px; min-width: 42px; justify-content: center; } }

/* une ligne masquée pour ce confrère : présente pour nous, invisible pour lui */
.grille-perso tr.masquee td { opacity: .45; }
.grille-perso tr.masquee .td-lib { text-decoration: line-through; }
.grille-perso td .bascule { justify-content: center; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* le PDF d'EBP accroché à un dossier */
.pdf-l { gap: 10px; flex-wrap: nowrap; }
.pdf-l .item-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.pdf-l .item-txt b { font-size: 13.5px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdf-l .item-txt small { font-size: 11.5px; color: var(--encre-3); }
.pdf-l .btn { flex: none; }
@media (max-width: 900px) { .pdf-l .btn { min-height: 42px; } }

/* ranger les blocs de son accueil */
/* Une ligne de réglage se prend en main : sa poignée à gauche, son fond à
   elle, et un bord qui la détache de la suivante quand on la déplace. */
.bloc-accueil {
  display: flex; align-items: center; gap: 4px;
  padding: 2px 6px 2px 2px; border-radius: var(--r);
  border: 1px solid transparent; background: var(--plan);
}
.bloc-accueil:hover { border-color: var(--trait); }
.bloc-accueil .bascule { margin: 0; }
.raccourci.on { border-color: var(--accent); color: var(--accent); }
.raccourci.on svg { opacity: 1; }

/* un confrère sur l'accueil : sa fiche à gauche, sa grille à droite */
.pro-l { grid-template-columns: minmax(0, 1fr) auto; gap: 6px; padding-right: 10px; }
.pro-l .alerte-corps { grid-template-columns: auto minmax(0, 1fr) auto; }
.pro-l .btn { flex: none; gap: 7px; }
@media (max-width: 900px) { .pro-l .btn { min-height: 42px; min-width: 42px; justify-content: center; } }

/* ranger les lignes du catalogue */
.range-l { padding: 5px 6px; color: var(--encre-3); }
.range-l svg { width: 15px; height: 15px; }
.range-l:hover:not(:disabled) { color: var(--accent); }
.range-l:disabled { opacity: .25; cursor: default; }
/* la ligne qu'on vient de déplacer se signale un instant */
@keyframes surligne { from { background: var(--accent-voile); } to { background: transparent; } }
tr.vient-de-bouger td { animation: surligne 1.4s ease-out; }
@media (prefers-reduced-motion: reduce) { tr.vient-de-bouger td { animation: none; } }

/* relever une prestation au fil de la grille d'un confrère */
/* la ligne garde son texte à gauche et ses prix à droite : la coche s'insère
   avant le libellé sans casser l'alignement des colonnes */
.recap-l .coche-presta {
  flex: none; padding: 4px 6px; margin-right: -6px; color: var(--encre-3);
  border: 1px solid var(--trait); border-radius: 7px; align-self: center;
}
.recap-l > span:first-of-type { flex: 1; min-width: 0; }
.recap-l.prise { padding-left: 6px; padding-right: 6px; }
.recap-l .coche-presta svg { width: 15px; height: 15px; }
.recap-l .coche-presta:hover { color: var(--accent); border-color: var(--accent); }
.recap-l.prise { background: var(--accent-voile); border-radius: var(--r); }
.recap-l.prise .coche-presta { color: var(--accent); border-color: var(--accent); }

/* tant qu'un relevé est en cours, la page garde la place de sa barre */
.grille-page.avec-panier .doc-feuille { padding-bottom: calc(120px + var(--sur-bas)); }
@media (max-width: 900px) {
  .grille-page.avec-panier .doc-feuille { padding-bottom: calc(190px + var(--sur-bas)); }
}
.panier-barre {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
  background: color-mix(in srgb, var(--plan) 96%, transparent);
  backdrop-filter: blur(12px); border-top: 1px solid var(--trait);
  box-shadow: 0 -8px 26px -18px rgba(0,0,0,.6);
  padding: 10px calc(16px + var(--sur-droite)) calc(10px + var(--sur-bas)) calc(16px + var(--sur-gauche));
}
.panier-dedans {
  max-width: 680px; margin: 0 auto; display: flex; align-items: center; gap: 12px;
}
.panier-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.panier-txt b { font-size: 13.5px; }
.panier-txt small { font-size: 11.5px; color: var(--encre-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.panier-total { font-weight: 700; font-size: 16px; white-space: nowrap; }
.panier-total i { font-style: normal; font-size: 10.5px; color: var(--encre-3); }
@media (max-width: 900px) {
  /* deux rangées, pas trois : le relevé au-dessus, le total et les deux gestes
     en dessous — « Vider » se réduit à sa croix pour laisser la place */
  .panier-dedans { flex-wrap: wrap; row-gap: 8px; }
  .panier-txt { flex: 1 1 100%; }
  /* la règle générale des boutons nus arrive plus loin dans la feuille : on la
     désigne explicitement, sinon elle ramène la barre à 40 px */
  .panier-barre .btn, .panier-barre .btn.nu { min-height: 44px; }
  .panier-barre .panier-vider span { display: none; }
  .panier-barre .panier-vider { min-width: 44px; justify-content: center; }
  .panier-barre .btn.plein { flex: 1; justify-content: center; }
}
@media print { .panier-barre { display: none !important; } }

/* une alerte et ses deux gestes : traiter pour tous, écarter pour soi */
/* La ligne garde la grille de .item — c'est le « minmax(0, 1fr) » qui empêche
   un long libellé d'élargir toute la fenêtre — et gagne deux colonnes pour ses
   gestes. Le corps cliquable reprend la grille d'origine à l'intérieur. */
.alerte-l { grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px; padding-right: 8px; }
.alerte-corps {
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center; gap: 11px; min-width: 0;
  background: none; border: none; text-align: left; padding: 0; color: inherit; font: inherit;
}
.alerte-l .alerte-geste { flex: none; padding: 7px 8px; color: var(--encre-3); }
.alerte-l .alerte-geste:hover { color: var(--encre); }
.alerte-l [data-act="alerte-traitee"]:hover { color: var(--libre); }
@media (max-width: 900px) {
  .alerte-l .alerte-geste { min-width: 42px; min-height: 42px; }
}

/* les collègues à prévenir, en tête du panneau des alertes */
.a-prevenir { padding: 0 18px 12px; display: flex; flex-direction: column; gap: 8px; }
.prevenir-l {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 11px; border-radius: var(--r);
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--trait));
  background: var(--accent-voile);
}
.prevenir-l .item-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.prevenir-l .item-txt b { font-size: 13.5px; font-weight: 600; }
.prevenir-l .item-txt small { color: var(--encre-2); font-size: 11.5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prevenir-l .btn { flex: none; }
@media (max-width: 900px) {
  .prevenir-l { flex-wrap: wrap; }
  .prevenir-l .item-txt { flex: 1 1 100%; order: -1; }
  .prevenir-l .btn.plein { flex: 1; justify-content: center; }
}

/* un garage confrère, dans les paramètres */
.acces-ligne {
  border: 1px solid var(--trait); border-radius: var(--r); padding: 12px 14px;
  display: flex; flex-direction: column; gap: 10px; background: var(--plan-2);
}
.acces-tete { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.acces-tete b { font-family: var(--din); font-size: 15px; }
.acces-ligne .rangee { flex-wrap: wrap; }
.acces-ligne .btn { font-size: 12.5px; }

/* --- accès de l'équipe ----------------------------------------------------- */
.saisie-code {
  font-family: var(--chiffre); font-size: 21px; letter-spacing: .3em; text-align: center;
  padding: 13px 11px;
}
.jeton.grand { width: 56px; height: 56px; font-size: 24px; margin: 0 auto; }
.profil .cadenas { color: var(--encre-3); display: flex; margin-left: auto; }
.profil .cadenas + .fleche { margin-left: 8px; }
.acces-personne {
  grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding-top: 10px; margin-top: 2px; border-top: 1px solid var(--trait-fin);
}
.acces-personne .btn { font-size: 12.5px; padding: 6px 10px; }

/* --- alertes de l'équipe --------------------------------------------------- */
.cloche { position: relative; padding: 7px 9px; }
/* le pictogramme d'alerte est plus gros que les autres : c'est le seul
   qu'on doit voir sans le chercher */
.cloche svg { width: 23px; height: 23px; }
.cloche .pastille {
  position: absolute; top: -2px; right: -2px;
  min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px;
  background: var(--occupe); color: #fff;
  font-family: var(--chiffre); font-size: 11.5px; font-weight: 700;
  display: grid; place-items: center;
  box-shadow: 0 0 0 2px var(--fond);
}
/* deux cloches en plus dans la barre : sur téléphone elles se resserrent
   pour que le nom de l'utilisateur ne parte pas hors de l'écran */
@media (max-width: 560px) {
  /* resserrées en largeur, mais jamais plus basses qu'un doigt : le nom de
     l'utilisateur laisse la place, la cible tactile ne se réduit pas */
  .cloche { padding: 6px 6px; min-height: 42px; }
  .cloche svg { width: 21px; height: 21px; }
  .cloche .pastille { top: 1px; right: -1px; }
}
/* Les deux cloches se lisent pareil : grise au repos, rouge quand ça attend.
   Une couleur par nature d'alerte obligeait à apprendre un code ; le picto
   suffit à les distinguer. */

/* Une alerte non lue bat en rouge : c'est du travail qui attend, ça doit
   s'attraper du coin de l'œil depuis l'autre bout de l'atelier. */
@keyframes bat-cloche {
  0%, 58%, 100% { transform: none; }
  66% { transform: rotate(-13deg) scale(1.1); }
  74% { transform: rotate(11deg) scale(1.1); }
  82% { transform: rotate(-6deg); }
  90% { transform: rotate(4deg); }
}
@keyframes rouge-cloche {
  0%, 45%, 100% { color: var(--occupe); }
  70% { color: color-mix(in srgb, var(--occupe) 45%, transparent); }
}
@keyframes bat-pastille {
  0%, 58%, 100% { transform: none; }
  70% { transform: scale(1.28); }
}
.cloche.clignote { color: var(--occupe); animation: rouge-cloche 1.8s ease-in-out infinite; }
.cloche.clignote svg { animation: bat-cloche 1.8s ease-in-out infinite; transform-origin: 50% 20%; }
.cloche.clignote .pastille { animation: bat-pastille 1.8s ease-in-out infinite; }
/* Sur téléphone, la cloche qui appelle prend un fond plein : à cette taille,
   un simple trait de couleur ne se distingue pas des boutons voisins. */
@media (max-width: 560px) {
  .cloche.clignote {
    background: color-mix(in srgb, var(--occupe) 15%, transparent);
    border-radius: var(--r);
  }
}

@media (prefers-reduced-motion: reduce) {
  .cloche.clignote, .cloche.clignote svg, .cloche.clignote .pastille { animation: none; }
  .cloche.clignote { color: var(--occupe); }
}

.item.neuve { background: var(--accent-voile); }
.point-neuf {
  width: 8px; height: 8px; border-radius: 50%; flex: none;
  background: var(--accent);
}

/* déplacer une ligne : un sélecteur réduit à sa plus simple expression */
.saisie.ranger {
  width: 42px; padding: 6px 4px; text-align: center;
  color: var(--encre-3); background: transparent; border-color: transparent;
}
.saisie.ranger:hover { border-color: var(--trait); color: var(--encre); }
.saisie.ranger:focus { width: auto; min-width: 130px; color: var(--encre); }

/* le pied d'une section : on ajoute une ligne là où on regarde */
.carte-pied {
  padding: 10px 16px; border-top: 1px solid var(--trait-fin);
  display: flex; gap: 8px; flex-wrap: wrap;
}

/* --- sommaire d'une grille tarifaire --------------------------------------
   Une puce par section : à six familles et plus, on ne fait plus défiler. */
.sommaire { display: flex; gap: 7px; flex-wrap: wrap; }
.sommaire .puce { text-decoration: none; }
.sommaire .puce:hover { border-color: var(--accent); color: var(--accent); }
/* la section visée ne se cale pas sous la barre du haut */
[id*="-fam-"] { scroll-margin-top: 76px; }
@media (max-width: 900px) { [id*="-fam-"] { scroll-margin-top: 64px; } }

/* --- espace professionnel -------------------------------------------------
   Deux prix côte à côte : le sien, et celui du particulier. */
.duo-prix { display: flex; align-items: baseline; gap: 0; white-space: nowrap; }
.duo-prix b { display: inline-block; width: 82px; text-align: right; font-weight: 700; }
.duo-prix .public { display: inline-block; width: 82px; text-align: right; color: var(--encre-3); }
.duo-prix .ecart {
  display: block; font-style: normal; font-size: 10.5px; font-weight: 600;
  color: var(--libre); margin-top: 1px;
  /* si un jour la mention s'allonge, elle passe à la ligne plutôt que
     de courir sous la colonne particulier */
  white-space: normal;
}

/* le choix du jour, en pastilles de calendrier */
.jours-libres { display: flex; gap: 7px; flex-wrap: wrap; }
.jour-libre {
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  padding: 8px 10px; min-width: 62px; cursor: pointer;
  border: 1px solid var(--trait); border-radius: var(--r); background: var(--plan);
  transition: border-color .12s, background .12s;
}
.jour-libre input { position: absolute; opacity: 0; pointer-events: none; }
.jour-libre b { font-family: var(--din); font-size: 11px; text-transform: uppercase;
  letter-spacing: .06em; color: var(--encre-3); }
.jour-libre span { font-family: var(--din); font-size: 19px; font-weight: 700; line-height: 1.1; }
.jour-libre i { font-style: normal; font-size: 10.5px; color: var(--libre); }
.jour-libre i.etat-charge { color: var(--attente); }
.jour-libre i.etat-plein { color: var(--occupe); }
.jour-libre:hover { border-color: var(--encre-3); }
.jour-libre:has(input:checked) { border-color: var(--accent); background: var(--accent-voile); }
.jour-libre:has(input:checked) span, .jour-libre:has(input:checked) b { color: var(--accent); }
.jour-libre.plein { opacity: .45; cursor: not-allowed; }
.jour-libre.plein i { color: var(--occupe); }

/* une demande de pro, tant qu'elle n'est pas confirmée */
.item.a-valider { background: var(--attente-voile); }
.item.a-valider .heure-rdv { color: var(--attente); font-weight: 700; }

/* choix d'une couleur, et retour à celle d'origine */
.rangee-couleur { display: flex; align-items: center; gap: 8px; }
.saisie-couleur {
  width: 46px; height: 34px; flex: none; padding: 2px; cursor: pointer;
  border: 1px solid var(--trait); border-radius: var(--r); background: var(--plan-2);
}
.rangee-couleur .btn { font-size: 12px; padding: 6px 9px; }

/* une case à cocher lisible au doigt */
.bascule { display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 13.5px; }
.bascule input { width: 19px; height: 19px; flex: none; accent-color: var(--accent); cursor: pointer; }

/* les trois fichiers que l'import EBP sait reconnaître */
.liste-ebp { margin: 0; padding-left: 17px; display: flex; flex-direction: column; gap: 5px;
  font-size: 12.5px; color: var(--encre-2); }
.liste-ebp li::marker { color: var(--encre-3); }

/* vos mots : un champ par état, en colonnes souples */
.grille-mots { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr)); }
.grille-mots label { display: flex; align-items: center; gap: 6px; }

/* le point de couleur d'un état, aux mêmes teintes que ses badges */
.puce-ton { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--encre-3); }
.puce-ton[data-ton="urgent"]  { background: var(--occupe); }
.puce-ton[data-ton="attente"] { background: var(--attente); }
.puce-ton[data-ton="info"],
.puce-ton[data-ton="actif"]   { background: var(--actif); }
.puce-ton[data-ton="gros"]    { background: var(--gros); }
.puce-ton[data-ton="perso"]   { background: var(--perso); }
.puce-ton[data-ton="ok"]      { background: var(--libre); }
.puce-ton[data-ton="mort"],
.puce-ton[data-ton="fini"]    { background: var(--mort); }

/* le nom d'une famille de tarifs se retape sur place */
/* --- la grille tarifaire ---------------------------------------------------
   Vingt lignes, trois champs chacune : encadrer les soixante en faisait un mur
   de rectangles gris où plus aucun prix ne ressortait. Un champ s'y lit comme
   du texte et ne montre son cadre qu'au moment où on va y toucher — la grille
   redevient une grille, et reste modifiable au même endroit. */
.tarifs .saisie {
  background: transparent; border-color: transparent;
  transition: background .1s, border-color .1s;
}
.tarifs tr:hover .saisie { border-color: var(--trait-fin); background: var(--plan-2); }
.tarifs .saisie:hover { border-color: var(--trait); background: var(--plan-2); }
.tarifs .saisie:focus { border-color: var(--accent); background: var(--plan); }
/* Le prix est ce qu'on vient lire : il porte les chiffres de l'atelier. */
.tarifs .td-part .saisie, .tarifs .td-pro .saisie {
  font-family: var(--chiffre); font-weight: 700; font-size: 14px; color: var(--encre);
}
.tarifs .td-lib .saisie { font-weight: 500; }

.titre-famille {
  font-family: var(--din); font-size: 15px; font-weight: 600; color: var(--encre);
  border-color: transparent; background: transparent; padding: 4px 7px;
  width: auto; max-width: 26ch; margin: -4px 0;
}
.titre-famille:hover { border-color: var(--trait); }
/* monter, descendre, supprimer une section */
.outils-section .btn { padding: 5px 7px; }
.outils-section .btn svg { width: 14px; height: 14px; }
.outils-section [data-act="monter-famille"] svg { transform: rotate(90deg); }
.outils-section [data-act="descendre-famille"] svg { transform: rotate(90deg); }
.titre-famille:focus { border-color: var(--accent); background: var(--plan); }

/* une place hors service : hachurée, hors du jeu */
.place[data-type="hs"] {
  background: repeating-linear-gradient(-45deg,
    color-mix(in srgb, var(--mort) 40%, transparent) 0 5px, transparent 5px 10px) !important;
  border-color: color-mix(in srgb, var(--mort) 60%, transparent) !important;
}
.lignes-devis .qte { width: 66px; text-align: right; }
.lignes-devis .pu  { width: 96px; text-align: right; }
.type-pin {
  font-family: var(--din); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 5px; border-radius: 2px; border: 1px solid var(--trait); color: var(--encre-3);
}
.type-pin[data-t="piece"]   { color: var(--actif);   border-color: color-mix(in srgb, var(--actif) 35%, transparent); }
.type-pin[data-t="mo"]      { color: var(--attente); border-color: color-mix(in srgb, var(--attente) 35%, transparent); }
.type-pin[data-t="forfait"] { color: var(--pret);    border-color: color-mix(in srgb, var(--pret) 35%, transparent); }

.totaux { display: flex; flex-direction: column; gap: 2px; }
.totaux .l { display: flex; justify-content: space-between; padding: 6px 0; font-size: 13.5px; }
.totaux .l span:last-child { font-family: var(--chiffre); font-variant-numeric: tabular-nums; }
.totaux .ttc { border-top: 2px solid var(--encre); margin-top: 6px; padding-top: 10px; font-family: var(--din); font-size: 20px; font-weight: 700; }

.piste { display: flex; flex-direction: column; gap: 0; }
.piste .etape { display: flex; gap: 11px; padding-bottom: 14px; position: relative; }
.piste .etape:not(:last-child)::before {
  content: ""; position: absolute; left: 8px; top: 19px; bottom: 0; width: 2px; background: var(--trait);
}
.piste .rond {
  width: 18px; height: 18px; flex: none; border-radius: 50%; margin-top: 1px;
  border: 2px solid var(--trait); background: var(--plan); z-index: 1;
}
.piste .etape.faite .rond { background: var(--libre); border-color: var(--libre); }
.piste .etape.faite:not(:last-child)::before { background: var(--libre); }
.piste .etape.ici .rond { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-voile); }
.piste .txt { font-size: 13px; line-height: 1.35; }
.piste .txt small { display: block; color: var(--encre-3); font-size: 11.5px; }

/* --- modale --------------------------------------------------------------- */
.voile {
  position: fixed; inset: 0; z-index: 80;
  background: color-mix(in srgb, #05080a 62%, transparent);
  backdrop-filter: blur(3px);
  display: grid; place-items: center; padding: 20px;
  animation: fondu .16s ease;
}
@keyframes fondu { from { opacity: 0; } }
.modale {
  background: var(--plan); border: 1px solid var(--trait); border-radius: var(--r-l);
