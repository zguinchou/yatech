            + `, rangées en <b>${sections.length} section${sections.length > 1 ? 's' : ''}</b>.`
            + (r.retires > 0 ? `<br><b>${r.retires} ligne${r.retires > 1 ? 's' : ''}</b> d'exemple ${r.retires > 1 ? 'ont' : 'a'} disparu.` : '')
          : `<b>${r.majs}</b> prix mis à jour.<br><b>${r.ajoutes}</b> article${r.ajoutes > 1 ? 's ajoutés' : ' ajouté'}.`
            + `<br><b>Vos ${mes.length} sections n'ont pas bougé</b>, vos libellés non plus.`)
          + (r.ignores ? `<br>${r.ignores} ligne${r.ignores > 1 ? 's' : ''} sans prix, ignorée${r.ignores > 1 ? 's' : ''}.` : '')
          + (DB.ecritOk ? '' : '<br><br><b style="color:var(--occupe)">Ce navigateur n\'enregistre rien.</b> '
             + 'Sauvegardez le fichier avant de fermer l\'onglet.'),
        bouton: DB.ecritOk ? 'Voir mes tarifs' : 'Sauvegarder le fichier',
        alors() {
          if (!DB.ecritOk) { sauvegarderFichier(); return; }
          S.vue = 'catalogue'; S.rechTarif = ''; rendre();
        }
      });
    }
  });
}

/** Combien d'articles utilisables dans ce fichier, avant d'y toucher. */
function compterArticlesEbp(texte) {
  const lignes = depuisCsv(texte);
  const col = repererAvec(lignes[0] || [], COLONNES_ARTICLES);
  if (col.prixHT === undefined) return null;
  const lire = (l, cle) => (col[cle] !== undefined ? String(l[col[cle]] || '').trim() : '');
  const bons = lignes.slice(1).filter(l =>
    (lire(l, 'code') || lire(l, 'libelle')) && nombreFr(lire(l, 'prixHT')) !== null);
  const sections = [...new Set(bons.map(l => lire(l, 'famille')).filter(Boolean))];
  return { articles: bons.length, sections, avecPrixPro: col.prixPro !== undefined };
}

/* Deux façons de reprendre les tarifs d'EBP :
   — « remplacer » : le catalogue devient celui d'EBP. C'est ce qu'on veut la
     première fois, quand ce qui est ici n'est qu'un exemple.
   — « prix » : on ne touche qu'aux prix des lignes déjà présentes, et les
     sections d'ici ne bougent pas d'un pouce. */
function importerArticlesEbp(texte, mode) {
  const lignes = depuisCsv(texte);
  const col = repererAvec(lignes[0] || [], COLONNES_ARTICLES);
  if (col.prixHT === undefined) return { erreur: 'Aucune colonne de prix reconnue dans ce fichier.' };

  const lire = (l, cle) => (col[cle] !== undefined ? String(l[col[cle]] || '').trim() : '');
  const prixDe = (l) => {
    const ht = nombreFr(lire(l, 'prixHT'));
    const pro = nombreFr(lire(l, 'prixPro'));
    return { ht, pro: pro !== null ? pro : ht };
  };
  let majs = 0, ajoutes = 0, ignores = 0;

  if (mode === 'remplacer') {
    const neuf = [];
    lignes.slice(1).forEach(l => {
      const code = lire(l, 'code'), libelle = lire(l, 'libelle');
      const { ht, pro } = prixDe(l);
      if ((!code && !libelle) || ht === null) { ignores++; return; }
      // on garde l'identifiant d'une ligne déjà connue : les devis y renvoient
      const ancien = code ? DB.etat.catalogue.find(x => (x.code || '').toLowerCase() === code.toLowerCase()) : null;
      neuf.push({
        id: ancien ? ancien.id : DB.nouvelId('p'),
        code: code || '', libelle: libelle || code,
        famille: lire(l, 'famille') || 'Prestations',
        type: ancien ? ancien.type : 'forfait',
        temps: ancien ? ancien.temps : 0,
        prixHT: ht, prixPro: pro
      });
      if (ancien) majs++; else ajoutes++;
    });
    if (!neuf.length) return { erreur: 'Aucune ligne exploitable : ni code article, ni désignation, ni prix lisible.' };
    const perdus = DB.etat.catalogue.length;
    DB.etat.catalogue = neuf;
    DB.sauver();
    return { mode, majs, ajoutes, ignores, retires: perdus - majs, total: lignes.length - 1 };
  }

  lignes.slice(1).forEach(l => {
    const code = lire(l, 'code'), libelle = lire(l, 'libelle');
    const { ht, pro } = prixDe(l);
    if ((!code && !libelle) || ht === null) { ignores++; return; }

    let p = code ? DB.etat.catalogue.find(x => (x.code || '').toLowerCase() === code.toLowerCase()) : null;
    if (!p && libelle) p = DB.etat.catalogue.find(x => (x.libelle || '').toLowerCase() === libelle.toLowerCase());

    if (p) {
      majs++;
      if (code && !p.code) p.code = code;
      // ni le libellé ni la section d'ici ne sont écrasés : c'est votre rangement
    } else {
      p = { id: DB.nouvelId('p'), code: code || '', libelle: libelle || code, type: 'forfait',
            famille: lire(l, 'famille') || 'Repris d\'EBP', temps: 0, prixHT: 0, prixPro: null };
      DB.etat.catalogue.push(p);
      ajoutes++;
    }
    p.prixHT = ht;
    p.prixPro = pro;
  });

  DB.sauver();
  return { mode: 'prix', majs, ajoutes, ignores, total: lignes.length - 1 };
}

function importerFacturesEbp(texte) {
  const lignes = depuisCsv(texte);
  const col = repererAvec(lignes[0] || [], COLONNES_FACTURES);
  if (col.numero === undefined) return { erreur: 'Aucun numéro de document reconnu dans ce fichier.' };

  const lire = (l, cle) => (col[cle] !== undefined ? String(l[col[cle]] || '').trim() : '');
  let rapproches = 0, orphelines = 0;

  lignes.slice(1).forEach(l => {
    const numero = lire(l, 'numero');
    if (!numero) return;

    /* On retrouve le devis par notre propre numéro, où qu'EBP l'ait rangé :
       en référence, en objet, ou dans les observations. */
    const texteLigne = l.join(' ').toUpperCase();
    const d = DB.etat.devis.find(x => x.numero && texteLigne.includes(x.numero.toUpperCase()));
    if (!d) { orphelines++; return; }

    const ttc = nombreFr(lire(l, 'ttc'));
    const ht = nombreFr(lire(l, 'ht'));
    figerTva(d);
    d.facture = {
      numero,
      date: depuisInputDate(dateEbp(lire(l, 'date'))) || Date.now(),
      ht: ht, ttc: ttc != null ? ttc : (ht != null ? ht * (1 + (tvaDu(d).franchise ? 0 : tvaDu(d).taux) / 100) : null)
    };
    if (d.statut !== 'facture') { d.statut = 'facture'; d.maj = Date.now(); }
    if (!d.ebp) d.ebp = Date.now();
    rapproches++;
  });

  DB.sauver();
  return { rapproches, orphelines, total: lignes.length - 1 };
}

/** Les dates d'EBP arrivent en jj/mm/aaaa : on les ramène au format des champs. */
function dateEbp(v) {
  const t = String(v || '').trim();
  const fr = t.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{2,4})$/);
  if (fr) {
    const an = fr[3].length === 2 ? '20' + fr[3] : fr[3];
    return an + '-' + fr[2].padStart(2, '0') + '-' + fr[1].padStart(2, '0');
  }
  return /^\d{4}-\d{2}-\d{2}/.test(t) ? t.slice(0, 10) : '';
}

function importerClientsEbp(texte) {
  const lignes = depuisCsv(texte);
  if (lignes.length < 2) return { erreur: 'Ce fichier ne contient aucune ligne exploitable.' };

  const col = repererColonnes(lignes[0]);
  if (col.nom === undefined && col.societe === undefined) {
    return { erreur: 'Aucune colonne de nom reconnue. La première ligne du fichier doit porter '
      + 'les intitulés des colonnes (Nom, Raison sociale, Téléphone, Ville…).' };
  }

  const lire = (l, cle) => (col[cle] !== undefined ? String(l[col[cle]] || '').trim() : '');
  const nu = (s) => String(s || '').replace(/\D/g, '');
  let ajoutes = 0, reconnus = 0, ignores = 0, pros = 0;

  lignes.slice(1).forEach(l => {
    const societe = lire(l, 'societe');
    const nom = societe || lire(l, 'nom');
    if (!nom) { ignores++; return; }
    const code = lire(l, 'codeEbp'), tel = lire(l, 'tel'), email = lire(l, 'email');

    let c = code ? DB.etat.clients.find(x => x.codeEbp === code) : null;
    if (!c && tel) c = DB.etat.clients.find(x => nu(x.tel) && nu(x.tel) === nu(tel));
    if (!c && email) c = DB.etat.clients.find(x => (x.email || '').toLowerCase() === email.toLowerCase());
    if (!c) {
      c = DB.etat.clients.find(x => (x.nom || '').toLowerCase() === nom.toLowerCase()
        && (x.prenom || '').toLowerCase() === lire(l, 'prenom').toLowerCase());
    }

    const neuf = !c;
    if (c) reconnus++;
    else {
      c = { id: DB.nouvelId('c'), type: 'part', tarif: 'part', nom: '', prenom: '', tel: '', email: '',
            adresse: '', cp: '', ville: '', note: '', cree: Date.now() };
      DB.etat.clients.push(c);
      ajoutes++;
    }

    // on complète, on n'écrase jamais ce qui est déjà renseigné ici
    const poser = (cle, valeur) => { if (valeur && !c[cle]) c[cle] = valeur; };
    poser('nom', nom);
    ['tel', 'email', 'adresse', 'cp', 'ville', 'siret', 'tvaIntra', 'note', 'codeEbp']
      .forEach(cle => poser(cle, lire(l, cle)));
    // sur une société, le « prénom » d'EBP est celui de l'interlocuteur
    if (societe) poser('contact', lire(l, 'prenom'));
    else poser('prenom', lire(l, 'prenom'));

    /* Une raison sociale, un SIRET ou un n° de TVA : c'est une société. On ne
       bascule la grille que sur une fiche neuve — un choix fait ici n'est
       jamais défait par un import. */
    if (neuf && (societe || c.siret || c.tvaIntra)) { c.type = 'pro'; c.tarif = 'pro'; pros++; }
  });

  DB.sauver();
  return { ajoutes, reconnus, ignores, pros, total: lignes.length - 1 };
}

/* ==========================================================================
   RECONNAISSANCE PENDANT L'APPEL
   Le client est encore au téléphone. Quelques chiffres de son numéro ou de sa
   plaque suffisent : on remonte sa fiche, ses voitures, ses devis et ce qui
   est sur le parc — au lieu de tout redemander.
   ========================================================================== */
const chiffresSeuls = (s) => String(s || '').replace(/\D/g, '');
const signesSeuls   = (s) => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

/* Un standard n'annonce pas les numéros comme on les note. « 06 12 34 56 78 »
   dans une fiche, « +33612345678 » sur la ligne : c'est le même téléphone, et
   un caractère de différence suffirait à ne pas reconnaître un habitué. On
   réduit donc chaque numéro à ce qui l'identifie — les neuf chiffres qui
   suivent l'indicatif, ce qui ne change pas d'une écriture à l'autre. */
function numeroClef(tel) {
  let n = chiffresSeuls(tel);
  if (!n) return '';
  if (n.startsWith('00')) n = n.slice(2);
  if (n.length > 9 && n.startsWith('33')) n = n.slice(2);
  if (n.length > 9 && n.startsWith('0')) n = n.slice(1);
  return n.length > 9 ? n.slice(-9) : n;
}

/** Deux numéros désignent-ils la même ligne ? */
function memeNumero(a, b) {
  const x = numeroClef(a), y = numeroClef(b);
  return !!x && x.length >= 6 && x === y;
}

/** Le numéro écrit comme on le lit : 06 12 34 56 78. Un standard annonce
 *  souvent « +33612345678 » — personne ne lit un numéro dans cette forme-là. */
function telLisible(tel) {
  const brut = String(tel || '').trim();
  let n = chiffresSeuls(brut);
  if (n.startsWith('00')) n = n.slice(2);
  if (n.length === 11 && n.startsWith('33')) n = '0' + n.slice(2);
  if (n.length !== 10 || !n.startsWith('0')) return brut;
  return n.replace(/(\d\d)(?=\d)/g, '$1 ');
}

function reconnaitreAppel(tel, immat) {
  const t = chiffresSeuls(tel), i = signesSeuls(immat);
  let vehicule = null, client = null;

  // la plaque désigne une voiture précise : c'est la piste la plus sûre
  if (i.length >= 3) {
    vehicule = DB.etat.vehicules.find(v => signesSeuls(v.immat).includes(i)) || null;
    if (vehicule) client = DB.client(vehicule.clientId);
  }
  /* Sinon le numéro, dès qu'il y a de quoi ne pas confondre deux clients. Un
     numéro complet est comparé sur sa forme réduite — il peut être écrit à
     l'internationale d'un côté et à la française de l'autre ; un numéro en
     cours de frappe, lui, se cherche tel quel. */
  if (!client && t.length >= 4) {
    client = DB.etat.clients.find(c => memeNumero(c.tel, tel))
          || DB.etat.clients.find(c => chiffresSeuls(c.tel).includes(t)) || null;
  }
  if (!client) return null;

  const vehicules = DB.etat.vehicules.filter(v => v.clientId === client.id);
  const devis = DB.etat.devis.filter(d => d.clientId === client.id).sort((a, b) => b.maj - a.maj);
  return {
    client, vehicule, vehicules, devis,
    enCours: devis.filter(d => !['facture', 'refuse'].includes(d.statut)),
    surLeParc: DB.etat.occupations.filter(o => vehicules.some(v => v.id === o.vehiculeId)),
    dernier: devis.filter(d => d.statut === 'facture')[0] || null
  };
}

/** Remet à jour le bandeau sans redessiner la fenêtre : le curseur ne bouge pas. */
function rafraichirReco(form) {
  const zone = form.querySelector('#reco-appel');
  if (!zone) return;
  const tel = form.querySelector('[name="tel"]');
  const immat = form.querySelector('[name="immat"]');
  zone.innerHTML = bandeauAppel(reconnaitreAppel(tel ? tel.value : '', immat ? immat.value : ''));
}

function creerDepuisAppel(form, envoyerLien) {
  const tel = form.tel.trim();
  const immat = form.immat.trim().toUpperCase();

  /* On reconnaît un habitué à sa plaque d'abord, à son numéro ensuite : c'est
     comme ça qu'on récupère ses coordonnées sans les redemander. */
  const nu = (s) => (s || '').toUpperCase().replace(/[-\s.]/g, '');
  let v = immat ? DB.etat.vehicules.find(x => nu(x.immat) === nu(immat)) : null;
  let c = v ? DB.client(v.clientId) : null;
  if (!c && tel) c = DB.etat.clients.find(x => (x.tel || '').replace(/\s/g, '') === tel.replace(/\s/g, ''));

  const neufClient = !c;
  if (!c) {
    c = { id: DB.nouvelId('c'), type: 'part', tarif: 'part', nom: form.nom.trim(), prenom: form.prenom.trim(),
          tel, email: form.email.trim(), adresse: '', cp: '', ville: '', note: '', cree: Date.now() };
    DB.etat.clients.push(c);
  } else {
    // le client existe : on complète ce qui manque, sans jamais écraser
    if (tel && !c.tel) c.tel = tel;
    if (form.email.trim() && !c.email) c.email = form.email.trim();
    if (form.nom.trim() && (!c.nom || c.nom === 'À identifier')) c.nom = form.nom.trim();
    if (form.prenom.trim() && !c.prenom) c.prenom = form.prenom.trim();
  }

  if (!v) {
    v = { id: DB.nouvelId('v'), clientId: c.id, marque: form.marque.trim(), modele: form.modele.trim(), immat, annee: null, km: null, energie: '' };
    DB.etat.vehicules.push(v);
  } else {
    if (form.marque.trim() && !v.marque) v.marque = form.marque.trim();
    if (form.modele.trim() && !v.modele) v.modele = form.modele.trim();
  }

  const d = {
    id: DB.nouvelId('d'), numero: DB.nouveauNumero(), clientId: c.id, vehiculeId: v.id,
    statut: 'appel', creePar: S.userId, cree: Date.now(), maj: Date.now(),
    panne: form.panne.trim(), lignes: [], remise: 0, note: '',
    token: Math.random().toString(36).slice(2, 8)
  };
  DB.etat.devis.push(d);

  const moi = DB.utilisateur(S.userId);
  const qui = moi ? moi.nom : 'Quelqu\'un';
  const nomClient = DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim();
  if (neufClient) {
    alerter('tous', 'client', `${qui} a créé la fiche de ${nomClient}.`,
      { vue: 'client-fiche', ref: c.id });
  }
  alerter('tous', 'demande',
    `${qui} a pris une demande : ${nomClient}${v.immat ? ' — ' + v.immat : ''}`
    + (form.panne.trim() ? ' · ' + form.panne.trim().slice(0, 60) : ''),
    { vue: 'devis-fiche', ref: d.id });

  enregistrer(`Appel ${c.prenom} ${c.nom} — ${d.numero} créé`.replace(/\s+/g, ' '));
  S.vue = 'devis-fiche'; S.devisId = d.id;

  if (envoyerLien) {
    S.modale = { type: 'lien', id: d.id };
    rendre();
  } else {
    S.modale = null;
    rendre();
    toast('Demande enregistrée. Plus rien ne se perd.');
  }
}

function ajouterLigne(devisId, presta) {
  const d = DB.devis(devisId);
  if (!d) return;
  const client = DB.client(d.clientId);   // décide de la grille tarifaire
  d.lignes.push({
    id: DB.nouvelId('l'),
    type: presta ? presta.type : 'mo',
    libelle: presta ? presta.libelle : '',
    code: presta ? presta.code : '',
    ref: presta && presta.ref ? presta.ref : '',
    qte: 1,
    prixHT: presta ? DB.prixPour(presta, client) : 0,
    remise: 0
  });
  d.maj = Date.now();
  DB.sauver(); rendre();
}

/** Recalcule toutes les lignes d'un devis sur la grille en vigueur. */
function reappliquerTarifs(devisId) {
  const d = DB.devis(devisId);
  if (!d) return 0;
  const client = DB.client(d.clientId);
  let n = 0;
  d.lignes.forEach(l => {
    const p = DB.etat.catalogue.find(x =>
      (l.code && x.code === l.code) || (l.ref && x.ref === l.ref) || x.libelle === l.libelle);
    if (!p) return;
    const prix = DB.prixPour(p, client);
    if (prix !== l.prixHT) { l.prixHT = prix; n++; }
  });
  if (n) { d.maj = Date.now(); DB.sauver(); }
  return n;
}

function placerVehicule(placeId, devisId) {
  const d = DB.devis(devisId);
  if (!d) return;
  DB.supprimerOccupation(placeId);
  DB.etat.occupations = DB.etat.occupations.filter(o => o.vehiculeId !== d.vehiculeId);
  DB.etat.occupations.push({
    placeId, vehiculeId: d.vehiculeId, devisId,
    depuis: Date.now(), etat: d.statut === 'encours' ? 'travaux' : 'arrivee',
    assigneA: null, sortiePrevue: null, pont: false, pieces: {}, memo: ''
  });
  const v = DB.vehicule(d.vehiculeId);
  S.placeId = placeId; S.immatPlacement = ''; S.parcFiltre = 'tous';
  enregistrer(`${v ? v.immat : 'Véhicule'} garé en ${placeId}`);
  toast(`Véhicule placé en ${placeId}`);
}

/* Garer une voiture depuis une place libre : on part de la plaque et on crée
   uniquement ce qui manque — véhicule, client, demande. */
function garerDepuisPlaque(placeId, f) {
  const sansTiret = (s) => (s || '').toUpperCase().replace(/[-\s.]/g, '');
  const immat = (f.immat || '').trim().toUpperCase();
  if (!immat) return;

  let v = DB.etat.vehicules.find(x => sansTiret(x.immat) === sansTiret(immat));
  let c = v ? DB.client(v.clientId) : null;

  if (!v) {
    if (!c) {
      const nom = (f.client || '').trim();
      c = nom ? DB.etat.clients.find(x => (x.nom || '').toLowerCase() === nom.toLowerCase()) : null;
      if (!c) {
        c = {
          id: DB.nouvelId('c'), type: 'part', tarif: 'part',
          nom: nom || 'À identifier', prenom: '', tel: (f.tel || '').trim(),
          email: '', adresse: '', cp: '', ville: '', note: '', cree: Date.now()
        };
        DB.etat.clients.push(c);
      }
    }
    v = {
      id: DB.nouvelId('v'), clientId: c.id,
      marque: (f.marque || '').trim(), modele: (f.modele || '').trim(),
      immat, annee: null, km: null, energie: ''
    };
    DB.etat.vehicules.push(v);
  }

  const perso = !!f.perso;
  let d = perso ? null
    : DB.etat.devis.filter(x => x.vehiculeId === v.id && !['facture', 'refuse'].includes(x.statut)).pop();

  // pas de dossier ouvert : on en crée un, sinon la voiture serait sur le parc
  // sans exister nulle part ailleurs
  if (!perso && !d) {
    d = {
      id: DB.nouvelId('d'), numero: DB.nouveauNumero(), clientId: c.id, vehiculeId: v.id,
      statut: 'appel', creePar: S.userId, cree: Date.now(), maj: Date.now(),
      panne: '', lignes: [], remise: 0, note: '', token: Math.random().toString(36).slice(2, 8)
    };
    DB.etat.devis.push(d);
  }

  // une voiture dehors n'occupe pas de place : son repère lui est propre
  const vraiId = placeId === 'RUE' ? PREFIXE_RUE + v.id : placeId;
  const dehors = estDansLaRue(vraiId);

  DB.supprimerOccupation(vraiId);
  DB.etat.occupations = DB.etat.occupations.filter(x => x.vehiculeId !== v.id);
  DB.etat.occupations.push({
    placeId: vraiId, vehiculeId: v.id, devisId: d ? d.id : null,
    depuis: Date.now(), etat: perso ? 'perso' : 'diag',
    assigneA: null, sortiePrevue: null, pont: false, pieces: {}, memo: ''
  });

  S.immatPlacement = '';
  S.parcFiltre = 'tous';        // on ne reste pas coincé sur « places libres »
  S.placeId = vraiId;
  const ou = dehors ? 'dans la rue' : 'en ' + vraiId;
  enregistrer(`${immat} garé ${ou}`);
  toast(`${immat} garé ${ou}`);
}

/** L'état sur le parc entraîne l'avancement du devis, jamais l'inverse. */
function suivreEtatDevis(o) {
  const d = DB.devis(o.devisId);
  const v = DB.vehicule(o.vehiculeId);
  if (d) {
    if ((o.etat === 'travaux' || o.etat === 'gros') && (d.statut === 'accepte' || d.statut === 'commande')) { d.statut = 'encours'; d.maj = Date.now(); }
    if (o.etat === 'pret' && d.statut === 'encours') { d.statut = 'termine'; d.maj = Date.now(); }
  }
  DB.noter(S.userId, `${v ? v.immat : o.placeId} → ${ETATS[o.etat] ? ETATS[o.etat].nom.toLowerCase() : o.etat}`);
}

function sortirVehicule(placeId) {
  const occ = DB.occupation(placeId);
  if (!occ) return;
  const v = DB.vehicule(occ.vehiculeId);
  DB.supprimerOccupation(placeId);
  S.placeId = null;
  enregistrer(`${v ? v.immat : 'Véhicule'} sorti de la place ${placeId}`);
  toast(`Place ${placeId} libérée`);
}

/* --- lien client ----------------------------------------------------------- */
function lienClient(d) {
  const base = location.href.split('#')[0];
  return `${base}#client=${d.token}`;
}
/** L'adresse de l'atelier sur une ligne, telle qu'on la met dans un SMS. */
function adresseGarage(r) {
  return [r.adresse, [r.cp, r.ville].filter(Boolean).join(' ')].filter(Boolean).join(', ');
}

/** Remplace les {étiquettes} d'un modèle par les valeurs du dossier. */
function remplirModele(modele, valeurs) {
  return String(modele || '').replace(/\{(\w+)\}/g, (t, cle) =>
    valeurs[cle] !== undefined ? valeurs[cle] : t);
}

function messageClient(d) {
  const i = infosDevis(d);
  const r = DB.etat.reglages;
  const signature = `\n\n${r.nom}${r.tel ? '\n' + r.tel : ''}`;
  const valeurs = {
    prenom: i.client ? (i.client.prenom || i.client.nom || '') : '',
    client: i.nomClient,
    vehicule: i.vehiculeTexte,
    immat: i.immat,
    numero: d.numero,
    montant: eur(totaux(d).ttc),
    lien: lienClient(d),
    garage: r.nom
  };
  // avant chiffrage on demande la fiche ; après, le devis part en PDF
  const modele = d.lignes.length ? r.messageDevis : r.messageInfos;
  return remplirModele(modele, valeurs) + signature;
}

/* Le mot qu'on envoie quand la voiture est prête. Prévenir par écrit vaut mieux
   qu'un appel : le client le lit quand il peut, et il garde le montant sous les
   yeux au moment de venir. */
function messagePret(o) {
  const r = DB.etat.reglages;
  const v = DB.vehicule(o.vehiculeId);
  const d = o.devisId ? DB.devis(o.devisId) : null;
  const c = d ? DB.client(d.clientId) : (v ? DB.client(v.clientId) : null);
  const signature = `\n\n${r.nom}${r.tel ? '\n' + r.tel : ''}`;
  return remplirModele(r.messagePret, {
    prenom: c ? (c.prenom || c.nom || '') : '',
    client: c ? (DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim()) : '',
    vehicule: v ? (v.marque + ' ' + v.modele).trim() : 'votre véhicule',
    immat: v ? v.immat : '',
    montant: d && d.lignes.length ? eur(totaux(d).ttc) : '',
    numero: d ? d.numero : '',
    garage: r.nom,
    horaires: tranchesOuverture(r).map(([a, b]) => `${enHeure(a)} à ${enHeure(b)}`).join(' et ')
  }) + signature;
}

/* ==========================================================================
   Le rendez-vous du client : le confirmer, et pouvoir l'annuler
   --------------------------------------------------------------------------
   Un client prévenu par SMS vient. Un client qui a un empêchement et qui doit
   téléphoner pour le dire ne prévient pas : il ne vient pas, et le créneau
   reste vide sans qu'on le sache. Le lien d'annulation existe pour ça — pour
   que la place se libère d'elle-même, et qu'on l'apprenne tout de suite.
   ========================================================================== */

/** Le lien qui décommande ce créneau-là, et lui seul. */
function lienAnnulation(p) {
  return location.href.split('#')[0] + '#annul=' + DB.jetonRdv(p);
}

/** Ce qu'on sait d'un rendez-vous, prêt à remplir un modèle. */
function valeursRdv(p) {
  const r = DB.etat.reglages;
  const meca = p.userId ? DB.utilisateur(p.userId) : null;
  return {
    garage: r.nom || '',
    marque: marqueRdv(p) || 'votre véhicule',
    vehicule: marqueRdv(p) || 'votre véhicule',
    immat: immatRdv(p) || '—',
    /* « jeudi 20 août » plutôt que « jeudi 20 août 2026 » : un rendez-vous se
       prend pour les jours qui viennent, l'année n'apprend rien à personne. */
    jour: new Date(p.jour).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }),
    heure: p.heure || '',
    adresse: adresseGarage(r) || (r.nom || ''),
    tel: r.tel || '',
    client: p.client || '',
    prestation: p.prestation || 'l\'intervention prévue',
    mecanicien: meca ? meca.nom : '',
    /* La date d'envoi, pour qui veut dater son SMS : le client retrouve alors
       lequel des deux messages est le dernier. */
    envoye: dateCourte(Date.now()) + ' à ' + new Date().toTimeString().slice(0, 5)
  };
}

/* Le SMS de confirmation au client. Le lien d'annulation en fait partie : sans
   lui le message n'est qu'une information de plus, avec lui c'est un créneau
   qui se rend tout seul. */
function messageRdvClient(p) {
  const r = DB.etat.reglages;
  return remplirModele(r.messageRdvClient,
    Object.assign(valeursRdv(p), { lien: lienAnnulation(p) }))
    + `\n\n${r.nom || ''}${r.tel ? '\n' + r.tel : ''}`;
}

/* L'accusé d'annulation. Il redit le rendez-vous annulé — jour, heure,
   véhicule : un client qui en a deux doit savoir lequel vient de tomber. */
function messageAnnule(p) {
  const r = DB.etat.reglages;
  return remplirModele(r.messageAnnule, valeursRdv(p))
    + `\n\n${r.nom || ''}${r.tel ? '\n' + r.tel : ''}`;
}

/* Le mot qui confirme un créneau à un confrère. Il a demandé un jour, on lui
   rend un jour ET une heure : c'est tout ce qu'il attend pour s'organiser. */
function messageRdv(p) {
  const r = DB.etat.reglages;
  const c = p.demandeur ? DB.client(p.demandeur) : null;
  const signature = `\n\n${r.nom}${r.tel ? '\n' + r.tel : ''}`;
  const meca = p.userId ? DB.utilisateur(p.userId) : null;
  return remplirModele(r.messageRdv, {
    jour: dateCourte(p.jour),
    heure: p.heure || '',
    prestation: p.prestation || 'l\'intervention prévue',
    immat: p.immat || '',
    client: c ? c.nom : '',
    mecanicien: meca ? meca.nom : '',
    garage: r.nom
  }) + signature;
}

/** À qui envoyer, et par quel moyen : ce qu'on connaît de ce client. */
function contactDe(o) {
  const v = DB.vehicule(o.vehiculeId);
  const d = o.devisId ? DB.devis(o.devisId) : null;
  const c = d ? DB.client(d.clientId) : (v ? DB.client(v.clientId) : null);
  if (!c) return null;
  return {
    client: c,
    nom: DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim(),
    tel: String(c.tel || '').trim(),
    email: String(c.email || '').trim()
  };
}

async function copier(txt, quoi) {
  try {
    await navigator.clipboard.writeText(txt);
    toast((quoi || 'Texte') + ' copié');
  } catch (e) {
    toast('Copie impossible — sélectionnez le texte à la main');
  }
}

/* La barre du bas ne tient que 5 boutons. Les quatre écrans du quotidien, puis
   « Plus » qui ouvre TOUT le reste : sans ça, Clients, Tarifs, Réglages et le
   changement d'utilisateur deviennent inaccessibles sur téléphone. */
/** Tout ce qui ne tient pas dans la barre du bas. */
/** Poser ou modifier un rendez-vous. */
function modalePlanif(ctx) {
  const p = ctx.id ? DB.rdv(ctx.id) : null;
  const jour = p ? p.jour : Number(ctx.jour);
  const userId = p ? p.userId : ctx.userId;
  const devisId = p ? p.devisId : (ctx.devisId || '');
  const dSel = devisId ? DB.devis(devisId) : null;
  const iSel = dSel ? infosDevis(dSel) : null;

  // les dossiers en cours, pour retrouver un client en un choix
  const dossiers = DB.etat.devis
    .filter(d => !['facture', 'refuse'].includes(d.statut))
    .sort((a, b) => b.maj - a.maj);

  const prestations = [...new Set(DB.etat.catalogue.map(x => x.libelle))];
  const emp = p ? p.emplacement : 'sol';
  /* Ce qui part dans le SMS de confirmation : la marque, la plaque, le numéro.
     Rattaché à un devis, tout est déjà connu — sinon on le demande, parce
     qu'un SMS sans plaque ne dit pas au client de quelle voiture on parle. */
  const marqueVeh = p ? marqueRdv(p) : (iSel ? iSel.vehiculeTexte : '');
  const immatVeh = p ? immatRdv(p) : (iSel ? iSel.immat : '');
  const telVeh = p ? telRdv(p) : (iSel && iSel.client ? String(iSel.client.tel || '') : '');

  return `<div class="voile" data-voile><div class="modale">
    <div class="modale-tete">
      <div><h2 style="font-size:18px">${p ? 'Modifier le rendez-vous' : 'Nouveau rendez-vous'}</h2>

      <div class="modale-corps">

        ${p && p.aValider ? `<div class="encart alerte">

            ? '<br><b>Calculateur déposé seul</b> — le véhicule ne vient pas, aucune place à réserver.'
            : ''}
          ${p.calculo ? `<br>Calculateur : <b class="num">${esc(p.calculo)}</b>` : ''}
          ${p.note ? `<br>« ${esc(p.note)} »` : ''}
          <br>Donnez-lui son heure et son mécanicien, puis confirmez — elle entre alors
          au planning et le pro la voit confirmée.
          <div class="rangee" style="margin-top:10px">
            <button type="button" class="btn plein" data-act="valider-demande" data-id="${p.id}">

            <button type="button" class="btn danger" data-act="refuser-demande" data-id="${p.id}">Refuser</button>
          </div>

        <div class="champ">
          <label>Client</label>
          <input class="saisie" name="client" list="liste-clients" required
                 value="${p ? esc(p.client) : (iSel ? esc(iSel.nomClient) : '')}"
                 placeholder="Nom du client">
          <datalist id="liste-clients">
            ${DB.etat.clients.map(c => `<option value="${esc(c.type === 'pro' ? c.nom : (c.prenom + ' ' + c.nom).trim())}"></option>`).join('')}
          </datalist>
        </div>

        <div class="champ">
          <label>Prestation prévue</label>
          <input class="saisie" name="prestation" list="liste-prestations" required

                 placeholder="Ce qu'il y a à faire">
          <datalist id="liste-prestations">
            ${prestations.map(l => `<option value="${esc(l)}"></option>`).join('')}
          </datalist>
        </div>

        ${/* Marque, plaque, portable : le strict nécessaire pour que le client
              reçoive un SMS qui lui parle, et pour qu'on sache quelle voiture
              on attend. Tout est facultatif — un créneau se pose sans. */ ''}
        <div class="champ-duo">
          <div class="champ"><label>Marque du véhicule</label>
            <input class="saisie" name="marque" list="liste-marques-rdv"
                   value="${esc(marqueVeh)}" placeholder="Peugeot 308">
            <datalist id="liste-marques-rdv">
              ${marquesConnues.map(m => `<option value="${esc(m)}"></option>`).join('')}

          <div class="champ"><label>Immatriculation</label>

        </div>

        <div class="champ">
          <label>Portable du client</label>
          <input class="saisie" type="tel" name="tel" value="${esc(telVeh)}" placeholder="06 12 34 56 78">
          <span class="aide">Sert au SMS de confirmation, avec le lien qui lui permet d'annuler seul.</span>
        </div>

        ${/* On ne prend pas rendez-vous hier : le calendrier s'arrête à

          <div class="champ"><label>Heure d'arrivée</label>

                   plus le corriger sans le déplacer. */
                const dispo = heuresDuJour(DB.etat.reglages, jour);
                const choisie = p ? p.heure : (dispo.includes(ctx.heure) ? ctx.heure : dispo[0]);
                const liste = dispo.length ? dispo : HEURES;
                return (liste.includes(choisie) ? liste : [choisie].concat(liste))

              parfois pour un dépannage. Mais il faut le savoir avant de le
              confirmer au client, pas en revenant de vacances. */ ''}
        <div id="planif-ferme">${(() => {
          const ferm = fermetureDu(jour);

          if (!ferm && !clos) return '';
          return `<div class="encart alerte"><b>L'atelier est fermé ce jour-là${

              }).join('')}

        <button type="submit" class="btn plein">${ic('check')} ${p ? 'Enregistrer' : 'Poser le rendez-vous'}</button>
      </div>
    </form>
  </div></div>`;
}

/* Le tour du parc : un passage, une ligne par véhicule, un doigt.
   C'est la mise à jour quotidienne — pas besoin d'ouvrir une seule fiche. */
/* Prévenir quelqu'un d'une tâche.
   Un prototype ne peut pas envoyer de SMS tout seul : il prépare le message
   et ouvre la messagerie du téléphone, ce qui marche dès aujourd'hui.
   Il tente aussi une notification du navigateur si l'app est ouverte. */
/* Demande de confirmation maison.
   confirm() du navigateur est neutralisé dans une page embarquée : il renvoie
   « non » sans rien afficher, et l'action semblait ne pas marcher. */
function confirmer(options) {
  S.confirmation = options;
  S.modale = { type: 'confirmer' };
  rendre();
}

/** Notification du navigateur, quand elle est autorisée et l'app ouverte. */
function notifierNavigateur(titre, corps) {
  try {
    if (typeof Notification === 'undefined') return;
    if (Notification.permission === 'granted') { new Notification(titre, { body: corps }); }
    else if (Notification.permission !== 'denied') {
      Notification.requestPermission().then(p => {
        if (p === 'granted') new Notification(titre, { body: corps });
      });
    }
  } catch (e) { /* le navigateur refuse : le SMS prend le relais */ }
}

/* ==========================================================================
   ÉCRAN — liste des devis
   ========================================================================== */
const FILTRES_DEVIS = [
  { id: 'actifs',  nom: 'Tout ce qui est en cours' },
  { id: 'atraiter',nom: 'À traiter' },
  { id: 'attente', nom: 'Chez le client' },
  { id: 'atelier', nom: 'En atelier' },
  { id: 'clos',    nom: 'Terminés' }
];

function devisFiltres() {
  const q = S.recherche.trim().toLowerCase();
  let l = DB.etat.devis.slice();

  switch (S.filtreDevis) {
    // ce qui attend une action de notre côté
    case 'atraiter': l = l.filter(d => ['appel', 'brouillon'].includes(d.statut)
                                    || (d.statut === 'envoye' && joursDepuis(d.envoye || d.cree) >= DB.etat.reglages.relanceApres)); break;
    // ce qui attend une action du client
    case 'attente':  l = l.filter(d => d.statut === 'attente' || d.statut === 'envoye'); break;
    case 'atelier':  l = l.filter(d => ['accepte', 'commande', 'encours', 'termine'].includes(d.statut)); break;
    case 'clos':     l = l.filter(d => ['facture', 'refuse'].includes(d.statut)); break;
    default:         l = l.filter(d => !['facture', 'refuse'].includes(d.statut));
  }

  // la recherche passe au-dessus du filtre : on cherche dans tout le fichier
  if (q) {
    l = DB.etat.devis.filter(d => {
      const i = infosDevis(d);
      const tel = i.client ? i.client.tel + ' ' + i.client.email + ' ' + i.client.ville : '';
      return (i.nomClient + ' ' + i.vehiculeTexte + ' ' + i.immat + ' ' + d.numero + ' ' + (d.panne || '') + ' ' + tel)
        .toLowerCase().replace(/[-\s]/g, '').includes(q.replace(/[-\s]/g, ''));
    });
  }
  return l.sort((a, b) => b.maj - a.maj);
}

function compteFiltre(id) {
  const sauve = S.filtreDevis, sauveQ = S.recherche;
  S.filtreDevis = id; S.recherche = '';
  const n = devisFiltres().length;
  S.filtreDevis = sauve; S.recherche = sauveQ;
  return n;
}

/* ==========================================================================
   ÉCRAN — planning partagé
   Une semaine, six jours, les trois personnes côte à côte. Chacun peut poser
   et déplacer ce qu'il veut : c'est un tableau commun, pas un agenda privé.
   ========================================================================== */
const minuit = (ts) => { const d = new Date(ts); d.setHours(0, 0, 0, 0); return d.getTime(); };

/* Avancer de n jours par le CALENDRIER, jamais en ajoutant 24 h. Deux nuits
   par an ne durent pas 24 h : fin octobre, « demain » calculé en millisecondes
   retombe sur aujourd'hui, et fin mars il saute un jour. */
const jourPlus = (ts, n) => { const d = new Date(ts); d.setDate(d.getDate() + n); d.setHours(0, 0, 0, 0); return d.getTime(); };

/* Le planning se regarde au mois, une semaine à la fois. On liste les lundis
   qui touchent le mois affiché — quatre le plus souvent, cinq ou six parfois,
   selon le jour où il tombe. Chacun devient un onglet, et on glisse de l'un à
   l'autre du doigt. */
function semainesDuMois(decalageMois) {
  const base = new Date();
  base.setHours(0, 0, 0, 0);
  base.setDate(1);
  base.setMonth(base.getMonth() + (Number(decalageMois) || 0));
  const mois = base.getMonth(), an = base.getFullYear();

  // le lundi de la semaine où tombe le 1er du mois
  const premier = new Date(base);
  premier.setDate(premier.getDate() - ((premier.getDay() + 6) % 7));

  // le dernier jour du mois
  const dernier = new Date(an, mois + 1, 0);
  dernier.setHours(0, 0, 0, 0);

  const semaines = [];
  const curseur = new Date(premier);
  while (curseur.getTime() <= dernier.getTime()) {
    const lundi = curseur.getTime();
    const dimanche = new Date(curseur);
    dimanche.setDate(dimanche.getDate() + 6);
    dimanche.setHours(23, 59, 59, 999);      // la semaine tient jusqu'au bout du dimanche
    /* Toute semaine qui touche le mois compte, même pour un seul jour :
       autrement un 30 tombant un lundi deviendrait impossible à planifier.
       Quatre onglets le plus souvent, cinq souvent, six quand un mois de 31
       jours commence un samedi — mieux vaut un onglet de plus qu'un jour
       inatteignable. */
    let jours = 0;
    for (let k = 0; k < 7; k++) {
      const d = new Date(curseur); d.setDate(d.getDate() + k);
      if (d.getMonth() === mois && d.getFullYear() === an) jours++;
    }
    if (jours) semaines.push({ lundi, dimanche: dimanche.getTime(), jours });
    curseur.setDate(curseur.getDate() + 7);
    if (semaines.length > 6) break;                 // garde-fou
  }
  return { semaines, mois, an, debut: base.getTime() };
}

/** Où se trouve aujourd'hui dans ce mois-là ? -1 s'il n'y est pas. */
function semaineDuJour(semaines) {
  const j = minuit(Date.now());
  return semaines.findIndex(s => j >= s.lundi && j <= s.dimanche);
}

/* La semaine qu'on regarde : celle qu'on a choisie tant qu'elle existe dans ce
   mois, sinon celle du jour. Tout ce qui a besoin de la connaître passe par
   ici — le titre de l'écran est calculé avant la grille, et s'il se posait la
   question dans son coin il annoncerait la semaine 1 pendant que la grille
   affiche déjà la semaine en cours. */
function semaineAffichee(mois) {
  if (S.semaineDuMois === undefined || S.semaineDuMois === null
      || S.semaineDuMois < 0 || S.semaineDuMois >= mois.semaines.length) {
    const i = semaineDuJour(mois.semaines);
    S.semaineDuMois = i >= 0 ? i : 0;
  }
  return S.semaineDuMois;
}

/** Est-on posé sur la semaine où tombe aujourd'hui ? */
function surLaSemaineDuJour() {
  const mois = semainesDuMois(S.moisPlanning || 0);
  return semaineDuJour(mois.semaines) === semaineAffichee(mois);
}

/** « Semaine du 17 au 22 août » — et le mois des deux bouts s'il change. */
function libelleSemaine(lundi, fin) {
  const mois = (t) => new Date(t).toLocaleDateString('fr-FR', { month: 'long' });
  const jour = (t) => new Date(t).getDate();
  const an = new Date(fin).getFullYear() === new Date().getFullYear()
    ? '' : ' ' + new Date(fin).getFullYear();
  return mois(lundi) === mois(fin)
    ? `Semaine du ${jour(lundi)} au ${jour(fin)} ${mois(fin)}${an}`
    : `Semaine du ${jour(lundi)} ${mois(lundi)} au ${jour(fin)} ${mois(fin)}${an}`;
}

/** Se poser sur la semaine qui contient ce lundi-là, dans le mois qu'il faut.

    Une semaine à cheval appartient aux deux mois qu'elle touche : la dernière
    d'août est aussi la première de septembre. Compter en « mois + rang »
    tombait donc deux fois sur la même semaine à chaque changement de mois, et
    la flèche paraissait morte une fois par mois. On cherche la semaine par sa
    date, et le mois suit. */
function poserSemaine(lundi) {
  const cible = minuit(lundi);
  const depart = S.moisPlanning || 0;
  // le mois courant d'abord : une semaine à cheval reste là où on la regardait
  for (const dec of [0, 1, -1, 2, -2]) {
    const m = semainesDuMois(depart + dec);
    const i = m.semaines.findIndex(s => cible >= s.lundi && cible <= s.dimanche);
    if (i >= 0) { S.moisPlanning = depart + dec; S.semaineDuMois = i; return true; }
  }
  return false;
}

/* Passer à la semaine voisine — en jours de calendrier, jamais en ajoutant
   7 × 24 h : la semaine du changement d'heure ne dure pas 168 heures. */
/* Changer de semaine, et se replacer au bon bout : on entre dans la semaine
   suivante par le lundi, et dans la précédente par le samedi — c'est le sens de
   la lecture, et celui du doigt qui vient de pousser. */
function glisserSemaine(sens, parLeDoigt) {
  const mois = semainesDuMois(S.moisPlanning || 0);
  const sem = mois.semaines[semaineAffichee(mois)];
  const d = new Date(sem.lundi);
  d.setDate(d.getDate() + sens * 7);
  poserSemaine(d.getTime());
  S.planningScroll = parLeDoigt && sens < 0 ? 'fin' : 0;
  rendre();
}

/** Durée probable d'une intervention, déduite du montant de main d'œuvre. */
function dureeEstimee(d) {
  if (!d || !d.lignes.length) return Number(DB.etat.reglages.dureeDefaut) || 1;
  const mo = d.lignes.filter(l => l.type !== 'piece').reduce((s, l) => s + l.qte * l.prixHT, 0);
  /* Un taux horaire vidé dans les réglages donnait une durée infinie, qui
     partait ensuite dans le rendez-vous et dans la charge de la journée. */
  const affiche = DB.estPro(DB.client(d.clientId)) ? DB.etat.reglages.tauxHorairePro : DB.etat.reglages.tauxHoraire;
  const taux = Number(affiche) > 0 ? Number(affiche) : 1;
  return Math.max(0.5, Math.round((mo / taux) * 2) / 2);
}

function libelleRdv(p) {
  return p.prestation || 'Rendez-vous';
}
/** Prestation principale d'un devis, pour pré-remplir un rendez-vous. */
function prestationDeDevis(d) {
  if (!d) return '';
  const l = d.lignes.find(x => x.type !== 'piece');
  return l ? l.libelle : (d.panne || '');
}

/** Immatriculation du véhicule concerné, si le rendez-vous porte un devis. */
/* Un créneau posé à la main porte sa plaque et sa marque ; un créneau rattaché
   à un devis les tient du véhicule. On demande d'abord ce qui a été saisi : ce
   que quelqu'un a écrit à la main l'emporte sur ce qu'on devine. */
function immatRdv(p) {
  if (String(p.immat || '').trim()) return p.immat.trim();
  const d = p.devisId ? DB.devis(p.devisId) : null;
  const v = d ? DB.vehicule(d.vehiculeId) : null;
  return v ? v.immat : '';
}

/** La marque du véhicule attendu — celle qu'on écrit dans le SMS. */
function marqueRdv(p) {
  if (String(p.marque || '').trim()) return p.marque.trim();
  const d = p.devisId ? DB.devis(p.devisId) : null;
  const v = d ? DB.vehicule(d.vehiculeId) : null;
  return v ? (v.marque + ' ' + (v.modele || '')).trim() : '';
}

/** Le portable où prévenir : celui du créneau, sinon celui du dossier. */
function telRdv(p) {
  if (String(p.tel || '').trim()) return p.tel.trim();
  const c = p.demandeur ? DB.client(p.demandeur)
          : (p.devisId && DB.devis(p.devisId) ? DB.client(DB.devis(p.devisId).clientId) : null);
  return c ? String(c.tel || '').trim() : '';
}

/** Les rendez-vous d'un jour : de tout le monde, ou d'une seule personne. Les
 *  créneaux annulés en font partie — barrés, ils ne comptent plus dans la
 *  charge, mais on voit le trou et pourquoi il est là. Les effacer d'office
 *  laisserait un blanc inexplicable au milieu d'une journée pleine. */
function rdvDu(jour, userId) {
  return DB.etat.planning
    .filter(p => minuit(p.jour) === jour && (userId === undefined || p.userId === userId))
    .sort((a, b) => (a.heure || '').localeCompare(b.heure || ''));
}

/** Les rendez-vous d'un jour qui tiennent encore. Un créneau rendu par le
 *  client n'occupe plus rien : il ne se compte ni dans la charge, ni dans ce
 *  qu'un confrère peut réserver, ni dans « au planning aujourd'hui ». Seul le
 *  planning le montre encore, barré, pour expliquer le trou. */
function rdvActifs(jour, userId) {
  return rdvDu(jour, userId).filter(p => !p.annule);
}

/** Ce que des clients ont décommandé et que personne n'a encore vu. */
function annulationsClient() {
  return DB.etat.planning
    .filter(p => p.annule && !p.annuleVu)
    .sort((a, b) => (b.annule.quand || 0) - (a.annule.quand || 0));
}

/** Devis validés qui n'ont encore aucun créneau. */
function aPlanifier() {
  const poses = new Set(DB.etat.planning.filter(p => !p.annule).map(p => p.devisId).filter(Boolean));
  return DB.etat.devis.filter(d => ['accepte', 'commande', 'encours'].includes(d.statut) && !poses.has(d.id));
}

const heuresFr = (h) => (h % 1 === 0 ? h + ' h' : Math.floor(h) + ' h ' + Math.round((h % 1) * 60));

/* ==========================================================================
   Le planning en demi-journées
   --------------------------------------------------------------------------
   Un garage ne travaille pas d'une traite : il y a le matin, et il y a
   l'après-midi. Le planning suit cette coupure au lieu de la masquer — chaque
   journée tient en deux demi-journées, S1 de 9 h à midi et S2 de 14 h à 18 h,
   chacune avec sa propre frise. « Mardi matin est plein, mardi après-midi est
   libre » se lit d'un coup d'œil, ce qu'une frise continue ne disait qu'à
   moitié.

   La semaine se lit comme un agenda : les jours en colonnes sur une seule
   ligne, le temps qui descend. Un rendez-vous prend sa vraie place et sa vraie
   hauteur dans sa demi-journée ; deux qui se chevauchent se partagent la
   largeur de la journée plutôt que de se cacher l'un l'autre.
   ========================================================================== */

/** Le nom d'une demi-journée : S1 le matin, S2 l'après-midi. */
const nomDemi = (i) => 'S' + (i + 1);

/** 540 -> « 9 h », 750 -> « 12 h 30 ». Pour les titres, pas pour les champs. */
const heureCourte = (m) => Math.floor(m / 60) + (m % 60 ? ' h ' + String(m % 60).padStart(2, '0') : ' h');

/** Où tombe une minute dans une demi-journée, en % de sa largeur. */
function posDemi(minutes, [a, b]) {
  return Math.min(100, Math.max(0, ((minutes - a) / (b - a)) * 100));
}

/** À quelle demi-journée revient un rendez-vous : la première qui n'est pas
 *  encore finie quand il commence. Un créneau posé pendant la coupure du midi
 *  revient donc à l'après-midi qui suit, pas au matin qui est clos. */
function demiDuRdv(debut, tranches) {
  for (let i = 0; i < tranches.length; i++) if (debut < tranches[i][1]) return i;
  return tranches.length - 1;
}

/** Ranger une journée : les rendez-vous placés, demi-journée par demi-journée,
 *  chacun avec sa ligne — deux rendez-vous qui se chevauchent ne se cachent
 *  pas l'un l'autre. */
function lignesDemi(rdv, tranches) {
  const demis = tranches.map(() => ({ poses: [], colonnes: [] }));
  rdv.forEach(p => {
    const debut = enMinutes(p.heure, tranches[0][0]);
    const fin = debut + (Number(p.duree) || 1) * 60;
    const i = demiDuRdv(debut, tranches);
    const t = tranches[i];
    const d = demis[i];
    const y = posDemi(debut, t);
    /* Un quart d'heure ne doit pas se réduire à un filet : une boîte garde une
       hauteur lisible, quitte à mordre un peu sur la suivante. */
    const y2 = Math.min(100, Math.max(posDemi(fin, t), y + 6));
    let col = d.colonnes.findIndex(bas => y >= bas - 0.01);
    if (col < 0) col = d.colonnes.length;
    d.colonnes[col] = y2;
    d.poses.push({
      p, y, hauteur: y2 - y, col,
      /* Posé hors de sa demi-journée — dans la coupure, avant l'ouverture,
         après la fermeture. La boîte mentirait sur sa place : on le dit. */
      hors: debut < t[0] || debut >= t[1],
      /* Commencé dans cette demi-journée, fini après elle : la boîte s'arrête
         au bord, en pointillé, plutôt que de faire croire qu'elle s'achève à
         midi. */
      deborde: fin > t[1]
    });
  });
  /* Combien de colonnes se partagent la journée : c'est ce qui donne sa
     largeur à chaque boîte. */
  return demis.map(d => ({ poses: d.poses, cols: Math.max(1, d.colonnes.length) }));
}

/** Les heures d'une demi-journée. Avec les bords pour l'échelle qu'on écrit à
 *  gauche, sans eux pour les repères tracés dans la journée. */
function marquesDemi([a, b], bords) {
  const out = [];
  const debut = bords ? Math.ceil(a / 60) * 60 : Math.ceil((a + 1) / 60) * 60;
  for (let m = debut; bords ? m <= b : m < b; m += 60) {
    const pos = ((m - a) / (b - a)) * 100;
    out.push({ m, pos, texte: heureCourte(m), bord: pos === 0 ? 'haut' : pos === 100 ? 'bas' : '' });
  }
  return out;
}

function vuePlanning() {
  const mois = semainesDuMois(S.moisPlanning || 0);
  // à l'ouverture on se pose sur la semaine en cours, si elle est dans ce mois
  const sem = mois.semaines[semaineAffichee(mois)] || mois.semaines[0];
  const lundi = sem.lundi;
  const jours = JOURS_SEMAINE.slice(0, DB.etat.reglages.joursOuvres || 6)
    /* On avance de jour en jour par le calendrier, jamais en ajoutant 24 h :
       la nuit du changement d'heure ne dure pas 24 h, et « lundi + 6 jours »
       tomberait à 23 h la veille — le samedi disparaîtrait du planning. */
    .map((nom, n) => {
      const d = new Date(lundi);
      d.setDate(d.getDate() + n);
      d.setHours(0, 0, 0, 0);
      return { nom, n, ts: d.getTime() };
    });
  const aujourdhui = minuit(Date.now());
  const attente = aPlanifier();

  /* Suivre une personne ne change pas la forme du planning : on retire
     simplement les rendez-vous des autres. Le jour reste le jour. */
  const suivi = S.planningQui && DB.utilisateur(S.planningQui) ? S.planningQui : null;
  /* Montrer ce qui a été rendu explique les trous ; le cacher rend la semaine
     plus nette. Les deux se défendent — c'est un réglage. */
  const gardeAnnules = DB.etat.reglages.planningAnnules !== false;
  const rdvVus = (ts) => rdvDu(ts, suivi || undefined).filter(p => gardeAnnules || !p.annule);

  // au-delà de quoi une journée est pleine : une personne, ou tout l'atelier
  const equipe = suivi ? 1 : Math.max(1, DB.etat.utilisateurs.length);
  const capaciteDu = (ts) => heuresOuvertes(DB.etat.reglages, rangJour(ts)) * equipe;

  const tranches = tranchesOuverture(DB.etat.reglages);
  const minuteCourante = new Date().getHours() * 60 + new Date().getMinutes();
  /* Chaque journée est rangée une fois pour toutes : la grille la relit une
     fois par demi-journée, et rien ne gagne à la ranger deux fois. */
  const range = jours.map(j => lignesDemi(rdvVus(j.ts), tranches));

  /* La demi-journée d'un jour : les repères d'heures, ce qui y est posé, et le
     trait du moment présent quand il y tombe — c'est lui qui dit où on en est. */
  /* Ce qui, dans cette demi-journée, est fermé pour CE jour-là : l'atelier
     n'ouvre pas encore, il a déjà fermé, ou il est en congés. On le peint en
     hachures plutôt que de l'effacer — un trou sans explication ressemble à un
     créneau libre, et c'est comme ça qu'on promet une heure qu'on ne tiendra
     pas. */
  const bandesFermees = (jour, t) => {
    const ferm = fermetureDu(jour.ts);
    const h = horairesDuJour(DB.etat.reglages, rangJour(jour.ts));
    if (ferm || h.ferme) return [{ a: 0, b: 100, motif: ferm ? (ferm.motif || 'Fermé') : 'Fermé' }];
    const siennes = tranchesOuverture(DB.etat.reglages, rangJour(jour.ts));
    const bandes = [];
    let curseur = t[0];
    siennes.filter(([a, b]) => b > t[0] && a < t[1]).forEach(([a, b]) => {
      if (a > curseur) bandes.push({ a: posDemi(curseur, t), b: posDemi(a, t), motif: '' });
      curseur = Math.max(curseur, b);
    });
    if (curseur < t[1]) bandes.push({ a: posDemi(curseur, t), b: posDemi(t[1], t), motif: '' });
    return bandes.filter(x => x.b - x.a > 0.5);
  };

  const piste = (jour, i, demi) => {
    const t = tranches[i];
    const passe = jour.ts < aujourdhui;
    const maintenant = jour.ts === aujourdhui && minuteCourante >= t[0] && minuteCourante <= t[1]
      ? posDemi(minuteCourante, t) : null;
    const fermees = bandesFermees(jour, t);
    const toutFerme = fermees.some(f => f.a <= 0.5 && f.b >= 99.5);

    return `<div class="pl-piste ${jour.ts === aujourdhui ? 'jour-j' : ''} ${passe ? 'passe' : ''} ${
                 i ? 'coupe' : ''} ${toutFerme ? 'ferme' : ''}"
                 style="--heures:${(t[1] - t[0]) / 60};--n:${demi.cols}">
      ${fermees.map(f => `<span class="pl-ferme" style="--y:${f.a}%;--h:${f.b - f.a}%"${
        f.motif ? ` title="${esc(f.motif)}"` : ''}>${
        f.motif && f.b - f.a > 30 ? `<i>${esc(f.motif)}</i>` : ''}</span>`).join('')}
      ${marquesDemi(t).map(m => `<span class="pl-trait" style="--y:${m.pos}%"></span>`).join('')}
      ${maintenant !== null ? `<span class="pl-maintenant" style="--y:${maintenant}%"></span>` : ''}
      ${demi.poses.length || toutFerme ? '' : '<span class="pl-libre">libre</span>'}
      ${demi.poses.map(o => boiteRdv(o, t)).join('')}
      ${passe || toutFerme ? '' : `<button class="pl-plus" data-act="planif-nouveau"
        data-jour="${jour.ts}" data-heure="${enHeure(t[0])}" data-user="${S.planningQui || S.userId}"
        title="Ajouter un rendez-vous — ${nomDemi(i)}, ${heureCourte(t[0])} à ${heureCourte(t[1])}">${ic('plus')}</button>`}
    </div>`;
  };

  /* Une boîte porte la couleur de la personne, son heure et son client. Trop
     courte pour tout dire, elle garde l'essentiel — le survol dit le reste. */
  const boiteRdv = ({ p, y, hauteur, col, hors, deborde }, t) => {
    const u = DB.utilisateur(p.userId);
    const e = EMPLACEMENTS[p.emplacement] || EMPLACEMENTS.sol;
    const immat = immatRdv(p);
    return `<button class="pl-bloc ${p.fait ? 'fini' : ''} ${p.emplacement === 'pont' ? 'pont' : ''} ${
                hors ? 'hors' : ''} ${deborde ? 'deborde' : ''} ${p.annule ? 'annule' : ''}"
              style="--teinte:${u ? u.teinte : 220};--y:${y}%;--h:${hauteur}%;--c:${col}"
              data-act="planif-ouvrir" data-id="${p.id}"
              title="${esc(p.heure)} · ${heuresFr(p.duree)} · ${esc(libelleRdv(p))}${
                p.client ? ' · ' + esc(p.client) : ''}${u ? ' · ' + esc(u.nom) : ''}${
                immat ? ' · ' + esc(immat) : ''} · ${esc(e.nom)}${
                hors ? ' — posé hors des heures ouvertes' : ''}${
                deborde ? ' — déborde après ' + heureCourte(t[1]) : ''}${
                p.annule ? ' — ANNULÉ par le client le ' + dateCourte(p.annule.quand) : ''}">
      <span class="pl-bloc-tete">
        <span class="pl-bloc-h">${esc(p.heure)}</span>
        <span class="pl-bloc-t">${esc(p.client || libelleRdv(p))}</span>
      </span>
      <span class="pl-bloc-s">${esc(libelleRdv(p))}${immat ? ' · ' + esc(immat) : ''}</span>
    </button>`;
  };

  const fin = jours[jours.length - 1].ts;

  /* Poser un rendez-vous à la main ne doit pas dépendre du survol d'une case :
     on prend un appel debout, avec un téléphone dans une main. Le bouton se
     pose sur le premier jour ouvrable de la semaine affichée — jamais dans le
     passé, où rien ne peut se planifier. */
  const jourNouveau = Math.max(lundi, aujourdhui);

  return entete('Planning', libelleSemaine(lundi, fin),
    `<button class="btn plein" data-act="planif-nouveau"
             data-jour="${jourNouveau}" data-user="${S.planningQui || S.userId}">
       ${ic('plus')} Nouveau rendez-vous</button>
     <div class="segments">
       <button data-act="planif-semaine" data-id="-1" title="Semaine précédente">${ic('retour')}</button>
       <button data-act="planif-semaine" data-id="0" class="${surLaSemaineDuJour() ? 'on' : ''}">Cette semaine</button>
       <button data-act="planif-semaine" data-id="1" title="Semaine suivante">${ic('fleche')}</button>
     </div>`
  ) + `<div class="corps pile">

    ${(() => {
      /* Ce que des clients ont rendu depuis le dernier passage. C'est la
         première chose à lire en ouvrant le planning : une place s'est libérée,
         et quelqu'un ne viendra pas. */
      const rendus = annulationsClient();
      if (!rendus.length) return '';
      return `<section class="carte annulations">
        <div class="carte-tete">
          <h2>${rendus.length} rendez-vous annulé${rendus.length > 1 ? 's' : ''} par ${
            rendus.length > 1 ? 'des clients' : 'le client'}</h2>
          <button class="btn nu" style="margin-left:auto" data-act="annul-toutes-vues">Tout classer</button>
        </div>
        <div class="carte-corps pile" style="gap:8px">
          ${rendus.map(p => {
            const quoi = [marqueRdv(p), immatRdv(p)].filter(x => x && x !== '—').join(' · ');
            return `<div class="annul-ligne">
              <div style="min-width:0">
                <b>${esc(p.client || 'Client')}</b> — ${esc(dateCourte(p.jour))} à ${esc(p.heure || '')}
                ${quoi ? `<div class="mini">${esc(quoi)}${p.prestation ? ' · ' + esc(p.prestation) : ''}</div>` : ''}
                <div class="mini">Annulé ${esc(dateCourte(p.annule.quand))}, le créneau est libre.</div>
              </div>
              <button class="btn nu" data-act="annul-vue" data-id="${p.id}"
                      title="Ne plus le compter — le créneau reste barré au planning">${ic('check')} Vu</button>
              <button class="btn nu" data-act="annul-effacer" data-id="${p.id}"
                      title="Retirer du planning">${ic('poubelle')}</button>
            </div>`;
          }).join('')}
        </div>
      </section>`;
    })()}

    ${attente.length ? `<section class="carte">
      <div class="carte-tete">
        <h2>À planifier</h2>
        <span class="pousse etiq" style="margin-left:auto">${attente.length} devis validé${attente.length > 1 ? 's' : ''} sans créneau</span>
      </div>
      <div class="carte-corps rangee" style="gap:8px">
        ${attente.map(d => {
          const i = infosDevis(d);
          return `<button class="a-poser" data-act="planif-nouveau" data-devis="${d.id}"
                    data-jour="${Math.max(lundi, aujourdhui)}" data-user="${S.planningQui || S.userId}">
            <b>${esc(i.vehiculeTexte)}</b>
            <span>${esc(i.nomClient)} · ${esc(i.immat)} · ${heuresFr(dureeEstimee(d))} estimées</span>
          </button>`;
        }).join('')}
      </div>
    </section>` : ''}

    ${(() => {
      /* Passer l'atelier à cinq jours cache le samedi, mais n'efface pas ce qui
         y était posé : l'onglet le compterait sans qu'on puisse le voir. On le
         dit, plutôt que de laisser un chiffre sans explication. */
      const visibles = new Set(jours.map(j => j.ts));
      const caches = DB.etat.planning.filter(p => {
        const t = minuit(p.jour);
        return t >= sem.lundi && t <= sem.dimanche && !visibles.has(t);
      });
      if (!caches.length) return '';
      const noms = [...new Set(caches.map(p =>
        new Date(p.jour).toLocaleDateString('fr-FR', { weekday: 'long' })))].join(' et ');
      return `<div class="encart alerte">
        <b>${caches.length} rendez-vous ${caches.length > 1 ? 'sont posés' : 'est posé'} un ${esc(noms)}</b>,
        jour que vous n'avez pas déclaré ouvré — ${caches.length > 1 ? 'ils n\'apparaissent' : 'il n\'apparaît'} donc pas
        ci-dessous. Repassez le planning à six jours dans les paramètres, ou déplacez-${caches.length > 1 ? 'les' : 'le'}.
      </div>`;
    })()}

    ${/* La couleur remplace la colonne : on rappelle qui porte laquelle, et le
          rappel sert de filtre — un clic sur quelqu'un ne garde que sa
          journée, un second rend le planning à tout l'atelier. */ ''}
    <div class="pl-legende">
      <button class="pl-leg ${suivi ? '' : 'on'}" data-act="planif-qui" data-id="">Tout l'atelier</button>
      ${DB.etat.utilisateurs.map(u => `<button class="pl-leg ${suivi === u.id ? 'on' : ''}"
          data-act="planif-qui" data-id="${u.id}">
        <span class="jeton-mini" style="--teinte:${u.teinte}">${esc(u.init)}</span>${esc(u.nom)}
      </button>`).join('')}
    </div>

    ${/* Les six jours tiennent sur une ligne et le temps descend, comme dans
          un agenda : l'échelle des heures à gauche, une colonne par jour. Sur
          téléphone la grille garde ses colonnes et glisse latéralement —
          l'échelle, elle, reste collée à gauche. */ ''}
    <div class="planning-cadre">
      <div class="planning" id="planning-glisse"
           style="--jours:${jours.length};--pas-h:${
             Math.min(120, Math.max(34, Number(DB.etat.reglages.planningPasH) || 62))}px">
        <div class="pl-coin"></div>
        ${jours.map(j => {
          // un créneau rendu ne charge plus la journée : il ne se compte plus
          const charge = rdvVus(j.ts).filter(x => !x.annule).reduce((s, p) => s + p.duree, 0);
          const capa = capaciteDu(j.ts);
          const plein = capa > 0 && charge > capa;
          const ferm = fermetureDu(j.ts);
          const clos = ferm || horairesDuJour(DB.etat.reglages, rangJour(j.ts)).ferme;
          return `<div class="pl-jour ${j.ts === aujourdhui ? 'jour-j' : ''} ${
                       j.ts < aujourdhui ? 'passe' : ''} ${clos ? 'clos' : ''}">
            <b>${esc(j.nom)}</b>
            <span class="num">${dateCourte(j.ts)}</span>
            ${/* Chaque demi-journée dit déjà si elle est libre : le répéter ici
                  ferait écrire « libre » trois fois sur une journée vide. */ ''}
            ${clos ? `<span class="pl-charge clos" title="${esc(ferm ? (ferm.motif || 'Fermé') : 'Jour non travaillé')}">${
                       esc(ferm ? (ferm.motif || 'Fermé') : 'Fermé')}${
                       charge ? ' · ' + heuresFr(charge) + ' pris' : ''}</span>`
                   : charge ? `<span class="pl-charge ${plein ? 'plein' : ''}">${heuresFr(charge)}</span>` : ''}
          </div>`;
        }).join('')}

        ${/* Une rangée par demi-journée : son échelle, puis les six jours. */ ''}
        ${tranches.map((t, i) => `
          <div class="pl-rail ${i ? 'coupe' : ''}" style="--heures:${(t[1] - t[0]) / 60}">
            <span class="pl-demi" title="${heureCourte(t[0])} à ${heureCourte(t[1])}">${nomDemi(i)}</span>
            ${marquesDemi(t, true).map(m =>
              `<span class="pl-h ${m.bord}" style="--y:${m.pos}%">${m.texte}</span>`).join('')}
          </div>
          ${jours.map((j, n) => piste(j, i, range[n][i])).join('')}
        `).join('')}
      </div>
    </div>
  </div>`;
}

/* ==========================================================================
   ÉCRAN — pense-bête
   Chacun le sien. Aucune statistique : juste ce qu'il reste à faire.
   ========================================================================== */
function mesMemos(inclureFaits) {
  return DB.etat.memos
    .filter(m => m.userId === (S.memoDe || S.userId))
    .filter(m => inclureFaits || !m.fait)
    .sort((a, b) => (a.fait - b.fait) || ((a.quand || 8e15) - (b.quand || 8e15)) || (b.cree - a.cree));
}

function echeanceTexte(m) {
  if (!m.quand) return { txt: 'Sans date', ton: '' };
  const jour = new Date(m.quand); jour.setHours(0, 0, 0, 0);
  const aujourdhui = new Date(); aujourdhui.setHours(0, 0, 0, 0);
  const ecart = Math.round((jour - aujourdhui) / JOUR);
  if (ecart < 0)  return { txt: 'En retard de ' + (-ecart) + ' j', ton: 'color:var(--occupe);font-weight:700' };
  if (ecart === 0) return { txt: "Aujourd'hui", ton: 'color:var(--accent);font-weight:700' };
  if (ecart === 1) return { txt: 'Demain', ton: '' };
  return { txt: dateCourte(m.quand), ton: '' };
}

function vueMemos() {
  const qui = S.memoDe || S.userId;
  const u = DB.utilisateur(qui);
  const liste = mesMemos(S.memosFaits);
  const restants = mesMemos(false).length;

  const carte = (m) => {
    const t = TYPES_MEMO[m.type] || TYPES_MEMO.note;
    const e = echeanceTexte(m);
    return `<div class="item" style="align-items:flex-start">
      <button class="btn nu" data-act="memo-fait" data-id="${m.id}"
              title="${m.fait ? 'Remettre à faire' : 'C\'est fait'}"
              style="color:${m.fait ? 'var(--libre)' : 'var(--encre-3)'};padding:2px">
        ${ic(m.fait ? 'coche' : 'carre')}
      </button>
      <span class="item-txt">

/* ==========================================================================
   ÉCRAN — parc / parking
   ========================================================================== */
const CELL_W = 62, CELL_H = 98, BAY_W = 52, BAY_H = 86;
const ALLEE = 30;            // allée de circulation entre deux rangées
const MARGE_H = 14;          // respiration en haut du plan
const MARGE_B = 14;          // respiration en bas
const MARGE_G = 54;          // bande de gauche, où s'écrit le nom de la rangée
/* Vue de face, simplement basculée : sans rotation dans le plan, le parc
   n'occupe plus que sa propre largeur au lieu de s'étaler en diagonale.
   Le volume des voitures reste visible, et le plan tient bien plus gros
   à l'écran — surtout sur un téléphone. */
const INCL_X = 52, INCL_Z = 0;

/* Hauteur des hampes qui portent les immatriculations. Zoom faible = places
   étroites : on décale une colonne sur deux pour que les étiquettes ne se
   marchent pas dessus. Zoom fort = places larges, plus besoin. */
const hampeMax = (zoom) => (zoom < 1.2 ? 96 : 40);
const hampe = (zoom, col) => (zoom < 1.2 && col % 2 ? hampeMax(zoom) : 40);

/* L'étiquette s'adapte à la largeur réellement disponible sur la place.
   Un parc plein sur un téléphone ne peut pas porter 18 plaques entières :
   au lieu de les empiler jusqu'à ne plus rien voir, on garde le bloc de
   chiffres, qui suffit à distinguer les voitures. La plaque complète reste
   dans la liste en dessous et sur la fiche. */
function etiquettePlaque(immat, largeurPlace) {
  const plein = String(immat || '');
  if (largeurPlace >= 60) return plein;
  if (largeurPlace >= 30) {
    const morceaux = plein.split('-');
    if (morceaux.length === 3) return morceaux[1];
    const chiffres = plein.match(/\d+/);
    return chiffres ? chiffres[0] : plein.slice(0, 4);
  }
  return '';
}

/** Encombrement du plan une fois basculé, pour dimensionner le cadre.
 *  La marge du haut suit la hauteur réelle des étiquettes. */
function boiteScene(l, h, zoom, iso) {
  if (!iso) return { w: Math.ceil(l * zoom) + 20, h: Math.ceil(h * zoom) + 20 };
  const rx = INCL_X * Math.PI / 180, rz = Math.abs(INCL_Z) * Math.PI / 180;
  const hp = h * Math.cos(rx);
  const etiquettes = hampeMax(zoom) * Math.sin(rx) * zoom;
  return {
    w: Math.ceil((l * Math.cos(rz) + hp * Math.sin(rz)) * zoom) + 44,
    h: Math.ceil((l * Math.sin(rz) + hp * Math.cos(rz)) * zoom) + 40 + Math.ceil(etiquettes)
  };
}

const PEAUX = ['#b6bcc2', '#57626d', '#8b9aa6', '#c3c8cc', '#6a7a86', '#9aa1a7', '#7b8c96'];
function peauVoiture(immat) {
  let h = 0;
  for (let i = 0; i < immat.length; i++) h = (h * 31 + immat.charCodeAt(i)) % 9973;
  return PEAUX[h % PEAUX.length];
}

/* Les filtres portent la couleur qu'ils désignent : ils servent de légende
   en même temps. Une seule barre au lieu de deux. */
/* Libellés courts pour que la bande tienne en une ligne ; le nom complet
   reste en infobulle et sur la fiche du véhicule. */
const FILTRES_PARC = [
  { id: 'libre',   nom: 'Libres',    aide: 'Places libres',             ton: 'var(--libre)' },
  { id: 'occupe',  nom: 'Occupées',  aide: 'Places occupées',           ton: 'var(--occupe)' },
  { id: 'diag',    nom: 'Diag',      aide: 'Diagnostic à faire',        ton: 'var(--occupe)' },
  { id: 'devis',   nom: 'Devis',     aide: 'Devis en attente',          ton: 'var(--attente)' },
  { id: 'piece',   nom: 'Pièce',     aide: 'Attente pièce',             ton: 'var(--attente)' },
  { id: 'travaux', nom: 'Travaux',   aide: 'Travaux en cours',          ton: 'var(--actif)' },
  { id: 'gros',    nom: 'Gros',      aide: 'Gros travaux',              ton: 'var(--gros)' },
  { id: 'perso',   nom: 'Perso',     aide: 'Véhicule du personnel',     ton: 'var(--perso)' },
  { id: 'pret',    nom: 'Prêt',      aide: 'Terminé, à restituer',      ton: 'var(--libre)' },
  { id: 'long',    nom: 'Immobilisés', aide: 'Immobilisés trop longtemps', ton: 'var(--occupe)' }
];

/** Une place passe-t-elle les filtres en cours ? */
function placeVisible(p) {
  if (S.parcCote !== 'tous' && p.nature !== S.parcCote) return false;
  const o = DB.occupation(p.id);
  const f = S.parcFiltre;
  if (f === 'tous') return true;
  if (f === 'libre') return !o;
  if (!o) return false;
  if (f === 'occupe') return true;
  if (f === 'long') return joursDepuis(o.depuis) >= DB.etat.reglages.immobilisationAlerte;
  return o.etat === f;
}

/** Même chose côté liste, à partir d'une occupation. */
function occCorrespond(o) {
  if (estDansLaRue(o.placeId)) {
    // la rue n'appartient à aucun côté du parc
    if (S.parcCote !== 'tous') return false;
    if (S.parcFiltre === 'tous') return true;
    if (S.parcFiltre === 'libre') return false;
    if (S.parcFiltre === 'occupe') return true;
    if (S.parcFiltre === 'long') return joursDepuis(o.depuis) >= DB.etat.reglages.immobilisationAlerte;
    return o.etat === S.parcFiltre;
  }
  const p = DB.place(o.placeId);
  return p ? placeVisible(p) : false;
}

/* Places libres de chaque côté du parc.
   Un véhicule du personnel n'est pas un travail en cours : peu importe où il
   est garé, il prend juste de la place. On le retire donc des deux compteurs
   à parts égales, en commençant par le côté le plus dégagé, pour que la
   mécanique et l'électronique restent équilibrées. */
function placesLibresParCote() {
  const travail = new Set(DB.etat.occupations.filter(o => o.etat !== 'perso').map(o => o.placeId));
  const cote = (nature) => {
    // une place hors service ne compte ni comme libre ni dans le total
    const ps = PLACES.filter(p => p.nature === nature && p.type !== 'hs');
    return { libres: ps.filter(p => !travail.has(p.id)).length, total: ps.length };
  };
  const meca = cote('meca'), electro = cote('electro');

  let perso = DB.etat.occupations.filter(o => o.etat === 'perso').length;
  while (perso > 0 && (meca.libres > 0 || electro.libres > 0)) {
    if (meca.libres >= electro.libres && meca.libres > 0) meca.libres--;
    else if (electro.libres > 0) electro.libres--;
    perso--;
  }
  return { meca, electro };
}

function tonEtat(e) {
  return { arrivee: 'var(--actif)', diag: 'var(--occupe)', devis: 'var(--attente)',
           piece: 'var(--attente)', travaux: 'var(--actif)', gros: 'var(--gros)',
           perso: 'var(--perso)', pret: 'var(--libre)' }[e] || 'var(--mort)';
}

/* --- pièces d'une intervention --------------------------------------------
   La liste vient des lignes « pièce » du devis ; l'état de commande est
   stocké sur l'occupation, pour que le devis reste le document de référence.
   -------------------------------------------------------------------------- */
function piecesDe(occ) {
  const d = occ.devisId ? DB.devis(occ.devisId) : null;
  if (!d) return [];
  return d.lignes.filter(l => l.type === 'piece').map(l => ({
    id: l.id, libelle: l.libelle, ref: l.ref || '', qte: l.qte,
    etat: (occ.pieces && occ.pieces[l.id]) || 'a_commander'
  }));
}
function piecesEnRetard(occ) {
  return piecesDe(occ).filter(p => p.etat !== 'recue').length;
}

function vueParking() {
  const maxCol = Math.max(...PLACES.map(p => p.col));
  const maxRang = Math.max(...PLACES.map(p => p.rang));
  const rangY = (r) => MARGE_H + r * (CELL_H + ALLEE);
  const largeur = MARGE_G + (maxCol + 1) * CELL_W;
  const hauteur = rangY(maxRang) + CELL_H + MARGE_B;

  /* Tant que personne n'a touché aux boutons +/−, le plan se met au plus gros
     que l'écran permet. Sur téléphone on ne descend pas sous 0,75 : en dessous
     les immatriculations ne se lisent plus — le cadre glisse latéralement. */
  if (S.parcZoom === null) {
    const petit = window.innerWidth <= 900;
    const rail = petit ? 0 : 233;
    const marges = (petit ? 24 : 52) + 32;
    const nature = boiteScene(largeur, hauteur, 1, S.parcVue === 'iso');
    const surLarge = (window.innerWidth - rail - marges) / nature.w;
    const surHaut = (window.innerHeight * (petit ? 0.52 : 0.66)) / nature.h;
    S.parcZoom = Math.min(2.4, Math.max(petit ? 0.75 : 0.6, Math.min(surLarge, surHaut)));
  }
  const boite = boiteScene(largeur, hauteur, S.parcZoom, S.parcVue === 'iso');

  const libres = placesLibres().length;
  const occupees = PLACES.length - libres;

  const titresZones = ZONES.map(z => {
    const ps = PLACES.filter(p => p.zone === z.id);
    if (!ps.length) return '';
    // le nom se pose dans la bande de gauche, à hauteur de sa rangée
    const rang = Math.min(...ps.map(p => p.rang));
    const libresZone = ps.filter(p => !DB.occupation(p.id)).length;
    return `<div class="zone-titre face-cam" title="${esc(z.detail)}"
        style="left:4px;top:${rangY(rang) + BAY_H / 2 + 8}px">
      <b>${esc(z.id)}</b><span>${libresZone}/${ps.length}</span>
    </div>`;
  }).join('');

  const bays = PLACES.map(p => {
    const o = DB.occupation(p.id);
    const v = o ? DB.vehicule(o.vehiculeId) : null;
    const visible = placeVisible(p);
    const jours = o ? joursDepuis(o.depuis) : 0;
    const vieux = o && jours >= DB.etat.reglages.immobilisationAlerte;
    const t = TYPE_PLACE[p.type] || TYPE_PLACE.std;
    const etiq = v ? etiquettePlaque(v.immat, BAY_W * S.parcZoom) : '';

    return `<div class="place ${S.placeId === p.id ? 'choisie' : ''} ${S.immatPlacement && !o ? 'cible' : ''}"
        data-etat="${o ? 'occupe' : 'libre'}" data-type="${p.type}"
        data-act="ouvrir-place" data-id="${p.id}"
        style="left:${MARGE_G + p.col * CELL_W}px;top:${rangY(p.rang)}px;width:${BAY_W}px;height:${BAY_H}px;${visible ? '' : 'opacity:.2'}"
        title="${esc(p.id)}${v ? ' — ' + esc(v.immat) : ' — libre'}">
      <span class="place-num">${esc(p.id)}</span>
      ${t.abr ? `<span class="place-type">${esc(t.abr)}</span>` : ''}
      ${o && v ? `
        <div class="auto" style="--peau:${peauVoiture(v.immat)};${p.type === 'util' ? '--hb:17px;--hc:15px;' : ''}transform:rotate(${p.orient}deg)">
          <div class="bloc caisse"><i class="t"></i><i class="n"></i><i class="s"></i><i class="o"></i><i class="e"></i></div>
          <div class="bloc cabine"><i class="t"></i><i class="n"></i><i class="s"></i><i class="o"></i><i class="e"></i></div>
        </div>
        <div class="marqueur ${etiq ? '' : 'point'}" style="--ton:${tonEtat(o.etat)};--lev:${hampe(S.parcZoom, p.col)}px">
          <span class="pin">${esc(etiq)}</span>
          ${vieux && etiq ? `<span class="jours">${jours} J</span>` : ''}
        </div>` : ''}
    </div>`;
  }).join('');

  return entete('Parc véhicules',

/* ==========================================================================
   ÉCRAN — clients
   ========================================================================== */
/* Sous un titre de section, le nom de la famille est déjà écrit au-dessus :
   inutile de le répéter sur chaque ligne. « Diagnostic électronique complet »
   dans la section « Diagnostic » se lit simplement « Électronique complet ».
   Le libellé complet reste intact dans les données — c'est lui qui part sur
   le devis, où il n'y a plus de section pour porter le contexte. */
function libelleDansSection(p) {
  const l = String(p.libelle || '').trim();
  const f = String(p.famille || '').trim();
  if (!f || !l) return l;

  const nu = (s) => sansAccent(s).toLowerCase();
  // « Forfaits atelier » doit aussi attraper « Forfait atelier … »
  const pistes = [f, f.replace(/s\b/g, '')].filter(Boolean);

  for (const piste of pistes) {
    if (nu(l).startsWith(nu(piste)) && l.length > piste.length + 3) {
      const reste = l.slice(piste.length).replace(/^[\s:—–\-·]+/, '');
      if (reste.length > 2) return reste.charAt(0).toUpperCase() + reste.slice(1);
    }
  }
  return l;
}

/* Monter ou descendre une section : on réordonne le catalogue par blocs, en
   gardant les lignes de chaque section groupées et dans leur ordre. */
function deplacerFamille(nom, sens) {
  const familles = [...new Set(DB.etat.catalogue.map(p => p.famille))];
  const i = familles.indexOf(nom);
  const j = i + sens;
  if (i < 0 || j < 0 || j >= familles.length) return;

  familles[i] = familles[j];
  familles[j] = nom;
  DB.etat.catalogue = familles.flatMap(f => DB.etat.catalogue.filter(p => p.famille === f));
  enregistrer(`Section « ${nom} » déplacée`);
}

/* ==========================================================================
   LE PLANNING SE TIENT À JOUR TOUT SEUL
   Un créneau passé n'a plus rien à dire : il encombre les semaines et fausse
   les compteurs. On garde la semaine précédente le temps que la semaine en
   cours se termine — assez pour retrouver ce qu'on a fait hier, pas assez
   pour traîner un mois de vieux rendez-vous. Le dossier, lui, reste : c'est
   lui qui porte l'historique, pas le créneau.
   ========================================================================== */
const MENAGES = {
  semaine:   { nom: 'La semaine passée', aide: 'effacée dès que la semaine en cours se termine' },
  mois:      { nom: 'Le mois passé',     aide: 'un mois de recul sur les créneaux' },
  trimestre: { nom: 'Trois mois',        aide: 'pour ceux qui aiment garder' },
  jamais:    { nom: 'Ne rien effacer',   aide: 'tout est conservé, le planning s\'allonge' }
};

/** La date avant laquelle un créneau n'a plus lieu d'être gardé. */
function limiteMenage() {
  const mode = (DB.etat.reglages.menagePlanning || 'semaine');
  if (mode === 'jamais') return null;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  if (mode === 'semaine') {
    // lundi de la semaine en cours, moins une semaine
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7) - 7);
  } else if (mode === 'mois') {
    d.setMonth(d.getMonth() - 1);
  } else {
    d.setMonth(d.getMonth() - 3);
  }
  return d.getTime();
}

/* On ne touche qu'aux créneaux terminés et sans suite : une demande d'un
   confrère jamais confirmée reste, sinon elle disparaîtrait sans réponse. */
function menagePlanning() {
  const limite = limiteMenage();
  if (!limite || !Array.isArray(DB.etat.planning)) return 0;
  const avant = DB.etat.planning.length;
  DB.etat.planning = DB.etat.planning.filter(p => minuit(p.jour) >= limite || p.aValider);
  const partis = avant - DB.etat.planning.length;
  if (partis) {
    DB.noter(null, `${partis} créneau${partis > 1 ? 'x' : ''} passé${partis > 1 ? 's' : ''} retiré${partis > 1 ? 's' : ''} du planning`);
    DB.sauver();
  }
  return partis;
}

/* Ranger une prestation dans sa section. On échange avec sa voisine de la même
   section, sans toucher aux autres : l'ordre du catalogue est celui qu'on lit
   ensuite partout — dans les devis, dans la grille des confrères, à l'écran. */
function deplacerPresta(prestaId, sens) {
  const p = DB.presta(prestaId);
  if (!p) return;
  const memeSection = DB.etat.catalogue.filter(x => x.famille === p.famille);
  const i = memeSection.indexOf(p);
  const j = i + sens;
  if (j < 0 || j >= memeSection.length) return;      // déjà en bout de section

  const voisine = memeSection[j];
  const a = DB.etat.catalogue.indexOf(p), b = DB.etat.catalogue.indexOf(voisine);
  DB.etat.catalogue[a] = voisine;
  DB.etat.catalogue[b] = p;
  S.prestaBougee = p.id;                             // pour la retrouver à l'œil
  enregistrer(`« ${p.libelle} » ${sens < 0 ? 'montée' : 'descendue'}`);
}

/* Le repère d'une section. Le nom de la famille contient accents et espaces :
   dans une ancre, il faudrait l'encoder, et un lien encodé ne retombe pas
   toujours sur son ancre. Un numéro d'ordre règle la question. */
const cleFamille = (prefixe, i) => prefixe + '-fam-' + i;

/** Le sommaire d'une grille : une puce par section, pour y aller directement. */
function sommaireFamilles(familles, prefixe) {
  if (familles.length < 3) return '';
  return `<div class="sommaire">
    ${familles.map((f, i) => `<a class="puce" href="#${cleFamille(prefixe, i)}">${esc(f)}</a>`).join('')}
  </div>`;
}
