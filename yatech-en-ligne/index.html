/** Exécuter une phrase. Rend la confirmation, ou null si rien n'a été compris. */
function executerVocal(phrase) {
  const brut = String(phrase || '').trim();
  const p = normaliserVoix(brut);
  if (!p) return null;
  VOIX.questionPosee = false;

  /* Un « oui », un « non », un « passe » ne veulent rien dire hors d'une
     question posée : on ne les regarde que si une question est en l'air. */
  if (VOIX.attente && (MOTS_OUI.test(p) || MOTS_NON.test(p) || MOTS_PASSE.test(p))) {
    const r = repondreAttente(p, brut);
    if (r) return r;
  }

  for (const c of COMMANDES) {
    const m = c.motif.exec(p);
    if (!m) continue;
    /* Un mémo, une recherche, une dictée : le texte se reprend sur la phrase
       d'origine. Une fois écrit, « Martin » vaut mieux que « martin ». */
    const tel = c.brut ? (c.brut.exec(brut) || [])[1] : null;
    const reponse = c.faire(m, tel);
    /* Une tournure comprise mais sans effet laisse sa chance aux suivantes. */
    if (!reponse) continue;
    /* Remplir un champ ne doit pas redessiner l'écran : la fenêtre serait
       reconstruite depuis zéro et tout ce qui vient d'être dicté disparaîtrait. */
    VOIX.garderEcran = c.garderEcran === true;
    /* Une commande a rempli un champ pendant la conversation : on enchaîne sur
       ce qui manque encore, plutôt que de laisser la question en suspens. */
    if (VOIX.dialogue && c.garderEcran && !VOIX.questionPosee) {
      const suite = demanderSuite();
      return suite ? reponse + ' — ' + suite : reponse;
    }
    return reponse;
  }

  /* Rien de connu, mais une question attend sa réponse : c'en est une. */
  if (VOIX.attente) {
    const r = repondreAttente(p, brut);
    if (r) return r;
  }

  VOIX.garderEcran = false;
  return null;
}

/** Remettre à jour le seul bandeau du micro, sans toucher au reste de l'écran. */
function rafraichirVoix() {
  const zone = document.getElementById('voix-barre');
  if (!zone) { rendre(); return; }
  zone.innerHTML = barreVocale();
}

/* L'éveil retombe de lui-même : le bandeau le montre sans qu'on ait à parler. */
setInterval(() => { if (VOIX.voulu && !VOIX.attente) rafraichirVoix(); }, 2000);

/* ==========================================================================
   Le micro
   --------------------------------------------------------------------------
   La reconnaissance du navigateur s'arrête toute seule au bout d'un silence :
   tant qu'on veut écouter, on la relance. Elle n'existe pas partout — on le
   dit, plutôt que de laisser un bouton mort.
   ========================================================================== */
const VOIX = {
  reco: null,
  ecoute: false,
  voulu: false,          // l'utilisateur veut écouter, même pendant une relance
  entendu: '',           // ce qui est en train d'être dit
  dernier: '',           // la dernière phrase complète
  reponse: '',           // ce que l'outil en a fait
  erreur: '',
  garderEcran: false,    // la dernière commande remplissait-elle un formulaire ?
  eveilJusqua: 0,        // jusqu'à quand les phrases valent commandes sans l'appeler
  dialogue: null,        // le formulaire qu'on remplit à deux, question par question
  attente: null,         // la question posée, dont on attend la réponse
  questionPosee: false,  // une question vient-elle d'être posée dans ce tour ?
  microOk: false,        // le navigateur a-t-il déjà accordé le micro ?

  dispo() { return !!(window.SpeechRecognition || window.webkitSpeechRecognition); },

  /* Demander le micro pour de bon.

     La reconnaissance vocale, lancée seule, ne fait pas toujours apparaître la
     question du navigateur : sur iOS elle échoue en silence, et dans une page
     affichée à l'intérieur d'une autre page elle refuse sans rien dire. C'est
     `getUserMedia` qui déclenche la vraie demande — on la pose donc d'abord, et
     son refus dit précisément pourquoi. On relâche aussitôt : la reconnaissance
     rouvrira son propre flux. */
  async autoriser() {
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return { ok: true };
      const flux = await navigator.mediaDevices.getUserMedia({ audio: true });
      flux.getTracks().forEach(t => t.stop());
      return { ok: true };
    } catch (e) {
      return { ok: false, nom: (e && e.name) || 'erreur' };
    }
  },

  /* Ce qu'on peut dire à quelqu'un dont le micro vient d'être refusé. La cause
     n'est pas la même selon l'endroit : dans un cadre, il n'y a rien à
     autoriser — la page qui l'entoure ne délègue pas le micro, et seule
     l'ouverture dans un onglet à part y change quelque chose. */
  pourquoiRefus(nom) {
    if (nom === 'NotFoundError' || nom === 'DevicesNotFoundError') {
      return 'Aucun micro trouvé sur cet appareil.';
    }
    if (nom === 'NotReadableError' || nom === 'TrackStartError') {
      return 'Le micro est déjà pris par une autre application. Fermez-la, puis réessayez.';
    }
    if (dansUnCadre()) {
      return 'Yatech est affiché à l\'intérieur d\'une autre page, qui ne lui donne pas le micro. '
           + 'Ouvrez-le dans son propre onglet et la voix marchera.';
    }
    return 'Le micro est refusé pour ce site. Autorisez-le dans la barre d\'adresse '
         + '(le cadenas, à gauche de l\'adresse), puis réessayez.';
  },

  parler(texte) {
    if (!DB.etat.reglages.voixParle) return;
    try {
      const s = window.speechSynthesis;
      if (!s) return;
      s.cancel();
      const d = new SpeechSynthesisUtterance(texte);
      d.lang = 'fr-FR';
      s.speak(d);
    } catch (e) { /* une voix muette n'empêche rien */ }
  },

  async demarrer() {
    if (!this.dispo()) {
      this.erreur = "Ce navigateur ne sait pas écouter. Chrome, Edge ou Safari le savent.";
      rendre(); return;
    }
    this.voulu = true;
    this.erreur = '';
    /* Le bandeau apparaît tout de suite : entre l'appui et le premier mot
       entendu il peut s'écouler une seconde, et un bouton qui ne répond pas
       donne envie d'appuyer une deuxième fois. */
    rendre();

    /* L'autorisation d'abord, une seule fois par session : le navigateur ne
       repose pas sa question quand il l'a déjà accordée. Refusée, on s'arrête
       ici en disant quoi faire — plutôt que de lancer une reconnaissance qui
       échouerait sans expliquer. */
    if (!this.microOk) {
      const rep = await this.autoriser();
      if (!this.voulu) return;              // coupé pendant qu'on demandait
      if (!rep.ok) {
        this.voulu = false;
        this.erreur = this.pourquoiRefus(rep.nom);
        rendre(); return;
      }
      this.microOk = true;
    }

    if (this.reco) { try { this.reco.start(); } catch (e) { /* déjà lancée */ } return; }

    const Reco = window.SpeechRecognition || window.webkitSpeechRecognition;
    const r = new Reco();
    r.lang = 'fr-FR';
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 3;

    r.onstart = () => { this.ecoute = true; this.erreur = ''; rendre(); };

    r.onresult = (ev) => {
      for (let i = ev.resultIndex; i < ev.results.length; i++) {
        const res = ev.results[i];
        if (!res.isFinal) { this.entendu = res[0].transcript; rafraichirVoix(); continue; }
        this.entendu = '';

        /* Endormi, on n'écoute que son nom : le reste, c'est l'atelier qui
           parle. Le nom seul suffit à réveiller — on répond, et on attend. */
        const eveille = voixEveillee();
        const appel = retirerMotAppel(res[0].transcript);
        if (!eveille && !appel.trouve) { rafraichirVoix(); continue; }
        if (appel.trouve) {
          eveillerVoix();
          if (!appel.reste.trim()) {
            bip('eveil'); this.dernier = motAppel(); this.reponse = 'Je vous écoute';
            this.parler('Je vous écoute'); rafraichirVoix(); continue;
          }
        }

        /* On essaie chaque proposition du navigateur : la première est souvent
           bonne, mais « ouvre le part » pour « ouvre le parc » arrive. */
        let fait = null, dit = appel.reste;
        for (let k = 0; k < res.length && !fait; k++) {
          const phrase = retirerMotAppel(res[k].transcript).reste;
          fait = executerVocal(phrase);
          if (fait) dit = phrase;
        }
        this.dernier = dit.trim();
        this.reponse = fait || '';
        if (fait) { eveillerVoix(); bip('ok'); this.parler(fait); }
        else { bip('non'); toast('Pas compris : « ' + this.dernier + ' »'); }
        this.garderEcran ? rafraichirVoix() : rendre();
      }
    };

    r.onerror = (ev) => {
      const c = ev.error;
      this.erreur = c === 'not-allowed' || c === 'service-not-allowed'
          ? this.pourquoiRefus('NotAllowedError')
        : c === 'audio-capture' ? "Aucun micro trouvé sur cet appareil."
        : c === 'network' ? "La reconnaissance a besoin du réseau."
        : c === 'no-speech' ? '' : "Le micro s'est arrêté (" + c + ').';
      // refusée, l'autorisation est à redemander : elle a pu changer entre-temps
      if (c === 'not-allowed' || c === 'service-not-allowed') this.microOk = false;
      if (c === 'not-allowed' || c === 'service-not-allowed' || c === 'audio-capture') this.voulu = false;
      rendre();
    };

    /* Un silence coupe la reconnaissance : tant qu'on veut écouter, on relance.
       Le petit délai évite la boucle folle quand le navigateur refuse. */
    r.onend = () => {
      this.ecoute = false;
      if (this.voulu) setTimeout(() => { if (this.voulu) { try { r.start(); } catch (e) { /* rien */ } } }, 350);
      rendre();
    };

    this.reco = r;
    try { r.start(); } catch (e) { this.erreur = "Le micro n'a pas démarré."; }
    rendre();
  },

  arreter() {
    this.voulu = false;
    this.entendu = '';
    if (this.reco) { try { this.reco.stop(); } catch (e) { /* rien */ } }
    this.ecoute = false;
    rendre();
  },

  basculer() { this.voulu ? this.arreter() : this.demarrer(); }
};

/* ==========================================================================
   Mains libres
   --------------------------------------------------------------------------
   Les mains dans un moteur, on ne touche pas l'écran — même pas pour lancer le
   micro. Il reste donc ouvert, et c'est son nom qui le réveille : « Yatech,
   rendez-vous demain 14 h ». Sans ce mot, ce qui se dit dans l'atelier passe
   sans être écouté. Une fois réveillé il le reste un moment : la suite d'une
   conversation n'a pas à le rappeler à chaque phrase.
   ========================================================================== */
const EVEIL_SECONDES = 30;

/* Yatech tourne-t-il à l'intérieur d'une autre page ? Un aperçu, un cadre, une
   application qui l'affiche : dans ce cas le micro ne dépend plus de nous mais
   de la page qui nous entoure, et elle ne le délègue pas. Un cadre d'une autre
   origine fait lever l'accès à `window.top` — c'en est un aussi. */
/* Ce qu'on sait de l'autorisation. Tous les navigateurs ne savent pas la dire :
   dans le doute on n'affirme rien plutôt que d'annoncer un refus imaginaire. */
function etatMicro() {
  if (VOIX.microOk || S.microEtat === 'accorde') return 'accordée';
  if (S.microEtat === 'refuse') return 'refusée';
  return '';
}

function dansUnCadre() {
  try { return window.self !== window.top; } catch (e) { return true; }
}

/* Le micro nous est-il coupé par la page qui nous entoure ? Être dans un cadre
   ne suffit pas à le dire : un cadre de la même origine hérite du micro sans
   rien demander. Chrome sait répondre pour de bon ; ailleurs on ne devine pas —
   on attend le refus, qui est une réponse sûre. */
function microBloque() {
  try {
    if (document.featurePolicy && document.featurePolicy.allowsFeature) {
      return !document.featurePolicy.allowsFeature('microphone');
    }
  } catch (e) { /* pas de réponse : on n'en tire rien */ }
  return false;
}

function motAppel() { return String(DB.etat.reglages.voixMot || 'Yatech').trim() || 'Yatech'; }

/** La phrase commence-t-elle par son nom ? Rend le reste, sans le nom. */
function retirerMotAppel(phrase) {
  const mot = motAppel().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const re = new RegExp('^\\s*(?:' + mot + ')\\s*[,.:!]?\\s*', 'i');
  const sans = String(phrase).replace(re, '');
  return { trouve: sans !== String(phrase), reste: sans };
}

function eveillerVoix() { VOIX.eveilJusqua = Date.now() + EVEIL_SECONDES * 1000; }

/** Écoute-t-on vraiment, à cet instant ? */
function voixEveillee() {
  if (!DB.etat.reglages.voixVeille) return true;   // pas de mot d'appel : tout est commande
  if (VOIX.attente) return true;                   // une question attend sa réponse
  return Date.now() < (VOIX.eveilJusqua || 0);
}

/* Un son court dit plus vite qu'une phrase que c'est pris — ou que ça ne l'est
   pas. On ne fait du bruit que si l'outil a le droit de parler. */
let sonVoix = null;
/* `quandMeme` : la sonnerie d'un appel entrant n'est pas une réponse de la
   voix. Décocher « répondre à voix haute » ne doit pas rendre le téléphone
   muet — ce sont deux choses sans rapport. */
function bip(genre, quandMeme) {
  if (!quandMeme && !DB.etat.reglages.voixParle) return;
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    sonVoix = sonVoix || new Ctx();
    if (sonVoix.state === 'suspended') sonVoix.resume();
    const notes = genre === 'appel' ? [880, 660, 880, 660]
                : genre === 'eveil' ? [660, 880]
                : genre === 'non' ? [300, 200] : [880];
    notes.forEach((f, i) => {
      const o = sonVoix.createOscillator(), g = sonVoix.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const t0 = sonVoix.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.11, t0 + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.11);
      o.connect(g); g.connect(sonVoix.destination);
      o.start(t0); o.stop(t0 + 0.13);
    });
  } catch (e) { /* un outil muet n'est pas un outil cassé */ }
}

/** Le bandeau du bas : ce qu'on entend, ce qui vient d'être fait. */
function barreVocale() {
  if (!VOIX.voulu && !VOIX.erreur) return '';
  const endormi = !VOIX.erreur && !VOIX.attente && DB.etat.reglages.voixVeille && !voixEveillee();
  const etat = VOIX.erreur ? 'muet' : VOIX.attente ? 'demande'
             : endormi ? 'veille' : VOIX.ecoute ? 'ecoute' : 'attente';
  const dit = VOIX.entendu || VOIX.dernier;
  /* Une question posée passe devant tout : c'est la seule chose à lire quand
     on a les mains prises. Ce qu'on vient de dire tient la seconde ligne. */
  return `<div class="voix-barre ${etat}">
    <span class="voix-pastille">${ic(VOIX.attente ? 'question' : 'micro')}</span>
    <div class="voix-texte">
      ${VOIX.erreur ? `<b>${esc(VOIX.erreur)}</b>`
        : VOIX.attente
        ? `<b>${esc(VOIX.attente.question)}</b>
           <span class="mini">${dit ? '« ' + esc(dit) + ' »' : 'j’écoute votre réponse'}</span>`
        : endormi
        ? `<b>Dites « ${esc(motAppel())} » pour parler</b>
           <span class="mini">${VOIX.reponse ? esc(VOIX.reponse) : 'le micro reste ouvert — rien à toucher'}</span>`
        : `<b>${dit ? esc(dit) : (VOIX.ecoute ? 'Je vous écoute…' : 'Un instant…')}</b>
           ${VOIX.reponse ? `<span class="mini">${esc(VOIX.reponse)}</span>` : ''}`}
    </div>
    ${/* Dans un cadre, il n'y a rien à autoriser sur place : le seul geste utile
          est d'ouvrir Yatech dans un onglet à lui. */ ''}
    ${VOIX.erreur && dansUnCadre() && VOIX.microOk === false
      ? `<a class="btn" href="${esc(location.href)}" target="_blank" rel="noopener"
           title="Ouvrir Yatech dans un onglet, où le micro marche">Ouvrir à part</a>`
      : ''}
    <button class="btn nu" data-act="voix-aide" title="Ce que je comprends">${ic('question')}</button>
    <button class="btn nu" data-act="voix" title="Couper le micro">${ic('croix')}</button>
  </div>`;
}

/** L'aide : elle se construit à partir de la table, donc elle est toujours juste. */
function modaleVoix() {
  const groupes = [];
  COMMANDES.forEach(c => {
    const g = groupes.find(x => x.nom === c.groupe) || (groupes.push({ nom: c.groupe, lignes: [] }), groupes[groupes.length - 1]);
    g.lignes.push(c);
  });
  const noms = DB.etat.utilisateurs.map(u => u.nom).join(', ');

  return `<div class="voile" data-voile><div class="modale">
    <div class="modale-tete">
      <div><h2 style="font-size:18px">Ce que je comprends</h2>
        <div class="mini">Dites-le simplement : « ouvre le planning » ou juste « planning ».</div></div>
      <button class="btn nu" style="margin-left:auto" data-act="fermer-modale">${ic('croix')}</button>
    </div>
    <div class="modale-corps pile">
      ${VOIX.dispo() ? '' : `<div class="encart alerte">
        <b>Ce navigateur ne sait pas écouter.</b> La commande vocale demande Chrome, Edge ou Safari.
        Tout reste faisable au doigt.</div>`}
      ${groupes.map(g => `<div class="voix-groupe">
        <div class="etiq">${esc(g.nom)}</div>
        <div class="pile" style="gap:7px">
          ${g.lignes.map(c => `<div class="voix-ligne">
            <b>« ${esc(c.exemple)} »</b>
            <span>${c.quoi}</span>
          </div>`).join('')}
        </div>
      </div>`).join('')}
      <p class="aide" style="margin:0">Les prénoms reconnus sont ceux de l'équipe : ${esc(noms)}.
      Ajoutez quelqu'un dans les paramètres et son prénom marche aussitôt.</p>
    </div>
    <div class="modale-pied">
      <label class="rangee" style="gap:8px;margin-right:auto;cursor:pointer">
        <input type="checkbox" data-champ-voix="voixParle" ${DB.etat.reglages.voixParle ? 'checked' : ''}>
        Répondre à voix haute
      </label>
      <button class="btn plein" data-act="voix">${ic('micro')} ${VOIX.voulu ? 'Couper le micro' : 'Écouter'}</button>
    </div>
  </div></div>`;
}

/* --- délégation des clics --------------------------------------------------- */
document.addEventListener('click', (e) => {
  const cible = e.target.closest('[data-act]');

  if (!cible) {
    if (e.target.matches('[data-voile]')) { S.modale = null; rendre(); return; }
    const place = placeSousLePoint(e.clientX, e.clientY);
    if (place) {
      S.vue = 'parking'; S.placeId = place.dataset.id; S.focusImmat = true;
      if (DB.occupation(place.dataset.id)) S.immatPlacement = '';
      rendre();
    }
    return;
  }

  const a = cible.dataset.act;
  const id = cible.dataset.id;

  const actions = {
    'changer-personne'() { S.connexionPour = null; S.erreurCode = null; rendre(); },

    /* La porte de secours du gérant, sur son propre appareil : les codes de
       l'équipe repassent au temporaire. Les données restent intactes. Ça ne
       fragilise rien de plus que ce qui l'est déjà — qui a l'appareil en main
       peut de toute façon effacer le navigateur. */
    'rouvrir-equipe'() {
      confirmer({
        titre: 'Vous n\'arrivez plus à entrer ?',
        texte: `Les mots de passe de l'équipe repasseront tous à <b class="num">${esc(MDP_PROVISOIRE)}</b>, `
             + 'et chacun en choisira un nouveau à sa prochaine connexion.<br><br>'
             + '<b>Vos données ne bougent pas</b> : clients, devis, parc, tarifs, tout reste en place. '
             + 'Seuls les accès sont remis à zéro.<br><br>'
             + 'Les garages partenaires ne sont pas concernés.',
        bouton: 'Remettre les accès à ' + MDP_PROVISOIRE, danger: true,
        alors() {
          const n = DB.reouvrirEquipe();
          S.erreurCode = null; S.emailSaisi = '';
          rendre();
          toast(`${n} accès remis à ${MDP_PROVISOIRE} — entrez avec votre prénom`);
        }
      });
    },

    'changer-code'() {
      const u = DB.utilisateur(id);
      if (!u) return;
      S.modale = { type: 'code', id };
      rendre();
    },
    /* Un code oublié : on ne peut pas le retrouver, seulement le remettre à
       celui de première connexion pour que la personne en repose un. */
    'reinit-code'() {
      const u = DB.utilisateur(id);
      if (!u) return;
      confirmer({
        titre: 'Réinitialiser le code de ' + esc(u.nom) + ' ?',
        texte: `Son code redevient <b class="num">${esc(MDP_PROVISOIRE)}</b>, celui de première connexion. `
             + 'À sa prochaine ouverture, l\'outil lui demandera d\'en choisir un nouveau.<br><br>'
             + 'C\'est la seule marche à suivre quand quelqu\'un a oublié le sien : personne ne peut le relire.',
        bouton: 'Réinitialiser', danger: true,
        alors() {
          DB.definirMdp(id, MDP_PROVISOIRE, true);
          enregistrer(`Code réinitialisé pour ${u.nom}`);
          toast(`${u.nom} entrera avec ${MDP_PROVISOIRE}`);
        }
      });
    },

    verrouiller() {
      /* Verrouiller, c'est dire « ce n'est plus moi ». À la réouverture, on
         redemande donc qui est là plutôt que de reprendre le premier compte de
         la liste — sinon on retrouverait l'écran de quelqu'un d'autre, et ses
         réglages avec. */
      stock.ecrire('atelier.rendu', '1');
      S.userId = null; S.connexionPour = null; S.erreurCode = null;
      S.proConnecte = null; S.grilleToken = null;
      S.modale = null; S.placeId = null;
      stock.effacer('atelier.qui');
      stock.effacer('atelier.pro');
      rendre();
    },

    connexion() {
      // un code posé : on le demande avant d'ouvrir quoi que ce soit
      if (!SANS_CODE && DB.aUnMdp(id)) { S.connexionPour = id; S.erreurCode = null; rendre(); return; }
      ouvrirSession(id);
    },
    deconnexion() {
      S.userId = null; S.connexionPour = null; S.modale = null;
      stock.effacer('atelier.qui'); rendre();
    },
    /* Un volet ouvert en referme un autre : on ne se retrouve jamais avec
       tous les réglages dépliés, c'est-à-dire au point de départ. */
    volet() { S.volet = S.volet === id ? null : id; rendre(); },

    /* Le micro : un bouton pour l'ouvrir, un autre pour savoir quoi lui dire. */
    voix() { VOIX.basculer(); },
    /* Poser la question du navigateur sans ouvrir le micro pour autant : on
       vient régler son autorisation, pas dicter. */
    'micro-autoriser'() {
      VOIX.autoriser().then(rep => {
        if (rep.ok) {
          VOIX.microOk = true;
          S.microEtat = 'accorde';
          toast('Micro autorisé');
        } else {
          VOIX.microOk = false;
          S.microEtat = 'refuse';
          toast(VOIX.pourquoiRefus(rep.nom));
        }
        rendre();
      });
    },

    'voix-aide'() { S.modale = { type: 'voix' }; rendre(); },

    'menu-plus'() { S.modale = { type: 'plus' }; rendre(); },
    pdf() {
      toast('Dans la fenêtre d\'impression, choisissez « Enregistrer en PDF »');
      // certains cadres refusent l'impression : mieux vaut le dire que ne rien faire
      setTimeout(() => {
        try { window.print(); }
        catch (e) {
          confirmer({
            titre: 'Impression refusée ici', bouton: 'J\'ai compris',
            texte: 'Cette page est affichée dans un cadre qui bloque l\'impression.<br><br>'
                 + 'Ouvrez l\'outil dans un onglet à part, ou depuis le fichier installé sur votre poste, '
                 + 'et le devis PDF sortira normalement.'
          });
        }
      }, 400);
    },

    aller() {
      S.vue = cible.dataset.vue;
      S.modale = null;
      S.recherche = ''; S.placeId = null; S.focusRech = false;
      if (cible.dataset.filtre) S.filtreDevis = cible.dataset.filtre;
      else if (S.vue === 'devis') S.filtreDevis = 'actifs';
      if (cible.dataset.parc) S.parcFiltre = cible.dataset.parc;
      if (cible.dataset.cote) { S.parcCote = cible.dataset.cote; S.parcFiltre = 'libre'; S.parcZoom = null; }
      rendre();
    },

    appel() { S.modale = { type: 'appel' }; rendre(); },

    /* Depuis l'appel entrant : noter la demande, le numéro déjà en place. Le
       formulaire ne se remplit qu'une fois dessiné — d'où le petit délai. */
    'appel-noter'() {
      const num = cible.dataset.num || '';
      S.modale = { type: 'appel' };
      rendre();
      setTimeout(() => {
        const champ = document.querySelector('#form-appel [name="tel"]');
        if (!champ) return;
        champ.value = telLisible(num);
        const form = document.querySelector('#form-appel');
        if (form) rafraichirReco(form);
        const panne = form && form.querySelector('[name="panne"]');
        if (panne) panne.focus();
      }, 40);
    },

    'compteurs-defaut'() { poserCompteurs(COMPTEURS_DEFAUT.slice()); },
    'compteurs-tous'()   { poserCompteurs(COMPTEURS.map(c => c.cle)); },
    'compteurs-aucun'()  { poserCompteurs([]); },

    'planning-hauteur'() {
      DB.etat.reglages.planningPasH = Math.min(120, Math.max(34, Number(id) || 62));
      DB.sauver(); rendre();
    },

    'appel-pris'() {
      const a = (DB.etat.appels || []).find(x => x.id === id);
      if (!a) return;
      a.pris = !a.pris; DB.sauver(); rendre();
    },
    'appel-revoir'() {
      const a = (DB.etat.appels || []).find(x => x.id === id);
      if (!a) return;
      S.modale = { type: 'appel-entrant', num: a.num }; rendre();
    },

    'appel-fiche'() {
      S.modale = null; S.vue = 'client-fiche'; S.clientId = id; rendre();
    },

    /* Essayer sans le standard : on fait sonner le numéro qu'on veut. */
    'appel-test'() {
      const champ = document.querySelector('#tel-test');
      const num = champ ? champ.value.trim() : '';
      if (chiffresSeuls(num).length < 4) { toast('Tapez d\'abord un numéro'); return; }
      sonnerAppel(num, true);
      rendre();
    },

    /* Reprendre la fiche d'un habitué : on remplit le formulaire à sa place,
       sans redessiner la fenêtre — il reste à noter la panne, et c'est tout. */
    'reprendre-appel'() {
      const form = $('#form-appel');
      const c = DB.client(id);
      if (!form || !c) return;
      const v = DB.vehicule(cible.dataset.vehicule);
      const mettre = (nom, valeur) => {
        const champ = form.querySelector(`[name="${nom}"]`);
        if (champ && valeur) champ.value = valeur;
      };
      mettre('prenom', c.prenom); mettre('nom', c.nom);
      mettre('tel', c.tel);       mettre('email', c.email);
      if (v) { mettre('immat', v.immat); mettre('marque', v.marque); mettre('modele', v.modele); }
      rafraichirReco(form);
      const panne = form.querySelector('[name="panne"]');
      if (panne) panne.focus();
      toast('Fiche reprise — il ne reste que la panne à noter');
    },
    'fermer-modale'() { S.modale = null; S.confirmation = null; rendre(); },
    'confirmer-oui'() {
      const suite = S.confirmation && S.confirmation.alors;
      S.confirmation = null; S.modale = null;
      if (suite) suite(); else rendre();
    },

    'ouvrir-devis'() { S.modale = null; S.vue = 'devis-fiche'; S.devisId = id; S.placeId = null; rendre(); },
    'ouvrir-client'() { S.modale = null; S.vue = 'client-fiche'; S.clientId = id; rendre(); },
    'editer-client'() { S.vue = 'client-fiche'; S.clientId = id; rendre(); },

    'filtre-devis'() { S.filtreDevis = id; rendre(); },
    'vider-recherche'() { S.recherche = ''; S.focusRech = true; rendre(); },
    'vider-rech-tarif'() { S.rechTarif = ''; S.focusRechTarif = true; rendre(); },
    // à bascule : recliquer sur le filtre actif le désactive

    /* Promouvoir ou rétrograder. Le dernier administrateur ne se rétrograde

    'role-acces'() {

    'ajouter-personne'() {
      if (!exigeAdmin('Ajouter quelqu\'un')) return;
      const u = {
        id: DB.nouvelId('u'), nom: 'Nouveau', fonction: 'À préciser',
        role: 'mecanicien', admin: false, init: 'N', teinte: DB.teinteLibre(), tel: ''
      };
      DB.etat.utilisateurs.push(u);
      // il entre avec le code de première connexion, et choisira le sien

      toast(`Personne ajoutée — elle entrera avec ${MDP_PROVISOIRE}`);

    'teinte-personne'() {
      const u = DB.utilisateur(id);
      if (u) { u.teinte = Number(cible.dataset.teinte); DB.sauver(); rendre(); }
    },
    'suppr-personne'() {
      if (!exigeAdmin('Retirer quelqu\'un de l\'équipe')) return;
      const u = DB.utilisateur(id);
      if (!u || DB.etat.utilisateurs.length < 2) return;
      const memos = DB.memosDe(id).length;
      const creneaux = DB.etat.planning.filter(p => p.userId === id).length;
      confirmer({
        titre: 'Retirer ' + esc(u.nom) + ' de l\'équipe ?',
        texte: (memos || creneaux
          ? `Ses <b>${memos} rappel${memos > 1 ? 's' : ''}</b> seront supprimés et ses `
            + `<b>${creneaux} créneau${creneaux > 1 ? 'x' : ''}</b> repasseront à quelqu'un d'autre.<br><br>`
          : '')
          + 'Les devis qu\'elle a créés et l\'historique restent intacts.',
        bouton: 'Retirer', danger: true,
        alors() {
          const repli = DB.etat.utilisateurs.find(x => x.id !== id);
          DB.etat.memos = DB.etat.memos.filter(m => m.userId !== id);
          DB.etat.planning.forEach(p => { if (p.userId === id) p.userId = repli.id; });
          DB.etat.occupations.forEach(o => { if (o.assigneA === id) o.assigneA = null; });
          DB.etat.utilisateurs = DB.etat.utilisateurs.filter(x => x.id !== id);
          if (S.userId === id) S.userId = repli.id;
          if (S.memoDe === id) S.memoDe = null;
          enregistrer(`${u.nom} retiré de l'équipe`);
          toast('Personne retirée');
        }

    /* La nouvelle ligne se pose dans la section d'où l'on a cliqué, sinon dans
       la première. On l'ajoute vide : il n'y a que le nom et les prix à taper. */
    'nouvelle-presta'() {
      const sections = [...new Set(DB.etat.catalogue.map(p => p.famille))];
      const ou = id && sections.includes(id) ? id : (sections[0] || 'Prestations');
      const neuve = {
        id: DB.nouvelId('p'), code: '', libelle: '', famille: ou, type: 'mo',
        temps: 1, prixHT: DB.etat.reglages.tauxHoraire, prixPro: DB.etat.reglages.tauxHorairePro
      };
      // elle se range à la suite des autres lignes de sa section
      const dernier = DB.etat.catalogue.map(p => p.famille).lastIndexOf(ou);
      if (dernier >= 0) DB.etat.catalogue.splice(dernier + 1, 0, neuve);
      else DB.etat.catalogue.push(neuve);

      S.rechTarif = ''; S.focusPresta = neuve.id;
      DB.sauver(); rendre();
    },
    /* Une demande de pro devient un vrai rendez-vous : on prend l'heure et le
       mécanicien tels qu'ils sont dans le formulaire ouvert. */
    'valider-demande'() {
      const p = DB.rdv(id);
      if (!p) return;
      const form = $('#form-planif');
      if (form) {
        const f = Object.fromEntries(new FormData(form).entries());
        p.heure = f.heure || p.heure;
        p.userId = f.userId || p.userId;
        p.duree = Math.max(0.5, Number(f.duree) || p.duree);
        p.emplacement = f.emplacement || p.emplacement;
        /* Sans String(), un créneau sans prestation faisait tomber tout le clic :
           « undefined.trim() » et la confirmation ne se faisait jamais, sans
           que rien ne le dise à l'écran. */
        p.prestation = String(f.prestation || p.prestation || '').trim();
      }
      p.aValider = false;
      DB.resoudre('demande-pro:' + p.id);     // l'alerte tombe pour toute l'équipe
      enregistrer(`Créneau confirmé pour ${p.client} — ${dateCourte(p.jour)} ${p.heure}`);
      /* Le confrère attend son heure : le message part dans la foulée, sans
         qu'on ait à y penser. La fenêtre l'écrit, il reste à l'envoyer. */
      const c = p.demandeur ? DB.client(p.demandeur) : null;
      if (c && (String(c.tel || '').trim() || String(c.email || '').trim())) {
        S.texteP = null;
        S.modale = { type: 'rdv-confirme', id: p.id };
        rendre();
      } else {
        S.modale = null;
        rendre();
        toast('Créneau confirmé — ce garage n\'a ni portable ni e-mail dans sa fiche');
      }
    },
    'refuser-demande'() {
      const p = DB.rdv(id);
      if (!p) return;
      confirmer({
        titre: 'Refuser cette demande ?',
        texte: `<b>${esc(p.client)}</b> — ${dateLongue(p.jour)}<br>${esc(p.prestation || '')}<br><br>`
             + 'La demande disparaît de votre planning et du sien.',
        bouton: 'Refuser', danger: true,
        alors() {
          DB.etat.planning = DB.etat.planning.filter(x => x.id !== id);
          S.modale = null;
          enregistrer('Demande de créneau refusée');
          toast('Demande refusée');
        }
      });
    },

    /* Envoyer sa grille à un garage pro, et garder trace de l'envoi : à quinze
       confrères, on ne se souvient plus de qui a reçu quoi. */
    'envoyer-grille'() {
      const c = DB.client(id);
      if (!c) return;
      const texte = messageGrille(c);
      const num = (c.tel || '').replace(/\s/g, '');
      const mail = (c.email || '').trim();
      c.lienEnvoye = Date.now();
      DB.sauver();
      if (mail) {
        ouvrirLien(`mailto:${mail}?subject=${encodeURIComponent('Votre grille tarifaire — ' + DB.etat.reglages.nom)}`
          + `&body=${encodeURIComponent(texte)}`, texte);
      } else if (num) {
        ouvrirLien(`sms:${num}?&body=${encodeURIComponent(texte)}`, texte);
      } else {
        copier(lienGrille(c), 'Lien de ' + c.nom);
      }
      rendre();
    },

    'couleur-defaut'() {

    /* L'ordre des sections est celui du catalogue : déplacer une section, c'est
       déplacer son bloc de lignes. Le sommaire et la grille des pros suivent. */
    'monter-famille'()    { deplacerFamille(id, -1); },
    'descendre-famille'() { deplacerFamille(id, +1); },

    'remettre-catalogue'() {
      const n = DB.remettreCatalogue();
      S.rechTarif = ''; rendre();
      toast(`${n} prestations remises — à vous de les mettre à vos prix`);
    },

    /* Le devis fait dans EBP revient ici en PDF : on l'accroche au dossier,
       et c'est de là qu'il part au client. */
    'joindre-pdf'() {
      const d = DB.devis(id);
      if (!d) return;
      lireFichier('application/pdf,.pdf', null, (fichier) => {
        if (!fichier) return;
        if (!/pdf$/i.test(fichier.name) && fichier.type !== 'application/pdf') {
          toast('Ce n\'est pas un PDF'); return;
        }
        RESERVE.poser('devis:' + d.id, fichier)
          .then(() => {
            d.pdf = { nom: fichier.name, taille: fichier.size, quand: Date.now() };
            enregistrer(`Devis PDF joint à ${d.numero}`);
            toast(`${fichier.name} joint — ${poidsFr(fichier.size)}`);
          })
          .catch(() => toast('Ce navigateur ne garde pas les fichiers'));
      });
    },

    /* Le message est parti : on enregistre le PDF dans la foulée pour qu'il
       soit sous la main au moment de l'attacher. */
    'pdf-envoye'() {
      const d = DB.devis(id);
      if (!d) return;
      RESERVE.prendre('devis:' + d.id).then(blob => {
        if (blob) telechargerFichier(d.pdf && d.pdf.nom || (d.numero + '.pdf'), blob, 'application/pdf');
      });
      d.envoye = d.envoye || Date.now();
      figerTva(d);
      if (d.statut === 'brouillon') { d.statut = 'envoye'; d.maj = Date.now(); }
      S.modale = null; S.texteP = null;
      enregistrer(`Devis ${d.numero} envoyé au client`);
      toast('PDF enregistré — joignez-le au message');
    },

    'nettoyer-pdf'() {
      RESERVE.nettoyer().then(({ partis, octets }) => {
        rendre();
        toast(partis ? `${partis} fichier${partis > 1 ? 's' : ''} retiré${partis > 1 ? 's' : ''} — ${poidsFr(octets)} libérés`
                     : 'Rien à nettoyer');
      });
    },

    /* Ce que ce garage-là voit dans sa grille. On ne touche ni au catalogue ni
       aux autres confrères : la liste des masquées vit sur sa fiche. */
    'section-pour-lui'() {
      const c = DB.client(id);
      if (!c) return;
      const section = cible.dataset.section;
      const tout = cible.dataset.tout === '1';
      c.masquees = c.masquees || {};
      DB.etat.catalogue.filter(p => p.famille === section)
        .forEach(p => { if (tout) delete c.masquees[p.id]; else c.masquees[p.id] = 1; });
      c.maj = Date.now();
      DB.sauver(); rendre();
      toast(tout ? `« ${section} » visible pour ${c.nom}` : `« ${section} » masquée pour ${c.nom}`);

    'ajouter-presta-perso'() {
      const c = DB.client(id);
      if (!c) return;
      c.presta = c.presta || [];
      const familles = [...new Set(DB.etat.catalogue.map(p => p.famille))];
      c.presta.push({
        id: DB.nouvelId('pp'), libelle: 'Nouvelle prestation',
        famille: familles[0] || 'Prestations', type: 'mo',
        prixHT: DB.etat.reglages.tauxHorairePro || 0
      });
      c.maj = Date.now();
      S.grillePerso = c.id;
      DB.sauver(); rendre();
      toast('Ligne ajoutée — donnez-lui son nom et son prix');
    },

    'suppr-presta-perso'() {
      const c = DB.client(id);
      const pid = cible.dataset.presta;
      if (!c || !Array.isArray(c.presta)) return;
      const p = c.presta.find(x => x.id === pid);
      confirmer({
        titre: 'Retirer cette ligne ?',
        texte: `<b>${esc(p ? p.libelle : '')}</b> disparaîtra de la grille de ${esc(c.nom)}. `
             + 'Elle n\'existe que pour lui : le catalogue et les autres confrères ne bougent pas.'
             + '<br>Les interventions déjà notées avec cette prestation gardent leur libellé et leur prix.',
        bouton: 'Retirer', danger: true,
        alors() {
          c.presta = c.presta.filter(x => x.id !== pid);
          if (c.tarifs) delete c.tarifs[pid];
          c.maj = Date.now();
          enregistrer(`Ligne retirée de la grille de ${c.nom}`);
        }
      });
    },

    'bascule-veh'() { S.vehEdit = S.vehEdit === id ? null : id; rendre(); },
    'bascule-client'() { S.clientEdit = S.clientEdit === id ? null : id; rendre(); },

    'ouvrir-pdf'() {
      const d = DB.devis(id);
      if (!d || !d.pdf) return;
      RESERVE.prendre('devis:' + d.id).then(blob => {
        if (!blob) { toast('Le fichier n\'est plus sur cet appareil'); return; }
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 60000);
      });
    },

    'retirer-pdf'() {
      const d = DB.devis(id);
      if (!d) return;
      confirmer({
        titre: 'Retirer le devis PDF ?',
        texte: `<b>${esc(d.pdf ? d.pdf.nom : '')}</b> sera effacé de cet appareil. `
             + 'Le dossier et son chiffrage ne bougent pas — vous pourrez rejoindre un autre PDF.',
        bouton: 'Retirer le PDF', danger: true,
        alors() {
          RESERVE.retirer('devis:' + d.id).then(() => {
            delete d.pdf;
            enregistrer(`Devis PDF retiré de ${d.numero}`);
          });
        }
      });
    },

    /* Envoyer le devis au client. Sur téléphone, le partage du système met le
       PDF en pièce jointe — WhatsApp, Mail, ce qu'il veut. Ailleurs, aucun
       navigateur ne sait attacher un fichier à un message : on enregistre le
       PDF et on ouvre le message, à lui de l'y glisser. On le dit. */
    'envoyer-pdf'() {
      const d = DB.devis(id);
      if (!d || !d.pdf) return;
      const texte = messageClient(d);
      RESERVE.prendre('devis:' + d.id).then(blob => {
        if (!blob) { toast('Le fichier n\'est plus sur cet appareil'); return; }
        const fichier = new File([blob], d.pdf.nom || (d.numero + '.pdf'), { type: 'application/pdf' });
        if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
          navigator.share({ files: [fichier], title: d.numero, text: texte })
            .then(() => { d.envoye = d.envoye || Date.now(); figerTva(d); DB.sauver(); toast('Devis envoyé'); })
            .catch(() => { /* partage annulé : rien à signaler */ });
          return;
        }
        S.modale = { type: 'envoi-pdf', id: d.id };
        rendre();
      });
    },

    /* Supprimer un client emporte tout ce qui n'existe que par lui : ses
       véhicules, ses dossiers, ses créneaux, sa place sur le parc. On énumère
       avant, parce qu'une fois parti rien ne revient — sauf par la sauvegarde. */
    'suppr-client'() {
      if (!exigeAdmin('Supprimer un client')) return;
      const c = DB.client(id);
      if (!c) return;
      const nom = DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim();
      const vehic = DB.etat.vehicules.filter(v => v.clientId === c.id);
      const idsV = vehic.map(v => v.id);
      const devis = DB.etat.devis.filter(d => d.clientId === c.id);
      const idsD = devis.map(d => d.id);
      const rdv = DB.etat.planning.filter(p => (p.devisId && idsD.includes(p.devisId)) || p.demandeur === c.id);
      const occ = DB.etat.occupations.filter(o => idsV.includes(o.vehiculeId));
      const du = resteADevoir(c.id);

      confirmer({
        titre: 'Supprimer ' + esc(nom) + ' ?',
        texte: `Partiront avec cette fiche : <b>${vehic.length} véhicule${vehic.length > 1 ? 's' : ''}</b>, `
             + `<b>${devis.length} dossier${devis.length > 1 ? 's' : ''}</b>`
             + (rdv.length ? `, <b>${rdv.length} rendez-vous</b>` : '')
             + (occ.length ? `, et sa place sur le parc` : '')
             + '.'
             + (du > 0 ? `<br><br><b>Attention :</b> ${eur(du)} restent à encaisser sur ce compte. `
                       + 'Cette somme disparaîtra de vos suivis.' : '')
             + (DB.estPro(c) ? '<br>L\'accès à sa grille sera fermé du même coup.' : '')
             + '<br><br>Seule une sauvegarde permet de revenir en arrière.',
        bouton: 'Supprimer ce client', danger: true,
        avant: { acte: 'exporter', txt: 'Sauvegarder d\'abord' },
        alors() {
          idsD.forEach(x => RESERVE.retirer('devis:' + x));   // leurs PDF partent aussi
          DB.etat.occupations = DB.etat.occupations.filter(o => !idsV.includes(o.vehiculeId));
          DB.etat.planning = DB.etat.planning.filter(p => !rdv.includes(p));
          DB.etat.devis = DB.etat.devis.filter(d => d.clientId !== c.id);
          DB.etat.vehicules = DB.etat.vehicules.filter(v => v.clientId !== c.id);
          DB.etat.clients = DB.etat.clients.filter(x => x.id !== c.id);
          DB.appliquerReglages();
          S.clientId = null; S.vue = 'clients';
          enregistrer(`${nom} supprimé — ${devis.length} dossier(s), ${vehic.length} véhicule(s)`);
          toast(`${nom} supprimé`);
        }
      });
    },

    /* Supprimer une intervention, c'est supprimer le dossier qui la porte :
       autant le dire. On annonce ce qui part, y compris un règlement déjà
       encaissé — pour qu'on ne le découvre pas dans les comptes. */
    'suppr-intervention'() {
      const d = DB.devis(id);
      if (!d) return;
      const c = DB.client(d.clientId);
      const t = totaux(d);
      const etat = etatIntervention(d);
      confirmer({
        titre: 'Supprimer cette intervention ?',
        texte: `<b>${esc(d.panne || d.numero)}</b><br>`
             + `${esc(d.numero)} · ${eur(t.ttc)} TTC · ${esc(ETATS_INTERV[etat].nom.toLowerCase())}`
             + `<br><br>Le dossier disparaît de l'historique de ${esc(c ? (DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim()) : 'ce client')}`
             + `${etat === 'regle' ? ', <b>règlement compris</b>' : ''}`
             + `${etat === 'aregler' ? `, et ${eur(t.ttc)} sortent de ce qu'il vous doit` : ''}.`
             + '<br>Ni le véhicule ni la fiche client ne bougent.',
        bouton: 'Supprimer', danger: true,
        alors() {
          RESERVE.retirer('devis:' + id);
          DB.etat.devis = DB.etat.devis.filter(x => x.id !== id);
          // un créneau qui pointait dessus n'a plus d'objet
          DB.etat.planning.forEach(p => { if (p.devisId === id) p.devisId = null; });
          DB.etat.occupations.forEach(o => { if (o.devisId === id) o.devisId = null; });
          DB.sauver();
          enregistrer(`Intervention ${d.numero} supprimée`);
        }
      });
    },

    'etat-interv'() {
      const etat = cible.dataset.etat;
      poserEtatIntervention(id, etat);
      const d = DB.devis(id);
      const c = d ? DB.client(d.clientId) : null;
      rendre();
      toast(etat === 'regle'
        ? `Réglé${c && resteADevoir(c.id) > 0 ? ' — reste ' + eur(resteADevoir(c.id)) : ''}`
        : etat === 'aregler' ? 'Passé à encaisser' : 'Remis en attente');
    },

    'monter-bloc'()    { deplacerBlocAccueil(id, -1); rendre(); },
    'descendre-bloc'() { deplacerBlocAccueil(id, +1); rendre(); },

    'bascule-raccourci'() {

      const liste = raccourcisChoisis().slice();
      const i = liste.indexOf(id);

    'monter-presta'()    { deplacerPresta(id, -1); },
    'descendre-presta'() { deplacerPresta(id, +1); },

    /* Retirer une fermeture : l'atelier rouvre ces jours-là, et le planning
       recommence à y proposer des créneaux. Rien d'autre ne bouge. */
    'rech-reglage-vider'() { S.rechReglage = ''; S.focusRechReglage = true; rendre(); },

    'densite'() { poserMaPref('densite', id); poserDensite(id); rendre(); },

    'logo-retirer'() {
      if (!exigeAdmin('Changer l\'enseigne')) return;
      DB.etat.reglages.logo = '';
      DB.sauver(); enregistrer('Enseigne retirée'); toast('Enseigne retirée'); rendre();
    },

    /* Les onze jours fériés d'une année, posés d'un coup. On saute ceux qui
       tombent un jour déjà fermé — un 1er mai un dimanche ne ferme rien de
       plus — et ceux qui sont déjà là. */
    'feries-ajouter'() {
      if (!exigeAdmin('Modifier les fermetures')) return;
      const an = Number(id) || new Date().getFullYear();
      const r = DB.etat.reglages;
      r.fermetures = r.fermetures || [];
      let poses = 0, deja = 0, dimanches = 0;
      joursFeries(an).forEach(({ jour, nom }) => {
        if (horairesDuJour(r, rangJour(jour)).ferme) { dimanches++; return; }
        if (fermetureDu(jour, r)) { deja++; return; }
        r.fermetures.push({ id: DB.nouvelId('fe'), debut: isoLocal(jour), fin: isoLocal(jour), motif: nom });
        poses++;
      });
      DB.sauver();
      enregistrer(`Jours fériés ${an} ajoutés (${poses})`);
      toast(poses
        ? `${poses} jour${poses > 1 ? 's' : ''} férié${poses > 1 ? 's' : ''} ajouté${poses > 1 ? 's' : ''}`
          + (deja ? `, ${deja} déjà posé${deja > 1 ? 's' : ''}` : '')
          + (dimanches ? `, ${dimanches} tombant${dimanches > 1 ? 's' : ''} un jour déjà fermé` : '')
        : 'Tous les jours fériés de ' + an + ' étaient déjà pris en compte');
      rendre();
    },

    'suppr-fermeture'() {
      if (!exigeAdmin('Modifier les fermetures')) return;
      const r = DB.etat.reglages;
      const f = (r.fermetures || []).find(x => x.id === id);
      r.fermetures = (r.fermetures || []).filter(x => x.id !== id);
      DB.sauver();
      enregistrer('Fermeture retirée' + (f && f.motif ? ' : ' + f.motif : ''));
      toast('Fermeture retirée — l\'atelier rouvre ces jours-là');
      rendre();
    },

    'suppr-famille'() {
      if (!exigeAdmin('Supprimer une section du catalogue')) return;
      const lignes = DB.etat.catalogue.filter(p => p.famille === id);
      const autres = [...new Set(DB.etat.catalogue.map(p => p.famille))].filter(f => f !== id);
      if (!autres.length) { toast('C\'est votre dernière section : elle ne peut pas partir.'); return; }

      confirmer({
        titre: 'Supprimer la section « ' + esc(id) + ' » ?',
        texte: `Elle contient <b>${lignes.length} ligne${lignes.length > 1 ? 's' : ''}</b>. Que deviennent-elles ?`
             + `<div class="champ" style="margin-top:12px"><label>Les déplacer dans</label>
                <select class="saisie" id="choix-famille">
                  ${autres.map(f => `<option value="${esc(f)}">${esc(f)}</option>`).join('')}
                  <option value="__suppr">— Supprimer ces ${lignes.length} ligne${lignes.length > 1 ? 's' : ''} —</option>
                </select></div>`,
        bouton: 'Supprimer la section', danger: true,
        alors() {
          const choix = $('#choix-famille');
          const cible = choix ? choix.value : autres[0];
          if (cible === '__suppr') {
            DB.etat.catalogue = DB.etat.catalogue.filter(p => p.famille !== id);
            enregistrer(`Section « ${id} » supprimée avec ses ${lignes.length} lignes`);
            toast('Section et lignes supprimées');
          } else {
            DB.etat.catalogue.forEach(p => { if (p.famille === id) p.famille = cible; });
            enregistrer(`Section « ${id} » fondue dans « ${cible} »`);
            toast(`${lignes.length} ligne${lignes.length > 1 ? 's déplacées' : ' déplacée'} dans « ${cible} »`);
          }
        }
      });
    },

    'nouvelle-famille'() {
      const prises = new Set(DB.etat.catalogue.map(p => p.famille));
      let nom = 'Nouvelle section', n = 2;
      while (prises.has(nom)) nom = 'Nouvelle section ' + n++;
      DB.etat.catalogue.push({
        id: DB.nouvelId('p'), code: 'NEW-' + (DB.etat.catalogue.length + 1),
        libelle: 'Nouvelle prestation', famille: nom, type: 'mo',
        temps: 1, prixHT: DB.etat.reglages.tauxHoraire, prixPro: DB.etat.reglages.tauxHorairePro
      });
      DB.sauver(); S.rechTarif = ''; rendre();
      toast('Section créée — tapez son nom en haut du bloc');
    },
    'suppr-presta'() {
      if (!exigeAdmin('Supprimer une prestation')) return;
      DB.etat.catalogue = DB.etat.catalogue.filter(p => p.id !== id);
      DB.sauver(); rendre();
    },

    'ouvrir-place'() {

        titre: 'Rendre le véhicule ?',

             + `${v ? ' — ' + esc(v.immat) : ''}<br><br>`
             + (estDansLaRue(id) ? 'Il sera retiré de la rue.' : `La place <b>${esc(id)}</b> sera libérée.`)
             + ' Son dossier et son historique restent intacts.',

    'effacer-signature'() {
      const cv = $('#signature');
      if (cv) { cv.getContext('2d').clearRect(0, 0, cv.width, cv.height); signatureVide = true; const i = $('#signature-invite'); if (i) i.style.display = ''; }
    },
    signer() {
      if (signatureVide) { toast('Merci de signer dans le cadre avant de valider.'); return; }
      const d = DB.devis(id);
      const c = DB.client(d.clientId);
      if (!clientComplet(c)) { toast('Complétez d\'abord vos coordonnées.'); return; }
      d.signature = { nom: (c.prenom + ' ' + c.nom).trim() || c.nom, date: Date.now(), trace: $('#signature').toDataURL('image/png') };
      d.statut = 'accepte'; d.reponse = Date.now(); d.maj = Date.now();
      DB.noter(d.creePar, `${d.numero} accepté et signé par le client`);
      // le client n'est personne dans l'équipe : tout l'atelier est prévenu
      alerterTousExterne('devis', `${d.numero} accepté et signé par ${d.signature.nom}.`,
        { vue: 'devis-fiche', ref: d.id, pro: DB.estPro(c) });
      DB.sauver(); toast('Devis accepté. Merci !'); rendre();
    },

        { vue: 'devis-fiche', ref: d.id, pro: DB.estPro(DB.client(d.clientId)) });
      DB.sauver(); rendre();
