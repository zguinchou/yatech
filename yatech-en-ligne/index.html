const DB = {
  etat: null,

  /** Complète ce qui manque : une sauvegarde d'une version antérieure de
   *  l'outil ne connaît pas forcément tous les champs d'aujourd'hui. */
  normaliser(e) {
    const neuf = () => JSON.parse(JSON.stringify(REGLAGES));
    if (!e.reglages) e.reglages = neuf();
    else {
      const d = neuf();
      /* La coupure du midi n'existait pas : les horaires enregistrés avant elle
         couraient d'une traite. On pose la coupure, et l'ouverture suit — sauf
         si elle avait été changée à la main, auquel cas elle est un choix. */
      const avantPause = e.reglages.pauseDebut === undefined;
      Object.keys(d).forEach(k => { if (e.reglages[k] === undefined) e.reglages[k] = d[k]; });
      if (avantPause && e.reglages.heureDebut === '08:00') e.reglages.heureDebut = d.heureDebut;
    }
    if (!Array.isArray(e.appels)) e.appels = [];
    // une sauvegarde abîmée ne doit pas faire tomber le planning
    if (!Array.isArray(e.reglages.fermetures)) e.reglages.fermetures = [];
    if (!e.reglages.horairesJour || typeof e.reglages.horairesJour !== 'object') e.reglages.horairesJour = {};
    /* Les dossiers déjà partis chez un client n'avaient pas de taux figé :
       on leur pose celui d'aujourd'hui, une fois. Leurs montants restent donc
       exactement ceux qu'on lit à l'écran en ce moment, et ils ne bougeront
       plus si le taux change demain. */
    if (Array.isArray(e.devis)) e.devis.forEach(d => {
      const parti = d.envoye || d.facture || ['accepte', 'commande', 'encours', 'termine', 'facture'].includes(d.statut);
      if (parti && !(d.tva && typeof d.tva.taux === 'number')) {
        d.tva = { taux: Number(e.reglages.tauxTva) || 0, franchise: !!e.reglages.tvaFranchise };
      }
    });
    /* Les droits n'existaient pas : on les pose une fois. L'accueil n'est pas
       administrateur par défaut — le reste de l'équipe l'est, et cela se
       change ensuite dans L'équipe. Un atelier sans aucun administrateur ne
       pourrait plus rien régler : le premier compte en devient un. */
    if (Array.isArray(e.utilisateurs) && e.utilisateurs.length) {
      e.utilisateurs.forEach(u => { if (u.admin === undefined) u.admin = u.role !== 'secretariat'; });
      if (!e.utilisateurs.some(u => u.admin)) e.utilisateurs[0].admin = true;
    }
    /* Les places libres et la rue sont passées dans l'écran Parc. On les retire
       une fois de l'accueil de chacun — sans y toucher ensuite, pour que celui
       qui les y remet les garde. */
    if (Array.isArray(e.utilisateurs)) e.utilisateurs.forEach(u => {
      if (!u.prefs || u.prefs.compteursRanges) return;
      if (Array.isArray(u.prefs.compteurs)) {
        u.prefs.compteurs = u.prefs.compteurs.filter(k => !['placesMeca', 'placesElectro', 'rue'].includes(k));
      }
      u.prefs.compteursRanges = true;
    });
    if (!e.reglages.nomsRangees) e.reglages.nomsRangees = {};
    if (!e.reglages.typesPlaces) e.reglages.typesPlaces = {};
    if (!e.reglages.libelles) e.reglages.libelles = {};
    /* Chaque garage professionnel qui a un e-mail reçoit son code temporaire :
       c'est ce qu'on lui envoie avec le lien, et il choisira le sien. */
    if (Array.isArray(e.clients)) e.clients.forEach(c => {
      const pro = c.tarif === 'pro' || c.type === 'pro';
      if (!pro || !(c.email || '').trim()) return;
      if (c.accesFerme) return;                 // fermé volontairement : on n'y touche pas
      if (c.mdp && c.mdp.emp) return;
      const code = codeTemporaire();
      const sel = Math.random().toString(36).slice(2, 10) + Date.now().toString(36) + c.id;
      c.mdp = { sel, emp: sha256(sel + '::' + code), provisoire: true };
      c.codeTemp = code;
    });
    if (!e.reglages.couleurs) e.reglages.couleurs = {};
    /* Les réglages d'avertissement sont imbriqués : une sauvegarde d'avant leur
       arrivée n'a ni le bloc, ni forcément tous ses événements. */
    if (!e.reglages.notifs) e.reglages.notifs = JSON.parse(JSON.stringify(REGLAGES.notifs));
    else {
      const d = JSON.parse(JSON.stringify(REGLAGES.notifs));
      Object.keys(d).forEach(k => { if (e.reglages.notifs[k] === undefined) e.reglages.notifs[k] = d[k]; });
      if (!e.reglages.notifs.quoi) e.reglages.notifs.quoi = d.quoi;
      else Object.keys(d.quoi).forEach(k => {
        if (e.reglages.notifs.quoi[k] === undefined) e.reglages.notifs.quoi[k] = d.quoi[k];
      });
    }
    // l'outil s'appelait « Atelier » avant d'avoir un nom : on le renomme une fois,
    // sans toucher à celui qui aurait déjà choisi le sien
    if (e.reglages.nomOutil === 'Atelier') e.reglages.nomOutil = 'Yatech';
    if (!e.reglages.accueil) e.reglages.accueil = JSON.parse(JSON.stringify(REGLAGES.accueil));
    if (!Array.isArray(e.utilisateurs) || !e.utilisateurs.length) e.utilisateurs = UTILISATEURS.map(u => Object.assign({}, u));
    /* Personne ne doit se retrouver sans porte. Qui n'a pas encore de code
       reçoit celui de première connexion ; il devra en choisir un à lui. */
    e.utilisateurs.forEach(u => {
      if (!u.email) u.email = sansAccentsSimple(u.nom) + '@garage.fr';
      if (u.mdp && u.mdp.emp) return;
      const sel = Math.random().toString(36).slice(2, 10) + Date.now().toString(36) + u.id;
      u.mdp = { sel, emp: sha256(sel + '::' + MDP_PROVISOIRE), provisoire: true };
    });
    if (!Array.isArray(e.catalogue)) e.catalogue = CATALOGUE.map(p => Object.assign({}, p));
    ['clients', 'vehicules', 'devis', 'occupations', 'memos', 'planning', 'journal', 'alertes']
      .forEach(k => { if (!Array.isArray(e[k])) e[k] = []; });
    if (!e.resolues || typeof e.resolues !== 'object') e.resolues = {};
    e.occupations.forEach(o => { if (!o.pieces) o.pieces = {}; });
    e.devis.forEach(d => { if (!Array.isArray(d.lignes)) d.lignes = []; });
    // date de passage dans EBP : jamais transféré tant qu'elle est nulle
    e.devis.forEach(d => { if (d.ebp === undefined) d.ebp = null; });
    // règlement : null tant que le client n'a pas payé
    e.devis.forEach(d => { if (d.regle === undefined) d.regle = null; });
    e.clients.forEach(c => { if (c.ebp === undefined) c.ebp = null; });
    if (typeof e.compteur !== 'number') e.compteur = 2600;
    return e;
  },

  /** Une sauvegarde est-elle exploitable ? */
  estUneSauvegarde(e) {
    return !!(e && typeof e === 'object' && Array.isArray(e.clients) && Array.isArray(e.devis));
  },

  charger() {
    const brut = stock.lire(CLE);
    if (brut) {
      try { this.etat = JSON.parse(brut); }
      catch (e) { this.etat = null; }        // données abîmées : on repart à vide
    }
    /* L'outil s'ouvre vide : c'est un atelier qui va y mettre ses vrais clients,
       pas une vitrine. Le jeu d'exemple reste disponible d'un bouton dans les
       paramètres, pour qui veut voir à quoi ça ressemble rempli. */
    if (!this.etat) this.etat = jeuVierge();

    /* Les appareils ouverts avant ce changement portent encore les voitures et
       les rendez-vous d'exemple. On les enlève une fois, une seule — la marque
       posée dans les réglages empêche que cela recommence, y compris pour qui
       redemande la démonstration exprès. */
    if (this.etat && (!this.etat.reglages || !this.etat.reglages.demoPurgee)
        && estLeJeuDemo(this.etat)) {
      const equipe = this.etat.utilisateurs;
      const reglages = this.etat.reglages;
      this.etat = jeuVierge();
      if (Array.isArray(equipe) && equipe.length) this.etat.utilisateurs = equipe;
      if (reglages) this.etat.reglages = reglages;
      this.etat.reglages.demoPurgee = 1;
    }

    /* Un catalogue vide sans qu'on l'ait voulu — appareil ouvert entre deux
       versions — se recharge de sa base. Celui qui l'a vidé exprès garde sa
       page blanche : le drapeau le dit. */
    if (this.etat && Array.isArray(this.etat.catalogue) && !this.etat.catalogue.length
        && !(this.etat.reglages && this.etat.reglages.catalogueVide)) {
      this.etat.catalogue = CATALOGUE.map(p => Object.assign({}, p));
    }

    this.normaliser(this.etat);
    this.appliquerReglages();
    // on sait dès le départ si ce navigateur nous laissera enregistrer
    this.ecritOk = stock.disponible();
    return this.etat;
  },

  /** Remettre la base de prestations livrée avec l'outil. */
  remettreCatalogue() {
    DB.etat.catalogue = CATALOGUE.map(p => Object.assign({}, p));
    DB.etat.reglages.catalogueVide = 0;
    DB.sauver();
    return DB.etat.catalogue.length;
  },

  /** Reconstruit ce qui dépend des paramètres, et remet dehors les voitures
   *  dont la place n'existe plus après un redécoupage du parc. */
  appliquerReglages() {
    construireParc(this.etat.reglages);
    construireHeures(this.etat.reglages);
    appliquerLibelles(this.etat.reglages);
    let deplacees = 0;
    this.etat.occupations.forEach(o => {
      if (estDansLaRue(o.placeId)) return;
      if (!PLACES.some(p => p.id === o.placeId)) { o.placeId = PREFIXE_RUE + o.vehiculeId; deplacees++; }
    });
    if (deplacees) this.sauver();
    return deplacees;
  },

  /** Remplace tout par une sauvegarde relue depuis un fichier. */
  restaurer(donnees) {
    if (!this.estUneSauvegarde(donnees)) return false;
    this.etat = this.normaliser(donnees);
    this.appliquerReglages();     // une sauvegarde peut décrire un autre parc
    this.sauver();
    return true;
  },

  /* On garde trace de chaque écriture : l'écran peut alors dire « enregistré à
     14:32 », ou prévenir franchement que rien n'est conservé. Un doute là-dessus
     coûte plus cher que n'importe quelle fonction manquante. */
  ecritOk: true,
  dernierEcrit: null,
  sauver() {
    // la date de dernière modification voyage avec les données : c'est elle
    // qui dit quel appareil est à jour quand on en compare deux
    this.etat.majGlobale = Date.now();
    const texte = JSON.stringify(this.etat);
    this.ecritOk = stock.ecrire(CLE, texte);
    this.empreinte = texte.length;              // pour repérer l'écho d'un autre onglet
    if (this.ecritOk) this.dernierEcrit = Date.now();
    return this.ecritOk;
  },

  /* Un autre onglet (ou l'autre version de l'outil) vient d'écrire : on reprend
     ce qu'il a enregistré au lieu de l'écraser à la prochaine frappe. */
  relire() {
    const brut = stock.lire(CLE);
    if (!brut) return false;
    let donnees;
    try { donnees = JSON.parse(brut); } catch (e) { return false; }
    if (!this.estUneSauvegarde(donnees)) return false;
    this.etat = this.normaliser(donnees);
    this.appliquerReglages();
    this.dernierEcrit = Date.now();
    return true;
  },

  /** Remettre le jeu d'exemple, à la demande expresse. La marque évite que le
   *  nettoyage automatique ne le reprenne au rechargement suivant. */
  reinitialiser() {
    this.etat = this.normaliser(jeuDeDemo());
    this.etat.reglages.demoPurgee = 1;
    this.appliquerReglages();     // le plan du parc suit les paramètres remis à neuf
    this.sauver();
  },

  /** L'outil neuf, sans rien dedans. */
  toutVider() {
    const equipe = this.etat ? this.etat.utilisateurs : null;
    this.etat = this.normaliser(jeuVierge());
    if (Array.isArray(equipe) && equipe.length) this.etat.utilisateurs = equipe;
    this.etat.catalogue = [];
    this.etat.reglages.catalogueVide = 1;    // vidé volontairement : on n'y revient pas
    this.etat.reglages.demoPurgee = 1;
    this.appliquerReglages();
    this.sauver();
  },

  /* Faire place nette pour de vraies données. On vide le travail de la
     démonstration — clients, véhicules, dossiers, planning, pense-bêtes, parc,
     alertes, journal — et on garde soigneusement ce qui a été réglé : l'équipe
     et ses mots de passe, les réglages, et le catalogue si on le demande.
     Le compteur de numéros repart aussi, sinon le premier vrai devis
     porterait un numéro de démonstration. */
  viderDonnees(options) {
    const o = options || {};
    const compte = {
      clients: DB.etat.clients.length,
      vehicules: DB.etat.vehicules.length,
      devis: DB.etat.devis.length,
      planning: DB.etat.planning.length,
      memos: DB.etat.memos.length,
      occupations: DB.etat.occupations.length,
      catalogue: o.catalogue ? DB.etat.catalogue.length : 0
    };
    DB.etat.clients = [];
    DB.etat.vehicules = [];
    DB.etat.devis = [];
    DB.etat.planning = [];
    DB.etat.memos = [];
    DB.etat.occupations = [];
    DB.etat.alertes = [];
    DB.etat.journal = [];
    if (o.catalogue) { DB.etat.catalogue = []; DB.etat.reglages.catalogueVide = 1; }
    DB.etat.compteur = 0;         // le prochain numéro sera le n° 1
    DB.appliquerReglages();       // le parc se redessine vide
    DB.sauver();
    return compte;
  },

  /* --- lectures --------------------------------------------------------- */
  client:    id => DB.etat.clients.find(c => c.id === id),
  vehicule:  id => DB.etat.vehicules.find(v => v.id === id),
  devis:     id => DB.etat.devis.find(d => d.id === id),
  devisParToken: t => DB.etat.devis.find(d => d.token === t),
  place:     id => estDansLaRue(id)
                     ? { id, zone: 'R', type: 'rue', nature: null, col: -1, rang: -1, orient: 0 }
                     : PLACES.find(p => p.id === id),
  dansLaRue: () => DB.etat.occupations.filter(o => String(o.placeId).indexOf(PREFIXE_RUE) === 0),
  occupation:id => DB.etat.occupations.find(o => o.placeId === id),
  occupationDuVehicule: vid => DB.etat.occupations.find(o => o.vehiculeId === vid),
  utilisateur: id => DB.etat.utilisateurs.find(u => u.id === id),
  presta:    id => DB.etat.catalogue.find(p => p.id === id),
  memosDe:   uid => DB.etat.memos.filter(m => m.userId === uid),
  rdv:       id => DB.etat.planning.find(p => p.id === id),
  clientParToken: t => DB.etat.clients.find(c => c.token === t),
  rdvParToken:    t => DB.etat.planning.find(p => p.token === t),

  /** Jeton d'annulation d'un rendez-vous, créé au premier envoi. Un jeton par
   *  rendez-vous : le lien d'un client ne peut pas décommander celui d'un
   *  autre, et il meurt avec le créneau. */
  jetonRdv(p) {
    if (!p.token) { p.token = Math.random().toString(36).slice(2, 9); DB.sauver(); }
    return p.token;
  },

  /** Jeton de partage d'un client, créé au premier besoin. */
  jetonClient(c) {
    if (!c.token) { c.token = Math.random().toString(36).slice(2, 9); DB.sauver(); }
    return c.token;
  },

  /** Grille tarifaire applicable à un client. */
  estPro: (c) => !!(c && (c.tarif ? c.tarif === 'pro' : c.type === 'pro')),

  /* Le catalogue tel que ce client-là le voit. Tous ne font pas appel à nous
     pour la même chose : l'un n'a que de l'électronique, l'autre les deux. On
     masque donc ce qui ne le concerne pas, et on lui ajoute au besoin des
     lignes qui n'existent que pour lui — sans jamais toucher au catalogue
     commun ni à ce que voient les autres. */
  catalogueDe(client) {
    const masquees = (client && client.masquees) || {};
    const commun = DB.etat.catalogue.filter(p => !masquees[p.id]);
    const perso = (client && Array.isArray(client.presta) ? client.presta : [])
      .map(p => Object.assign({ perso: true }, p));
    if (!perso.length) return commun;
    /* Les lignes propres se rangent dans leur section, à la suite des autres :
       la grille se lit d'un bloc, pas en deux morceaux. */
    const familles = [...new Set(commun.map(p => p.famille).concat(perso.map(p => p.famille)))];
    return familles.flatMap(f => commun.filter(p => p.famille === f)
      .concat(perso.filter(p => p.famille === f)));
  },

  /** Cette prestation est-elle visible pour ce client ? */
  visiblePour(presta, client) {
    if (!presta || !client) return true;
    if (presta.perso) return (client.presta || []).some(p => p.id === presta.id);
    return !(client.masquees && client.masquees[presta.id]);
  },

  /* Prix appliqué à un client, dans cet ordre :
     1. le prix négocié avec lui sur cette prestation ;
     2. sinon la grille professionnelle, moins sa remise personnelle ;
     3. sinon la grille particulier.
     Chaque confrère peut ainsi avoir ses conditions sans toucher au catalogue. */
  prixPour(presta, client) {
    if (!presta) return 0;
    /* Un prix ne descend jamais sous zéro : offert, c'est zéro. Un montant
       négatif se propagerait dans les totaux, dans le reste à encaisser et
       jusque dans EBP — un avoir se fait sur une facture, pas dans un tarif. */
    const perso = client && client.tarifs && client.tarifs[presta.id];
    if (perso !== undefined && perso !== null && perso !== '') {
      const n = Number(perso);
      if (!isNaN(n)) return Math.max(0, n);
    }
    /* Une ligne créée pour ce client seul porte déjà son prix : on ne lui
       applique pas la remise générale, sinon le prix convenu serait rogné. */
    if (presta.perso) return Math.max(0, Number(presta.prixHT) || 0);
    if (!DB.estPro(client)) return Math.max(0, presta.prixHT);
    const base = presta.prixPro != null ? presta.prixPro : presta.prixHT;
    // une remise vit entre 0 et 100 % ; au-delà elle ferait payer le garage
    const remise = Math.min(100, Math.max(0, Number(client && client.remisePro) || 0));
    if (!remise) return Math.max(0, base);
    return Math.max(0, Math.round(base * (1 - remise / 100) * 100) / 100);
  },

  /** Ce prix vient-il d'un accord particulier avec ce client ? */
  prixNegocie(presta, client) {
    const v = client && client.tarifs && client.tarifs[presta.id];
    return v !== undefined && v !== null && v !== '';
  },

  /* --- écritures -------------------------------------------------------- */
  nouvelId: (prefixe) => prefixe + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),

  nouveauNumero() {
    /* Deux dossiers ne doivent JAMAIS porter le même numéro : c'est par lui
       qu'EBP retrouve la facture. Le compteur peut pourtant retomber en
       arrière — on le règle à la main dans les paramètres pour reprendre une
       numérotation. Alors on avance jusqu'à un numéro encore libre. */
    const prefixe = DB.etat.reglages.prefixeDevis || 'DV-';
    let numero;
    do {
      DB.etat.compteur += 1;
      numero = prefixe + DB.etat.compteur;
    } while (DB.etat.devis.some(d => d.numero === numero));
    return numero;
  },

  /** Une teinte encore libre pour une nouvelle personne. */
  teinteLibre() {
    const prises = DB.etat.utilisateurs.map(u => u.teinte);
    const palette = [38, 195, 320, 145, 265, 15, 90, 220];
    return palette.find(t => !prises.includes(t)) || Math.floor(Math.random() * 360);
  },

  /* --- accès de l'équipe ------------------------------------------------
     Le mot de passe n'est jamais rangé en clair : on garde une empreinte
     et un grain de sel propre à chacun. Personne ne peut le relire, ni dans
     la sauvegarde, ni dans le navigateur. */
  /* --- une seule porte, deux niveaux de droits -------------------------
     Salariés et garages professionnels se connectent au même endroit, avec
     un e-mail et un mot de passe. C'est le compte trouvé qui décide de ce
     qu'on voit : l'atelier entier, ou seulement sa grille. */
  normEmail: (e) => String(e || '').trim().toLowerCase(),

  /* On accepte l'e-mail, mais aussi le prénom pour l'équipe : à trois dans un
     garage, personne ne retient une adresse générée automatiquement, et se
     retrouver dehors de chez soi n'a aucun sens. */
  compteParEmail(email) {
    const m = DB.normEmail(email);
    if (!m) return null;

    let u = DB.etat.utilisateurs.find(x => DB.normEmail(x.email) === m);
    if (!u) u = DB.etat.utilisateurs.find(x => DB.normEmail(x.nom) === m);
    if (u) return { type: 'salarie', id: u.id, nom: u.nom };

    const c = DB.etat.clients.find(x => DB.estPro(x) && DB.normEmail(x.email) === m);
    if (c) return { type: 'pro', id: c.id, nom: c.nom };
    return null;
  },

  /** Rouvre l'accès de toute l'équipe avec le code temporaire. Les données ne
   *  bougent pas — c'est la porte qu'on déverrouille, pas le contenu. */
  reouvrirEquipe() {
    DB.etat.utilisateurs.forEach(u => DB.definirMdp(u.id, MDP_PROVISOIRE, true));
    DB.sauver();
    return DB.etat.utilisateurs.length;
  },

  /** Le code temporaire d'un garage pro : lisible tant qu'il ne l'a pas changé. */
  codeTempPro(clientId) {
    const c = DB.client(clientId);
    return c && c.mdp && c.mdp.provisoire ? (c.codeTemp || '') : '';
  },

  definirMdpClient(clientId, mdp, provisoire, codeClair) {
    const c = DB.client(clientId);
    if (!c) return false;
    /* Fermer un accès doit tenir : sans ce drapeau, la normalisation au
       chargement suivant lui redonnerait un code temporaire et la porte se
       rouvrirait toute seule. */
    if (!mdp) { c.mdp = null; c.codeTemp = ''; c.accesFerme = true; DB.sauver(); return true; }
    const sel = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    c.mdp = { sel, emp: sha256(sel + '::' + mdp), provisoire: !!provisoire };
    c.codeTemp = provisoire ? (codeClair || mdp) : '';
    c.accesFerme = false;
    DB.sauver();
    return true;
  },

  /* Un mot de passe se tape aussi sur un téléphone : le clavier ajoute volontiers
     une espace après un collage, et une saisie automatique en laisse souvent une
     à la fin. On essaie donc la saisie telle quelle, puis sans ses espaces de
     bord — jamais celles du milieu, qui font partie du mot de passe. */
  variantesMdp(mdp) {
    const s = String(mdp || '');
    const t = s.trim();
    return t === s ? [s] : [s, t];
  },

  verifierMdpClient(clientId, mdp) {
    const c = DB.client(clientId);
    if (!c || !c.mdp) return false;
    const essais = DB.variantesMdp(mdp);
    if (essais.some(v => c.mdp.emp === sha256(c.mdp.sel + '::' + v))) return true;
    /* Le code d'accès est affiché en majuscules, mais un clavier de téléphone
       commence en minuscules. Tant que le confrère n'a pas choisi son mot de
       passe, on ne lui fait pas payer cette différence. */
    if (c.mdp.provisoire && c.codeTemp) {
      const attendu = String(c.codeTemp).toUpperCase();
      if (essais.some(v => v.toUpperCase() === attendu)) return true;
    }
    return false;
  },

  mdpProvisoireClient(clientId) {
    const c = DB.client(clientId);
    return !!(c && c.mdp && c.mdp.provisoire);
  },

  definirMdp(userId, mdp, provisoire) {
    const u = DB.utilisateur(userId);
    if (!u) return false;
    if (!mdp) { u.mdp = null; DB.sauver(); return true; }
    const sel = Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
    u.mdp = { sel, emp: sha256(sel + '::' + mdp), provisoire: !!provisoire };
    DB.sauver();
    return true;
  },

  /** Le code de première connexion, tant que la personne n'a pas choisi le sien. */
  mdpProvisoire(userId) {
    const u = DB.utilisateur(userId);
    return !!(u && u.mdp && u.mdp.provisoire);
  },

  verifierMdp(userId, mdp) {
    const u = DB.utilisateur(userId);
    if (!u) return false;
    if (!u.mdp) return true;                       // pas de code posé : accès libre
    const essais = DB.variantesMdp(mdp);
    if (essais.some(v => u.mdp.emp === sha256(u.mdp.sel + '::' + v))) return true;
    /* Tant que personne n'a choisi son mot de passe, le code de première
       connexion en vigueur ouvre toujours. Sans cela, un appareil resté sur un
       ancien code garderait son propriétaire dehors de son propre outil, sans
       aucun moyen de s'en rendre compte. */
    if (u.mdp.provisoire && essais.some(v => v === MDP_PROVISOIRE)) {
      DB.definirMdp(userId, MDP_PROVISOIRE, true);   // l'empreinte se réaligne
      return true;
    }
    return false;
  },

  aUnMdp(userId) {
    const u = DB.utilisateur(userId);
    return !!(u && u.mdp && u.mdp.emp);
  },

  /** L'outil est-il protégé, ne serait-ce que par une seule personne ? */
  protege() { return DB.etat.utilisateurs.some(u => u.mdp && u.mdp.emp); },

  noter(qui, texte) {
    DB.etat.journal.unshift({ id: DB.nouvelId('j'), quand: now(), qui, texte });
    DB.etat.journal = DB.etat.journal.slice(0, 60);
  },

  /* Une alerte est destinée à quelqu'un. `pour` vaut un identifiant, ou 'tous'
     pour ce qui concerne l'atelier entier. Celui qui déclenche l'événement ne
     se prévient jamais lui-même : il sait déjà ce qu'il vient de faire. */
  alerter(pour, type, texte, contexte) {
    if (!Array.isArray(DB.etat.alertes)) DB.etat.alertes = [];
    const cibles = pour === 'tous'
      ? DB.etat.utilisateurs.map(u => u.id).filter(id => id !== DB.acteur)
      : [pour].filter(id => id && id !== DB.acteur);
    if (!cibles.length) return;

    cibles.forEach(id => DB.etat.alertes.unshift({
      id: DB.nouvelId('al'), pour: id, de: DB.acteur || null,
      type, texte, quand: now(), lu: false,
      vue: contexte && contexte.vue || null, ref: contexte && contexte.ref || null,
      pro: !!(contexte && contexte.pro),       // vient d'un garage professionnel
      cle: contexte && contexte.cle || null    // repère d'une alerte posée par la veille
    }));
    DB.etat.alertes = DB.etat.alertes.slice(0, 200);
  },

  /** Qui agit en ce moment : renseigné par l'application à chaque action. */
  acteur: null,

  alertesDe(userId, toutes) {
    if (!Array.isArray(DB.etat.alertes)) return [];
    // écartée : rangée par cette personne-là ; les autres la gardent
    return DB.etat.alertes.filter(a => a.pour === userId && !a.ecartee && (toutes || !a.lu));
  },

  /* Écarter, c'est pour soi seul : « je ne peux rien y faire, qu'un autre s'en
     occupe ». On garde la trace au lieu de supprimer, sinon la veille reposerait
     la même alerte au prochain chargement. */
  ecarter(alerteId) {
    const a = (DB.etat.alertes || []).find(x => x.id === alerteId);
    if (!a) return null;
    a.ecartee = now();
    a.lu = true;
    DB.sauver();
    return a;
  },

  /* Traiter, c'est pour tout le monde : le travail est fait, plus personne n'a
     à le voir. Toutes les copies de la même alerte disparaissent. */
  resoudre(cle) {
    if (!cle || !Array.isArray(DB.etat.alertes)) return 0;
    const avant = DB.etat.alertes.length;
    DB.etat.alertes = DB.etat.alertes.filter(a => a.cle !== cle);
    /* On garde la décision : sans elle, la veille reposerait l'alerte au
       redessin suivant, puisque le dossier, lui, est toujours ouvert. La trace
       s'efface d'elle-même quand le travail est réellement terminé. */
    if (!DB.etat.resolues) DB.etat.resolues = {};
    DB.etat.resolues[cle] = now();
    DB.sauver();
    return avant - DB.etat.alertes.length;
  },

  /** Cette alerte a-t-elle été déclarée traitée par quelqu'un ? */
  estResolue(cle) {
    return !!(DB.etat.resolues && DB.etat.resolues[cle]);
  },

  /** Oublie les décisions dont le sujet n'existe plus. */
  nettoyerResolues(vivantes) {
    if (!DB.etat.resolues) { DB.etat.resolues = {}; return 0; }
    let n = 0;
    Object.keys(DB.etat.resolues).forEach(cle => {
      if (!vivantes.has(cle)) { delete DB.etat.resolues[cle]; n++; }
    });
    if (n) DB.sauver();
    return n;
  },

  /** A-t-on déjà posé cette alerte à cette personne, même écartée depuis ? */
  dejaPosee(cle, userId) {
    return (DB.etat.alertes || []).some(a => a.cle === cle && a.pour === userId);
  },

  supprimerOccupation(placeId) {
    DB.etat.occupations = DB.etat.occupations.filter(o => o.placeId !== placeId);
  }
};

</script>
<script>
/* ==========================================================================
   ATELIER — logique de l'application
   ========================================================================== */

/* --- petites fonctions utilitaires --------------------------------------- */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));

const esc = (v) => String(v == null ? '' : v)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

const eur = (n) => (Number(n) || 0).toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
const eur0 = (n) => Math.round(Number(n) || 0).toLocaleString('fr-FR') + ' €';

const dateCourte = (ts) => ts ? new Date(ts).toLocaleDateString('fr-FR', { day: '2-digit', month: 'short' }) : '—';
const dateLongue = (ts) => ts ? new Date(ts).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }) : '—';
const heure = (ts) => ts ? new Date(ts).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' }) : '';

/* Date au format d'un <input type="date">, en heure LOCALE.
   toISOString() passerait par UTC : en France l'été, minuit local devient
   22 h la veille et toutes les dates reculeraient d'un jour. */
function isoLocal(ts) {
  const d = new Date(ts);
  return d.getFullYear() + '-'
    + String(d.getMonth() + 1).padStart(2, '0') + '-'
    + String(d.getDate()).padStart(2, '0');
}
/** Lecture d'un <input type="date"> : midi, pour ne dépendre d'aucun fuseau. */
const depuisInputDate = (v) => v ? new Date(v + 'T12:00').setHours(0, 0, 0, 0) : null;

const joursDepuis = (ts) => Math.floor((Date.now() - ts) / JOUR);
function depuisTexte(ts) {
  const h = Math.floor((Date.now() - ts) / 3600000);
  if (h < 1) return 'à l\'instant';
  if (h < 24) return h + ' h';
  const j = Math.floor(h / 24);
  return j + (j > 1 ? ' jours' : ' jour');
}

/* --- pictogrammes --------------------------------------------------------- */
const ICO = {
  jauge:    '<path d="M3 13a9 9 0 0118 0"/><path d="M12 13l4.5-3.5"/><circle cx="12" cy="13" r="1.4" fill="currentColor" stroke="none"/><path d="M3 13v4h18v-4"/>',
  /* un toit et une porte : le retour à la première page se reconnaît sans mot */

  devis:    '<path d="M14 3H7a2 2 0 00-2 2v14a2 2 0 002 2h10a2 2 0 002-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/>',
  parking:  '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 17V8h3.5a2.75 2.75 0 010 5.5H9"/>',
  clients:  '<path d="M16 20v-1.5a3.5 3.5 0 00-3.5-3.5h-5A3.5 3.5 0 004 18.5V20"/><circle cx="10" cy="8" r="3.2"/><path d="M20 20v-1.5a3.5 3.5 0 00-2.6-3.4"/><path d="M15.5 5.2a3.2 3.2 0 010 5.6"/>',
  /* six points : la poignée qu'on reconnaît sans qu'on l'explique */
  poignee:  '<circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/>',
  catalogue:'<path d="M4 6h16M4 12h16M4 18h10"/><circle cx="19" cy="18" r="1.6" fill="currentColor" stroke="none"/>',
  reglages: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>',
  plus:     '<path d="M12 5v14M5 12h14"/>',
  tel:      '<path d="M5 4h4l2 5-2.5 1.5a12 12 0 005 5L15 13l5 2v4a1 1 0 01-1.1 1A16 16 0 014 5.1 1 1 0 015 4z"/>',
  loupe:    '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/>',
  fleche:   '<path d="M9 6l6 6-6 6"/>',
  retour:   '<path d="M15 6l-6 6 6 6"/>',
  haut:     '<path d="M6 15l6-6 6 6"/>',
  bas:      '<path d="M6 9l6 6 6-6"/>',
  croix:    '<path d="M6 6l12 12M18 6L6 18"/>',

   réimportées, appareil resté sur un ancien jeu de comptes — ne doit surtout
   pas se rabattre sur le premier de la liste : la barre afficherait quelqu'un
   d'autre et tout ce qui serait fait le serait sous son nom. On referme la
   porte, la personne se reconnecte. */
function sessionValide() {
  if (S.userId && !DB.utilisateur(S.userId)) {
    S.userId = null;
    stock.effacer('atelier.qui');
    return false;
  }
  if (S.proConnecte) {
    const c = DB.client(S.proConnecte);
    if (!c || !DB.estPro(c) || c.accesFerme) {
      S.proConnecte = null; S.grilleToken = null;
      stock.effacer('atelier.pro');
      return false;
    }
  }
  return true;
}

/* ==========================================================================
   CALCULS
   ========================================================================== */
/** La TVA qui s'applique à un dossier : celle figée à son départ si elle l'a
 *  été, sinon celle de l'atelier aujourd'hui — un devis en préparation suit
 *  les réglages, un devis parti ne bouge plus. */
function tvaDu(d) {
  if (d && d.tva && typeof d.tva.taux === 'number') return d.tva;
  return { taux: Number(DB.etat.reglages.tauxTva) || 0,
           franchise: !!DB.etat.reglages.tvaFranchise };
}

/** Figer le taux sur un dossier. Une fois posé, il ne se repose pas. */
function figerTva(d) {
  if (!d || (d.tva && typeof d.tva.taux === 'number')) return;
  d.tva = { taux: Number(DB.etat.reglages.tauxTva) || 0,
            franchise: !!DB.etat.reglages.tvaFranchise };
}

/* Une remise se lit toujours entre 0 et 100 %. La saisie le tient déjà, mais
   une base reprise d'ailleurs peut porter n'importe quoi : sans cette borne,
   un devis finissait en négatif — le garage devant de l'argent au client. */
const partRemise = (v) => Math.min(100, Math.max(0, Number(v) || 0)) / 100;

function totaux(d) {
  const brut = (d.lignes || []).reduce((s, l) => s + (Number(l.qte) || 0) * (Number(l.prixHT) || 0) * (1 - partRemise(l.remise)), 0);
  const rem = brut * partRemise(d.remise);
  const ht = brut - rem;
  /* Le taux qui s'applique est celui du jour où le devis est parti, pas celui
     d'aujourd'hui. Sans ça, changer la TVA dans les réglages réécrivait le
     montant de toutes les factures déjà émises — un document que le client a
     entre les mains et que le comptable a enregistré.

     En franchise en base, il n'y a pas de TVA à facturer : le taux ne
     s'applique pas, quel qu'il soit resté dans les réglages. */
  const t = tvaDu(d);
  const tva = t.franchise ? 0 : ht * (t.taux / 100);
  return { brut, rem, ht, tva, ttc: ht + tva };
}

function infosDevis(d) {
  const c = DB.client(d.clientId);
  const v = DB.vehicule(d.vehiculeId);
  return {
    client: c,
    vehicule: v,
    nomClient: c ? (c.type === 'pro' ? c.nom : (c.prenom + ' ' + c.nom).trim()) : 'Client inconnu',
    vehiculeTexte: v ? `${v.marque} ${v.modele}` : 'Véhicule non renseigné',
    immat: v ? v.immat : '—'
  };
}

function clientComplet(c) {
  return !!(c && c.nom && c.tel && c.email && c.adresse && c.cp && c.ville);
}

/** Devis qui dorment : envoyés et sans réponse depuis trop longtemps. */
function aRelancer() {
  const seuil = DB.etat.reglages.relanceApres;
  return DB.etat.devis.filter(d => d.statut === 'envoye' && joursDepuis(d.envoye || d.cree) >= seuil);
}
function appelsATraiter() { return DB.etat.devis.filter(d => d.statut === 'appel'); }

/** Créneaux demandés par un garage pro et pas encore confirmés. */
function demandesPro() { return DB.etat.planning.filter(p => p.aValider); }
function attenteInfos()   { return DB.etat.devis.filter(d => d.statut === 'attente'); }
function pretsARendre()   { return DB.etat.occupations.filter(o => o.etat === 'pret'); }
function immobilisesLongs() {
  const seuil = DB.etat.reglages.immobilisationAlerte;
  return DB.etat.occupations.filter(o => joursDepuis(o.depuis) >= seuil);
}
function placesLibres() {
  const prises = new Set(DB.etat.occupations.map(o => o.placeId));
  return PLACES.filter(p => !prises.has(p.id));

/* ==========================================================================
   ACTIONS
   ========================================================================== */
function toast(txt) {
  const z = $('#toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = txt;
  z.appendChild(el);
  /* Les mains dans le moteur, on ne lit pas un message en deux secondes. La
     durée se règle — bornée, pour qu'un message ne s'installe jamais. */
  const d = Math.min(15, Math.max(1, Number(DB.etat && DB.etat.reglages.dureeMessages) || 2.4)) * 1000;
  setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, d);
  setTimeout(() => el.remove(), d + 400);
}

function enregistrer(texte) {
  if (texte) DB.noter(S.userId, texte);
  DB.sauver();
  rendre();
}

/** Les préférences de quelqu'un, créées au premier réglage. */
function prefsDe(userId) {
  const u = DB.utilisateur(userId || S.userId);
  if (!u) return null;
  if (!u.prefs) u.prefs = {};
  return u.prefs;
}

/* Une préférence d'avertissement : la sienne si elle est posée, sinon celle
   que l'atelier propose par défaut. */
function prefNotif(cle, userId) {
  const u = DB.utilisateur(userId || S.userId);
  const commun = DB.etat.reglages.notifs || {};
  const p = u && u.prefs && u.prefs.notifs;
  if (p && p[cle] !== undefined) return p[cle];
  return commun[cle];
}

function prefNotifQuoi(type, userId) {
  const u = DB.utilisateur(userId || S.userId);
  const commun = (DB.etat.reglages.notifs || {}).quoi || {};
  const p = u && u.prefs && u.prefs.notifs && u.prefs.notifs.quoi;
  if (p && p[type] !== undefined) return p[type];
  return !!commun[type];
}

function poserPrefNotif(cle, valeur, userId) {
  const p = prefsDe(userId);
  if (!p) return;
  if (!p.notifs) p.notifs = {};
  p.notifs[cle] = valeur;
  DB.sauver();
}

function poserPrefNotifQuoi(type, valeur, userId) {
  const p = prefsDe(userId);
  if (!p) return;
  if (!p.notifs) p.notifs = {};
  if (!p.notifs.quoi) p.notifs.quoi = {};
  p.notifs.quoi[type] = valeur;
  DB.sauver();
}

/* ==========================================================================

   --------------------------------------------------------------------------
   Un garage ne se pilote pas avec les mêmes chiffres selon le jour, la
   personne et la saison. Plutôt que d'en choisir six pour tout le monde, on
   les met tous là — le parc, la charge, l'argent, le fichier, la journée — et
   chacun coche les siens dans les paramètres. Ce qui n'est pas coché ne
   s'affiche pas, et ne se calcule pas.

   Chaque compteur dit trois choses : combien, de quoi, et où aller en
   cliquant. Un compteur qui n'emmène nulle part n'a rien à faire ici.
   ========================================================================== */

/** Le lundi de la semaine en cours, et le premier jour du mois. */
function debutSemaine() {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getTime();
}
function debutMois() {
  const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(1);
  return d.getTime();
}

/** La date qui fait foi pour un encaissement : celle de la facture. */

/** Tous les dossiers terminés et non encaissés, de tout le monde. */

  return DB.etat.devis.filter(d => (d.lignes || []).length && etatIntervention(d) === 'aregler');
}

/* Ceux qu'on affiche à la livraison. Les places libres et les voitures dans la
   rue n'y sont plus : elles vivent en haut de l'écran Parc, où l'on va de toute
   façon quand on cherche une place. L'accueil garde ce qui appelle une action.
   Le reste attend qu'on aille le chercher — un tableau de bord de quarante
   cases ne se lit plus. */
const COMPTEURS_DEFAUT = ['appels', 'relances', 'attenteInfos', 'prets', 'rdvJour'];

/* Les compteurs du parc, montrés en haut de l'écran Parc. On y va pour placer
   une voiture ou en sortir une : le nombre de places libres se lit là, pas sur
   un tableau de bord qu'on regarde le matin. */
const COMPTEURS_PARC = ['placesMeca', 'placesElectro', 'placesTotal', 'rue', 'prets', 'immobilises'];

/* Une seule tuile de compteur, dessinée pareil partout — l'accueil et le parc
   n'en font pas deux versions. */
function tuileCompteur(c) {
  let v;
  try { v = c.calc(); } catch (e) { return ''; }
  const n = Number(typeof v === 'object' ? v.n : v) || 0;
  const aff = typeof v === 'object' ? v.aff : v;
  const bat = c.alerte && n > 0 && DB.etat.reglages.compteursClignotent !== false;
  return `<button class="brief-item ${n ? '' : 'calme'} ${bat ? 'appelle' : ''}"
      style="--ton:${c.ton}" data-act="aller" data-vue="${c.vue}"
      data-cpt="${c.cle}" ${c.extra || ''}>
    <span class="val">${aff}</span><span class="leg">${esc(c.nom(n))}</span>
  </button>`;
}

/** Poser d'un coup la liste des compteurs de la personne connectée. */
function poserCompteurs(liste) {
  const p = prefsDe();
  if (!p) return;
  p.compteurs = liste;
  DB.sauver(); rendre();
}

/** Ceux que cette personne veut voir, dans SON ordre — celui qu'elle a rangé
 *  au doigt sur l'accueil. Un compteur inconnu (venu d'une version antérieure,
 *  ou coché deux fois) est écarté au passage. */
function compteursChoisis(userId) {
  const u = DB.utilisateur(userId || S.userId);
  const perso = u && u.prefs && Array.isArray(u.prefs.compteurs) ? u.prefs.compteurs : null;
  const vus = [];
  return (perso || COMPTEURS_DEFAUT)
    .map(cle => (vus.includes(cle) ? null : (vus.push(cle), COMPTEURS.find(c => c.cle === cle))))
    .filter(Boolean);
}

/* Les blocs de l'accueil, dans l'ordre livré. Chacun peut les ranger autrement :
   l'ordre est une préférence, comme les cases cochées. */
const BLOCS_ACCUEIL = [
  ['raccourcis', 'Les raccourcis en haut'],
  ['compteurs',  'Les compteurs (places libres, véhicules prêts…)'],
  ['facturer',   'Ce qu\'il reste à facturer dans EBP'],
  ['pros',       'Les garages partenaires et leurs grilles'],
  ['appels',     'Les appels reçus'],
  ['journal',    'Le journal du téléphone (qui a appelé)'],
  ['memos',      'Les pense-bêtes'],
  ['planning',   'Le planning du jour et du lendemain']
];

/** L'ordre choisi par cette personne, complété de ce qui manque. */
function ordreAccueil(userId) {
  const u = DB.utilisateur(userId || S.userId);
  const defaut = BLOCS_ACCUEIL.map(b => b[0]);
  const perso = u && u.prefs && Array.isArray(u.prefs.ordreAccueil) ? u.prefs.ordreAccueil : [];
  /* On se méfie de ce qui est stocké : une sauvegarde d'une version antérieure,
     un bloc disparu, un doublon — sans ce filtre, le même bloc s'afficherait
     deux fois et un autre jamais. */
  const connus = [];
  perso.forEach(k => { if (defaut.includes(k) && !connus.includes(k)) connus.push(k); });
  // un bloc ajouté par une mise à jour se range à sa place d'origine
  return connus.concat(defaut.filter(k => !connus.includes(k)));
}

function deplacerBlocAccueil(cle, sens) {
  const p = prefsDe();
  if (!p) return;
  const ordre = ordreAccueil();
  const i = ordre.indexOf(cle), j = i + sens;
  if (i < 0 || j < 0 || j >= ordre.length) return;
  ordre[i] = ordre[j]; ordre[j] = cle;
  p.ordreAccueil = ordre;
  DB.sauver();
}

/* Les raccourcis de la barre : on choisit lesquels, et dans quel ordre. */
const RACCOURCIS = {
  parc:      { nom: 'Parc',     ico: 'parking',   act: 'tour-parc' },
  tarifs:    { nom: 'Tarifs',   ico: 'catalogue', act: 'aller', vue: 'catalogue' },
  devis:     { nom: 'Devis',    ico: 'devis',     act: 'aller', vue: 'devis' },
  clients:   { nom: 'Clients',  ico: 'clients',   act: 'aller', vue: 'clients' },
  planning:  { nom: 'Planning', ico: 'agenda',    act: 'aller', vue: 'planning' },
  memos:     { nom: 'Mémos',    ico: 'epingle',   act: 'aller', vue: 'memos' },
  reglages:  { nom: 'Réglages', ico: 'reglages',  act: 'aller', vue: 'reglages' }
};
const RACCOURCIS_DEFAUT = ['parc', 'tarifs', 'devis', 'clients'];

function raccourcisChoisis(userId) {
  const u = DB.utilisateur(userId || S.userId);
  const perso = u && u.prefs && Array.isArray(u.prefs.raccourcis) ? u.prefs.raccourcis : null;
  return (perso || RACCOURCIS_DEFAUT).filter(k => RACCOURCIS[k]);
}

/** Ce que cette personne veut voir sur son accueil. */
function prefAccueil(cle, userId) {
  const u = DB.utilisateur(userId || S.userId);
  const commun = DB.etat.reglages.accueil || {};
  const p = u && u.prefs && u.prefs.accueil;
  if (p && p[cle] !== undefined) return p[cle];
  return commun[cle] !== false;
}

/** Un réglage personnel simple : le sien, sinon le repli donné. */
function maPref(cle, defaut, userId) {
  const u = DB.utilisateur(userId || S.userId);
  const v = u && u.prefs && u.prefs[cle];
  return v === undefined || v === null || v === '' ? defaut : v;
}
function poserMaPref(cle, valeur, userId) {
  const u = DB.utilisateur(userId || S.userId);
  if (!u) return;
  u.prefs = u.prefs || {};
  if (valeur === null || valeur === undefined) delete u.prefs[cle];
  else u.prefs[cle] = valeur;
  DB.sauver();
}

/* L'écran qui s'ouvre en arrivant. L'atelier pour la plupart ; le planning
   pour qui commence sa journée par les rendez-vous, le parc pour qui range les
   voitures avant tout. */
const ECRANS_OUVERTURE = [
  ['atelier', 'L\'atelier'], ['planning', 'Le planning'], ['parking', 'Le parc'],
  ['clients', 'Les clients'], ['devis', 'Tous les devis'], ['memos', 'Le pense-bête'],
  ['tarifs', 'Les tarifs']
];
const monEcranOuverture = (userId) => {
  const v = maPref('ouverture', 'atelier', userId);
  return ECRANS_OUVERTURE.some(([k]) => k === v) ? v : 'atelier';
};

/* La densité : la même application, plus serrée ou plus grosse. Sur le poste
   de l'atelier on lit de loin, les mains sales ; au bureau on veut tout voir
   d'un écran. */
const DENSITES = [['serre', 'Serré', .92], ['normal', 'Normal', 1], ['large', 'Large', 1.09],
                  ['tres-large', 'Très large', 1.2]];
const maDensite = (userId) => {
  const v = maPref('densite', 'normal', userId);
  return DENSITES.some(([k]) => k === v) ? v : 'normal';
};
/** Ce que l'écran peut réellement grossir : agrandir revient à rétrécir la
 *  place disponible, et sous 360 px la mise en page n'en a plus. On plafonne
 *  plutôt que de laisser la page déborder sur le côté. */
const echelleMax = () => Math.max(1, (window.innerWidth || 1024) / 360);

function poserDensite(cle) {
  const d = DENSITES.find(([k]) => k === cle) || DENSITES[1];
  document.documentElement.style.setProperty('--echelle', String(Math.min(d[2], echelleMax())));
  document.documentElement.dataset.densite = d[0];
}

/* Un téléphone qu'on tourne change de largeur sans redessiner : l'échelle, elle,
   doit suivre — sinon le paysage reste bridé comme le portrait. */
window.addEventListener('resize', () => { if (DB.etat) poserDensite(maDensite()); });

/** Le canal retenu pour quelqu'un : le sien, sinon celui de l'atelier. */
function canalDe(u) {
  const n = DB.etat.reglages.notifs || {};
  const perso = u && u.prefs && u.prefs.notifs && u.prefs.notifs.canal;
  const c = perso || (u && u.canalNotif) || n.canal || 'whatsapp';
  return CANAUX[c] ? c : 'whatsapp';
}

/** Peut-on réellement le joindre par ce canal ? */
function joignable(u) {
  const c = canalDe(u);
  if (c === 'aucun') return false;
  const besoin = CANAUX[c].besoin;
  if (besoin === 'tel') return !!String(u && u.tel || '').replace(/\D/g, '').length;
  if (besoin === 'email') return !!String(u && u.email || '').trim();
  return false;
}

/* Un numéro français composé au clavier devient un numéro international :
   WhatsApp n'accepte que celui-là. */
function telInternational(tel) {
  const n = String(tel || '').replace(/[^\d+]/g, '');
  if (n.startsWith('+')) return n.slice(1);
  if (n.startsWith('00')) return n.slice(2);
  if (n.startsWith('0')) return '33' + n.slice(1);
  return n;
}

function texteNotif(alerte) {
  const r = DB.etat.reglages;
  const de = alerte.de ? DB.utilisateur(alerte.de) : null;
  return remplirModele(r.notifs.modele || '[{outil}] {texte}\n— {de}', {
    outil: r.nomOutil || 'Yatech',
    texte: alerte.texte,
    de: de ? de.nom : (r.nom || 'l\'atelier'),
    garage: r.nom || ''
  }).replace(/\n—\s*$/, '');
}

/** L'adresse qui ouvre l'application du téléphone, message déjà écrit. */
function lienNotif(u, texte) {
  const c = canalDe(u);
  if (c === 'whatsapp') return 'https://wa.me/' + telInternational(u.tel) + '?text=' + encodeURIComponent(texte);
  if (c === 'sms') {
    // le séparateur du corps diffère selon les téléphones ; « ? » passe partout
    return 'sms:' + String(u.tel || '').replace(/\s/g, '') + '?body=' + encodeURIComponent(texte);
  }
  const sujet = (DB.etat.reglages.nomOutil || 'Yatech') + ' — à traiter';
  return 'mailto:' + encodeURIComponent(u.email) + '?subject=' + encodeURIComponent(sujet)
       + '&body=' + encodeURIComponent(texte);
}

/** Est-on dans les heures où l'on ne dérange pas cette personne-là ? */
function heureSilencieuse(quand, userId) {
  if (S.silenceLeve && (!userId || userId === S.userId)) return false;
  if (!prefNotif('silenceActif', userId)) return false;
  const d = new Date(quand || Date.now());
  const m = d.getHours() * 60 + d.getMinutes();
  const lire = (h) => { const p = String(h || '').split(':'); return (Number(p[0]) || 0) * 60 + (Number(p[1]) || 0); };
  const deb = lire(prefNotif('silenceDebut', userId)), fin = lire(prefNotif('silenceFin', userId));
  return deb <= fin ? (m >= deb && m < fin) : (m >= deb || m < fin);
}

/** Ce type d'événement sort-il de l'outil, pour cette personne ? */
function notifiable(type, pro, userId) {
  if (!DB.etat.reglages.notifs || !DB.etat.reglages.notifs.actif) return false;
  if (!prefNotif('actif', userId)) return false;
  return prefNotifQuoi(pro ? 'pro' : type, userId);
}

/* Les avertissements à faire partir : une alerte non lue, d'un type retenu,
   pour quelqu'un de joignable, et qu'on n'a pas déjà prévenu. */
function aPrevenir() {
  if (!DB.etat.reglages.notifs || !DB.etat.reglages.notifs.actif) return [];
  const relance = Number(DB.etat.reglages.notifs.relancerApres) || 0;
  return (DB.etat.alertes || []).filter(a => {
    if (a.lu || a.prevenu || a.ecartee) return false;
    /* Ce sont les réglages du destinataire qui décident : c'est lui qu'on
       dérange, pas celui qui a l'outil sous les yeux. */
    if (!notifiable(a.type, a.pro, a.pour)) return false;
    if (heureSilencieuse(Date.now(), a.pour)) return false;
    const u = DB.utilisateur(a.pour);
    if (!u || !joignable(u)) return false;
    if (relance && a.propose && Date.now() - a.propose < relance * 60000) return false;
    return true;
  });
}

/** Prévient qui de droit. Celui qui déclenche l'action n'est pas prévenu. */
function alerter(pour, type, texte, contexte) {
  DB.acteur = S.userId;
  DB.alerter(pour, type, texte, contexte);
  DB.acteur = null;
  suiteAlerte(type, texte, contexte);
}

/* Ce qui suit toute alerte : l'avertissement du navigateur pour qui a l'outil
   ouvert, et le rappel visible qu'il reste des gens à joindre autrement. */
function suiteAlerte(type, texte, contexte) {
  // l'avertissement local ne concerne que la personne devant l'écran
  if (!S.userId) return;
  if (!notifiable(type, contexte && contexte.pro, S.userId)) return;
  if (heureSilencieuse(Date.now(), S.userId)) return;
  if (prefNotif('navigateur')) notifierNavigateur(DB.etat.reglages.nomOutil || 'Yatech', texte);
  if (prefNotif('sonner')) sonner();
}

/* Un son court, fabriqué sur place : aucun fichier à charger, et rien qui
   sorte du téléphone si le navigateur refuse. */
function sonner() {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
    o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.3);
    setTimeout(() => { try { ctx.close(); } catch (e) { /* rien */ } }, 600);
  } catch (e) { /* le navigateur refuse le son : ce n'est pas grave */ }
}

/* Ce qui vient de l'extérieur — un client qui signe, un garage confrère qui
   réserve — ne doit exclure personne : le compte ouvert dans l'atelier n'y est
   pour rien, et doit être prévenu comme les autres. */
function alerterTousExterne(type, texte, contexte) {
  DB.acteur = null;
  DB.alerter('tous', type, texte, contexte);
  suiteAlerte(type, texte, contexte);
}

/* --- la veille ------------------------------------------------------------
   Les alertes ci-dessus supposent quelqu'un d'autre au bout du fil. Seul sur
   son poste, on est toujours l'auteur, donc jamais le destinataire, et la
   cloche reste éteinte pour de mauvaises raisons. Ces alertes-là ne viennent
   de personne : c'est l'outil qui vous tire la manche. Chacune porte une clé,
   pour n'être posée qu'une fois. */
function poserVeille(cle, pour, type, texte, contexte) {
  if (!Array.isArray(DB.etat.alertes)) DB.etat.alertes = [];
  /* Chacun a sa copie : celui qui a écarté l'alerte ne doit pas la revoir
     revenir au rechargement, mais les autres doivent toujours la recevoir. On
     regarde donc personne par personne, et non l'existence globale de la clé. */
  if (DB.estResolue(cle)) return false;      // quelqu'un a dit que c'était fait
  const cibles = (pour === 'tous' ? DB.etat.utilisateurs.map(u => u.id) : [pour])
    .filter(id => id && !DB.dejaPosee(cle, id));
  if (!cibles.length) return false;
  DB.acteur = null;
  cibles.forEach(id => DB.alerter(id, type, texte, Object.assign({ cle }, contexte)));
  return true;
}

/* Le ménage des alertes dont le travail est fait. La veille sait exactement ce
   qui reste à traiter : tout ce qui porte une clé et n'y figure plus a été
   réglé par quelqu'un — l'alerte disparaît alors pour toute l'équipe. */
/* La veille ne connaît que ses propres suivis : elle efface ce qui porte une de
   ses clés et n'a plus lieu d'être. Une alerte à clé venue d'ailleurs ne la
   regarde pas — sans cette précaution, elle balaierait ce qu'elle n'a pas posé. */
const PREFIXES_VEILLE = ['appel:', 'memo-du-jour:', 'client-incomplet:', 'impaye:', 'demande-pro:',
  'annul-client:'];

function resoudreCequiEstFait(clesVivantes) {
  if (!Array.isArray(DB.etat.alertes)) return 0;
  const sienne = (cle) => PREFIXES_VEILLE.some(p => String(cle).startsWith(p));
  const avant = DB.etat.alertes.length;
  DB.etat.alertes = DB.etat.alertes.filter(a => !a.cle || !sienne(a.cle) || clesVivantes.has(a.cle));
  const partis = avant - DB.etat.alertes.length;
  if (partis) DB.sauver();
  return partis;
}

function veilleAlertes() {
  if (!DB.etat || !S.userId) return;
  let posees = 0;

  /* Les clés de ce qui reste réellement à faire, relevées au passage. Ce qui
     n'y figure plus a été traité : l'alerte s'efface pour toute l'équipe. */
  const vivantes = new Set();
  const poser = (cle, pour, type, texte, ctx) => {
    vivantes.add(cle);
    return poserVeille(cle, pour, type, texte, ctx);
  };

  // 1 · les appels reçus qui n'ont pas encore été traités
  appelsATraiter().forEach(d => {
    const i = infosDevis(d);
    if (poser('appel:' + d.id, 'tous', 'demande',
      `Appel à traiter — ${i.nomClient}${i.immat && i.immat !== '—' ? ' · ' + i.immat : ''}`
      + (d.panne ? ' : ' + d.panne.slice(0, 50) : ''),
      { vue: 'devis-fiche', ref: d.id })) posees++;
  });

  // 2 · les pense-bêtes du jour, ou en retard, pour celui à qui ils sont
  const jour = minuit(Date.now());
  DB.etat.memos.forEach(m => {
    if (m.fait || !m.quand || minuit(m.quand) > jour) return;
    const t = TYPES_MEMO[m.type] || { nom: 'Pense-bête' };
    if (poser('memo-du-jour:' + m.id + ':' + jour, m.userId, 'memo',
      `${t.nom} : ${m.texte}`, { vue: 'memos', ref: m.id })) posees++;
  });

  // 3 · les fiches clients qu'on ne pourra pas rappeler
  DB.etat.clients.forEach(c => {
    if ((c.tel || '').trim() || (c.email || '').trim()) return;
    if (!DB.etat.devis.some(d => d.clientId === c.id)) return;   // fiche sans dossier : pas urgent
    const nom = DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim();
    if (poser('client-incomplet:' + c.id, 'tous', 'client',
      `${nom} : ni téléphone ni e-mail — impossible de le rappeler.`,
      { vue: 'client-fiche', ref: c.id })) posees++;
  });

  // 4 · les créneaux demandés par un garage pro et jamais confirmés
  /* 5 · les interventions terminées que personne n'a encaissées. Une par
     client et par mois écoulé : on rappelle, on ne harcèle pas. */
  const seuilImpaye = Number(DB.etat.reglages.impayeAlerte) || 0;
  if (seuilImpaye) {
    DB.etat.clients.forEach(c => {
      const du = interventionsDe(c.id).filter(d => !d.regle);
      if (!du.length) return;
      const plusVieille = Math.min(...du.map(d => d.facture ? d.facture.date : (d.reponse || d.maj)));
      const jours = joursDepuis(plusVieille);
      if (jours < seuilImpaye) return;
      const nom = DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim();
      const montant = du.reduce((s, d) => s + totaux(d).ttc, 0);
      // la clé change de mois en mois : le rappel revient, sans se répéter chaque jour
      const mois = new Date(plusVieille + jours * JOUR).toISOString().slice(0, 7);
      if (poser('impaye:' + c.id + ':' + mois, 'tous', 'devis',
        `${nom} : ${eur(montant)} non encaissé${du.length > 1 ? 's' : ''} depuis ${jours} jours`,
        { vue: 'client-fiche', ref: c.id })) posees++;
    });
  }

  /* 5 bis · une sauvegarde qui date. Les données vivent dans ce navigateur :
     un fichier récent est la seule chose qui les rendra s'il les perd. */
  const seuilSauve = Number(DB.etat.reglages.rappelSauvegarde) || 0;
  if (seuilSauve) {
    const q = DB.etat.reglages.derniereSauvegarde;
    const jours = q ? joursDepuis(q) : null;
    if (jours === null || jours >= seuilSauve) {
      // une clé par semaine : le rappel revient, sans se répéter chaque jour
      const sem = Math.floor(minuit(Date.now()) / (7 * JOUR));
      if (poser('sauvegarde:' + sem, 'tous', 'devis',
        jours === null ? 'Aucune sauvegarde depuis cet appareil — un fichier vous rendrait tout'
                       : `Dernière sauvegarde il y a ${jours} jours — pensez à en refaire une`,
        { vue: 'reglages' })) posees++;
    }
  }

  /* 5 ter · le parc bientôt plein : il vaut mieux le savoir avant d'accepter
     la voiture que devant le client, la clé à la main. */
  const seuilParc = Number(DB.etat.reglages.parcAlerte) || 0;
  if (seuilParc) {
    const utiles = PLACES.filter(p => p.type !== 'hs');
    const prises = DB.etat.occupations.filter(o => utiles.some(p => p.id === o.placeId)).length;
    const taux = utiles.length ? Math.round(prises * 100 / utiles.length) : 0;
    if (taux >= seuilParc) {
      const jourCle = minuit(Date.now());
      if (poser('parc-plein:' + jourCle, 'tous', 'parc',
        `Le parc est occupé à ${taux} % — ${utiles.length - prises} place${
          utiles.length - prises > 1 ? 's' : ''} libre${utiles.length - prises > 1 ? 's' : ''}`,
        { vue: 'parking' })) posees++;
    }
  }

  /* 6 · ce qu'un client vient de décommander tout seul. Personne ne l'a
     décidé ici : sans ce rappel, on découvrirait le trou le jour même. */
  annulationsClient().forEach(p => {
    const quoi = [marqueRdv(p), immatRdv(p)].filter(x => x && x !== '—').join(' · ');
    if (poser('annul-client:' + p.id, 'tous', 'rdv',
      `${p.client || 'Un client'} a annulé son rendez-vous du ${dateCourte(p.jour)} à ${p.heure}`
      + (quoi ? ' — ' + quoi : ''),
      { vue: 'planning', ref: p.id })) posees++;
  });

  demandesPro().forEach(p => {
    // le nom est posé à la réservation ; s'il manque, on retrouve le demandeur
    const dem = p.demandeur ? DB.client(p.demandeur) : null;
    const qui = p.client || (dem ? dem.nom : '') || 'Un garage partenaire';
    if (poser('demande-pro:' + p.id, 'tous', 'rdv',
      `${qui} attend votre confirmation pour le ${dateCourte(p.jour)}`
      + (p.prestation ? ' — ' + p.prestation : '')
      + (p.boitierSeul ? ' (calculateur seul)' : ''),
      { vue: 'planning', ref: p.id, pro: true })) posees++;
  });

  resoudreCequiEstFait(vivantes);
  DB.nettoyerResolues(vivantes);   // le sujet a disparu : la décision n'a plus d'objet
  if (posees) DB.sauver();
  return posees;
}

/* Une alerte fraîche pour la personne connectée : on la montre tout de suite,
   même si elle est sur un autre onglet. */
let dernierSon = 0;
function sonnerSiNouveau() {
  if (!S.userId || enVuePublique()) return;
  const neuves = DB.alertesDe(S.userId).filter(a => Date.now() - a.quand < 15000);
  if (!neuves.length || Date.now() - dernierSon < 8000) return;
  dernierSon = Date.now();
  const a = neuves[0];
  if (etatNotifications() === 'granted') {
    try { new Notification(TYPES_ALERTE[a.type] ? TYPES_ALERTE[a.type].nom : 'Yatech',
      { body: a.texte, tag: 'atelier-' + a.type }); return; } catch (e) { /* on retombe plus bas */ }
  }
  if (!document.hidden) toast(a.texte);
}

const ORDRE_STATUT = ['appel', 'attente', 'brouillon', 'envoye', 'accepte', 'commande', 'encours', 'termine', 'facture'];

function changerStatut(id, statut, motCle) {
  const d = DB.devis(id);
  if (!d) return;
  d.statut = statut;
  d.maj = Date.now();
  if (statut === 'envoye') d.envoye = Date.now();
  if (statut === 'accepte' || statut === 'refuse') d.reponse = Date.now();
  /* À partir du moment où un chiffre part chez le client, il ne bouge plus. */
  if (['envoye', 'accepte', 'commande', 'encours', 'termine', 'facture'].includes(statut)) figerTva(d);

  // le parc suit automatiquement l'avancement du devis
  const occ = DB.etat.occupations.find(o => o.devisId === id);
  if (occ) {
    if (statut === 'encours') occ.etat = 'travaux';
    if (statut === 'termine') occ.etat = 'pret';
    if (statut === 'envoye')  occ.etat = 'devis';
  }
  enregistrer(`${d.numero} → ${STATUTS[statut] ? STATUTS[statut].nom : statut}${motCle ? ' · ' + motCle : ''}`);
  toast(`${d.numero} : ${STATUTS[statut] ? STATUTS[statut].nom.toLowerCase() : statut}`);
}

/* ==========================================================================
   PASSERELLE EBP
   La facturation reste dans EBP. Ici on capte au téléphone, on chiffre, on
   suit l'atelier — et on repasse à EBP ce qu'il lui faut, sans ressaisir.
   Le lien tient à une chose : le même code client des deux côtés.
   ========================================================================== */
const sansAccent = (s) => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');

/** Code client proposé : lisible dans EBP, stable, sans accent ni espace. */
function codeEbp(c) {
  if (!c) return '';
  if (c.codeEbp) return c.codeEbp;
  const base = sansAccent(c.type === 'pro' ? c.nom : (c.nom || c.prenom || 'CLIENT'))
    .toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8) || 'CLIENT';
  const rang = DB.etat.clients.filter(x => x.id <= c.id).length;
  return base + String(rang).padStart(3, '0');
}

/* Un CSV que la France sait lire : point-virgule, guillemets doublés, CRLF.
   Le BOM en tête évite les accents cassés à l'ouverture. */
function versCsv(lignes) {
  const cellule = (v) => {
    const t = v === null || v === undefined ? '' : String(v);
    return /[";\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  return '﻿' + lignes.map(l => l.map(cellule).join(';')).join('\r\n') + '\r\n';
}

/** Lecture d'un CSV : séparateur deviné, guillemets respectés. */
function depuisCsv(texte) {
  const brut = String(texte || '').replace(/^﻿/, '');
  const premiere = brut.split(/\r?\n/)[0] || '';
  const sep = (premiere.split(';').length >= premiere.split(',').length) ? ';' : ',';
  const lignes = [];
  let ligne = [], champ = '', guillemets = false;
  for (let i = 0; i < brut.length; i++) {
    const ch = brut[i];
    if (guillemets) {
      if (ch === '"' && brut[i + 1] === '"') { champ += '"'; i++; }
      else if (ch === '"') guillemets = false;
      else champ += ch;
    } else if (ch === '"') guillemets = true;
    else if (ch === sep) { ligne.push(champ); champ = ''; }
    else if (ch === '\n') { ligne.push(champ); lignes.push(ligne); ligne = []; champ = ''; }
    else if (ch !== '\r') champ += ch;
  }
  if (champ || ligne.length) { ligne.push(champ); lignes.push(ligne); }
  return lignes.filter(l => l.some(x => String(x).trim()));
}

/** Rend un fichier à l'utilisateur. Promesse vraie si le fichier est bien parti :
 *  c'est elle qui décide si on peut marquer une demande comme passée dans EBP. */
function telechargerFichier(nom, contenu, type) {
  // page publiée : c'est le visualiseur qui remet le fichier, après accord
  if (window.claude && window.claude.downloads) {
    return window.claude.downloads.save({ filename: nom, data: contenu })
      .then(() => { toast('Fichier enregistré'); return true; })
      .catch((err) => {
        const code = err && err.code;
        if (code === 'too_large') toast('Fichier trop volumineux');
        else if (code === 'rate_limited') toast('Réessayez dans un instant');
        else if (code !== 'declined') toast('Téléchargement indisponible ici');
        return false;
      });
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([contenu], { type: type || 'text/csv;charset=utf-8' }));
  a.download = nom;
  a.click();
  /* On libère l'adresse plus tard : révoquée dans la seconde, un gros fichier
     — un PDF de devis — voit son téléchargement s'interrompre. */
  const url = a.href;
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  toast('Fichier téléchargé');
  return Promise.resolve(true);
}

/* Pas de filtre d'extension : sur téléphone, un `accept` trop précis grise les
   fichiers dans le sélecteur et on ne peut rien choisir. On accepte tout, et
   c'est le contenu qui décide. */
/** Le nom de l'outil, ramené à ce qui peut servir de nom de fichier. */
function nomFichierOutil() {
  return sansAccent(DB.etat.reglages.nomOutil || 'Yatech')
    .toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'yatech';
}

/** La sauvegarde complète, en un fichier. Appelable de partout. */
function sauvegarderFichier() {
  const sortie = telechargerFichier(nomFichierOutil() + '-' + isoLocal(Date.now()) + '.json',
    JSON.stringify(DB.etat, null, 2), 'application/json');
  /* On retient la date : c'est la seule façon de dire honnêtement « votre
     dernière copie date de trois semaines » plutôt que de laisser croire que
     tout est à l'abri. Le fichier peut être refusé par le navigateur — dans ce
     cas on ne note rien. */
  const noter = () => { DB.etat.reglages.derniereSauvegarde = Date.now(); DB.sauver(); };
  if (sortie && typeof sortie.then === 'function') {
    return sortie.then((ok) => { if (ok !== false) noter(); return ok; });
  }
  if (sortie !== false) noter();
  return sortie;
}

/* Choisir un fichier. Deux usages : lire son texte (les CSV d'EBP), ou prendre
   le fichier lui-même sans le lire (un PDF, qu'on range tel quel). */
function lireFichier(accept, alors, brut) {
  const champ = document.createElement('input');
  champ.type = 'file';
  /* On ne filtre que pour le PDF : sur téléphone, un `accept` trop précis grise
     les CSV d'EBP dans le sélecteur et plus rien n'est choisissable. */
  if (accept && brut) champ.accept = accept;
  champ.addEventListener('change', () => {
    const fichier = champ.files && champ.files[0];
    if (!fichier) return;
    if (brut) { brut(fichier); return; }
    const lecteur = new FileReader();
    lecteur.onerror = () => toast('Impossible de lire ce fichier');
    lecteur.onload = () => alors(lecteur.result, fichier.name);
    lecteur.readAsText(fichier);
  });
  champ.click();
}

/* --- la file d'attente ----------------------------------------------------
   Dès qu'une demande est prise au téléphone, elle se met d'elle-même dans la
   file. Rien à penser : il reste à la déverser dans EBP, et ce qui est passé
   ne repart jamais deux fois. */
function devisATransferer() {
  return DB.etat.devis.filter(d => !d.ebp && d.statut !== 'refuse');
}

/** Sont à repasser : les clients jamais transférés, et ceux dont la fiche a
 *  été retouchée ici depuis leur dernier passage. */
const clientAJour = (c) => !!c.ebp && !(c.maj && c.maj > c.ebp);

function clientsATransferer(devis) {
  const vus = new Set();
  const liste = (devis || devisATransferer())
    .map(d => DB.client(d.clientId))
    .filter(c => c && !clientAJour(c) && !vus.has(c.id) && vus.add(c.id));
  // une fiche modifiée repart même sans nouveau devis
  DB.etat.clients.forEach(c => {
    if (c.ebp && !clientAJour(c) && !vus.has(c.id)) { vus.add(c.id); liste.push(c); }
  });
  return liste;
}

/* --- ce qu'on donne à EBP -------------------------------------------------- */
function csvClients(liste) {
  const l = [['Code client', 'Type', 'Civilite', 'Nom', 'Prenom', 'Adresse', 'Code postal',
              'Ville', 'Telephone', 'Email', 'SIRET', 'TVA intracom', 'Tarif', 'Vehicules', 'Observations']];
  (liste || DB.etat.clients).forEach(c => {
    /* Les véhicules partent avec la fiche : c'est justement ce qui est long à
       ressaisir dans EBP, et une plaque en observation vaut mieux qu'un client
       qu'on ne sait pas rattacher à sa voiture. */
    const vehic = DB.etat.vehicules.filter(v => v.clientId === c.id)
      .map(v => [v.immat, (v.marque + ' ' + v.modele).trim(), v.km ? v.km + ' km' : '']
        .filter(Boolean).join(' '))
      .join(' / ');
    l.push([
      codeEbp(c), c.type === 'pro' ? 'Professionnel' : 'Particulier', '',
      c.nom || '', c.type === 'pro' ? '' : (c.prenom || ''),
      c.adresse || '', c.cp || '', c.ville || '', c.tel || '', c.email || '',
      c.siret || '', c.tvaIntra || '', DB.estPro(c) ? 'PRO' : 'PARTICULIER',
      vehic, c.note || ''
    ]);
  });
  return versCsv(l);
}

/* ==========================================================================
   LES PDF QUI REVIENNENT D'EBP
   Le devis se fait dans EBP — c'est lui qui tient la facturation. Ce qu'il
   nous rend, c'est un PDF, et c'est nous qui l'envoyons au client, parce que
   c'est ici qu'on a son numéro et son dossier ouvert.

   Ces fichiers ne tiennent pas dans le stockage ordinaire du navigateur :
   quelques devis et il serait plein. Ils vivent donc dans la réserve du
   navigateur (IndexedDB), et le dossier ne garde que leur nom et leur taille.
   Conséquence assumée, écrite noir sur blanc dans les paramètres : ils
   restent sur cet appareil et ne partent pas dans la sauvegarde JSON.
   ========================================================================== */
const RESERVE = {
  nom: 'yatech-pdf',
  base: null,

  ouvrir() {
    if (this.base) return Promise.resolve(this.base);
    return new Promise((res, rej) => {
      if (typeof indexedDB === 'undefined') { rej(new Error('sans réserve')); return; }
      const d = indexedDB.open(this.nom, 1);
      d.onupgradeneeded = () => { d.result.createObjectStore('pdf'); };
      d.onsuccess = () => { this.base = d.result; res(this.base); };
      d.onerror = () => rej(d.error || new Error('réserve indisponible'));
    });
  },

  poser(cle, blob) {
    return this.ouvrir().then(b => new Promise((res, rej) => {
      const t = b.transaction('pdf', 'readwrite');
      t.objectStore('pdf').put(blob, cle);
      t.oncomplete = () => res(true);
      t.onerror = () => rej(t.error);
    }));
  },

  prendre(cle) {
    return this.ouvrir().then(b => new Promise((res, rej) => {
      const t = b.transaction('pdf', 'readonly');
      const r = t.objectStore('pdf').get(cle);
      r.onsuccess = () => res(r.result || null);
      r.onerror = () => rej(r.error);
    }));
  },

  retirer(cle) {
    return this.ouvrir().then(b => new Promise((res) => {
      const t = b.transaction('pdf', 'readwrite');
      t.objectStore('pdf').delete(cle);
      t.oncomplete = () => res(true);
      t.onerror = () => res(false);
    })).catch(() => false);
  },

  /* Le ménage : un PDF dont le dossier n'existe plus ne sert à rien et prend
     de la place. On le fait sur demande, jamais dans le dos. */
  nettoyer() {
    return this.ouvrir().then(b => new Promise((res) => {
      const vivants = new Set(DB.etat.devis.filter(d => d.pdf).map(d => 'devis:' + d.id));
      let partis = 0, octets = 0;
      const t = b.transaction('pdf', 'readwrite');
      const st = t.objectStore('pdf');
      const c = st.openCursor();
      c.onsuccess = (e) => {
        const cur = e.target.result;
        if (!cur) return;
        if (!vivants.has(cur.key)) { octets += (cur.value && cur.value.size) || 0; partis++; st.delete(cur.key); }
        cur.continue();
      };
      t.oncomplete = () => res({ partis, octets });
      t.onerror = () => res({ partis: 0, octets: 0 });
    })).catch(() => ({ partis: 0, octets: 0 }));
  },

  /** Le poids total gardé sur cet appareil. */
  poids() {
    return this.ouvrir().then(b => new Promise((res) => {
      let total = 0;
      const t = b.transaction('pdf', 'readonly');
      const c = t.objectStore('pdf').openCursor();
      c.onsuccess = (e) => {
        const cur = e.target.result;
        if (!cur) { res(total); return; }
        total += (cur.value && cur.value.size) || 0;
        cur.continue();
      };
      c.onerror = () => res(total);
    })).catch(() => 0);
  }
};

const poidsFr = (o) => o > 900000 ? (o / 1048576).toFixed(1).replace('.', ',') + ' Mo'
                     : Math.max(1, Math.round(o / 1024)) + ' Ko';

function csvArticles() {
  const l = [['Code article', 'Libelle', 'Famille', 'Prix vente HT', 'Prix pro HT', 'TVA']];
  DB.etat.catalogue.forEach(p => l.push([
    p.code || p.id, p.libelle || '', p.famille || '',
    prixCsv(p.prixHT), prixCsv(p.prixPro != null ? p.prixPro : p.prixHT),
    prixCsv(DB.etat.reglages.tauxTva)
  ]));
  return versCsv(l);
}

const prixCsv = (n) => String(Number(n || 0).toFixed(2)).replace('.', ',');   // EBP lit la virgule

function lignesDevisCsv(liste) {
  /* « Reference » porte notre numéro : c'est par lui qu'on reconnaîtra la
     facture quand elle reviendra d'EBP. Ne pas le retirer du paramétrage. */
  const l = [['Numero', 'Reference', 'Date', 'Code client', 'Nom client', 'Immatriculation', 'Vehicule',
              'Code article', 'Designation', 'Quantite', 'Prix unitaire HT', 'Remise %',
              'Total HT', 'TVA', 'Statut']];
  liste.forEach(d => {
    const c = DB.client(d.clientId), v = DB.vehicule(d.vehiculeId);
    const nom = c ? (DB.estPro(c) ? c.nom : (c.prenom + ' ' + c.nom).trim()) : '';
    const s = STATUTS[d.statut];
    (d.lignes.length ? d.lignes : [null]).forEach(x => l.push([
      d.numero, d.numero, isoLocal(d.cree), c ? codeEbp(c) : '', nom,
      v ? v.immat : '', v ? (v.marque + ' ' + v.modele).trim() : '',
      x ? (x.code || x.ref || '') : '', x ? x.libelle : '(devis sans ligne)',
      x ? prixCsv(x.qte) : '', x ? prixCsv(x.prixHT) : '', x ? prixCsv(x.remise || 0) : '',
      x ? prixCsv(x.qte * x.prixHT * (1 - (x.remise || 0) / 100)) : '',
      prixCsv(tvaDu(d).franchise ? 0 : tvaDu(d).taux), s ? s.nom : d.statut
    ]));
  });
  return versCsv(l);
}

/* --- ce qu'on reprend d'EBP ------------------------------------------------ */
/* Les intitulés de colonnes changent d'une version à l'autre : on reconnaît
   chaque colonne à son sens, sans imposer un format. */
const COLONNES_EBP = {
  codeEbp:  ['code client', 'code', 'codeclient', 'numero client', 'reference'],
  /* EBP sort souvent DEUX colonnes de nom : la raison sociale pour les
     sociétés, le nom de famille pour les particuliers. La société l'emporte
     quand elle est remplie — c'est comme ça qu'un garage confrère arrive ici
     en professionnel, et pas au nom de son gérant. */
  /* « raison sociale » ne figure QUE dans societe : les colonnes sont repérées
     de gauche à droite, et si le mot était aussi dans `nom`, la raison sociale
     — souvent placée avant — servirait de nom à tout le monde. Les particuliers,
     dont elle est vide, seraient alors ignorés en bloc. */
  societe:  ['raison sociale', 'societe', 'raison sociale 1', 'nom commercial', 'enseigne'],
  nom:      ['nom', 'nom client', 'client', 'intitule', 'libelle'],
  prenom:   ['prenom', 'first name'],
  tel:      ['telephone', 'tel', 'portable', 'mobile', 'tel portable', 'telephone portable'],
  email:    ['email', 'e-mail', 'mail', 'adresse email', 'courriel'],
  adresse:  ['adresse', 'adresse 1', 'rue', 'adresse1'],
  cp:       ['code postal', 'cp', 'codepostal'],
  ville:    ['ville', 'localite'],
  siret:    ['siret'],
  tvaIntra: ['tva intracom', 'n° tva intracom', 'numero tva', 'tva intracommunautaire'],
  note:     ['observations', 'notes', 'note', 'commentaire', 'remarque']
};

/* « E-mail », « Téléphone portable », « N° TVA intracom. » : on ramène tout à
   des lettres et des espaces avant de comparer, des deux côtés. */
const cleColonne = (x) => sansAccent(x).toLowerCase()
  .replace(/[^a-z0-9]+/g, ' ').replace(/\s+/g, ' ').trim();

function repererAvec(entete, carte) {
  const propre = entete.map(cleColonne);
  const trouve = {};
  Object.keys(carte).forEach(cle => {
    const noms = carte[cle].map(cleColonne);
    const i = propre.findIndex(x => noms.includes(x));
    if (i >= 0) trouve[cle] = i;
  });
  return trouve;
}

const repererColonnes = (entete) => repererAvec(entete, COLONNES_EBP);

const COLONNES_ARTICLES = {
  code:    ['code article', 'code', 'reference', 'reference article', 'ref'],
  libelle: ['libelle', 'designation', 'description', 'intitule', 'libelle article'],
  famille: ['famille', 'famille article', 'categorie', 'rayon', 'section', 'groupe'],
  prixHT:  ['prix vente ht', 'pv ht', 'prix de vente ht', 'prix de vente', 'prix vente',
            'prix ht', 'prix unitaire ht', 'tarif 1', 'prix'],
  prixPro: ['prix pro ht', 'prix professionnel', 'tarif 2', 'prix revendeur', 'prix remise',
            'tarif pro', 'prix pro']
};

const COLONNES_FACTURES = {
  numero:  ['numero', 'numero de piece', 'numero piece', 'numero document', 'numero facture',
            'n facture', 'piece', 'document'],
  ref:     ['reference', 'reference document', 'reference externe', 'notes', 'observations', 'objet'],
  date:    ['date', 'date document', 'date facture', 'date de facture'],
  client:  ['code client', 'client', 'nom client', 'tiers'],
  ht:      ['total ht', 'montant ht', 'net ht', 'base ht'],
  ttc:     ['total ttc', 'montant ttc', 'net a payer', 'net a payer ttc', 'total']
};

/** Les nombres d'EBP : virgule décimale, espaces, symbole monétaire. */
function nombreFr(v) {
  const t = String(v == null ? '' : v).replace(/[^\d,.\-]/g, '').replace(/\.(?=\d{3}\b)/g, '').replace(',', '.');
  const n = parseFloat(t);
  return isNaN(n) ? null : n;
}

/* De quel fichier s'agit-il ? On le déduit de ses colonnes, pour n'avoir
   qu'un seul bouton d'import à présenter. */
function typeFichierEbp(entete) {
  const c = repererColonnes(entete);
  const a = repererAvec(entete, COLONNES_ARTICLES);
  const f = repererAvec(entete, COLONNES_FACTURES);
  if (f.numero !== undefined && (f.ttc !== undefined || f.ht !== undefined)
      && c.tel === undefined && a.famille === undefined) return 'factures';
  if (a.prixHT !== undefined && (a.code !== undefined || a.libelle !== undefined)
      && c.tel === undefined && c.ville === undefined) return 'articles';
  if (c.nom !== undefined) return 'clients';
  return null;
}

/* Reprendre les tarifs d'EBP : on montre ce que contient le fichier, et on
   laisse choisir ce qu'il advient du rangement d'ici. */
function demanderModeTarifs(texte) {

         + (info.sections.length ? ` et <b>${info.sections.length} section${info.sections.length > 1 ? 's' : ''}</b> : `
            + esc(info.sections.slice(0, 4).join(', ')) + (info.sections.length > 4 ? '…' : '') : '')

         + `<div class="champ"><label>Que fait-on ?</label>

              <option value="prix">Mettre à jour les prix seulement — garder mes sections et mes libellés</option>
            </select></div>`
         + `<p class="aide" style="margin:10px 0 0">La première fois, prenez <b>« EBP fait foi »</b> : `
         + `ce qui est ici n'est qu'un exemple. Ensuite, <b>« les prix seulement »</b> vous évite de refaire `
         + `votre rangement à chaque mise à jour de tarif.`
         + (communs ? '' : '<br>Vos lignes actuelles n\'ont pas de code article : le rapprochement se fera sur la désignation.')
         + '</p>',
    bouton: 'Reprendre les tarifs',
